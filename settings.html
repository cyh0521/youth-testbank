<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳號與設定 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<style>
.settings-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px}
.settings-tab{padding:10px 22px;font-size:.88rem;font-weight:500;color:var(--text-secondary);cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:var(--font-sans)}
.settings-tab.active{color:var(--primary);border-bottom-color:var(--accent);font-weight:700}
.tab-panel{display:none}.tab-panel.active{display:block}

.role-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.75rem;font-weight:600}
.role-admin{background:#fde8e8;color:#c0392b}
.role-teacher{background:#e8eef6;color:var(--primary)}

.search-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.user-count{font-size:.82rem;color:var(--text-muted);white-space:nowrap}

.profile-avatar-lg{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;align-items:center;justify-content:center;font-size:1.9rem;color:white;font-weight:700;flex-shrink:0}
.pw-toggle{position:relative}
.pw-toggle .form-control{padding-right:42px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem;padding:2px 4px}
.field-hint{font-size:.74rem;color:var(--text-muted);margin-top:3px}
.required{color:var(--danger)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .err-box{background:#fef0ef;color:var(--danger);border:1px solid #f5c6c2;border-radius:var(--radius);padding:8px 12px;font-size:.82rem;margin-bottom:12px;display:none}

</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <div class="main" inert>
    <div class="topbar">
      <span class="topbar-title">帳號與設定</span>
    </div>
    <div class="page-content" id="pageContent">
      <!-- 動態填入 Tabs -->
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     新增 / 編輯帳號 Modal（靜態，不在 innerHTML 裡）
     ════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="umTitle">新增帳號</h3>
      <button class="modal-close" onclick="closeUserModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="err-box" id="umErr"></div>
      <input type="hidden" id="umUid">
      <div class="form-group">
        <label class="form-label">身份 <span class="required">*</span></label>
        <select class="form-control" id="umRole" onchange="onUmRoleChange()">
          <option value="teacher">🎓 教師</option>
          <option value="admin">🛡️ 管理員</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">電子信箱 <span class="required">*</span></label>
          <input class="form-control" type="email" id="umEmail" placeholder="登入用信箱">
        </div>
        <div class="form-group">
          <label class="form-label">姓名 <span class="required">*</span></label>
          <input class="form-control" id="umName" placeholder="顯示名稱">
        </div>
      </div>
      <div class="form-group" id="umSchoolGroup">
        <label class="form-label">服務學校 <span id="umSchoolReq" class="required"></span></label>
        <input class="form-control" id="umSchool" placeholder="請輸入服務學校全名">
        <div class="field-hint" id="umSchoolHint">教師必填</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" id="umPwLabel">密碼 <span class="required">*</span></label>
          <div class="pw-toggle">
            <input class="form-control" type="password" id="umPw" placeholder="至少 6 字元">
            <button class="pw-eye" type="button" onclick="togglePw('umPw',this)">👁</button>
          </div>
          <div class="field-hint hidden" id="umPwHint">留空則不更改密碼</div>
        </div>
        <div class="form-group">
          <label class="form-label">確認密碼</label>
          <div class="pw-toggle">
            <input class="form-control" type="password" id="umPw2" placeholder="再次輸入">
            <button class="pw-eye" type="button" onclick="togglePw('umPw2',this)">👁</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeUserModal()">取消</button>
      <button class="btn btn-primary" id="umSaveBtn" onclick="saveUser()">儲存帳號</button>
    </div>
  </div>
</div>

<!-- 個人資料 Modal -->
<div class="modal-overlay hidden" id="profileModal">
  <div class="modal">
    <div class="modal-header">
      <h3>修改個人資料</h3>
      <button class="modal-close" onclick="document.getElementById('profileModal').classList.add('hidden')">✕</button>
    </div>
    <div class="modal-body">
      <div class="err-box" id="pmErr"></div>
      <div class="form-group">
        <label class="form-label">電子信箱（不可變更）</label>
        <input class="form-control" id="pmEmail" disabled style="background:var(--bg-base);color:var(--text-muted)">
      </div>
      <div class="form-group">
        <label class="form-label">姓名 <span class="required">*</span></label>
        <input class="form-control" id="pmName">
      </div>
      <div class="form-group" id="pmSchoolGroup" style="display:none">
        <label class="form-label">服務學校 <span id="pmSchoolReq" class="required"></span></label>
        <input class="form-control" id="pmSchool" placeholder="請輸入服務學校全名">
      </div>
      <hr style="margin:16px 0;border:none;border-top:1px solid var(--border-light)">
      <div style="font-size:.82rem;font-weight:600;color:var(--text-secondary);margin-bottom:12px">🔒 變更密碼（選填）</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">新密碼</label>
          <div class="pw-toggle">
            <input class="form-control" type="password" id="pmPw" placeholder="留空表示不變更">
            <button class="pw-eye" type="button" onclick="togglePw('pmPw',this)">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">確認新密碼</label>
          <div class="pw-toggle">
            <input class="form-control" type="password" id="pmPw2" placeholder="再次輸入">
            <button class="pw-eye" type="button" onclick="togglePw('pmPw2',this)">👁</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('profileModal').classList.add('hidden')">取消</button>
      <button class="btn btn-primary" id="pmSaveBtn" onclick="saveProfile()">儲存變更</button>
    </div>
  </div>
</div>

<script type="module">
import { guardPage } from './js/auth-guard.js';
import { getAuth, updatePassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

window._activeNav = 'settings';
const user = await guardPage();
if (!user) throw new Error('not auth');
const isAdmin = DataService.isAdmin();

// ══════════════════════════════════════════════════
//  Tab 結構
// ══════════════════════════════════════════════════
function buildTabs() {
  const tabs = [];
  if (isAdmin) tabs.push({ id:'accounts', label:'👥 帳號管理' });
  tabs.push({ id:'profile', label:'👤 個人資料' });

  const tabsHTML = `<div class="settings-tabs">
    ${tabs.map((t,i)=>`<button class="settings-tab ${i===0?'active':''}" id="stab-${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('')}
  </div>
  ${tabs.map((t,i)=>`<div class="tab-panel ${i===0?'active':''}" id="spanel-${t.id}"></div>`).join('')}`;

  document.getElementById('pageContent').innerHTML = tabsHTML;

  // 渲染每個 tab 的內容
  if (isAdmin) buildAccountsPanel();
  buildProfilePanel();
}

window.switchTab = id => {
  document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('stab-'+id)?.classList.add('active');
  document.getElementById('spanel-'+id)?.classList.add('active');
};

// ══════════════════════════════════════════════════
//  帳號管理 Panel
// ══════════════════════════════════════════════════
let allUsers = [];

function buildAccountsPanel() {
  document.getElementById('spanel-accounts').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2>帳號管理</h2>
        <button class="btn btn-primary btn-sm" id="addUserBtn">＋ 新增帳號</button>
      </div>
      <div class="card-body">
        <div class="search-bar">
          <input class="form-control" id="searchInput" placeholder="🔍 搜尋姓名或信箱" style="flex:1;max-width:260px" oninput="filterUsers()">
          <select class="form-control" id="roleFilter" style="max-width:130px" onchange="filterUsers()">
            <option value="">全部身份</option>
            <option value="admin">管理員</option>
            <option value="teacher">教師</option>
          </select>
          <span class="user-count" id="userCount"></span>
        </div>
        <div class="table-wrapper">
          <table class="data-table" id="userTable">
            <thead><tr><th>姓名</th><th>電子信箱</th><th>身份</th><th>服務學校</th><th>建立日期</th><th style="width:100px"></th></tr></thead>
            <tbody id="userTbody"><tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted)">載入中…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>`;

  // 綁定「新增帳號」按鈕
  document.getElementById('addUserBtn').addEventListener('click', () => openUserModal(null));

  loadUsers();
}

async function loadUsers() {
  try {
    allUsers = (await DataService.getUsers()).filter(u => ['admin','teacher'].includes(u.role));
    filterUsers();
  } catch(e) {
    const tb = document.getElementById('userTbody');
    if (tb) tb.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:24px">載入失敗：${e.message}</td></tr>`;
  }
}

window.filterUsers = () => {
  const kw = (document.getElementById('searchInput')?.value||'').toLowerCase();
  const rf = document.getElementById('roleFilter')?.value||'';
  const filtered = allUsers.filter(u =>
    (!rf || u.role===rf) &&
    (!kw || (u.displayName||'').toLowerCase().includes(kw)||(u.email||'').toLowerCase().includes(kw)||(u.school||'').toLowerCase().includes(kw))
  );
  const cnt = document.getElementById('userCount');
  if (cnt) cnt.textContent = `共 ${filtered.length} 位`;
  const tbody = document.getElementById('userTbody');
  if (!tbody) return;
  const self = DataService.getCurrentUser();
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted)">無符合帳號</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(u => `
    <tr>
      <td><strong>${u.displayName||'—'}</strong>
        ${u.uid===self.uid?'<span style="font-size:.7rem;background:#e8eef6;color:var(--primary);padding:1px 5px;border-radius:10px;margin-left:4px">我</span>':''}</td>
      <td style="font-size:.83rem;color:var(--text-secondary)">${u.email||'—'}</td>
      <td>${roleTag(u.role)}</td>
      <td style="font-size:.83rem">${u.school||'—'}</td>
      <td style="font-size:.78rem;color:var(--text-muted)">${fmtDate(u.createdAt)}</td>
      <td><div style="display:flex;gap:5px">
        <button class="btn btn-sm btn-outline" onclick="openUserModal('${u.id||u.uid}')">編輯</button>
        ${u.uid!==self.uid?`<button class="btn btn-sm btn-danger" onclick="doDelete('${u.id||u.uid}','${(u.displayName||u.email||'').replace(/'/g,"\\'")}')">刪除</button>`:''}
      </div></td>
    </tr>`).join('');
};

function roleTag(role) {
  const m = { admin:['role-admin','🛡️ 管理員'], teacher:['role-teacher','🎓 教師'] };
  const [cls, label] = m[role]||['',''];
  return `<span class="role-badge ${cls}">${label}</span>`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

// ══════════════════════════════════════════════════
//  新增/編輯 Modal
// ══════════════════════════════════════════════════
window.openUserModal = (uid) => {
  // 清空
  ['umUid','umEmail','umName','umSchool','umPw','umPw2'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value = '';
  });
  document.getElementById('umErr').style.display = 'none';

  if (uid) {
    const u = allUsers.find(x => (x.id||x.uid)===uid);
    if (!u) { UI.toast('找不到帳號', 'danger'); return; }
    document.getElementById('umTitle').textContent    = '編輯帳號';
    document.getElementById('umUid').value            = uid;
    document.getElementById('umRole').value           = u.role||'teacher';
    document.getElementById('umEmail').value          = u.email||'';
    document.getElementById('umEmail').disabled       = true;
    document.getElementById('umName').value           = u.displayName||'';
    document.getElementById('umSchool').value         = u.school||'';
    document.getElementById('umPwLabel').innerHTML    = '新密碼（選填）';
    document.getElementById('umPwHint').classList.remove('hidden');
  } else {
    document.getElementById('umTitle').textContent    = '新增帳號';
    document.getElementById('umUid').value            = '';
    document.getElementById('umRole').value           = 'teacher';
    document.getElementById('umEmail').disabled       = false;
    document.getElementById('umPwLabel').innerHTML    = '密碼 <span class="required">*</span>';
    document.getElementById('umPwHint').classList.add('hidden');
  }
  onUmRoleChange();
  document.getElementById('userModal').classList.remove('hidden');
};

window.closeUserModal = () => document.getElementById('userModal').classList.add('hidden');

window.onUmRoleChange = () => {
  const role = document.getElementById('umRole').value;
  const req  = document.getElementById('umSchoolReq');
  const hint = document.getElementById('umSchoolHint');
  if (role==='teacher') { req.textContent='*'; hint.textContent='教師必填'; }
  else { req.textContent=''; hint.textContent='管理員選填'; }
};

window.saveUser = async () => {
  const errEl  = document.getElementById('umErr');
  errEl.style.display = 'none';
  const uid    = document.getElementById('umUid').value;
  const role   = document.getElementById('umRole').value;
  const email  = document.getElementById('umEmail').value.trim();
  const name   = document.getElementById('umName').value.trim();
  const school = document.getElementById('umSchool').value.trim();
  const pw     = document.getElementById('umPw').value;
  const pw2    = document.getElementById('umPw2').value;
  const isEdit = !!uid;
  const showErr = m => { errEl.textContent=m; errEl.style.display='block'; };

  if (!email) return showErr('請填寫電子信箱');
  if (!name)  return showErr('請填寫姓名');
  if (role==='teacher' && !school) return showErr('教師必須填寫服務學校');
  if (!isEdit && !pw) return showErr('請設定密碼');
  if (pw && pw.length<6) return showErr('密碼至少 6 字元');
  if (pw && pw!==pw2)   return showErr('兩次密碼不一致');

  const btn = document.getElementById('umSaveBtn');
  btn.disabled=true; btn.textContent='儲存中…';
  try {
    if (isEdit) {
      await DataService.updateProfile(uid, { displayName:name, role, school:school||null });
      if (pw) UI.toast('帳號已更新（密碼變更因 Firebase 安全限制需請使用者自行操作）','warning',6000);
      else    UI.toast(`帳號「${name}」已更新`,'success');
    } else {
      const res = await DataService.register({
        email, password:pw, displayName:name, role,
        school:school||null, _adminCreate:true
      });
      if (!res.ok) return showErr(res.msg);
      UI.toast(`帳號「${name}」建立成功`,'success');
    }
    closeUserModal();
    allUsers = (await DataService.getUsers()).filter(u => ['admin','teacher'].includes(u.role));
    filterUsers();
  } catch(e) {
    showErr(e.message||'發生未知錯誤');
  } finally {
    btn.disabled=false; btn.textContent='儲存帳號';
  }
};

window.doDelete = async (uid, name) => {
  if (!confirm(`確定要刪除帳號「${name}」？\n\n此操作僅刪除 Firestore 資料，Firebase Auth 帳號需至 Console 手動刪除。`)) return;
  try {
    await DataService.deleteUser(uid);
    UI.toast(`已刪除帳號「${name}」`,'success');
    allUsers = (await DataService.getUsers()).filter(u => ['admin','teacher'].includes(u.role));
    filterUsers();
  } catch(e) { UI.toast('刪除失敗：'+e.message,'danger'); }
};

// ══════════════════════════════════════════════════
//  個人資料 Panel
// ══════════════════════════════════════════════════
function buildProfilePanel() {
  const u = DataService.getCurrentUser();
  const ini = (u.displayName||u.email||'?')[0].toUpperCase();
  const showSchool = u.role==='teacher';

  document.getElementById('spanel-profile').innerHTML = `
    <div class="card" style="max-width:560px">
      <div class="card-header"><h2>個人資料</h2></div>
      <div class="card-body">
        <div style="display:flex;align-items:center;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--border-light);margin-bottom:20px">
          <div class="profile-avatar-lg">${ini}</div>
          <div>
            <div style="font-size:1.05rem;font-weight:700;margin-bottom:3px">${u.displayName||'（未設定）'}</div>
            <div style="color:var(--text-muted);font-size:.84rem;margin-bottom:6px">${u.email||''}</div>
            ${roleTag(u.role)}
            ${showSchool&&u.school?`<div style="font-size:.82rem;margin-top:6px">🏫 ${u.school}</div>`:''}
          </div>
        </div>
        <button class="btn btn-outline" id="editProfileBtn">✏️ 修改個人資料與密碼</button>
      </div>
    </div>`;

  document.getElementById('editProfileBtn').addEventListener('click', openProfileModal);
}

function openProfileModal() {
  const u = DataService.getCurrentUser();
  document.getElementById('pmEmail').value  = u.email||'';
  document.getElementById('pmName').value   = u.displayName||'';
  document.getElementById('pmSchool').value = u.school||'';
  document.getElementById('pmPw').value     = '';
  document.getElementById('pmPw2').value    = '';
  document.getElementById('pmErr').style.display = 'none';
  const sg = document.getElementById('pmSchoolGroup');
  sg.style.display = u.role==='teacher' ? 'block':'none';
  document.getElementById('pmSchoolReq').textContent = u.role==='teacher'?'*':'';
  document.getElementById('profileModal').classList.remove('hidden');
}

window.saveProfile = async () => {
  const errEl = document.getElementById('pmErr');
  errEl.style.display='none';
  const name   = document.getElementById('pmName').value.trim();
  const school = document.getElementById('pmSchool').value.trim();
  const pw     = document.getElementById('pmPw').value;
  const pw2    = document.getElementById('pmPw2').value;
  const u      = DataService.getCurrentUser();
  const showErr = m => { errEl.textContent=m; errEl.style.display='block'; };
  if (!name) return showErr('姓名不能為空');
  if (u.role==='teacher' && !school) return showErr('教師必須填寫服務學校');
  if (pw && pw.length<6) return showErr('密碼至少 6 字元');
  if (pw && pw!==pw2)   return showErr('兩次密碼不一致');
  const btn = document.getElementById('pmSaveBtn');
  btn.disabled=true; btn.textContent='儲存中…';
  try {
    await DataService.updateProfile(u.uid, { displayName:name, school:school||null });
    if (pw) {
      await updatePassword(getAuth().currentUser, pw);
      UI.toast('個人資料與密碼已更新','success');
    } else {
      UI.toast('個人資料已更新','success');
    }
    document.getElementById('profileModal').classList.add('hidden');
    buildProfilePanel(); // 重新渲染顯示最新資料
  } catch(e) {
    if (e.code==='auth/requires-recent-login') showErr('變更密碼需重新登入後再試');
    else showErr(e.message||'發生錯誤');
  } finally { btn.disabled=false; btn.textContent='儲存變更'; }
};

// ══════════════════════════════════════════════════
//  共用工具
// ══════════════════════════════════════════════════
window.togglePw = (id, btn) => {
  const inp = document.getElementById(id);
  inp.type = inp.type==='password' ? 'text' : 'password';
  btn.textContent = inp.type==='password' ? '👁' : '🙈';
};


window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

// ── 啟動 ──────────────────────────────────────────
buildTabs();
</script>
</body>
</html>
