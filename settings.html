<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳號與設定 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<style>
.settings-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px}
.settings-tab{padding:10px 22px;font-size:.88rem;font-weight:500;color:var(--text-secondary);cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:var(--font-sans)}
.settings-tab.active{color:var(--primary);border-bottom-color:var(--accent);font-weight:700}
.tab-panel{display:none}.tab-panel.active{display:block}

.role-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.75rem;font-weight:600}
.role-admin{background:#fde8e8;color:#c0392b}
.role-teacher{background:#e8eef6;color:var(--primary)}

.search-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.user-count{font-size:.82rem;color:var(--text-muted);white-space:nowrap}

.avatar-picker{border:0;min-width:0;margin:16px 0 20px}
.avatar-picker legend{font-size:.83rem;font-weight:650;color:var(--text-secondary);margin-bottom:10px}
.avatar-current{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:var(--text-secondary);font-size:.79rem}
.avatar-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.avatar-choice{display:flex;align-items:center;justify-content:center;min-width:0;padding:9px 3px;border:1px solid var(--border);border-radius:10px;background:white;color:var(--text-secondary)}
.avatar-choice:hover{background:#f5f8ff;border-color:#b8cdee}
.avatar-choice[aria-pressed="true"]{border-color:#3478f6;background:#edf4ff;box-shadow:0 0 0 2px rgba(52,120,246,.15)}
.avatar-upload{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.avatar-upload small{color:var(--text-muted);font-size:.72rem}
.avatar-file-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.profile-avatar-group{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.profile-avatar-group .btn{white-space:nowrap}
.profile-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.profile-actions{display:flex;gap:10px;flex-wrap:wrap}
.profile-actions .btn{width:148px;justify-content:center}
.catalog-subject{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
.catalog-subject-header{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--bg-base);font-weight:700}
.catalog-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;padding:12px 14px}
.catalog-books label{display:flex;align-items:center;gap:7px;font-size:.84rem}
.catalog-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
@media(max-width:440px){.avatar-options{grid-template-columns:repeat(3,minmax(0,1fr))}}
.password-card{max-width:560px}
.password-card .card-body{display:grid;gap:16px}
.password-hint{color:var(--text-muted);font-size:.82rem}
.password-field{display:grid;gap:6px}
.password-field label{color:var(--text-secondary);font-size:.82rem;font-weight:600}
.password-input{position:relative}
.password-input .form-control{width:100%;padding-right:58px}
.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--primary-light);font-size:.75rem;padding:4px}
.password-message{display:none;padding:10px 12px;border-radius:8px;font-size:.82rem}
.password-message.is-error{display:block;background:#fef0ef;color:#9c3535}
.password-message.is-success{display:block;background:#e7f7ed;color:#267656}
.password-actions{display:flex;justify-content:flex-end}
.pw-toggle{position:relative}
.pw-toggle .form-control{padding-right:42px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem;padding:2px 4px}
.field-hint{font-size:.74rem;color:var(--text-muted);margin-top:3px}
.required{color:var(--danger)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .err-box{background:#fef0ef;color:var(--danger);border:1px solid #f5c6c2;border-radius:var(--radius);padding:8px 12px;font-size:.82rem;margin-bottom:12px;display:none}

</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/avatar.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <div class="main" inert>
    <div class="topbar">
      <span class="topbar-title">帳號與設定</span>
    </div>
    <div class="page-content" id="pageContent">
      <!-- 動態填入 Tabs -->
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     新增 / 編輯帳號 Modal（靜態，不在 innerHTML 裡）
     ════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="umTitle">新增帳號</h3>
      <button class="modal-close" onclick="closeUserModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="err-box" id="umErr"></div>
      <input type="hidden" id="umUid">
      <div class="form-group">
        <label class="form-label">身份 <span class="required">*</span></label>
        <select class="form-control" id="umRole" onchange="onUmRoleChange()">
          <option value="teacher">🎓 教師</option>
          <option value="admin">🛡️ 管理員</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">電子信箱 <span class="required">*</span></label>
          <input class="form-control" type="email" id="umEmail" placeholder="登入用信箱">
        </div>
        <div class="form-group">
          <label class="form-label">姓名 <span class="required">*</span></label>
          <input class="form-control" id="umName" placeholder="顯示名稱">
        </div>
      </div>
      <div class="form-group" id="umSchoolGroup">
        <label class="form-label">服務學校 <span id="umSchoolReq" class="required"></span></label>
        <input class="form-control" id="umSchool" placeholder="請輸入服務學校全名">
        <div class="field-hint" id="umSchoolHint">教師必填</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" id="umPwLabel">密碼 <span class="required">*</span></label>
          <div class="pw-toggle">
            <input class="form-control" type="password" id="umPw" placeholder="至少 6 字元">
            <button class="pw-eye" type="button" onclick="togglePw('umPw',this)">👁</button>
          </div>
          <div class="field-hint hidden" id="umPwHint">留空則不更改密碼</div>
        </div>
        <div class="form-group">
          <label class="form-label">確認密碼</label>
          <div class="pw-toggle">
            <input class="form-control" type="password" id="umPw2" placeholder="再次輸入">
            <button class="pw-eye" type="button" onclick="togglePw('umPw2',this)">👁</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeUserModal()">取消</button>
      <button class="btn btn-primary" id="umSaveBtn" onclick="saveUser()">儲存帳號</button>
    </div>
  </div>
</div>

<!-- 個人資料 Modal -->
<div class="modal-overlay hidden" id="profileModal">
  <div class="modal">
    <div class="modal-header">
      <h3>編輯個人資料</h3>
      <button class="modal-close" onclick="document.getElementById('profileModal').classList.add('hidden')">✕</button>
    </div>
    <div class="modal-body">
      <div class="err-box" id="pmErr"></div>
      <div class="form-group">
        <label class="form-label">電子信箱（不可變更）</label>
        <input class="form-control" id="pmEmail" disabled style="background:var(--bg-base);color:var(--text-muted)">
      </div>
      <div class="form-group">
        <label class="form-label">姓名 <span class="required">*</span></label>
        <input class="form-control" id="pmName">
      </div>
      <div class="form-group" id="pmSchoolGroup" style="display:none">
        <label class="form-label">服務學校 <span id="pmSchoolReq" class="required"></span></label>
        <input class="form-control" id="pmSchool" placeholder="請輸入服務學校全名">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('profileModal').classList.add('hidden')">取消</button>
      <button class="btn btn-primary" id="pmSaveBtn" onclick="saveProfile()">儲存變更</button>
    </div>
  </div>
</div>

<!-- 頭像 Modal -->
<div class="modal-overlay hidden" id="avatarModal">
  <div class="modal">
    <div class="modal-header">
      <h3>編輯頭像</h3>
      <button class="modal-close" type="button" onclick="document.getElementById('avatarModal').classList.add('hidden')">✕</button>
    </div>
    <div class="modal-body">
      <div class="err-box" id="amErr"></div>
      <fieldset class="avatar-picker">
        <legend>選擇頭像</legend>
        <div class="avatar-current"><span id="amAvatarPreview"></span></div>
        <div class="avatar-options" id="amAvatarOptions"></div>
        <div class="avatar-upload">
          <label class="btn btn-outline btn-sm" for="amAvatarFile">上傳圖片</label>
          <input class="avatar-file-input" type="file" id="amAvatarFile" accept="image/jpeg,image/png,image/webp" aria-label="上傳自訂頭像">
          <small id="amAvatarStatus" role="status" aria-live="polite"></small>
        </div>
      </fieldset>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" type="button" onclick="document.getElementById('avatarModal').classList.add('hidden')">取消</button>
      <button class="btn btn-primary" type="button" id="amSaveBtn" onclick="saveAvatar()">儲存頭像</button>
    </div>
  </div>
</div>

<script type="module">
import { guardPage } from './js/auth-guard.js';

window._activeNav = 'settings';
const user = await guardPage();
if (!user) throw new Error('not auth');
const isAdmin = DataService.isAdmin();

// ══════════════════════════════════════════════════
//  Tab 結構
// ══════════════════════════════════════════════════
function buildTabs() {
  const tabs = [];
  if (isAdmin) tabs.push({ id:'accounts', label:'👥 帳號管理' });
  tabs.push({ id:'profile', label:'👤 個人資料' });
  tabs.push({ id:'password', label:'🔒 密碼設定' });
  tabs.push({ id:'catalog', label:'📚 題庫環境設定' });

  const tabsHTML = `<div class="settings-tabs">
    ${tabs.map((t,i)=>`<button class="settings-tab ${i===0?'active':''}" id="stab-${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('')}
  </div>
  ${tabs.map((t,i)=>`<div class="tab-panel ${i===0?'active':''}" id="spanel-${t.id}"></div>`).join('')}`;

  document.getElementById('pageContent').innerHTML = tabsHTML;

  // 渲染每個 tab 的內容
  if (isAdmin) buildAccountsPanel();
  buildProfilePanel();
  buildPasswordPanel();
  buildCatalogPanel();
}

window.switchTab = id => {
  document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('stab-'+id)?.classList.add('active');
  document.getElementById('spanel-'+id)?.classList.add('active');
};

// ══════════════════════════════════════════════════
//  帳號管理 Panel
// ══════════════════════════════════════════════════
let allUsers = [];

function buildAccountsPanel() {
  document.getElementById('spanel-accounts').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2>帳號管理</h2>
        <button class="btn btn-primary btn-sm" id="addUserBtn">＋ 新增帳號</button>
      </div>
      <div class="card-body">
        <div class="search-bar">
          <input class="form-control" id="searchInput" placeholder="🔍 搜尋姓名或信箱" style="flex:1;max-width:260px" oninput="filterUsers()">
          <select class="form-control" id="roleFilter" style="max-width:130px" onchange="filterUsers()">
            <option value="">全部身份</option>
            <option value="admin">管理員</option>
            <option value="teacher">教師</option>
          </select>
          <span class="user-count" id="userCount"></span>
        </div>
        <div class="table-wrapper">
          <table class="data-table" id="userTable">
            <thead><tr><th>姓名</th><th>電子信箱</th><th>身份</th><th>服務學校</th><th>建立日期</th><th style="width:100px"></th></tr></thead>
            <tbody id="userTbody"><tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted)">載入中…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>`;

  // 綁定「新增帳號」按鈕
  document.getElementById('addUserBtn').addEventListener('click', () => openUserModal(null));

  loadUsers();
}

async function loadUsers() {
  try {
    allUsers = (await DataService.getUsers()).filter(u => ['admin','teacher'].includes(u.role));
    filterUsers();
  } catch(e) {
    const tb = document.getElementById('userTbody');
    if (tb) tb.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:24px">載入失敗：${e.message}</td></tr>`;
  }
}

window.filterUsers = () => {
  const kw = (document.getElementById('searchInput')?.value||'').toLowerCase();
  const rf = document.getElementById('roleFilter')?.value||'';
  const filtered = allUsers.filter(u =>
    (!rf || u.role===rf) &&
    (!kw || (u.displayName||'').toLowerCase().includes(kw)||(u.email||'').toLowerCase().includes(kw)||(u.school||'').toLowerCase().includes(kw))
  );
  const cnt = document.getElementById('userCount');
  if (cnt) cnt.textContent = `共 ${filtered.length} 位`;
  const tbody = document.getElementById('userTbody');
  if (!tbody) return;
  const self = DataService.getCurrentUser();
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted)">無符合帳號</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(u => `
    <tr>
      <td><strong>${u.displayName||'—'}</strong>
        ${u.uid===self.uid?'<span style="font-size:.7rem;background:#e8eef6;color:var(--primary);padding:1px 5px;border-radius:10px;margin-left:4px">我</span>':''}</td>
      <td style="font-size:.83rem;color:var(--text-secondary)">${u.email||'—'}</td>
      <td>${roleTag(u.role)}</td>
      <td style="font-size:.83rem">${u.school||'—'}</td>
      <td style="font-size:.78rem;color:var(--text-muted)">${fmtDate(u.createdAt)}</td>
      <td><div style="display:flex;gap:5px">
        <button class="btn btn-sm btn-outline" onclick="openUserModal('${u.id||u.uid}')">編輯</button>
        ${u.uid!==self.uid?`<button class="btn btn-sm btn-danger" onclick="doDelete('${u.id||u.uid}','${(u.displayName||u.email||'').replace(/'/g,"\\'")}')">刪除</button>`:''}
      </div></td>
    </tr>`).join('');
};

function roleTag(role) {
  const m = { admin:['role-admin','🛡️ 管理員'], teacher:['role-teacher','🎓 教師'] };
  const [cls, label] = m[role]||['',''];
  return `<span class="role-badge ${cls}">${label}</span>`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

// ══════════════════════════════════════════════════
//  新增/編輯 Modal
// ══════════════════════════════════════════════════
window.openUserModal = (uid) => {
  // 清空
  ['umUid','umEmail','umName','umSchool','umPw','umPw2'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value = '';
  });
  document.getElementById('umErr').style.display = 'none';

  if (uid) {
    const u = allUsers.find(x => (x.id||x.uid)===uid);
    if (!u) { UI.toast('找不到帳號', 'danger'); return; }
    document.getElementById('umTitle').textContent    = '編輯帳號';
    document.getElementById('umUid').value            = uid;
    document.getElementById('umRole').value           = u.role||'teacher';
    document.getElementById('umEmail').value          = u.email||'';
    document.getElementById('umEmail').disabled       = true;
    document.getElementById('umName').value           = u.displayName||'';
    document.getElementById('umSchool').value         = u.school||'';
    document.getElementById('umPwLabel').innerHTML    = '新密碼（選填）';
    document.getElementById('umPwHint').classList.remove('hidden');
  } else {
    document.getElementById('umTitle').textContent    = '新增帳號';
    document.getElementById('umUid').value            = '';
    document.getElementById('umRole').value           = 'teacher';
    document.getElementById('umEmail').disabled       = false;
    document.getElementById('umPwLabel').innerHTML    = '密碼 <span class="required">*</span>';
    document.getElementById('umPwHint').classList.add('hidden');
  }
  onUmRoleChange();
  document.getElementById('userModal').classList.remove('hidden');
};

window.closeUserModal = () => document.getElementById('userModal').classList.add('hidden');

window.onUmRoleChange = () => {
  const role = document.getElementById('umRole').value;
  const req  = document.getElementById('umSchoolReq');
  const hint = document.getElementById('umSchoolHint');
  if (role==='teacher') { req.textContent='*'; hint.textContent='教師必填'; }
  else { req.textContent=''; hint.textContent='管理員選填'; }
};

window.saveUser = async () => {
  const errEl  = document.getElementById('umErr');
  errEl.style.display = 'none';
  const uid    = document.getElementById('umUid').value;
  const role   = document.getElementById('umRole').value;
  const email  = document.getElementById('umEmail').value.trim();
  const name   = document.getElementById('umName').value.trim();
  const school = document.getElementById('umSchool').value.trim();
  const pw     = document.getElementById('umPw').value;
  const pw2    = document.getElementById('umPw2').value;
  const isEdit = !!uid;
  const showErr = m => { errEl.textContent=m; errEl.style.display='block'; };

  if (!email) return showErr('請填寫電子信箱');
  if (!name)  return showErr('請填寫姓名');
  if (role==='teacher' && !school) return showErr('教師必須填寫服務學校');
  if (!isEdit && !pw) return showErr('請設定密碼');
  if (pw && pw.length<6) return showErr('密碼至少 6 字元');
  if (pw && pw!==pw2)   return showErr('兩次密碼不一致');

  const btn = document.getElementById('umSaveBtn');
  btn.disabled=true; btn.textContent='儲存中…';
  try {
    if (isEdit) {
      await DataService.updateProfile(uid, { displayName:name, role, school:school||null });
      if (pw) UI.toast('帳號已更新（密碼變更因 Firebase 安全限制需請使用者自行操作）','warning',6000);
      else    UI.toast(`帳號「${name}」已更新`,'success');
    } else {
      const res = await DataService.register({
        email, password:pw, displayName:name, role,
        school:school||null, _adminCreate:true
      });
      if (!res.ok) return showErr(res.msg);
      UI.toast(`帳號「${name}」建立成功`,'success');
    }
    closeUserModal();
    allUsers = (await DataService.getUsers()).filter(u => ['admin','teacher'].includes(u.role));
    filterUsers();
  } catch(e) {
    showErr(e.message||'發生未知錯誤');
  } finally {
    btn.disabled=false; btn.textContent='儲存帳號';
  }
};

window.doDelete = async (uid, name) => {
  if (!confirm(`確定要刪除帳號「${name}」？\n\n此操作僅刪除 Firestore 資料，Firebase Auth 帳號需至 Console 手動刪除。`)) return;
  try {
    await DataService.deleteUser(uid);
    UI.toast(`已刪除帳號「${name}」`,'success');
    allUsers = (await DataService.getUsers()).filter(u => ['admin','teacher'].includes(u.role));
    filterUsers();
  } catch(e) { UI.toast('刪除失敗：'+e.message,'danger'); }
};

// ══════════════════════════════════════════════════
//  個人資料 Panel
// ══════════════════════════════════════════════════
function buildProfilePanel() {
  const u = DataService.getCurrentUser();
  const showSchool = u.role==='teacher';

  document.getElementById('spanel-profile').innerHTML = `
    <div class="card" style="max-width:560px">
      <div class="card-header"><h2>個人資料</h2></div>
      <div class="card-body">
        <div style="display:flex;align-items:center;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--border-light);margin-bottom:20px">
          <div class="profile-avatar-group">
            ${Avatar.markup(u.avatar, u.displayName || u.email, 'user-avatar--large')}
          </div>
          <div>
            <div class="profile-name-row"><span style="font-size:1.05rem;font-weight:700">${UI.escapeHtml(u.displayName||'（未設定）')}</span>${roleTag(u.role)}</div>
            <div style="color:var(--text-muted);font-size:.84rem;margin-bottom:6px">${UI.escapeHtml(u.email||'')}</div>
            ${showSchool&&u.school?`<div style="font-size:.82rem;margin-top:6px">🏫 ${UI.escapeHtml(u.school)}</div>`:''}
          </div>
        </div>
        <div class="profile-actions">
          <button class="btn btn-outline" type="button" id="editProfileBtn">✏️ 編輯個人資料</button>
          <button class="btn btn-outline" type="button" id="editAvatarBtn">🖼️ 編輯頭像</button>
        </div>
      </div>
    </div>`;

  document.getElementById('editProfileBtn').addEventListener('click', openProfileModal);
  document.getElementById('editAvatarBtn').addEventListener('click', openAvatarModal);
}

let selectedAvatar = '';
let avatarUploadRequest = 0;
function updateAvatarPreview() {
  const u = DataService.getCurrentUser();
  document.getElementById('amAvatarPreview').innerHTML = Avatar.markup(selectedAvatar, u.displayName || u.email, 'user-avatar--large');
  document.querySelectorAll('#amAvatarOptions .avatar-choice').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.avatar === selectedAvatar));
  });
}

function buildAvatarChoices() {
  const choices = [{ id: '', label: '原始線條頭像' }, ...Avatar.options];
  document.getElementById('amAvatarOptions').innerHTML = choices.map(option => `
    <button type="button" class="avatar-choice" data-avatar="${option.id}" aria-label="${option.label}" title="${option.label}" aria-pressed="false">
      ${Avatar.markup(option.id, DataService.getCurrentUser().displayName, 'user-avatar--choice')}
    </button>`).join('');
  document.querySelectorAll('#amAvatarOptions .avatar-choice').forEach(button => {
    button.addEventListener('click', () => {
      avatarUploadRequest++;
      selectedAvatar = button.dataset.avatar;
      document.getElementById('amAvatarFile').value = '';
      document.getElementById('amAvatarStatus').textContent = '';
      document.getElementById('amSaveBtn').disabled = false;
      updateAvatarPreview();
    });
  });
  updateAvatarPreview();
}

function openProfileModal() {
  const u = DataService.getCurrentUser();
  document.getElementById('pmEmail').value  = u.email||'';
  document.getElementById('pmName').value   = u.displayName||'';
  document.getElementById('pmSchool').value = u.school||'';
  document.getElementById('pmErr').style.display = 'none';
  const sg = document.getElementById('pmSchoolGroup');
  sg.style.display = u.role==='teacher' ? 'block':'none';
  document.getElementById('pmSchoolReq').textContent = u.role==='teacher'?'*':'';
  document.getElementById('profileModal').classList.remove('hidden');
}

function openAvatarModal() {
  const u = DataService.getCurrentUser();
  avatarUploadRequest++;
  selectedAvatar = u.avatar || '';
  document.getElementById('amErr').style.display = 'none';
  document.getElementById('amAvatarFile').value = '';
  document.getElementById('amAvatarStatus').textContent = '';
  document.getElementById('amSaveBtn').disabled = false;
  buildAvatarChoices();
  document.getElementById('avatarModal').classList.remove('hidden');
}

document.getElementById('amAvatarFile').addEventListener('change', async event => {
  const file = event.target.files?.[0];
  if (!file) return;
  const status = document.getElementById('amAvatarStatus');
  const saveButton = document.getElementById('amSaveBtn');
  const request = ++avatarUploadRequest;
  saveButton.disabled = true;
  status.textContent = '圖片處理中…';
  try {
    const avatar = await Avatar.prepareUpload(file);
    if (request !== avatarUploadRequest) return;
    selectedAvatar = avatar;
    status.textContent = '已選擇自訂頭像，儲存後生效';
    updateAvatarPreview();
  } catch (error) {
    if (request !== avatarUploadRequest) return;
    event.target.value = '';
    status.textContent = error.message || '圖片無法載入';
  } finally {
    if (request === avatarUploadRequest) saveButton.disabled = false;
  }
});

window.saveProfile = async () => {
  const errEl = document.getElementById('pmErr');
  errEl.style.display='none';
  const name   = document.getElementById('pmName').value.trim();
  const school = document.getElementById('pmSchool').value.trim();
  const u      = DataService.getCurrentUser();
  const showErr = m => { errEl.textContent=m; errEl.style.display='block'; };
  if (!name) return showErr('姓名不能為空');
  if (u.role==='teacher' && !school) return showErr('教師必須填寫服務學校');
  const btn = document.getElementById('pmSaveBtn');
  btn.disabled=true; btn.textContent='儲存中…';
  try {
    await DataService.updateProfile(u.uid, { displayName:name, school:school||null });
    UI.toast('個人資料已更新','success');
    document.getElementById('profileModal').classList.add('hidden');
    buildProfilePanel(); // 重新渲染顯示最新資料
  } catch(e) {
    showErr(e.message||'發生錯誤');
  } finally { btn.disabled=false; btn.textContent='儲存變更'; }
};

window.saveAvatar = async () => {
  const errEl = document.getElementById('amErr');
  errEl.style.display = 'none';
  const btn = document.getElementById('amSaveBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    await DataService.updateProfile(DataService.getCurrentUser().uid, { avatar:selectedAvatar });
    UI.toast('頭像已更新', 'success');
    document.getElementById('avatarModal').classList.add('hidden');
    buildProfilePanel();
  } catch (e) {
    errEl.textContent = e.message || '儲存頭像失敗';
    errEl.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = '儲存頭像'; }
};

async function buildCatalogPanel() {
  const panel = document.getElementById('spanel-catalog');
  panel.innerHTML = `<section class="card" style="max-width:760px">
    <div class="card-header"><h2>題庫環境設定</h2></div>
    <div class="card-body">
      <h3 style="font-size:1rem;margin:0 0 6px">選擇科目</h3>
      <p style="font-size:.84rem;color:var(--text-secondary);margin:0 0 14px">勾選要在系統中顯示的科目與冊別。未勾選的內容將從選單、題目與試卷清單隱藏。</p>
      <div id="catalogChoices" aria-busy="true">載入科目中…</div>
      <div class="catalog-actions">
        <button class="btn btn-outline btn-sm" type="button" id="catalogSelectAll">全選</button>
        <button class="btn btn-outline btn-sm" type="button" id="catalogClearAll">全部取消</button>
        <button class="btn btn-primary" type="button" id="catalogSave">儲存設定</button>
        <span id="catalogStatus" role="status" aria-live="polite"></span>
      </div>
    </div>
  </section>`;
  const choices = document.getElementById('catalogChoices');
  const save = document.getElementById('catalogSave');
  save.disabled = true;
  try {
    const subjects = await DataService.getSubjects();
    const bookResults = await Promise.all(subjects.map(s => DataService.getBooks(s.id)));
    const visible = DataService.getVisibleCatalog();
    choices.innerHTML = subjects.map((subject, index) => {
      const books = [...new Map(bookResults[index].filter(b => b.code).map(b => [b.code, b])).values()];
      const selected = visible === null || Object.prototype.hasOwnProperty.call(visible, subject.code);
      return `<div class="catalog-subject" data-subject="${UI.escapeHtml(subject.code)}">
        <label class="catalog-subject-header"><input type="checkbox" class="catalog-subject-check" ${selected ? 'checked' : ''}>${UI.escapeHtml(subject.name || subject.code)}</label>
        <div class="catalog-books">${books.length ? books.map(book => `<label><input type="checkbox" class="catalog-book-check" value="${UI.escapeHtml(book.code)}" ${visible === null || (Array.isArray(visible[subject.code]) && visible[subject.code].includes(book.code)) ? 'checked' : ''}>${UI.escapeHtml(book.name || book.code)}</label>`).join('') : '<span style="color:var(--text-muted);font-size:.82rem">目前沒有冊別</span>'}</div>
      </div>`;
    }).join('') || '<p>目前沒有可選擇的科目。</p>';
    choices.setAttribute('aria-busy', 'false');
    choices.addEventListener('change', event => {
      const group = event.target.closest('.catalog-subject');
      if (!group) return;
      const subjectCheck = group.querySelector('.catalog-subject-check');
      const bookChecks = [...group.querySelectorAll('.catalog-book-check')];
      if (event.target === subjectCheck) bookChecks.forEach(input => { input.checked = subjectCheck.checked; });
      else subjectCheck.checked = bookChecks.some(input => input.checked);
      document.getElementById('catalogStatus').textContent = '尚未儲存';
    });
    document.getElementById('catalogSelectAll').addEventListener('click', () => {
      choices.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = true; });
      document.getElementById('catalogStatus').textContent = '尚未儲存';
    });
    document.getElementById('catalogClearAll').addEventListener('click', () => {
      choices.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = false; });
      document.getElementById('catalogStatus').textContent = '尚未儲存';
    });
    save.disabled = false;
    save.addEventListener('click', async () => {
      const selected = {};
      choices.querySelectorAll('.catalog-subject').forEach(group => {
        if (group.querySelector('.catalog-subject-check').checked) {
          selected[group.dataset.subject] = [...group.querySelectorAll('.catalog-book-check:checked')].map(input => input.value);
        }
      });
      save.disabled = true;
      const status = document.getElementById('catalogStatus');
      status.textContent = '儲存中…';
      try {
        await DataService.updateProfile(DataService.getCurrentUser().uid, { visibleCatalog:selected });
        window._tbCache = null;
        status.textContent = '已儲存；切換頁面後依新設定顯示';
        UI.toast('題庫環境設定已更新', 'success');
      } catch (error) {
        status.textContent = `儲存失敗：${error.message || '請稍後再試'}`;
      } finally { save.disabled = false; }
    });
  } catch (error) {
    choices.textContent = `科目載入失敗：${error.message || '請稍後再試'}`;
    choices.setAttribute('aria-busy', 'false');
  }
}

function buildPasswordPanel() {
  document.getElementById('spanel-password').innerHTML = `
    <section class="card password-card" aria-labelledby="passwordHeading">
      <div class="card-header"><h2 id="passwordHeading">密碼設定</h2></div>
      <form class="card-body" id="passwordForm">
        <p class="password-hint">請先輸入目前密碼，再設定新密碼。</p>
        <div class="password-field"><label for="currentPassword">目前密碼</label><div class="password-input"><input class="form-control" id="currentPassword" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-toggle="currentPassword" aria-label="顯示目前密碼">顯示</button></div></div>
        <div class="password-field"><label for="newPassword">新密碼</label><div class="password-input"><input class="form-control" id="newPassword" type="password" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" data-toggle="newPassword" aria-label="顯示新密碼">顯示</button></div><small class="password-hint">至少 6 個字元</small></div>
        <div class="password-field"><label for="confirmPassword">確認新密碼</label><div class="password-input"><input class="form-control" id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" data-toggle="confirmPassword" aria-label="顯示確認新密碼">顯示</button></div></div>
        <div class="password-message" id="passwordMessage" role="status" aria-live="polite"></div>
        <div class="password-actions"><button class="btn btn-primary" id="passwordSave" type="submit">更新密碼</button></div>
      </form>
    </section>`;

  const form = document.getElementById('passwordForm');
  const message = document.getElementById('passwordMessage');
  const saveButton = document.getElementById('passwordSave');
  const showMessage = (text, success = false) => {
    message.textContent = text;
    message.className = `password-message ${success ? 'is-success' : 'is-error'}`;
  };

  form.querySelectorAll('[data-toggle]').forEach(button => {
    button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.toggle);
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      button.textContent = visible ? '隱藏' : '顯示';
      button.setAttribute('aria-label', `${visible ? '隱藏' : '顯示'}${input.labels[0].textContent}`);
    });
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const current = document.getElementById('currentPassword').value;
    const next = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    if (next.length < 6) return showMessage('新密碼至少需要 6 個字元');
    if (next !== confirm) return showMessage('兩次輸入的新密碼不一致');
    if (current === next) return showMessage('新密碼請勿與目前密碼相同');
    saveButton.disabled = true;
    saveButton.textContent = '更新中…';
    message.className = 'password-message';
    try {
      await DataService.changePassword(current, next);
      form.reset();
      showMessage('密碼已更新', true);
    } catch (error) {
      const descriptions = {
        'auth/invalid-credential': '目前密碼不正確',
        'auth/wrong-password': '目前密碼不正確',
        'auth/weak-password': '新密碼強度不足，請使用更長的密碼',
        'auth/too-many-requests': '嘗試次數過多，請稍後再試',
        'auth/network-request-failed': '網路連線失敗，請稍後再試'
      };
      showMessage(descriptions[error.code] || error.message || '更新密碼失敗');
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = '更新密碼';
    }
  });
}
