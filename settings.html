<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進階設定 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<style>
.settings-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.settings-tab{padding:9px 16px;font-size:.86rem;font-weight:600;color:var(--text-secondary);cursor:pointer;border:1px solid var(--border);border-radius:9px;background:#fff;transition:background .15s,border-color .15s,color .15s;font-family:var(--font-sans)}
.settings-tab:hover{background:#f0f5ff;border-color:#b8cdee;color:var(--primary)}
.settings-tab.active{color:#2168df;border-color:#b8cdee;background:#edf3ff}
.settings-tab,.settings-page .btn{display:inline-flex;align-items:center;gap:7px}
.settings-tab svg,.settings-page .btn svg,.role-badge svg{width:16px;height:16px;flex:none}
.tab-panel{display:none}.tab-panel.active{display:block}
.settings-page .card{max-width:900px;overflow:visible}
.settings-page .card-header{padding:22px 22px 0;border:0;gap:16px}
.settings-page .card-header h2{font-family:var(--font-sans);font-size:1.35rem;letter-spacing:.01em;font-weight:700;color:var(--text-primary)}
.settings-page .card-body{padding:20px 22px 22px}
.settings-page .card-header+.card-body{padding-top:18px}
.settings-page .card-header+.card-body.card-body-with-description{padding-top:2px}
.settings-page #spanel-profile .card-header+.card-body{padding-top:8px}
.settings-page .accounts-card{max-width:none}
.settings-page .accounts-card .card-header{align-items:center}
.settings-page .accounts-card .search-bar{gap:10px;margin-bottom:16px}
.settings-page .accounts-card .user-count{margin-left:auto}
.settings-page .accounts-card .data-table{font-size:.9rem}
.settings-page .accounts-card .data-table th{padding:12px 16px;background:#fff;font-size:.86rem;text-align:left}
.settings-page .accounts-card .data-table td{padding:12px 16px}
.account-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.account-info-item{padding:12px 14px;border:1px solid var(--border-light);border-radius:var(--radius);background:var(--bg-base)}
.account-info-item span{display:block;color:var(--text-muted);font-size:.84rem;margin-bottom:4px}
.account-info-item strong{font-size:1.05rem;color:var(--text-primary)}
.account-info-note{color:var(--text-muted);font-size:.84rem;margin:14px 0 0}
@media(max-width:440px){.account-info-grid{grid-template-columns:1fr}}
.settings-page .accounts-card .data-table tbody tr:nth-child(even){background:#fbfcfe}
.settings-page .accounts-card .data-table tbody tr:hover{background:#edf3ff}
.settings-page .accounts-card .data-table .btn{line-height:1;justify-content:center}
.settings-page .accounts-card .data-table .btn svg{display:block}
.settings-page #spanel-profile .card{max-width:560px}
.settings-page .exam-margins-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:440px){.settings-page .exam-margins-grid{grid-template-columns:1fr}}
@media(max-width:600px){.settings-page .card-header{align-items:flex-start;flex-direction:column}.settings-page .accounts-card .user-count{margin-left:0}}

.role-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:.84rem;font-weight:600}
.role-admin{background:#fde8e8;color:#c0392b}
.role-teacher{background:#e8eef6;color:var(--primary)}

.search-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.settings-search{position:relative;flex:1;max-width:260px}
.settings-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted);pointer-events:none}
.settings-search .form-control{width:100%;padding-left:35px}
.user-count{font-size:.88rem;color:var(--text-muted);white-space:nowrap}

.avatar-picker{border:0;min-width:0;margin:16px 0 20px}
.avatar-picker legend{font-size:.9rem;font-weight:650;color:var(--text-secondary);margin-bottom:10px}
.avatar-current{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:var(--text-secondary);font-size:.86rem}
.avatar-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.avatar-choice{display:flex;align-items:center;justify-content:center;min-width:0;padding:9px 3px;border:1px solid var(--border);border-radius:10px;background:white;color:var(--text-secondary)}
.avatar-choice:hover{background:#f5f8ff;border-color:#b8cdee}
.avatar-choice[aria-pressed="true"]{border-color:#3478f6;background:#edf4ff;box-shadow:0 0 0 2px rgba(52,120,246,.15)}
.avatar-upload{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.avatar-upload small{color:var(--text-muted);font-size:.84rem}
.avatar-file-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.profile-avatar-group{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.profile-avatar-group .btn{white-space:nowrap}
.profile-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.profile-school{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.88rem}
.profile-school svg{flex:none}
.profile-actions{display:flex;gap:10px;flex-wrap:wrap}
.profile-actions .btn{width:148px;justify-content:center}
.catalog-subject{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
.catalog-subject-header{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--bg-base);font-size:.9rem;font-weight:700}
.catalog-books{display:flex;flex-wrap:wrap;gap:9px 18px;padding:12px 14px;overflow-x:auto}
.catalog-books label{display:inline-flex;align-items:center;gap:7px;flex:none;font-size:.9rem;white-space:nowrap}
.catalog-subject input[type=checkbox]{width:16px;height:16px;flex:none}
.catalog-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.catalog-section[hidden]{display:none}
#catalogSubnav{flex-wrap:wrap}
.header-layout-board{display:grid;gap:12px}
.header-layout-line{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.header-layout-line>strong{padding-top:12px;color:var(--text-secondary);font-size:.9rem}
.header-layout-dropzone{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;min-height:64px;padding:10px;border:1px dashed #b9c5d4;border-radius:10px;background:#f8fafc}
.header-layout-dropzone.is-target{border-color:#3974c7;background:#eef5ff}
.header-layout-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #c6d4e7;border-radius:8px;background:#fff;color:#2f425c;font:inherit;font-size:.9rem;cursor:grab;user-select:none}
.header-layout-chip::before{content:'⋮⋮';color:#8395aa;letter-spacing:-3px}
.header-layout-chip.dragging{opacity:.45}
.header-layout-chip:focus-visible{outline:2px solid #3974c7;outline-offset:2px}
.header-layout-placeholder{width:64px;min-height:34px;border:2px dashed #3974c7;border-radius:8px;background:#eaf2ff}
@media(max-width:600px){.header-layout-line{grid-template-columns:1fr;gap:4px}.header-layout-line>strong{padding-top:0}}
@media(max-width:440px){.avatar-options{grid-template-columns:repeat(3,minmax(0,1fr))}}
.password-card{max-width:560px}
.password-card .card-body{display:grid;gap:16px}
.password-hint{color:var(--text-muted);font-size:.88rem}
.password-field{display:grid;gap:6px}
.password-field label{color:var(--text-secondary);font-size:.88rem;font-weight:600}
.password-input{position:relative}
.password-input .form-control{width:100%;padding-right:58px}
.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--primary-light);font-size:.84rem;padding:4px}
.password-message{display:none;padding:10px 12px;border-radius:8px;font-size:.88rem}
.password-message.is-error{display:block;background:#fef0ef;color:#9c3535}
.password-message.is-success{display:block;background:#e7f7ed;color:#267656}
.password-actions{display:flex;justify-content:flex-end}
.pw-toggle{position:relative}
.pw-toggle .form-control{padding-right:42px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem;padding:2px 4px}
.field-hint{font-size:.84rem;color:var(--text-muted);margin-top:3px}
.required{color:var(--danger)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .err-box{background:#fef0ef;color:var(--danger);border:1px solid #f5c6c2;border-radius:var(--radius);padding:8px 12px;font-size:.88rem;margin-bottom:12px;display:none}

</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/avatar.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <div class="main" inert>
    <div class="topbar">
      <span class="topbar-title" id="settingsPageTitle">進階設定</span>
    </div>
    <div class="page-content settings-page" id="pageContent">
      <!-- 動態填入 Tabs -->
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     新增 / 編輯帳號 Modal（靜態，不在 innerHTML 裡）
     ════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="umTitle">新增帳號</h3>
      <button class="modal-close" onclick="closeUserModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="err-box" id="umErr"></div>
      <input type="hidden" id="umUid">
      <div class="form-group">
        <label class="form-label">身份 <span class="required">*</span></label>
        <select class="form-control" id="umRole" onchange="onUmRoleChange()">
          <option value="teacher">教師</option>
          <option value="manager">管理員</option>
          <option value="admin" hidden>主要管理員</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">電子信箱 <span class="required">*</span></label>
          <input class="form-control" type="email" id="umEmail" placeholder="登入用信箱">
        </div>
        <div class="form-group">
          <label class="form-label">姓名 <span class="required">*</span></label>
          <input class="form-control" id="umName" placeholder="顯示名稱">
        </div>
      </div>
      <div class="form-group" id="umSchoolGroup">
        <label class="form-label">服務學校 <span id="umSchoolReq" class="required"></span></label>
        <input class="form-control" id="umSchool" placeholder="請輸入服務學校全名">
        <div class="field-hint" id="umSchoolHint">教師必填</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" id="umPwLabel">密碼 <span class="required">*</span></label>
          <div class="pw-toggle">
            <input class="form-control" type="password" id="umPw" placeholder="至少 6 字元">
            <button class="pw-eye" type="button" onclick="togglePw('umPw',this)">👁</button>
          </div>
          <div class="field-hint hidden" id="umPwHint">留空則不更改密碼</div>
        </div>
        <div class="form-group">
          <label class="form-label">確認密碼</label>
          <div class="pw-toggle">
            <input class="form-control" type="password" id="umPw2" placeholder="再次輸入">
            <button class="pw-eye" type="button" onclick="togglePw('umPw2',this)">👁</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeUserModal()">取消</button>
      <button class="btn btn-primary" id="umSaveBtn" onclick="saveUser()">儲存帳號</button>
    </div>
  </div>
</div>

<!-- 帳號資訊 Modal -->
<div class="modal-overlay hidden" id="accountInfoModal" role="dialog" aria-modal="true" aria-labelledby="accountInfoTitle">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 id="accountInfoTitle">帳號資訊</h3>
      <button class="modal-close" type="button" onclick="closeAccountInfo()" aria-label="關閉">✕</button>
    </div>
    <div class="modal-body">
      <p id="accountInfoIdentity" style="margin:0 0 16px;color:var(--text-secondary)"></p>
      <div class="account-info-grid">
        <div class="account-info-item"><span>登入次數</span><strong id="accountInfoLogins">—</strong></div>
        <div class="account-info-item"><span>最後登入時間</span><strong id="accountInfoLastLogin">—</strong></div>
        <div class="account-info-item"><span>累計建立試卷</span><strong id="accountInfoCreated">—</strong></div>
        <div class="account-info-item"><span>目前保留試卷</span><strong id="accountInfoCurrent">—</strong></div>
      </div>
      <p class="account-info-note">登入與累計建卷次數從統計啟用後開始記錄；目前保留試卷數直接從試卷資料查詢。</p>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" type="button" onclick="closeAccountInfo()">關閉</button></div>
  </div>
</div>

<!-- 個人資料 Modal -->
<div class="modal-overlay hidden" id="profileModal">
  <div class="modal">
    <div class="modal-header">
      <h3>編輯個人資料</h3>
      <button class="modal-close" onclick="document.getElementById('profileModal').classList.add('hidden')">✕</button>
    </div>
    <div class="modal-body">
      <div class="err-box" id="pmErr"></div>
      <div class="form-group">
        <label class="form-label">電子信箱（不可變更）</label>
        <input class="form-control" id="pmEmail" disabled style="background:var(--bg-base);color:var(--text-muted)">
      </div>
      <div class="form-group">
        <label class="form-label">姓名 <span class="required">*</span></label>
        <input class="form-control" id="pmName">
      </div>
      <div class="form-group" id="pmSchoolGroup" style="display:none">
        <label class="form-label">服務學校 <span id="pmSchoolReq" class="required"></span></label>
        <input class="form-control" id="pmSchool" placeholder="請輸入服務學校全名">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('profileModal').classList.add('hidden')">取消</button>
      <button class="btn btn-primary" id="pmSaveBtn" onclick="saveProfile()">儲存變更</button>
    </div>
  </div>
</div>

<!-- 頭像 Modal -->
<div class="modal-overlay hidden" id="avatarModal">
  <div class="modal">
    <div class="modal-header">
      <h3>編輯頭像</h3>
      <button class="modal-close" type="button" onclick="document.getElementById('avatarModal').classList.add('hidden')">✕</button>
    </div>
    <div class="modal-body">
      <div class="err-box" id="amErr"></div>
      <fieldset class="avatar-picker">
        <legend>選擇頭像</legend>
        <div class="avatar-current"><span id="amAvatarPreview"></span></div>
        <div class="avatar-options" id="amAvatarOptions"></div>
        <div class="avatar-upload">
          <label class="btn btn-outline btn-sm" for="amAvatarFile">上傳圖片</label>
          <input class="avatar-file-input" type="file" id="amAvatarFile" accept="image/jpeg,image/png,image/webp" aria-label="上傳自訂頭像">
          <small id="amAvatarStatus" role="status" aria-live="polite"></small>
        </div>
      </fieldset>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" type="button" onclick="document.getElementById('avatarModal').classList.add('hidden')">取消</button>
      <button class="btn btn-primary" type="button" id="amSaveBtn" onclick="saveAvatar()">儲存變更</button>
    </div>
  </div>
</div>

<script type="module">
import { guardPage } from './js/auth-guard.js';
import { confirmDeletion } from './js/confirm-exam-deletion.js';
import { DEFAULT_WORD_MARGINS, loadWordMargins, saveWordMargins, resetWordMargins, FONT_OPTIONS, FONT_SIZE_RANGE, LINE_HEIGHT_RANGE, loadAppearance, saveAppearance, loadHeader, saveHeader, HEADER_FIELDS, DEFAULT_HEADER_LAYOUT, normalizeHeaderLayout } from './js/exam-preview.js';

const settingsView = new URLSearchParams(location.search).get('view');
window._activeNav = settingsView === 'accounts' ? 'account-admin' : 'settings';
const user = await guardPage();
if (!user) throw new Error('not auth');
const isAdmin = DataService.isAdmin();
const isPrimaryAdmin = DataService.isPrimaryAdmin();
if (settingsView === 'accounts' && !isAdmin) location.replace('settings.html');
const pageTitle = settingsView === 'accounts' ? '帳號管理' : '進階設定';
document.title = `${pageTitle} — 幼獅題庫系統`;
document.getElementById('settingsPageTitle').textContent = pageTitle;

// ══════════════════════════════════════════════════
//  Tab 結構
// ══════════════════════════════════════════════════
function buildTabs() {
  const tabs = [];
  if (settingsView === 'accounts' && isAdmin) tabs.push({ id:'accounts', label:'帳號管理' });
  else {
    tabs.push({ id:'profile', label:'個人資料', icon:ICONS.user16 });
    tabs.push({ id:'subjects', label:'常用科目', icon:ICONS.navTextbooks20 });
    tabs.push({ id:'appearance', label:'試卷版面設定', icon:ICONS.navSettings20 });
  }

  const tabsHTML = `${tabs.length > 1 ? `<div class="settings-tabs" aria-label="進階設定">
    ${tabs.map((t,i)=>`<button class="settings-tab ${i===0?'active':''}" id="stab-${t.id}" onclick="switchTab('${t.id}')">${t.icon || ''}${t.label}</button>`).join('')}
  </div>` : ''}
  ${tabs.map((t,i)=>`<div class="tab-panel ${i===0?'active':''}" id="spanel-${t.id}"></div>`).join('')}`;

  document.getElementById('pageContent').innerHTML = tabsHTML;

  // 渲染每個 tab 的內容
  if (settingsView === 'accounts' && isAdmin) buildAccountsPanel();
  else {
    buildProfilePanel();
    buildCatalogPanel();
    const requested = new URLSearchParams(location.search).get('section');
    if (settingsView === 'catalog') switchTab(requested === 'appearance' || requested === 'margins' || requested === 'header' ? 'appearance' : 'subjects');
    else if (requested === 'subjects' || requested === 'appearance') switchTab(requested);
  }
}

window.switchTab = id => {
  document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('stab-'+id)?.classList.add('active');
  document.getElementById('spanel-'+id)?.classList.add('active');
};

// ══════════════════════════════════════════════════
//  帳號管理 Panel
// ══════════════════════════════════════════════════
let allUsers = [];

function buildAccountsPanel() {
  document.getElementById('spanel-accounts').innerHTML = `
    <div class="card accounts-card">
      <div class="card-header">
        <h2>帳號管理</h2>
        <button class="btn btn-primary btn-sm" id="addUserBtn">${ICONS.plus16}新增帳號</button>
      </div>
      <div class="card-body">
        <div class="search-bar">
          <div class="settings-search">${ICONS.search16}<input class="form-control" id="searchInput" placeholder="搜尋姓名或信箱" oninput="filterUsers()"></div>
          <select class="form-control" id="roleFilter" style="max-width:130px" onchange="filterUsers()">
            <option value="">全部身份</option>
            <option value="admin">主要管理員</option>
            <option value="manager">管理員</option>
            <option value="teacher">教師</option>
          </select>
          <span class="user-count" id="userCount"></span>
        </div>
        <div class="table-wrapper">
          <table class="data-table" id="userTable">
            <thead><tr><th>姓名</th><th>電子信箱</th><th>身份</th><th>服務學校</th><th>建立日期</th><th>操作</th></tr></thead>
            <tbody id="userTbody"><tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted)">載入中…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>`;

  // 綁定「新增帳號」按鈕
  document.getElementById('addUserBtn').addEventListener('click', () => openUserModal(null));

  loadUsers();
}

async function loadUsers() {
  try {
    allUsers = (await DataService.getUsers()).filter(u => ['admin','manager','teacher'].includes(u.role));
    filterUsers();
  } catch(e) {
    const tb = document.getElementById('userTbody');
    if (tb) tb.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:24px">載入失敗：${UI.escapeHtml(e.message)}</td></tr>`;
  }
}

window.filterUsers = () => {
  const kw = (document.getElementById('searchInput')?.value||'').toLowerCase();
  const rf = document.getElementById('roleFilter')?.value||'';
  const filtered = allUsers.filter(u =>
    (!rf || u.role===rf) &&
    (!kw || (u.displayName||'').toLowerCase().includes(kw)||(u.email||'').toLowerCase().includes(kw)||(u.school||'').toLowerCase().includes(kw))
  );
  const cnt = document.getElementById('userCount');
  if (cnt) cnt.textContent = `共 ${filtered.length} 位`;
  const tbody = document.getElementById('userTbody');
  if (!tbody) return;
  const self = DataService.getCurrentUser();
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted)">無符合帳號</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(u => `
    <tr>
      <td><strong>${UI.escapeHtml(u.displayName||'—')}</strong>
        ${u.uid===self.uid?'<span style="font-size:.82rem;background:#e8eef6;color:var(--primary);padding:1px 5px;border-radius:10px;margin-left:4px">我</span>':''}</td>
      <td style="color:var(--text-secondary)">${UI.escapeHtml(u.email||'—')}</td>
      <td>${roleTag(u.role)}</td>

let accountInfoPreviousFocus = null;
window.openAccountInfo = async uid => {
  const target = allUsers.find(u => u.uid === uid);
  if (!target) { UI.toast('找不到帳號', 'danger'); return; }
  accountInfoPreviousFocus = document.activeElement;
  document.getElementById('accountInfoIdentity').textContent = `${target.displayName || '—'} · ${target.email || '—'}`;
  document.getElementById('accountInfoLogins').textContent = target.loginCount ?? '—';
  document.getElementById('accountInfoLastLogin').textContent = UI.formatDateTime(target.lastLoginAt);
  document.getElementById('accountInfoCreated').textContent = target.examCreatedCount ?? '—';
  const currentCount = document.getElementById('accountInfoCurrent');
  currentCount.textContent = target.examCurrentCount ?? '查詢中…';
  document.getElementById('accountInfoModal').dataset.uid = uid;
  document.getElementById('accountInfoModal').classList.remove('hidden');
  document.querySelector('#accountInfoModal .modal-close').focus();
  try {
    const count = await DataService.getExamCountForUser(uid);
    if (document.getElementById('accountInfoModal').classList.contains('hidden') ||
        document.getElementById('accountInfoModal').dataset.uid !== uid) return;
    currentCount.textContent = count;
    target.examCurrentCount = count;
  } catch (error) {
    if (!document.getElementById('accountInfoModal').classList.contains('hidden') &&
        document.getElementById('accountInfoModal').dataset.uid === uid) {
      const quotaExceeded = error.code === 'resource-exhausted' || /quota exceeded/i.test(error.message || '');
      currentCount.textContent = target.examCurrentCount ?? (quotaExceeded ? '配額已滿' : '查詢失敗');
      UI.toast(quotaExceeded ? 'Firestore 配額已滿，暫時無法查詢試卷數量' : '試卷數量查詢失敗：' + error.message, 'danger');
    }
  }
};
window.closeAccountInfo = () => {
  document.getElementById('accountInfoModal').classList.add('hidden');
  accountInfoPreviousFocus?.focus?.();
};
document.getElementById('accountInfoModal').addEventListener('click', event => {
  if (event.target.id === 'accountInfoModal') closeAccountInfo();
});
document.getElementById('accountInfoModal').addEventListener('keydown', event => {
  if (event.key === 'Escape') { event.preventDefault(); closeAccountInfo(); }
  if (event.key === 'Tab') {
    const buttons = [...event.currentTarget.querySelectorAll('button')];
    if ((event.shiftKey && document.activeElement === buttons[0]) || (!event.shiftKey && document.activeElement === buttons.at(-1))) {
      event.preventDefault();
      (event.shiftKey ? buttons.at(-1) : buttons[0]).focus();
    }
  }
});

function roleTag(role) {
  const m = { admin:['role-admin',`${ICONS.users16}主要管理員`], manager:['role-admin',`${ICONS.users16}管理員`], teacher:['role-teacher',`${ICONS.school16}教師`] };
  const [cls, label] = m[role]||['',''];
  return `<span class="role-badge ${cls}">${label}</span>`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

window.saveUser = async () => {
  const errEl  = document.getElementById('umErr');
  errEl.style.display = 'none';
  const uid    = document.getElementById('umUid').value;
  const role   = document.getElementById('umRole').value;
  const email  = document.getElementById('umEmail').value.trim();
  const name   = document.getElementById('umName').value.trim();
  const school = document.getElementById('umSchool').value.trim();
  const pw     = document.getElementById('umPw').value;
  const pw2    = document.getElementById('umPw2').value;
  const isEdit = !!uid;
  const target = isEdit ? allUsers.find(u => u.uid===uid) : null;
  const showErr = m => { errEl.textContent=m; errEl.style.display='block'; };

  if (!email) return showErr('請填寫電子信箱');
  if (isEdit && (!target || (target.uid !== user.uid && !isPrimaryAdmin && target.role !== 'teacher') || (target.uid === user.uid && role !== target.role) || (target.role === 'admin' && role !== 'admin'))) return showErr('權限不足');
  if (!isEdit && (role !== 'teacher' && (!isPrimaryAdmin || role !== 'manager'))) return showErr('權限不足');
  if (!name)  return showErr('請填寫姓名');
  if (role==='teacher' && !school) return showErr('教師必須填寫服務學校');
  if (!isEdit && !pw) return showErr('請設定密碼');
  if (pw && pw.length<6) return showErr('密碼至少 6 字元');
  if (pw && pw!==pw2)   return showErr('兩次密碼不一致');

  const btn = document.getElementById('umSaveBtn');
  btn.disabled=true; btn.textContent='儲存中…';
  try {
    if (isEdit) {
      await DataService.updateProfile(uid, { displayName:name, role, school:school||null });
      if (pw) UI.toast('帳號已更新（密碼變更因 Firebase 安全限制需請使用者自行操作）','warning',6000);
      else    UI.toast(`帳號「${name}」已更新`,'success');
    } else {
      const res = await DataService.register({
        email, password:pw, displayName:name, role,
        school:school||null, _adminCreate:true
      });
      if (!res.ok) return showErr(res.msg);
      UI.toast(`帳號「${name}」建立成功`,'success');
    }
    closeUserModal();
    allUsers = (await DataService.getUsers()).filter(u => ['admin','manager','teacher'].includes(u.role));
    filterUsers();
  } catch(e) {
    showErr(e.message||'發生未知錯誤');
  } finally {
    btn.disabled=false; btn.textContent='儲存帳號';
  }
};

window.doDelete = async uid => {
  const target = allUsers.find(u => u.uid===uid);
  if (!target || uid===user.uid || target.role==='admin' || (!isPrimaryAdmin && target.role!=='teacher')) { UI.toast('權限不足', 'danger'); return; }
  const name = target.displayName || target.email || '';
  if (!await confirmDeletion({
    title: '刪除帳號',
    message: `確定要刪除帳號「${name}」？此操作僅刪除 Firestore 資料，Firebase Auth 帳號需至 Console 手動刪除。`,
    actionLabel: '刪除帳號'
  })) return;
  try {
    await DataService.deleteUser(uid);
    UI.toast(`已刪除帳號「${name}」`,'success');
    allUsers = (await DataService.getUsers()).filter(u => ['admin','manager','teacher'].includes(u.role));
    filterUsers();
  } catch(e) { UI.toast('刪除失敗：'+e.message,'danger'); }
};

let selectedAvatar = '';

function updateAvatarPreview() {
  const u = DataService.getCurrentUser();

  document.querySelectorAll('#amAvatarOptions .avatar-choice').forEach(button => {

function buildAvatarChoices() {
  const choices = [{ id: '', label: '原始線條頭像' }, ...Avatar.options];
  document.getElementById('amAvatarOptions').innerHTML = choices.map(option => `
    <button type="button" class="avatar-choice" data-avatar="${option.id}" aria-label="${option.label}" title="${option.label}" aria-pressed="false">
      ${Avatar.markup(option.id, DataService.getCurrentUser().displayName, 'user-avatar--choice')}
    </button>`).join('');
  document.querySelectorAll('#amAvatarOptions .avatar-choice').forEach(button => {
    button.addEventListener('click', () => {
      avatarUploadRequest++;
      selectedAvatar = button.dataset.avatar;
      document.getElementById('amAvatarFile').value = '';
      document.getElementById('amAvatarStatus').textContent = '';
      document.getElementById('amSaveBtn').disabled = false;
      updateAvatarPreview();
    });

}

function openAvatarModal() {
  const u = DataService.getCurrentUser();
  avatarUploadRequest++;
  selectedAvatar = u.avatar || '';
  document.getElementById('amErr').style.display = 'none';
  document.getElementById('amAvatarFile').value = '';
  document.getElementById('amAvatarStatus').textContent = '';
  document.getElementById('amSaveBtn').disabled = false;

document.getElementById('amAvatarFile').addEventListener('change', async event => {
  const file = event.target.files?.[0];
  if (!file) return;
  const status = document.getElementById('amAvatarStatus');
  const saveButton = document.getElementById('amSaveBtn');
  const request = ++avatarUploadRequest;
  saveButton.disabled = true;
  status.textContent = '圖片處理中…';
  try {
    const avatar = await Avatar.prepareUpload(file);
    if (request !== avatarUploadRequest) return;
    selectedAvatar = avatar;
    status.textContent = '已選擇自訂頭像，儲存後生效';
    updateAvatarPreview();
  } catch (error) {
    if (request !== avatarUploadRequest) return;
    event.target.value = '';
    status.textContent = error.message || '圖片無法載入';
  } finally {
    if (request === avatarUploadRequest) saveButton.disabled = false;
  }
});

      const selected = {};
      choices.querySelectorAll('.catalog-subject').forEach(group => {
        if (group.querySelector('.catalog-subject-check').checked) {
          selected[group.dataset.subject] = [...group.querySelectorAll('.catalog-book-check:checked')].map(input => input.value);
        }
      });
      save.disabled = true;
      const status = document.getElementById('catalogStatus');
      status.textContent = '儲存中…';
      try {
        await DataService.updateProfile(DataService.getCurrentUser().uid, { visibleCatalog:selected });
        window._tbCache = null;
        status.textContent = '已儲存；切換頁面後依新設定顯示';
        UI.toast('常用科目設定已更新', 'success');
      } catch (error) {
        status.textContent = `儲存失敗：${error.message || '請稍後再試'}`;
      } finally { save.disabled = false; }
    });
  } catch (error) {
    choices.textContent = `科目載入失敗：${error.message || '請稍後再試'}`;
    choices.setAttribute('aria-busy', 'false');
  }
}

function buildAppearanceSettings() {
  const font = document.getElementById('defaultExamFont');
  const size = document.getElementById('defaultExamFontSize');
  const line = document.getElementById('defaultExamLineHeight');
  font.innerHTML = FONT_OPTIONS.map(option => `<option value="${option.id}">${option.label}</option>`).join('');
  size.innerHTML = Array.from({length:FONT_SIZE_RANGE.max-FONT_SIZE_RANGE.min+1}, (_, index) => {
    const value = FONT_SIZE_RANGE.min + index;
    return `<option value="${value}">${value}</option>`;
  }).join('');
  line.min = LINE_HEIGHT_RANGE.min;
  line.max = LINE_HEIGHT_RANGE.max;
  line.step = LINE_HEIGHT_RANGE.step;
  const fill = values => { font.value = values.font; size.value = values.fontSize; line.value = values.lineHeight; };
  fill(loadAppearance());
  const status = document.getElementById('appearanceStatus');
  document.getElementById('appearanceSave').addEventListener('click', async () => {
    if (!size.reportValidity() || !line.reportValidity()) return;
    try {
      await DataService.preserveExamAppearances(loadAppearance());
      await saveAppearance({ font:font.value, fontSize:Number(size.value), lineHeight:Number(line.value) });
      status.textContent = '已儲存';
      UI.toast('字體與行距已儲存', 'success');
    } catch (error) { status.textContent = `儲存失敗：${error.message || '請稍後再試'}`; }
  });
  document.getElementById('appearanceReset').addEventListener('click', async () => {
    const defaults = { font:'system', fontSize:FONT_SIZE_RANGE.default, lineHeight:LINE_HEIGHT_RANGE.default };
    try {
      await DataService.preserveExamAppearances(loadAppearance());
      await saveAppearance(defaults);
      fill(defaults);
      status.textContent = '已恢復預設';
    }
    catch (error) { status.textContent = `重設失敗：${error.message || '請稍後再試'}`; }
  });
  const fillMargins = values => {
    for (const [side, value] of Object.entries(values)) document.getElementById(`examMargin-${side}`).value = value;
  };
  fillMargins(loadWordMargins());
  const marginStatus = document.getElementById('examMarginsStatus');
  document.getElementById('examMarginsSave').addEventListener('click', async () => {
    const margins = {};
    for (const side of Object.keys(DEFAULT_WORD_MARGINS)) {
      const input = document.getElementById(`examMargin-${side}`);
      if (!input.reportValidity()) return;
      margins[side] = Number(input.value);
    }
    try {
      await saveWordMargins(margins);
      marginStatus.textContent = '已儲存';
      UI.toast('試卷邊距已儲存', 'success');
    } catch (error) { marginStatus.textContent = `儲存失敗：${error.message || '請稍後再試'}`; }
  });
  document.getElementById('examMarginsReset').addEventListener('click', async () => {
    try {
      await resetWordMargins();
      fillMargins(DEFAULT_WORD_MARGINS);
      marginStatus.textContent = '已恢復預設';
    } catch (error) { marginStatus.textContent = `重設失敗：${error.message || '請稍後再試'}`; }
  });
}

function buildHeaderSettings() {
  const layoutHost = document.getElementById('headerLayoutFields');
  layoutHost.innerHTML = `<div class="header-layout-board">${[1,2].map(row => `<div class="header-layout-line"><strong>第 ${row} 行</strong><div class="header-layout-dropzone" data-row="${row}" aria-label="第 ${row} 行欄位"></div></div>`).join('')}</div>`;
  const layoutZones = Object.fromEntries([1,2].map(row => [row, layoutHost.querySelector(`[data-row="${row}"]`)]));
  const layoutChips = Object.fromEntries(HEADER_FIELDS.map(field => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'header-layout-chip';
    chip.draggable = true;
    chip.dataset.field = field.id;
    chip.textContent = field.label;
    chip.title = `拖曳「${field.label}」調整位置`;
    return [field.id, chip];
  }));
  const fillLayout = data => {
    const layout = normalizeHeaderLayout(data.layout);
    HEADER_FIELDS.slice().sort((a,b) => layout[a.id].row - layout[b.id].row || layout[a.id].position - layout[b.id].position)
      .forEach(field => layoutZones[layout[field.id].row].appendChild(layoutChips[field.id]));
  };
  let draggedChip = null;
  const placeholder = document.createElement('span');
  placeholder.className = 'header-layout-placeholder';
  const finishDrag = () => {
    draggedChip?.classList.remove('dragging');
    draggedChip = null;
    placeholder.remove();
    Object.values(layoutZones).forEach(zone => zone.classList.remove('is-target'));
  };
  layoutHost.addEventListener('dragstart', event => {
    const chip = event.target.closest('.header-layout-chip');
    if (!chip) return;
    draggedChip = chip;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', chip.dataset.field);
    chip.classList.add('dragging');
  });
  layoutHost.addEventListener('dragover', event => {
    const zone = event.target.closest('.header-layout-dropzone');
    if (!draggedChip || !zone) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    Object.values(layoutZones).forEach(item => item.classList.toggle('is-target', item === zone));
    const before = [...zone.querySelectorAll('.header-layout-chip:not(.dragging)')].find(chip => {
      const rect = chip.getBoundingClientRect();
      return event.clientY < rect.top + rect.height / 2 || (event.clientY <= rect.bottom && event.clientX < rect.left + rect.width / 2);
    });
    zone.insertBefore(placeholder, before || null);
  });
  layoutHost.addEventListener('drop', event => {
    const zone = event.target.closest('.header-layout-dropzone');
    if (!draggedChip || !zone) return;
    event.preventDefault();
    zone.insertBefore(draggedChip, placeholder);
    finishDrag();
  });
  layoutHost.addEventListener('dragend', finishDrag);
  const saved = loadHeader();
  fillLayout(saved);
  async function saveHeaderDefaults(data) {
    await DataService.preserveExamHeaders(loadHeader());
    await saveHeader(data);
  }
  const layoutStatus = document.getElementById('headerLayoutStatus');
  document.getElementById('headerLayoutSave').addEventListener('click', async () => {
    const layout = Object.fromEntries([1,2].flatMap(row =>
      [...layoutZones[row].querySelectorAll('.header-layout-chip')].map((chip, index) =>
        [chip.dataset.field, { row, position:index+1 }])));
    try { await saveHeaderDefaults({ layout }); layoutStatus.textContent = '已儲存'; UI.toast('欄位位置已儲存', 'success'); }
    catch (error) { layoutStatus.textContent = `儲存失敗：${error.message || '請稍後再試'}`; }
  });
  document.getElementById('headerLayoutReset').addEventListener('click', async () => {
    try {
      await saveHeaderDefaults({ layout:DEFAULT_HEADER_LAYOUT });
      fillLayout({ layout:DEFAULT_HEADER_LAYOUT });
      layoutStatus.textContent = '已恢復預設';
    } catch (error) { layoutStatus.textContent = `重設失敗：${error.message || '請稍後再試'}`; }
  });
}

function buildPasswordPanel() {
  document.getElementById('passwordContainer').innerHTML = `
    <section class="card password-card" aria-labelledby="passwordHeading">
      <div class="card-header"><h2 id="passwordHeading">更新密碼</h2></div>
      <form class="card-body" id="passwordForm">
        <p class="password-hint">請先輸入目前密碼，再設定新密碼。</p>
        <div class="password-field"><label for="currentPassword">目前密碼</label><div class="password-input"><input class="form-control" id="currentPassword" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-toggle="currentPassword" aria-label="顯示目前密碼">顯示</button></div></div>
        <div class="password-field"><label for="newPassword">新密碼</label><div class="password-input"><input class="form-control" id="newPassword" type="password" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" data-toggle="newPassword" aria-label="顯示新密碼">顯示</button></div><small class="password-hint">至少 6 個字元</small></div>
        <div class="password-field"><label for="confirmPassword">確認新密碼</label><div class="password-input"><input class="form-control" id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" data-toggle="confirmPassword" aria-label="顯示確認新密碼">顯示</button></div></div>
        <div class="password-message" id="passwordMessage" role="status" aria-live="polite"></div>
        <div class="password-actions"><button class="btn btn-primary" id="passwordSave" type="submit">儲存變更</button></div>
      </form>
    </section>`;

  const form = document.getElementById('passwordForm');
  const message = document.getElementById('passwordMessage');
  const saveButton = document.getElementById('passwordSave');
  const showMessage = (text, success = false) => {
    message.textContent = text;
    message.className = `password-message ${success ? 'is-success' : 'is-error'}`;
  };

  form.querySelectorAll('[data-toggle]').forEach(button => {
    button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.toggle);
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      button.textContent = visible ? '隱藏' : '顯示';
      button.setAttribute('aria-label', `${visible ? '隱藏' : '顯示'}${input.labels[0].textContent}`);
    });
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const current = document.getElementById('currentPassword').value;
    const next = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    if (next.length < 6) return showMessage('新密碼至少需要 6 個字元');
    if (next !== confirm) return showMessage('兩次輸入的新密碼不一致');
    if (current === next) return showMessage('新密碼請勿與目前密碼相同');
    saveButton.disabled = true;
    saveButton.textContent = '更新中…';
    message.className = 'password-message';
    try {
      await DataService.changePassword(current, next);
      form.reset();
      showMessage('密碼已更新', true);
    } catch (error) {
      const descriptions = {
        'auth/invalid-credential': '目前密碼不正確',
        'auth/wrong-password': '目前密碼不正確',
        'auth/weak-password': '新密碼強度不足，請使用更長的密碼',
        'auth/too-many-requests': '嘗試次數過多，請稍後再試',
        'auth/network-request-failed': '網路連線失敗，請稍後再試'
      };
      showMessage(descriptions[error.code] || error.message || '更新密碼失敗');
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = '儲存變更';
    }
  });
}
