<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>題本反譯 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/site-redesign.css"><link rel="stylesheet" href="css/testbank-redesign.css"><link rel="stylesheet" href="css/reverse-import.css"></head>
<body class="testbank-redesign-page reverse-import-page"><script src="js/icons.js"></script><script src="js/core.js"></script><div class="layout"><header class="site-header" id="sidebar"></header><script src="js/shell.js"></script><div class="main" inert><div class="topbar"><span class="topbar-title">題本反譯</span></div><main class="page-content">
<header class="import-page-heading"><div class="import-page-title"><h1>題本反譯</h1><p>將舊版題本轉成可匯入的 Word 表格</p></div><ol class="reverse-flow" aria-label="反譯流程"><li id="flowUpload" aria-current="step"><span>1</span>上傳題本</li><li id="flowPreview"><span>2</span>確認與下載</li></ol></header>
<section class="card import-card"><div class="card-header section-heading"><div><h2>上傳題本</h2><p>可一次處理多個 Word 檔案</p></div><a href="import.html" class="btn btn-outline btn-sm">返回題目匯入</a></div><div class="card-body">
<div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="選擇或拖曳 Word 題本檔案"><span class="upload-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5"/></svg></span><div class="upload-title">點擊或拖曳 Word 檔案到這裡</div><div class="upload-sub">支援 .docx，可多選，每檔上限 20 MB</div></div>
<input id="files" type="file" accept=".docx" multiple hidden><div id="fileList" class="file-list" aria-label="已選取檔案"></div><div class="reverse-upload-actions"><span id="fileCount" class="field-hint">尚未選取檔案</span><button class="btn btn-primary" id="parse" disabled>解析題本 →</button></div><p id="status" class="reverse-status" role="status" aria-live="polite"></p>
<details class="reverse-format"><summary>輸出格式與圖片規則</summary><p>選擇題及其他題型分別輸出。全文使用新細明體，填空題的連續底線使用 Times New Roman；僅選擇題簡答欄的英數字使用全形。圖片保留原大小，以 Shift+Enter 段內換行後附圖；選擇題放在「結尾」最後，其他題型放在題目或解析欄。</p></details>
</div></section><div id="results" class="reverse-files"></div></main></div></div><script src="vendor/jszip.min.js"></script><script type="module" src="js/reverse-import-page.js"></script></body></html>
