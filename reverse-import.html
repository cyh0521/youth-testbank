<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>題本轉檔 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/process-bar.css"><link rel="stylesheet" href="css/site-redesign.css"><link rel="stylesheet" href="css/testbank-redesign.css?v=20261016-card-titles"><link rel="stylesheet" href="css/reverse-import.css?v=20261015-header-actions"></head>
<body class="testbank-redesign-page reverse-import-page"><script src="js/icons.js"></script><script src="js/core.js"></script><div class="layout"><header class="site-header" id="sidebar"></header><script src="js/shell.js?v=20261014-nav-order"></script><div class="main" inert><div class="topbar"><span class="topbar-title">題本轉檔</span></div><main class="page-content">
<header class="import-page-heading"><div class="import-page-title"><h1>題本轉檔</h1><p>將舊版題本轉成可匯入的 Word 表格</p></div><section class="import-progress" aria-label="題本轉檔流程"><div class="steps" role="list"><div class="step active" id="flowUpload" role="listitem" aria-current="step"><span class="step-num">1</span><span class="step-copy"><strong>上傳題本</strong></span></div><div class="step" id="flowPreview" role="listitem"><span class="step-num">2</span><span class="step-copy"><strong>確認與下載</strong></span></div></div></section></header>
<section id="uploadPanel" class="card import-card"><div class="card-header section-heading"><div><h2>上傳題本</h2><p>可一次處理多個 Word 檔案</p></div><div class="import-header-actions"><button class="btn btn-primary btn-sm" id="parse" disabled><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：解析題本</button></div></div><div class="card-body">
<div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="選擇或拖曳 Word 題本檔案"><span class="upload-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5"/></svg></span><div class="upload-title">點擊或拖曳 Word 檔案到這裡</div><div class="upload-sub">支援 .docx，可多選，每檔上限 20 MB</div></div>
<input id="files" type="file" accept=".docx" multiple hidden><div id="fileList" class="file-list" aria-label="已選取檔案"></div><div class="reverse-upload-actions" hidden><span id="fileCount"></span></div><p id="status" class="reverse-status" role="status" aria-live="polite"></p>
<details class="reverse-format"><summary>輸出格式與圖片規則</summary><ul><li>選擇題及其他題型分別輸出。</li><li>轉檔後表格使用新細明體，填空題的連續底線使用 Times New Roman。</li><li>選擇題簡答欄的英數字使用全形。</li><li>圖片保留原大小，以 Shift+Enter 段內換行後附圖。</li><li>選擇題圖片放在「結尾」最後，其他題型圖片放在題目或解析欄。</li></ul></details>
</div></section><section id="previewPanel" hidden><div class="card import-card"><div class="card-header section-heading"><div><h2 id="previewTitle" tabindex="-1">確認與下載</h2><p>確認冊別與各題欄位後下載入題檔</p></div><div class="import-header-actions"><button type="button" class="btn btn-outline btn-sm" id="continueImport"><span class="reverse-action-icon" aria-hidden="true"></span>繼續匯入</button><button type="button" class="btn btn-primary btn-sm" id="backHome"><span class="reverse-action-icon" aria-hidden="true"></span>回到首頁</button></div></div></div><div id="results" class="reverse-files"></div></section></main></div></div><script src="vendor/jszip.min.js"></script><script type="module" src="js/reverse-import-page.js?v=20261014-preview-layout"></script></body></html>
