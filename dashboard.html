<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首頁總覽 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/avatar.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <main class="main" inert>
    <div class="topbar">
      <span class="topbar-title">首頁總覽</span>
      <div class="topbar-actions"><span class="text-sm text-muted" id="welcomeText"></span><a class="toolbar-account" href="settings.html" aria-label="我的帳號" id="toolbarAccount"></a></div>
    </div>
    <div class="page-content" id="content" aria-busy="true">
      <div class="dashboard-overview"><div class="skeleton dash-skel-section"></div><div class="skeleton dash-skel-section"></div></div>
      <div class="skeleton dash-skel-section"></div>
    </div>
  </main>
</div>
<script type="module">
import { guardPage } from './js/auth-guard.js';
window._activeNav = 'dashboard';
const user = await guardPage();
if (!user) throw new Error('not auth');
const I = window.ICONS;
const esc = UI.escapeHtml;
const isAdmin = DataService.isAdmin();
let dashboardExams = [];
let examsLoaded = false;
let dashboardSubjects = Object.fromEntries(Object.entries(SUBJECT_CODES).filter(([code]) => DataService.isSubjectVisible(code)));
let dashboardSubjectRecords = new Map();
const questionCache = new Map();
const bookCache = new Map();
let overviewBookCodes = new Map();
let overviewRequest = 0;
let overviewStats = { total: 0, byType: {} };

const greetingName = (user.displayName || user.email?.split('@')[0] || '').trim().replace(/\s*老師$/, '');
document.getElementById('welcomeText').textContent = `歡迎回來，${greetingName ? `${greetingName} 老師` : '老師'}`;
document.getElementById('toolbarAccount').innerHTML = Avatar.markup(user.avatar, user.displayName || user.email, 'user-avatar--toolbar');

const subjectName = code => dashboardSubjects[code] || code || '未分類';
const subjectTone = code => Math.max(0, Object.keys(SUBJECT_CODES).indexOf(code)) % 6;
const examTime = value => {
  if (!value) return 0;
  const date = value.toDate ? value.toDate() : value.seconds != null ? new Date(value.seconds * 1000) : new Date(value);
  return Number.isNaN(date.getTime()) ? 0 : date.getTime();
};
const dateLabel = value => {
  const time = examTime(value);
  return time ? new Date(time).toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}) : '—';
};

function renderExamRows() {
  if (!examsLoaded) {
    document.getElementById('recentExamRows').innerHTML = '<tr><td colspan="5" class="dash-empty">試卷清單暫時無法載入，請重新載入頁面。</td></tr>';
    document.getElementById('examResultCount').textContent = '';
    return;
  }
  const search = document.getElementById('examSearch').value.trim().toLocaleLowerCase();
  const subject = document.getElementById('examSubject').value;
  const direction = document.getElementById('examSort').value === 'oldest' ? 1 : -1;
  const filtered = dashboardExams.filter(e => (!subject || e.subjectCode === subject) && (e.title || '').toLocaleLowerCase().includes(search))
    .sort((a,b) => direction * (examTime(a.createdAt) - examTime(b.createdAt)));
  document.getElementById('examResultCount').textContent = `共 ${filtered.length} 份${filtered.length > 6 ? '，顯示前 6 份' : ''}`;
  document.getElementById('recentExamRows').innerHTML = filtered.slice(0,6).map(e => `
    <tr>
      <td><span class="exam-name">${I.test20}<strong>${esc(e.title || '（未命名）')}</strong></span></td>
      <td><span class="subject-tag tone-${subjectTone(e.subjectCode)}">${esc(subjectName(e.subjectCode))}</span></td>
      <td class="nowrap">${Number(e.questionCount) || 0} 題</td>
      <td class="exam-date">${esc(dateLabel(e.createdAt))}</td>
      <td><a class="exam-manage" href="exams.html">${I.folder16} 管理試卷 <span aria-hidden="true">›</span></a></td>
    </tr>`).join('') || `<tr><td colspan="5" class="dash-empty">${dashboardExams.length ? '找不到符合條件的試卷，請調整搜尋條件。' : '尚無試卷，從上方選題方式開始建立第一份試卷。'}</td></tr>`;
}

const chartColors = ['#3478f6','#49b998','#a38ae5','#f3b94e','#ee8998','#75a7bb'];
function renderOverviewChart(byType, total) {
  const chart = document.getElementById('overviewChart');
  document.getElementById('overviewTotal').innerHTML = `${Number(total).toLocaleString()} <span>題</span>`;
  if (!total) {
    chart.innerHTML = '<p class="dash-empty">此範圍尚無題目資料</p>';
    return;
  }
  const max = Math.max(...Object.values(byType), 1);
  chart.innerHTML = Object.entries(QUESTION_TYPES).map(([code, name], index) => {
    const count = Number(byType[code]) || 0;
    return `<div class="bar-item"><span class="bar-label">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/max*100)}%;background:${chartColors[index]}"></div></div><span class="bar-count">${count.toLocaleString()}</span></div>`;
  }).join('');
}

async function updateOverview() {
  const request = ++overviewRequest;
  const subjectCode = document.getElementById('overviewSubject').value;
  const bookSelect = document.getElementById('overviewBook');
  const chart = document.getElementById('overviewChart');
  overviewBookCodes = new Map();
  if (!subjectCode) {
    bookSelect.innerHTML = '<option value="">全部科目</option>';
    bookSelect.disabled = true;
    chart.setAttribute('aria-busy', 'false');
    renderOverviewChart(overviewStats.byType || {}, overviewStats.total || 0);
    return;
  }

  bookSelect.disabled = true;
  bookSelect.innerHTML = '<option value="">載入冊別中…</option>';
  chart.setAttribute('aria-busy', 'true');
  chart.innerHTML = '<p class="dash-empty">正在載入題型分布…</p>';
  const record = dashboardSubjectRecords.get(subjectCode);
  const booksPromise = bookCache.get(subjectCode) || (record
    ? DataService.getVisibleBooks(record.id, subjectCode)
    : Promise.resolve([]));
  bookCache.set(subjectCode, booksPromise);
  const questionsPromise = questionCache.get(subjectCode) || DataService.getQuestions({ subjectCode });
  questionCache.set(subjectCode, questionsPromise);
  const [booksResult, questionsResult] = await Promise.allSettled([booksPromise, questionsPromise]);
  if (request !== overviewRequest) return;

  let books = [];
  if (booksResult.status === 'fulfilled') {
    bookCache.set(subjectCode, booksResult.value);
    const uniqueCodes = new Map();
    for (const book of booksResult.value) {
      const code = String(book.code || '').trim();
      if (code && !uniqueCodes.has(code)) uniqueCodes.set(code, String(book.name || code).trim());
    }
    const groups = new Map();
    for (const [code, name] of uniqueCodes) {
      if (!groups.has(name)) groups.set(name, new Set());
      groups.get(name).add(code);
    }
    books = [...groups].map(([name, codes], index) => {
      const key = String(index);
      overviewBookCodes.set(key, codes);
      return `<option value="${key}">${esc(name)}</option>`;
    });
  } else {
    bookCache.delete(subjectCode);
  }
  bookSelect.innerHTML = '<option value="">全部科目</option>' + books.join('');
  bookSelect.disabled = books.length === 0;
  if (questionsResult.status === 'rejected') {
    questionCache.delete(subjectCode);
    chart.innerHTML = '<p class="dash-empty">題型分布暫時無法載入，請重新選擇科目。</p>';
    document.getElementById('overviewTotal').innerHTML = '— <span>題</span>';
    chart.setAttribute('aria-busy', 'false');
    return;
  }
  questionCache.set(subjectCode, questionsResult.value);
  chart.setAttribute('aria-busy', 'false');
  renderSelectedBook();
}

function renderSelectedBook() {
  const subjectCode = document.getElementById('overviewSubject').value;
  const bookCodes = overviewBookCodes.get(document.getElementById('overviewBook').value);
  const questions = questionCache.get(subjectCode);
  if (!Array.isArray(questions)) return;
  const selected = bookCodes ? questions.filter(q => bookCodes.has(String(q.bookCode))) : questions;
  const byType = {};
  for (const q of selected) byType[q.type] = (byType[q.type] || 0) + 1;
  renderOverviewChart(byType, selected.length);
}

async function renderStaff() {
  const statsPromise = DataService.getVisibleCatalog() === null
    ? DataService.getQuestionStats()
    : DataService.getQuestions().then(questions => {
        const stats = { total:questions.length, byType:{}, bySubject:{} };
        for (const q of questions) {
          stats.byType[q.type] = (stats.byType[q.type] || 0) + 1;
          stats.bySubject[q.subjectCode] = (stats.bySubject[q.subjectCode] || 0) + 1;
        }
        return stats;
      });
  const [statsResult, examsResult, subjectsResult] = await Promise.allSettled([
    statsPromise, DataService.getExams(), DataService.getVisibleSubjects()
  ]);
  const stats = statsResult.status === 'fulfilled' ? statsResult.value : {total:0, byType:{}, bySubject:{}};
  overviewStats = stats;
  dashboardExams = examsResult.status === 'fulfilled' ? examsResult.value : [];
  examsLoaded = examsResult.status === 'fulfilled';
  // 保留預設科目，合併課本管理中的自訂名稱與科目；零題也要顯示。
  if (subjectsResult.status === 'fulfilled') {
    for (const subject of subjectsResult.value) {
      if (subject.code) {
        dashboardSubjects[subject.code] = subject.name || subject.code;
        dashboardSubjectRecords.set(subject.code, subject);
      }
    }
  }
  for (const code of Object.keys(stats.bySubject || {})) {
    if (!dashboardSubjects[code]) dashboardSubjects[code] = code;
  }
  const action = (page, icon, label, desc, cls='') => `<a class="create-action ${cls}" href="${page}.html"><span class="create-icon">${icon}</span><span><strong>${label}</strong><small>${desc}</small></span><span class="action-arrow" aria-hidden="true">›</span></a>`;
  const warnings = [statsResult.status === 'rejected' ? '題庫統計暫時無法載入' : '', examsResult.status === 'rejected' ? '試卷清單暫時無法載入' : ''].filter(Boolean);
  document.getElementById('content').innerHTML = `
    ${warnings.length ? `<div class="alert alert-warning" role="status">${warnings.join('；')}。<button class="btn btn-sm btn-outline" onclick="location.reload()">重新載入</button></div>` : ''}
    <div class="dashboard-overview">
      <section class="card create-card">
        <div class="overview-heading"><div><h2>建立新試卷</h2><p>選擇方式，快速開始出題或列印題本</p></div><span class="section-icon">${I.sparkles20}</span></div>
        <div class="create-actions">
          ${action('compose', '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="26" height="19" rx="3"/><path d="M12 23v5m8-5v5M9 28h14"/></svg>', '電腦選題','依範圍與條件，快速生成試卷','auto-action')}
          ${action('manual', I.test, '手動選題','從題庫中挑選，彈性組卷','manual-action')}
          ${action('coded', I.code, '編碼選題','輸入題目編號，精準加入試卷','coded-action')}
          <button class="create-action print-action" type="button" disabled aria-label="題本列印，即將推出">
            <span class="create-icon">${I.printer}</span>
            <span><strong>題本列印 <span class="coming-soon">即將推出</span></strong><small>列印整冊題庫，方便教學使用</small></span>
          </button>
        </div>
      </section>
      <section class="card overview-card">
        <div class="overview-heading"><div><h2>題庫概況</h2><p>專業命題，掌握題型配置</p></div></div>
        <div class="overview-filters">
          <label>科目<select class="form-control" id="overviewSubject"><option value="">全部科目</option>${Object.keys(dashboardSubjects).map(code => `<option value="${esc(code)}">${esc(subjectName(code))}</option>`).join('')}</select></label>
          <label>冊別<select class="form-control" id="overviewBook" disabled><option value="">全部科目</option></select></label>
        </div>
        <div class="question-total" id="overviewTotal">${statsResult.status === 'fulfilled' ? (stats.total || 0).toLocaleString() : '—'} <span>題</span></div>
        <div class="overview-chart" id="overviewChart" aria-label="題型分布" aria-live="polite">${statsResult.status === 'fulfilled' ? '' : '<p class="dash-empty">題型分布暫時無法載入</p>'}</div>
      </section>
    </div>
    <section class="recent-section" aria-labelledby="recentHeading">
      <div class="section-heading"><h2 id="recentHeading">最近試卷</h2><a class="text-link" href="exams.html">試卷管理 <span aria-hidden="true">›</span></a></div>
      <div class="recent-toolbar">
        <span class="collection-pill">全部試卷 <span>${examsResult.status === 'fulfilled' ? dashboardExams.length : '—'}</span></span>
        <select class="form-control" id="examSubject" aria-label="篩選試卷科目"><option value="">所有科目</option>${[...new Set(dashboardExams.map(e => e.subjectCode).filter(Boolean))].map(code => `<option value="${esc(code)}">${esc(subjectName(code))}</option>`).join('')}</select>
        <label class="exam-search">${I.search16}<input id="examSearch" type="search" placeholder="搜尋試卷名稱" aria-label="搜尋試卷名稱"></label>
        <select class="form-control" id="examSort" aria-label="試卷排序"><option value="newest">建立時間（新 → 舊）</option><option value="oldest">建立時間（舊 → 新）</option></select>
      </div>
      <div class="card table-wrapper"><table class="data-table recent-table"><thead><tr><th>試卷名稱</th><th>科目</th><th>題數</th><th>建立時間</th><th>操作</th></tr></thead><tbody id="recentExamRows"></tbody></table></div>
      <p class="exam-result-count" id="examResultCount" aria-live="polite"></p>
    </section>
    ${isAdmin ? `<nav class="admin-shortcuts" aria-label="管理員快速操作"><span>題庫管理</span><a href="import.html">${I.upload16} 匯入題目</a><a href="questions.html">${I.list16} 題目維護</a><a href="textbooks.html">${I.book16} 課本管理</a><a href="settings.html?view=accounts">${I.settings16} 帳號管理</a></nav>` : ''}`;
  if (statsResult.status === 'fulfilled') renderOverviewChart(stats.byType || {}, stats.total || 0);
  document.getElementById('overviewSubject').addEventListener('change', updateOverview);
  document.getElementById('overviewBook').addEventListener('change', renderSelectedBook);
  document.getElementById('examSearch').addEventListener('input', renderExamRows);
  document.getElementById('examSubject').addEventListener('change', renderExamRows);
  document.getElementById('examSort').addEventListener('change', renderExamRows);
  renderExamRows();
}

try {
  await renderStaff();
} catch (e) {
  console.error('Dashboard render error:', e);
  document.getElementById('content').innerHTML = `<div class="alert alert-danger">首頁載入失敗，請稍後重試。</div><button class="btn btn-primary" onclick="location.reload()">重新載入</button>`;
} finally {
  document.getElementById('content').setAttribute('aria-busy', 'false');
}
</script>
</body>
</html>
