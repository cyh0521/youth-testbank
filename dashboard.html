<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首頁總覽 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/dashboard-exam-editor.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/avatar.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <main class="main" inert>
    <div class="topbar">
      <span class="topbar-title">首頁總覽</span>
      <div class="topbar-actions"><span class="text-sm text-muted" id="welcomeText"></span><a class="toolbar-account" href="settings.html" aria-label="我的帳號" id="toolbarAccount"></a></div>
    </div>
    <div class="page-content" id="content" aria-busy="true">
      <div class="dashboard-overview"><div class="skeleton dash-skel-section"></div><div class="skeleton dash-skel-section"></div></div>
      <div class="skeleton dash-skel-section"></div>
    </div>
  </main>
</div>
<script type="module">
import { guardPage } from './js/auth-guard.js';
import { openDashboardExamEditor } from './js/dashboard-exam-editor.js';
import { confirmExamDeletion } from './js/confirm-exam-deletion.js';
window._activeNav = 'dashboard';
const user = await guardPage();
if (!user) throw new Error('not auth');
const I = window.ICONS;
const esc = UI.escapeHtml;
let dashboardExams = [];
let examsLoaded = false;
let dashboardSubjects = Object.fromEntries(Object.entries(SUBJECT_CODES).filter(([code]) => DataService.isSubjectVisible(code)));
let dashboardSubjectRecords = new Map();
const questionCache = new Map();
const bookCache = new Map();
let overviewBookCodes = new Map();
let overviewRequest = 0;
const overviewSelectionKey = `youth.overviewSelection.${user.uid || user.email || 'default'}`;
let savedOverviewSelection = (() => {
  try { return JSON.parse(localStorage.getItem(overviewSelectionKey)) || {}; }
  catch { return {}; }
})();

const greetingName = (user.displayName || user.email?.split('@')[0] || '').trim().replace(/\s*老師$/, '');
document.getElementById('welcomeText').textContent = `歡迎回來，${greetingName ? `${greetingName} 老師` : '老師'}`;
document.getElementById('toolbarAccount').innerHTML = Avatar.markup(user.avatar, user.displayName || user.email, 'user-avatar--toolbar');

const subjectName = code => dashboardSubjects[code] || code || '未分類';
const examBookName = exam => {
  const books = bookCache.get(exam.subjectCode);
  const book = Array.isArray(books) ? books.find(item => item.code === exam.bookCode) : null;
  return book?.name || exam.bookName || exam.bookCode || '未指定冊別';
};
const subjectTone = code => Math.max(0, Object.keys(SUBJECT_CODES).indexOf(code)) % 6;
const examTime = value => {
  if (!value) return 0;
  const date = value.toDate ? value.toDate() : value.seconds != null ? new Date(value.seconds * 1000) : new Date(value);
  return Number.isNaN(date.getTime()) ? 0 : date.getTime();
};
const dateLabel = value => {
  const time = examTime(value);
  return time ? new Date(time).toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}) : '—';
};


const canEditExams = DataService.isAdmin() || DataService.isTeacher();
const recentEyeIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
async function handleRecentExamAction(event) {
  const button = event.target.closest('[data-exam-action]');
  if (!button || button.dataset.busy === 'true') return;
  const exam = dashboardExams.find(e => e.id === button.closest('[data-exam-id]').dataset.examId);
  if (!exam) return;
  const action = button.dataset.examAction;
  if (action === 'delete' && !canEditExams) return;
  button.dataset.busy = 'true';
  try {
    if (action === 'delete' && !await confirmExamDeletion(exam.title || '')) return;
    if (action === 'edit') {
      await openDashboardExamEditor(exam, async () => {
        dashboardExams = await DataService.getExams();
        renderExamRows();
      });
      return;
    }
    if (action === 'delete') {
      await DataService.deleteExam(exam.id);
      dashboardExams = dashboardExams.filter(e => e.id !== exam.id);
      renderExamRows();
      UI.toast('試卷已刪除', 'success');
      return;
    }
    const questions = await DataService.getQuestionsByIds(exam.questionIds || []);
    const byId = new Map(questions.map(q => [q.id, q]));
    const ordered = (exam.questionIds || []).map(id => byId.get(id)).filter(Boolean);
    if (!ordered.length) { UI.toast('此試卷無法載入題目', 'warning'); return; }
    const { showExamPreview, printWithPaperChoice, downloadExam } = await import('./js/exam-preview.js');
    if (action === 'preview') showExamPreview(exam, ordered);
    else if (action === 'print') await printWithPaperChoice(exam, ordered);
    else if (action === 'word') await downloadExam(exam, ordered, 'Word');
  } catch (error) {
    UI.toast('操作失敗：' + error.message, 'danger');
  } finally {
    delete button.dataset.busy;
  }
}

function renderExamRows() {
  if (!examsLoaded) {
    document.getElementById('recentExamRows').innerHTML = '<tr><td colspan="5" class="dash-empty">試卷清單暫時無法載入，請重新載入頁面。</td></tr>';
    document.getElementById('examResultCount').textContent = '';
    return;
  }
  const filtered = [...dashboardExams].sort((a,b) => examTime(b.createdAt) - examTime(a.createdAt));
  document.getElementById('examResultCount').textContent = `共 ${filtered.length} 份${filtered.length > 10 ? '，顯示前 10 份' : ''}`;
  document.getElementById('recentExamRows').innerHTML = filtered.slice(0,10).map(e => `
    <tr>
      <td><span class="exam-name${e.description ? ' has-description' : ''}">${I.test20}<strong title="${esc(e.title || '（未命名）')}">${esc(e.title || '（未命名）')}</strong>${e.description ? `<span class="exam-description" title="${esc(e.description)}">${esc(e.description)}</span>` : ''}</span></td>
      <td><span class="subject-tag tone-${subjectTone(e.subjectCode)}" title="${esc(examBookName(e))}">${esc(examBookName(e))}</span></td>
      <td class="nowrap">${Number(e.questionCount) || 0} 題</td>
      <td class="exam-date">${esc(dateLabel(e.createdAt))}</td>
      <td><div class="recent-exam-actions" data-exam-id="${esc(e.id)}">
        <button class="btn btn-sm btn-outline" data-exam-action="preview">${recentEyeIcon}預覽</button>
        ${canEditExams ? `<button class="btn btn-sm btn-outline" data-exam-action="edit">${I.edit16}編輯</button>` : ''}
        <button class="btn btn-sm btn-ghost" data-exam-action="print">${I.printer16}列印</button>
        <button class="btn btn-sm btn-primary" data-exam-action="word">${I.download16}下載</button>
        ${canEditExams ? `<button class="btn btn-sm btn-danger" data-exam-action="delete">${I.trash16}刪除</button>` : ''}
      </div></td>
    </tr>`).join('') || `<tr><td colspan="5" class="dash-empty">尚無試卷，從上方選題方式開始建立第一份試卷。</td></tr>`;
}

const chartColors = ['#3478f6','#49b998','#a38ae5','#f3b94e','#ee8998','#75a7bb'];
function renderOverviewChart(byType, total) {
  const chart = document.getElementById('overviewChart');
  document.getElementById('overviewTotal').innerHTML = `${Number(total).toLocaleString()} <span>題</span>`;
  if (!total) {
    chart.innerHTML = '<p class="dash-empty">此範圍尚無題目資料</p>';
    return;
  }
  const max = Math.max(...Object.values(byType), 1);
  chart.innerHTML = Object.entries(QUESTION_TYPES).filter(([code]) => (Number(byType[code]) || 0) > 0).map(([code, name]) => {
    const count = Number(byType[code]) || 0;
    const index = Object.keys(QUESTION_TYPES).indexOf(code);
    return `<div class="bar-item"><span class="bar-label">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/max*100)}%;background:${chartColors[index]}"></div></div><span class="bar-count">${count.toLocaleString()}</span></div>`;
  }).join('');
}

async function updateOverview() {
  const request = ++overviewRequest;
  const subjectCode = document.getElementById('overviewSubject').value;
  const bookSelect = document.getElementById('overviewBook');
  const chart = document.getElementById('overviewChart');
  overviewBookCodes = new Map();
  if (!subjectCode) {
    bookSelect.innerHTML = '<option value="">尚無冊別</option>';
    bookSelect.disabled = true;
    chart.setAttribute('aria-busy', 'false');
    renderOverviewChart({}, 0);
    return;
  }

  bookSelect.disabled = true;
  bookSelect.innerHTML = '<option value="">載入冊別中…</option>';
  chart.setAttribute('aria-busy', 'true');
  chart.innerHTML = '<p class="dash-empty">正在載入題型分布…</p>';
  const record = dashboardSubjectRecords.get(subjectCode);
  const booksPromise = bookCache.get(subjectCode) || (record
    ? DataService.getVisibleBooks(record.id, subjectCode)
    : Promise.resolve([]));
  bookCache.set(subjectCode, booksPromise);
  const questionsPromise = questionCache.get(subjectCode) || DataService.getQuestions({ subjectCode });
  questionCache.set(subjectCode, questionsPromise);
  const [booksResult, questionsResult] = await Promise.allSettled([booksPromise, questionsPromise]);
  if (request !== overviewRequest) return;

  if (booksResult.status === 'fulfilled') bookCache.set(subjectCode, booksResult.value);
  else bookCache.delete(subjectCode);
  if (questionsResult.status === 'rejected') {
    questionCache.delete(subjectCode);
    bookSelect.innerHTML = '<option value="">冊別無法載入</option>';
    chart.innerHTML = '<p class="dash-empty">題型分布暫時無法載入，請重新選擇科目。</p>';
    document.getElementById('overviewTotal').innerHTML = '— <span>題</span>';
    chart.setAttribute('aria-busy', 'false');
    return;
  }
  questionCache.set(subjectCode, questionsResult.value);
  const importedCodes = new Set(questionsResult.value.map(q => String(q.bookCode || '').trim()));
  const bookNames = new Map((booksResult.status === 'fulfilled' ? booksResult.value : [])
    .map(book => [String(book.code || '').trim(), String(book.name || book.code || '').trim()]));
  const groups = new Map();
  for (const code of importedCodes) {
    const name = bookNames.get(code) || code || '未指定冊別';
    if (!groups.has(name)) groups.set(name, new Set());
    groups.get(name).add(code);
  }
  const books = [...groups].map(([name, codes], index) => {
    const key = String(index);
    overviewBookCodes.set(key, codes);
    return `<option value="${key}">${esc(name)}</option>`;
  });
  bookSelect.innerHTML = books.join('') || '<option value="">尚無冊別</option>';
  bookSelect.disabled = books.length === 0;
  const savedCode = savedOverviewSelection.subjectCode === subjectCode ? savedOverviewSelection.bookCode : null;
  const savedBook = [...overviewBookCodes].find(([, codes]) => codes.has(savedCode))?.[0];
  if (savedBook !== undefined) bookSelect.value = savedBook;
  chart.setAttribute('aria-busy', 'false');
  renderSelectedBook();
}

function renderSelectedBook() {
  const subjectCode = document.getElementById('overviewSubject').value;
  const bookCodes = overviewBookCodes.get(document.getElementById('overviewBook').value);
  const questions = questionCache.get(subjectCode);
  if (!Array.isArray(questions)) return;
  const selected = bookCodes ? questions.filter(q => bookCodes.has(String(q.bookCode || '').trim())) : [];
  const byType = {};
  for (const q of selected) byType[q.type] = (byType[q.type] || 0) + 1;
  renderOverviewChart(byType, selected.length);
  if (bookCodes) {
    savedOverviewSelection = { subjectCode, bookCode: [...bookCodes][0] };
    try { localStorage.setItem(overviewSelectionKey, JSON.stringify(savedOverviewSelection)); }
    catch { /* 本機儲存無法使用時，當前篩選仍可操作。 */ }
  }
}

async function renderStaff() {
  const statsPromise = DataService.getVisibleCatalog() === null
    ? DataService.getQuestionStats()
    : DataService.getQuestions().then(questions => {
        const stats = { total:questions.length, byType:{}, bySubject:{} };
        for (const q of questions) {
          stats.byType[q.type] = (stats.byType[q.type] || 0) + 1;
          stats.bySubject[q.subjectCode] = (stats.bySubject[q.subjectCode] || 0) + 1;
        }
        return stats;
      });
  const [statsResult, examsResult, subjectsResult] = await Promise.allSettled([
    statsPromise, DataService.getExams(), DataService.getVisibleSubjects()
  ]);
  const stats = statsResult.status === 'fulfilled' ? statsResult.value : {total:0, byType:{}, bySubject:{}};
  dashboardExams = examsResult.status === 'fulfilled' ? examsResult.value : [];
  examsLoaded = examsResult.status === 'fulfilled';
  // 合併課本管理中的自訂科目名稱；選單僅顯示有題目的科目。
  if (subjectsResult.status === 'fulfilled') {
    for (const subject of subjectsResult.value) {
      if (subject.code) {
        dashboardSubjects[subject.code] = subject.name || subject.code;
        dashboardSubjectRecords.set(subject.code, subject);
      }
    }
  }
  await Promise.all([...new Set(dashboardExams.map(exam => exam.subjectCode).filter(Boolean))].map(async code => {
    const subject = dashboardSubjectRecords.get(code);
    if (!subject) return;
    try {
      const books = await DataService.getVisibleBooks(subject.id, code);
      bookCache.set(code, books);
    } catch (error) {
      console.warn('Dashboard book names unavailable:', code, error);
    }
  }));
  for (const code of Object.keys(stats.bySubject || {})) {
    if (!dashboardSubjects[code]) dashboardSubjects[code] = code;
  }
  const overviewSubjectCodes = Object.keys(dashboardSubjects).filter(code => (Number(stats.bySubject?.[code]) || 0) > 0);
  const initialSubjectCode = overviewSubjectCodes.includes(savedOverviewSelection.subjectCode)
    ? savedOverviewSelection.subjectCode : overviewSubjectCodes[0] || '';
  const action = (page, icon, label, desc, cls='') => `<a class="create-action ${cls}" href="${page}.html"><span class="create-icon">${icon}</span><span><strong>${label}</strong><small>${desc}</small></span><span class="action-arrow" aria-hidden="true">›</span></a>`;
  const warnings = [statsResult.status === 'rejected' ? '題庫統計暫時無法載入' : '', examsResult.status === 'rejected' ? '試卷清單暫時無法載入' : ''].filter(Boolean);
  document.getElementById('content').innerHTML = `
    ${warnings.length ? `<div class="alert alert-warning" role="status">${warnings.join('；')}。<button class="btn btn-sm btn-outline" onclick="location.reload()">重新載入</button></div>` : ''}
    <div class="dashboard-overview">
      <section class="card create-card">
        <div class="overview-heading"><div><h2>建立新試卷</h2><p>選擇方式，快速開始出題或列印題本</p></div></div>
        <div class="create-actions">
          ${action('compose', I.navAuto20, '電腦選題','依範圍與條件，快速生成試卷','auto-action')}
          ${action('manual', I.navManual20, '手動選題','從題庫中挑選，彈性組卷','manual-action')}
          ${action('coded', I.navNumber20, '編碼選題','輸入題目編號，精準加入試卷','coded-action')}
          <button class="create-action print-action" type="button" disabled aria-label="題本列印，即將推出">
            <span class="create-icon">${I.navBooklet20}</span>
            <span><strong>題本列印 <span class="coming-soon">即將推出</span></strong><small>列印整冊題庫，方便教學使用</small></span>
          </button>
        </div>
      </section>
      <section class="card overview-card">
        <div class="overview-heading"><div><h2>題庫概況</h2><p>專業命題，掌握題型配置</p></div></div>
        <div class="overview-filters">
          <select class="form-control" id="overviewSubject" aria-label="篩選科目" ${initialSubjectCode ? '' : 'disabled'}>${overviewSubjectCodes.length ? overviewSubjectCodes.map(code => `<option value="${esc(code)}" ${code === initialSubjectCode ? 'selected' : ''}>${esc(subjectName(code))}</option>`).join('') : '<option value="">尚無科目</option>'}</select>
          <select class="form-control" id="overviewBook" aria-label="篩選冊別" disabled><option value="">${initialSubjectCode ? '載入冊別中…' : '尚無冊別'}</option></select>
        </div>
        <div class="question-total" id="overviewTotal">— <span>題</span></div>
        <div class="overview-chart" id="overviewChart" aria-label="題型分布" aria-live="polite"></div>
      </section>
    </div>
    <section class="card recent-section" aria-labelledby="recentHeading">
      <div class="section-heading"><div><h2 id="recentHeading">最近試卷</h2><p>查看最近建立的 10 份試卷，快速預覽、列印與管理；若要查看完整試卷清單，請移至「<a class="recent-management-link" href="exams.html">試卷管理</a>」。</p></div></div>
      <div class="table-wrapper"><table class="data-table recent-table"><colgroup><col class="recent-col-title"><col class="recent-col-subject"><col class="recent-col-count"><col class="recent-col-date"><col class="recent-col-actions"></colgroup><thead><tr><th>試卷名稱</th><th>科目（冊別）</th><th>題數</th><th>建立時間</th><th>操作</th></tr></thead><tbody id="recentExamRows"></tbody></table></div>
      <p class="exam-result-count" id="examResultCount" aria-live="polite"></p>
    </section>`;
  if (initialSubjectCode) await updateOverview();
  else renderOverviewChart({}, 0);
  document.getElementById('overviewSubject').addEventListener('change', updateOverview);
  document.getElementById('overviewBook').addEventListener('change', renderSelectedBook);
  document.getElementById('recentExamRows').addEventListener('click', handleRecentExamAction);
  renderExamRows();
}

try {
  await renderStaff();
} catch (e) {
  console.error('Dashboard render error:', e);
  document.getElementById('content').innerHTML = `<div class="alert alert-danger">首頁載入失敗，請稍後重試。</div><button class="btn btn-primary" onclick="location.reload()">重新載入</button>`;
} finally {
  document.getElementById('content').setAttribute('aria-busy', 'false');
}
</script>
</body>
</html>
