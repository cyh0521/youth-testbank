<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首頁總覽 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<style>
/* ── Dashboard 專屬樣式 ── */
.welcome-banner {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 120%);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  color: white;
  margin-bottom: 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  position: relative; overflow: hidden;
}
.welcome-banner::before {
  content: ''; position: absolute; right: -40px; top: -40px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(232,184,75,.18) 0%, transparent 70%);
  pointer-events: none;
}
.welcome-banner h2 {
  font-family: var(--font-serif);
  font-size: 1.25rem; margin-bottom: 6px;
  font-weight: 600;
}
.welcome-banner p { font-size: .85rem; opacity: .85; line-height: 1.6; }
.welcome-banner p strong { color: var(--accent-light); font-weight: 700; }
.welcome-icon {
  flex-shrink: 0; opacity: .35;
  display: flex; align-items: center; justify-content: center;
  width: 70px; height: 70px;
}
.welcome-icon svg { width: 56px; height: 56px; color: white; }

/* 統計卡片 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
@media(max-width:900px){ .stats-grid{ grid-template-columns: 1fr 1fr; } }
.stat-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  display: flex; align-items: center; gap: 14px;
  transition: box-shadow .15s, transform .15s;
}
.stat-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.stat-card .stat-icon {
  width: 46px; height: 46px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.stat-card .stat-icon svg { width: 22px; height: 22px; }
.stat-card .stat-num {
  font-family: var(--font-serif);
  font-size: 1.7rem; font-weight: 700;
  color: var(--primary); line-height: 1.1;
}
.stat-card .stat-label {
  font-size: .76rem;
  color: var(--text-light);
  margin-top: 2px;
}
.stat-card.accent { background: linear-gradient(135deg, #fffaf0, #fff); }

/* 圖表列 */
.charts-row {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 16px; margin-bottom: 20px;
}
@media(max-width:900px){ .charts-row{ grid-template-columns: 1fr; } }
.bar-item {
  display: flex; align-items: center; gap: 10px;
  font-size: .82rem; margin-bottom: 9px;
}
.bar-item:last-child { margin-bottom: 0; }
.bar-label {
  width: 76px;
  color: var(--text-secondary);
  flex-shrink: 0; text-align: right;
  font-size: .76rem; font-weight: 500;
}
.bar-track {
  flex: 1;
  background: #f0ece2;
  border-radius: 6px;
  height: 18px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  border-radius: 6px;
  transition: width .8s cubic-bezier(.2,.7,.3,1);
  min-width: 2px;
}
.bar-count {
  width: 42px; text-align: right;
  color: var(--text-primary);
  font-weight: 600; flex-shrink: 0;
  font-size: .8rem;
  font-variant-numeric: tabular-nums;
}

/* 快速操作 */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
@media(max-width:700px){ .quick-actions{ grid-template-columns: 1fr 1fr; } }
.quick-action {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: white;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all .15s;
  text-decoration: none;
  color: inherit;
}
.quick-action:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
  border-color: var(--primary-light);
}
.quick-action .qa-icon {
  width: 38px; height: 38px;
  border-radius: 8px;
  background: var(--bg-base);
  color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.quick-action .qa-icon svg { width: 20px; height: 20px; }
.quick-action .qa-label {
  font-size: .88rem; font-weight: 600;
  color: var(--primary);
  margin-bottom: 1px;
}
.quick-action .qa-desc {
  font-size: .72rem; color: var(--text-light);
}
.quick-action.primary .qa-icon { background: var(--primary); color: white; }
.quick-action.accent  .qa-icon { background: var(--accent);  color: white; }

/* Empty state */
.dash-empty {
  color: var(--text-muted); font-size: .85rem;
  padding: 12px 0; text-align: center;
}

/* Skeleton */
.dash-skel-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 22px; }
@media(max-width:900px){ .dash-skel-grid{ grid-template-columns: 1fr 1fr; } }
.dash-skel-banner { height: 110px; border-radius: var(--radius-lg); margin-bottom: 22px; }
.dash-skel-card   { height: 80px;  border-radius: var(--radius-lg); }
.dash-skel-section{ height: 220px; border-radius: var(--radius-lg); margin-bottom: 16px; }
</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">首頁總覽</span>
      <div class="topbar-actions"><span class="text-sm text-muted" id="dateStr"></span></div>
    </div>
    <div class="page-content" id="content">
      <!-- 骨架屏載入畫面 -->
      <div class="skeleton dash-skel-banner"></div>
      <div class="dash-skel-grid">
        <div class="skeleton dash-skel-card"></div>
        <div class="skeleton dash-skel-card"></div>
        <div class="skeleton dash-skel-card"></div>
        <div class="skeleton dash-skel-card"></div>
      </div>
      <div class="charts-row">
        <div class="skeleton dash-skel-section"></div>
        <div class="skeleton dash-skel-section"></div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { guardPage } from './js/auth-guard.js';
window._activeNav = 'dashboard';

const user = await guardPage();
if (!user) throw new Error('not auth');

document.getElementById('dateStr').textContent =
  new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric',weekday:'long'});

const isAdmin = DataService.isAdmin();
const I = window.ICONS;

async function render() {
  try {
    await renderStaff();
  } catch(e) {
    console.error('Dashboard render error:', e);
    document.getElementById('content').innerHTML = `
      <div class="alert alert-danger">
        <div><strong>載入失敗：</strong>${e.message}</div>
        <div style="font-size:.8rem;margin-top:6px;opacity:.8">
          請確認 Firestore 安全規則已部署，或重新整理頁面再試。
        </div>
      </div>
      <div class="card"><div class="card-body">
        <button class="btn btn-primary" onclick="location.reload()">${I.refresh} 重新載入</button>
      </div></div>`;
  }
}

// ── 教師/管理員 ───────────────────────────────
async function renderStaff() {
  let stats   = { total: 0, byType: {}, bySubject: {}, byDifficulty: {} };
  let exams   = [];

  try { stats   = await DataService.getQuestionStats(); } catch(e) { console.warn('stats error', e.message); }
  try { exams   = await DataService.getExams(); }          catch(e) { console.warn('exams error', e.message); }

  // ── 題型分布長條圖 ──
  const tColors = {
    T1:'#3b82c4', T2:'#2ecc71', T3:'#f39c12',
    T4:'#9b59b6', T5:'#e67e22', T6:'#5d6d7e'
  };
  const maxT = Math.max(...Object.values(stats.byType||{}), 1);
  const typeBars = Object.entries(QUESTION_TYPES).map(([c,n]) => {
    const cnt = stats.byType[c]||0;
    const pct = Math.round(cnt/maxT*100);
    return `<div class="bar-item">
      <div class="bar-label">${n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${tColors[c]}"></div></div>
      <div class="bar-count">${cnt}</div>
    </div>`;
  }).join('');

  // ── 各科題數 ──
  const maxS = Math.max(...Object.values(stats.bySubject||{}), 1);
  const subjBars = Object.entries(SUBJECT_CODES)
    .filter(([c]) => stats.bySubject[c])  // 只顯示有題目的科目
    .map(([c,n]) => {
      const cnt = stats.bySubject[c]||0;
      const pct = Math.round(cnt/maxS*100);
      return `<div class="bar-item">
        <div class="bar-label" style="width:96px;font-size:.74rem">${n}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(pct,2)}%;background:var(--primary)"></div></div>
        <div class="bar-count">${cnt}</div>
      </div>`;
    }).join('');

  // ── 最近試卷 ──
  const examRows = exams.slice(0,5).map(e => `
    <tr>
      <td><strong>${e.title||'（未命名）'}</strong></td>
      <td style="font-size:.8rem;color:var(--text-secondary)">${SUBJECT_CODES[e.subjectCode]||'—'}</td>
      <td>${e.questionCount||0} 題</td>
      <td style="font-size:.78rem;color:var(--text-muted)">${UI.formatDate(e.createdAt)}</td>
      <td><button class="btn btn-sm btn-outline" onclick="nav('exams')">查看</button></td>
    </tr>`).join('') ||
    `<tr><td colspan="5" class="dash-empty">尚無試卷，請先選題組卷</td></tr>`;

  // ── 快速操作（依角色給不同入口）──
  const action = (page, icon, label, desc, cls = '') => `
    <a class="quick-action ${cls}" onclick="nav('${page}')">
      <div class="qa-icon">${icon}</div>
      <div><div class="qa-label">${label}</div><div class="qa-desc">${desc}</div></div>
    </a>`;

  const adminActions = isAdmin ? `
    ${action('import',    I.upload20, '匯入題目',   '上傳 Word 入題檔', 'primary')}
    ${action('questions', I.list20,   '題目維護',   '檢視、編輯題庫')}
    ${action('textbooks', I.book20,   '課本管理',   '管理科目與冊別')}
  ` : '';

  document.getElementById('content').innerHTML = `
    <div class="welcome-banner">
      <div>
        <h2>歡迎回來，${user.displayName||user.email} ${isAdmin?'管理員':'老師'}</h2>
        <p>題庫共 <strong>${(stats.total||0).toLocaleString()}</strong> 題　|　已儲存試卷 <strong>${exams.length}</strong> 份</p>
      </div>
      <div class="welcome-icon">${I.book}</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#e8eef6;color:var(--primary)">${I.book}</div>
        <div><div class="stat-num">${(stats.total||0).toLocaleString()}</div><div class="stat-label">題庫總題數</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#eafaf1;color:var(--success)">${I.folder}</div>
        <div><div class="stat-num">${exams.length}</div><div class="stat-label">已建立試卷</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fdecea;color:var(--danger)">${I.layers}</div>
        <div><div class="stat-num">${Object.keys(stats.bySubject||{}).filter(k=>stats.bySubject[k]).length}</div><div class="stat-label">使用中的科目</div></div>
      </div>
    </div>

    <div class="charts-row">
      <div class="card">
        <div class="card-header"><h2>題型分布</h2></div>
        <div class="card-body">${stats.total ? typeBars : '<div class="dash-empty">尚無題目</div>'}</div>
      </div>
      <div class="card">
        <div class="card-header"><h2>各科題數</h2></div>
        <div class="card-body" style="max-height:240px;overflow-y:auto">${subjBars || '<div class="dash-empty">尚無題目</div>'}</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-header"><h2>快速操作</h2></div>
      <div class="card-body">
        <div class="quick-actions">
          ${adminActions}
          ${action('compose', I.auto20,   '電腦選題', '自動亂數組卷', isAdmin ? '' : 'primary')}
          ${action('manual',  I.edit20,   '人工選題', '手動挑選題目')}
          ${action('exams',   I.folder20, '試卷管理', '依班級、科目或全部管理試卷')}
          ${isAdmin ? action('settings', I.settings20, '帳號與設定', '使用者管理') : ''}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>最近試卷</h2>
        <button class="btn btn-sm btn-outline" onclick="nav('exams')">全部試卷 →</button>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>試卷名稱</th><th>科目</th><th>題數</th><th>建立日期</th><th></th></tr></thead>
          <tbody>${examRows}</tbody>
        </table>
      </div>
    </div>`;
}

render();
</script>
</body>
</html>
