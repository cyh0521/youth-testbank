<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>題目維護 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<style>
/* 頁面特有：題目文字截斷 */
.filter-bar{flex-wrap:nowrap;overflow-x:auto}
.filter-bar .filter-group,.filter-bar .filter-actions{flex-shrink:0}
.filter-bar .filter-actions{margin-left:0}
.filter-bar #fChapter,.filter-bar #fSection,.filter-bar #fSubsection{width:150px;max-width:150px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-bar #fChapter option,.filter-bar #fSection option,.filter-bar #fSubsection option{padding-right:16px}
.filter-bar .keyword-filter{width:120px;flex:0 0 120px}
.filter-bar .keyword-filter .form-control{width:100%;min-width:0}
.filter-bar .form-control,.filter-bar .filter-actions .btn{height:32px}
.filter-bar .filter-actions .btn{padding:0 12px;align-items:center;justify-content:center;line-height:1}
.filter-bar .filter-actions [data-icon],.filter-bar .filter-actions .btn span{display:inline-flex;align-items:center;justify-content:center;line-height:0}
.filter-bar .filter-actions svg{display:block;width:16px;height:16px}
.question-section .filter-bar{padding:0 0 14px;margin:0 0 14px;border:0;border-bottom:1px solid var(--border-light);border-radius:0;background:transparent}
.question-section .result-bar{min-height:34px;margin-bottom:14px;justify-content:flex-start;gap:12px}
.question-section .result-bar:has(.result-count:empty){display:none}
.question-section .result-bar .view-toggle{height:32px;flex-shrink:0}
.question-section .result-bar .view-toggle button{height:100%;padding:0 10px;justify-content:center;line-height:1}
.question-section .result-bar .view-toggle button span{display:inline-flex;align-items:center;justify-content:center;line-height:0}
.question-section .result-count{color:var(--text-light)}
.question-section .batch-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.question-section .batch-actions .btn{height:30px;display:inline-flex;align-items:center;gap:5px;padding:0 10px}
.question-section .batch-actions svg{width:16px;height:16px}
.question-section .table-wrapper{overflow-x:auto}
.question-table{min-width:1030px;font-size:.9rem}
.question-table th{font-size:.86rem}
.question-table th,.question-table td{padding:11px 12px}
.question-table th:first-child,.question-table td:first-child{vertical-align:middle}
.question-table input[type=checkbox]{display:block;width:16px;height:16px;margin:0}
.question-table .q-col-check{width:42px}
.question-table .q-col-number{width:85px}
.question-table .q-col-type{width:86px}
.question-table .q-col-chapter{width:84px}
.question-table .q-col-difficulty{width:70px}
.question-table .q-col-answer{width:100px}
.question-table .q-col-actions{width:170px}
.question-table .q-number{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-secondary);font-size:.9rem}
.question-table .q-answer{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary)}
.question-table .exam-date,.question-table .badge,.question-table .q-actions .btn{font-size:.88rem}
.question-table .badge,.q-card-meta .badge{border-radius:var(--radius)}
.question-table .q-actions{display:flex;align-items:center;gap:8px;white-space:nowrap}
.question-table .q-actions .btn{gap:4px;padding:4px 8px}
.question-table .q-actions svg{display:block}
.question-section .question-pagination{padding:14px 0 0;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.q-search-empty-icon{display:flex;justify-content:center;margin-bottom:10px;color:var(--text-muted);opacity:.45}
.q-search-empty-icon svg{width:32px;height:32px}
.question-section #tableView,.question-section #cardView{box-shadow:none;border:0;border-radius:0;background:transparent}
#qModal .modal{display:flex;flex-direction:column;max-height:90vh;overflow:hidden}
#qModal .modal-header,#qModal .modal-footer{flex:none;position:relative}
#qModal .modal-body{flex:1;min-height:0;max-height:none;overflow-y:auto;padding:22px 24px}
#qModal .edit-grid{gap:16px 18px}
#qModal .edit-basic-row{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,.7fr);gap:12px}
#qModal .edit-basic-row .form-control{padding-left:8px;padding-right:8px}
#qModal .edit-grid .form-group{margin:0;min-width:0}
#qModal .edit-section-heading{grid-column:1/-1;margin:4px 0 0;padding-bottom:8px;border-bottom:1px solid var(--border-light);color:var(--primary);font-size:.92rem;font-weight:700}
#qModal .edit-section-heading:first-child{margin-top:0}
#qModal .edit-grid .form-label{font-size:.88rem}
#qModal .edit-grid .form-control{font-size:.9rem}
.question-break-hint{margin-top:5px;color:var(--text-muted);font-size:.84rem}
.question-editor{min-height:132px;max-height:340px;overflow-y:auto;white-space:pre-wrap;line-height:1.6}
.question-editor > :is(div,p):not(:first-child){margin-top:.45em}
.question-editor .question-image{cursor:pointer;margin:4px 2px}
.question-editor .question-image.is-selected{outline:2px solid var(--primary);outline-offset:3px;border-radius:3px}
.question-editor .question-image.is-missing{min-height:48px;border:1px dashed #d97706;background:#fff7ed}
.question-image-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.question-image-toolbar .btn{height:32px;padding:0 10px;font-size:.86rem}
.question-image-status{color:var(--primary);font-size:.84rem}
.question-image-path,.question-image-settings{display:flex;align-items:flex-end;flex-wrap:wrap;gap:10px;padding:12px;background:#f5f8fd;border:1px solid var(--border-light);border-radius:8px;margin-bottom:8px}
.question-image-path label,.question-image-settings label{display:grid;gap:5px;font-size:.84rem;min-width:0}
.question-image-path label{flex:1;min-width:200px}
.question-image-settings label:has([data-alt]){flex:1;min-width:160px}
.question-image-settings [data-width]{width:105px}
.question-image-hint{color:var(--text-muted);font-size:.82rem;line-height:1.6}
#qModal .modal-footer .btn{height:36px;min-width:88px;justify-content:center;font-size:.9rem;padding:0 14px}
#qModal .modal-footer .btn svg{width:16px;height:16px}
#eq-location{width:100%;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.5}
#chapterPickerModal{z-index:1100}
#chapterPickerModal .modal{display:flex;flex-direction:column;max-height:90vh;overflow:hidden}
#chapterPickerModal .modal-body{overflow-y:auto;min-height:0}
.chapter-picker-list{display:grid;gap:3px}
.chapter-picker-item{display:block;width:100%;padding:9px 12px;border:0;border-radius:6px;background:transparent;color:var(--text-primary);text-align:left;font:inherit;font-size:.9rem;line-height:1.5;cursor:pointer}
.chapter-picker-item:hover,.chapter-picker-item:focus-visible{background:#edf3ff}
.chapter-picker-item.selected{background:#e4eeff;color:var(--primary);font-weight:600}
.chapter-picker-level-2{padding-left:30px}
.chapter-picker-level-3{padding-left:50px;color:var(--text-secondary)}
@media(max-width:600px){#qModal .modal-body{padding:18px}#qModal .modal-footer{gap:8px;padding:12px 18px}#qModal .modal-footer .btn{min-width:0}}
.q-text{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem;line-height:1.5}

/* ── 檢視模式切換（表格 ↔ 卡片） ── */
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:white}
.view-toggle button{
  background:none;border:none;padding:5px 10px;cursor:pointer;
  font-size:.86rem;color:var(--text-secondary);
  display:inline-flex;align-items:center;gap:5px;
  transition:background .12s,color .12s;
}
.view-toggle button:hover{background:var(--bg-base)}
.view-toggle button.active{background:var(--primary);color:white}
.view-toggle button svg{display:block;width:14px;height:14px}
.view-toggle button + button{border-left:1px solid var(--border)}

/* ── 卡片檢視 ── */
.q-card-grid{padding:10px;display:grid;gap:10px}
.q-card-item{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  padding:14px 16px;
  border:1px solid var(--border-light);
  border-radius:var(--radius);
  background:white;
  transition:border-color .12s,box-shadow .12s;
}
.q-card-item:hover{border-color:var(--primary-light);box-shadow:0 2px 8px rgba(26,58,92,.06)}
.q-card-item.selected{background:#f5f9ff;border-color:var(--primary-light)}
.q-card-check{display:flex;align-items:flex-start;padding-top:2px}
.q-card-check input{width:16px;height:16px;cursor:pointer;accent-color:var(--primary-light)}
.q-card-body{min-width:0}
.q-card-meta{
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  margin-bottom:8px;font-size:.88rem;
}
.q-card-meta .badge,.q-card-actions .btn{font-size:.88rem}
.q-card-meta .qnum{
  font-family:var(--font-mono);letter-spacing:.04em;
  color:var(--text-secondary);margin-left:auto;
}
.q-card-meta .subject{color:var(--text-muted)}
.q-card-meta .chapter{color:var(--text-muted)}
.q-card-text{
  font-size:.9rem;line-height:1.7;color:var(--text-primary);
  margin-bottom:8px;word-break:break-word;
}
.q-card-opts{
  display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;
  font-size:.88rem;color:var(--text-secondary);
  margin-bottom:8px;line-height:1.6;
}
.q-card-opts .opt.correct{color:var(--success);font-weight:600}
.q-card-answer{
  font-size:.88rem;padding-top:8px;border-top:1px dashed var(--border-light);
  display:flex;align-items:center;gap:8px;
}
.q-card-answer .ans-label{color:var(--text-muted)}
.q-card-answer .ans-val{color:var(--success);font-weight:600;font-family:var(--font-mono)}
.q-card-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0;min-width:86px}
.q-card-actions .btn{justify-content:center}
@media(max-width:700px){
  .q-card-item{grid-template-columns:auto 1fr;grid-template-rows:auto auto}
  .q-card-actions{grid-column:1/-1;flex-direction:row;justify-content:flex-end;padding-top:4px;border-top:1px dashed var(--border-light);min-width:0}
  .q-card-opts{grid-template-columns:1fr}
}
.q-card-meta{gap:8px;line-height:1.6;margin-bottom:6px}
.q-card-meta .qnum,.q-card-meta .page-source,.q-card-meta .badge{padding:2px 8px;border-radius:6px;font-size:.82rem;line-height:1.5}
.q-card-meta .qnum{margin-left:0;background:#e8eef6;color:var(--primary)}
.q-card-meta .page-source{background:#f1edfa;color:#68518f;overflow-wrap:anywhere}
.q-card-text{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere;margin-bottom:0}
.q-card-answer{align-items:flex-start;margin-top:9px;padding:7px 10px;border:0;border-radius:6px;background:#eef7f2;color:#176d49;line-height:1.6}
.q-card-answer .ans-label{flex:none;font-size:.82rem;color:inherit;font-weight:400}
.q-card-answer .ans-val{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;color:inherit;font-weight:400;font-family:inherit}
</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js?v=20261008-choice-images"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js?v=20261007-images-dir"></script>
  <div class="main" inert>
    <div class="topbar">
      <span class="topbar-title">題目維護</span>
    </div>
    <div class="page-content">
      <section class="card recent-section question-section" aria-label="題目清單">

      <!-- 篩選列 -->
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">科目</span>
          <select class="form-control" id="fSubject" onchange="onSubjectFilter()">
            <option value="">全部科目</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">冊次</span>
          <select class="form-control" id="fBook" onchange="onBookFilter()">
            <option value="">全部冊次</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label" id="fChapterLabel">章</span>
          <select class="form-control" id="fChapter" style="min-width:130px" onchange="onChapterFilter()">
            <option value="">全部</option>
          </select>
        </div>
        <div class="filter-group" id="fSectionGroup" style="display:none">
          <span class="filter-label" id="fSectionLabel">節</span>
          <select class="form-control" id="fSection" style="min-width:130px" onchange="onSectionFilter()">
            <option value="">全部</option>
          </select>
        </div>
        <div class="filter-group" id="fSubsectionGroup" style="display:none">
          <span class="filter-label" id="fSubsectionLabel">小節</span>
          <select class="form-control" id="fSubsection" style="min-width:130px" onchange="updateTypeOptions()">
            <option value="">全部</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">題型</span>
          <select class="form-control" id="fType">
            <option value="">全部題型</option>
          </select>
        </div>

        <div class="filter-group keyword-filter">
          <span class="filter-label">關鍵字</span>
          <input class="form-control" id="fKeyword" placeholder="搜尋題目或編號…" onkeydown="if(event.key==='Enter')doSearch()">
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary btn-sm" onclick="doSearch()"><span data-icon="search20"></span> 搜尋</button>
        </div>
      </div>

      <!-- 結果列 -->
      <div class="result-bar">
        <div class="view-toggle" role="tablist" aria-label="檢視模式">
          <button id="viewTableBtn" class="active" onclick="setView('table')" title="精簡顯示">
            <span data-icon="list16"></span>精簡顯示
          </button>
          <button id="viewCardBtn" onclick="setView('card')" title="完整顯示">
            <span data-icon="layers16"></span>完整顯示
          </button>
        </div>
        <span class="result-count" id="resultCount"></span>
      </div>

      <!-- 批次提示 -->
      <div class="batch-bar hidden" id="batchBar">
        <span>已選 <strong id="selCount">0</strong> 題</span>
        <div class="batch-actions">
          <button class="btn btn-sm btn-ghost" style="background:rgba(255,255,255,.2);color:white;border:none" onclick="clearSelection()">取消選取</button>
          <button class="btn btn-sm btn-danger" id="batchDelBtn" onclick="batchDelete()"><span data-icon="trash16"></span> 批次刪除</button>
        </div>
      </div>

      <!-- 表格檢視 -->
      <div class="card" id="tableView">
        <div class="table-wrapper">
          <table class="data-table recent-table question-table" id="qTable">
            <colgroup><col class="q-col-check"><col class="q-col-number"><col class="q-col-type"><col class="q-col-chapter"><col class="q-col-difficulty"><col><col class="q-col-answer"><col class="q-col-actions"></colgroup>
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAllCb" onchange="onSelectAll()" title="全選"></th>
                <th>編號</th><th>題型</th><th>章節</th><th>難易</th>
                <th>題目</th><th>答案</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="qTbody">
              <tr><td colspan="8" class="dash-empty">載入中…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="question-pagination">
          <div class="pagination" id="pagination"></div>
          <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
            <span style="font-size:.88rem;color:var(--text-muted)">每頁</span>
            <select class="form-control" id="pageSizeSel" style="width:70px;font-size:.88rem;padding:4px 6px" onchange="onPageSizeChange()">
              <option value="20">20</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 卡片檢視 -->
      <div class="card" id="cardView" style="display:none">
        <div class="q-card-grid" id="qCardGrid">
          <div style="text-align:center;padding:40px;color:var(--text-muted)">載入中…</div>
        </div>
        <div class="question-pagination">
          <div class="pagination" id="paginationCard"></div>
          <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
            <span style="font-size:.88rem;color:var(--text-muted)">每頁</span>
            <select class="form-control" id="pageSizeSelCard" style="width:70px;font-size:.88rem;padding:4px 6px" onchange="onPageSizeChange(true)">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
            </select>
          </div>
        </div>
      </div>

      </section>
    </div>
  </div>
</div>

<!-- 題目詳情/編輯 Modal -->
<div class="modal-overlay hidden" id="qModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="qModalTitle">題目詳情</h3>
      <button class="modal-close" onclick="closeQModal()">✕</button>
    </div>
    <div class="modal-body" id="qModalBody"></div>
    <div class="modal-footer" id="qModalFooter">
      <button class="btn btn-ghost" onclick="closeQModal()">關閉</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="chapterPickerModal" role="dialog" aria-modal="true" aria-labelledby="chapterPickerTitle">
  <div class="modal modal-lg">
    <div class="modal-header"><h3 id="chapterPickerTitle">選擇章節</h3><button class="modal-close" type="button" onclick="closeChapterPicker()" aria-label="關閉">✕</button></div>
    <div class="modal-body"><div id="chapterPickerList" class="chapter-picker-list"></div></div>
    <div class="modal-footer"><button class="btn btn-ghost" type="button" onclick="closeChapterPicker()">取消</button></div>
  </div>
</div>

<script type="module">
import { guardPage } from './js/auth-guard.js';
import { confirmDeletion } from './js/confirm-exam-deletion.js';
import { QuestionImageEditor, editorHtml, editorText, imageArchive, downloadArchive } from './js/question-image-editor.js?v=20261007-images-dir';
window._activeNav = 'questions';
const user = await guardPage(['admin','manager']);
if (!user) throw new Error('not auth');
const canEdit = DataService.isAdmin();

// 還原使用者上次的檢視模式
if ((localStorage.getItem('qViewMode') || 'table') === 'card') {
  document.getElementById('viewTableBtn').classList.remove('active');
  document.getElementById('viewCardBtn').classList.add('active');
  document.getElementById('tableView').style.display = 'none';
  document.getElementById('cardView').style.display  = '';
}

// ── 初始化下拉選單（從課本管理系統讀取）──────────
await initTextbookCache();
const fSubject = document.getElementById('fSubject');
fSubject.innerHTML = '<option value="">全部科目</option>' + tbSubjectOptions().replace('<option value="">請選擇科目</option>','');
const fType = document.getElementById('fType');

function updateTypeOptions() {
  const sc = fSubject.value;
  const bc = document.getElementById('fBook').value;
  const ch = document.getElementById('fChapter').value;
  const sec = document.getElementById('fSection').value;
  const sub = document.getElementById('fSubsection').value;
  const available = new Set(allQuestions.filter(q =>
    q.subjectCode === sc && q.bookCode === bc &&
    (!ch || Number(q.chapterNum) === Number(ch)) &&
    (!sec || Number(q.sectionNum) === Number(sec)) &&
    (!sub || Number(q.subsectionNum) === Number(sub))
  ).map(q => q.type));
  const previous = fType.value;
  fType.innerHTML = '<option value="">全部題型</option>';
  Object.entries(QUESTION_TYPES).forEach(([v,l]) => {
    if (available.has(v)) fType.add(new Option(l, v));
  });
  fType.value = available.has(previous) ? previous : '';
}
window.updateTypeOptions = updateTypeOptions;

function addChapterOption(select, value, label) {
  // 原生 select 的展開選項在部分瀏覽器不支援 option padding，保留尾端空白作為右側留白。
  const option = new Option(label + '\u00a0\u00a0\u00a0', value);
  option.title = label;
  select.add(option);
}

function chaptersFromQuestions(questions, book) {
  const chapterNums = [...new Set(questions.map(q => q.chapterNum).filter(Boolean))].sort((a,b) => Number(a)-Number(b));
  return chapterNums.map(chapterNum => {
    const inChapter = questions.filter(q => Number(q.chapterNum) === Number(chapterNum));
    const sectionNums = [...new Set(inChapter.map(q => q.sectionNum).filter(Boolean))].sort((a,b) => Number(a)-Number(b));
    return {chapterNum, title:`${book.l1 || '章'} ${chapterNum}`, sections:sectionNums.map(sectionNum => {
      const subsectionNums = [...new Set(inChapter.filter(q => Number(q.sectionNum) === Number(sectionNum)).map(q => q.subsectionNum).filter(Boolean))].sort((a,b) => Number(a)-Number(b));
      return {sectionNum, title:`${book.l2 || '節'} ${sectionNum}`, subsections:subsectionNums.map(num => ({num, title:`${book.l3 || '小節'} ${num}`}))};
    })};
  });
}

window.onSubjectFilter = () => {
  allQuestions = [];
  const sc = fSubject.value;
  const fb = document.getElementById('fBook');
  fb.innerHTML = '<option value="">全部冊次</option>';
  if (sc) {
    const subj = _tbCache?.subjectByCode?.[sc];
    const books = subj ? (_tbCache?.booksBySubject?.[subj.id] || []) : [];
    books.forEach(b => fb.innerHTML += `<option value="${b.code}">${b.name}</option>`);
  }
  document.getElementById('fChapter').innerHTML = '<option value="">全部</option>';
  document.getElementById('fSection').innerHTML = '<option value="">全部</option>';
  document.getElementById('fSectionGroup').style.display = 'none';
  document.getElementById('fSubsection').innerHTML = '<option value="">全部</option>';
  document.getElementById('fSubsectionGroup').style.display = 'none';
  updateTypeOptions();
};

window.onBookFilter = async () => {
  const sc = fSubject.value, bc = document.getElementById('fBook').value;
  allQuestions = [];
  window._currentBookObj = null;
  window._currentChapters = null;
  const fc = document.getElementById('fChapter');
  fc.innerHTML = '<option value="">全部</option>';
  document.getElementById('fSection').innerHTML = '<option value="">全部</option>';
  document.getElementById('fSectionGroup').style.display = 'none';
  document.getElementById('fSubsection').innerHTML = '<option value="">全部</option>';
  document.getElementById('fSubsectionGroup').style.display = 'none';
  updateTypeOptions();
  if (!sc || !bc) return;
  const subj = _tbCache?.subjectByCode?.[sc];
  const bookObj = subj ? (_tbCache?.booksBySubject?.[subj.id]||[]).find(b=>b.code===bc) : null;
  if (subj && bookObj) {
    const chapters = await DataService.getChapterDefs(subj.id, bookObj.id);
    if (fSubject.value !== sc || document.getElementById('fBook').value !== bc) return;
    const l1 = bookObj.l1 || '章';
    chapters.forEach(c => addChapterOption(fc, c.chapterNum, c.title || l1 + c.chapterNum));
    document.getElementById('fChapterLabel').textContent = l1;
    window._currentBookObj = bookObj;
    window._currentChapters = chapters;
  } else {
    // 沒有課本章節定義時，待題目載入後建立章節選項。
  }
  try {
    const questions = await DataService.getQuestionsFromFirestore({ subjectCode: sc, bookCode: bc });
    if (fSubject.value !== sc || document.getElementById('fBook').value !== bc) return;
    allQuestions = questions;
    if (!window._currentChapters?.length) {
      const fallbackBook = {
        ...bookObj,
        l1:bookObj?.l1 || '章',
        l2:bookObj?.l2 || (questions.some(q => q.sectionNum) ? '節' : ''),
        l3:bookObj?.l3 || (questions.some(q => q.subsectionNum) ? '小節' : ''),
      };
      window._currentBookObj = fallbackBook;
      window._currentChapters = chaptersFromQuestions(questions, fallbackBook);
      fc.innerHTML = '<option value="">全部</option>';
      document.getElementById('fChapterLabel').textContent = fallbackBook.l1 || '章';
      window._currentChapters.forEach(c => addChapterOption(fc, c.chapterNum, c.title));
    }
    updateTypeOptions();
  } catch (e) {
    console.error('載入題型選項失敗', e);
  }
};

window.onChapterFilter = () => {
  const ch = document.getElementById('fChapter').value;
  const sg = document.getElementById('fSectionGroup');
  const sl = document.getElementById('fSectionLabel');
  const sf = document.getElementById('fSection');
  sf.innerHTML = '<option value="">全部</option>';
  document.getElementById('fSubsection').innerHTML = '<option value="">全部</option>';
  document.getElementById('fSubsectionGroup').style.display = 'none';
  if (!ch || !window._currentChapters) { sg.style.display = 'none'; updateTypeOptions(); return; }
  const chapterObj = window._currentChapters.find(c => String(c.chapterNum) === String(ch));
  const l2 = window._currentBookObj?.l2 || '';
  if (!l2 || !chapterObj || !(chapterObj.sections||[]).length) { sg.style.display = 'none'; updateTypeOptions(); return; }
  sl.textContent = l2;

window.onSectionFilter = () => {
  const ch = document.getElementById('fChapter').value;
  const sec = document.getElementById('fSection').value;
  const group = document.getElementById('fSubsectionGroup');

// ── 資料與狀態 ────────────────────────────────────
let allQuestions = [];
let filtered     = [];
let currentPage  = 1;
let pageSize     = 50;
let pageSizeCard = 20;
let viewMode     = localStorage.getItem('qViewMode') || 'table';  // 'table' | 'card'
let selected     = new Set();
let selectionAnchorId = null;

async function loadAll() {
  // 不預先載入全部題目，等使用者選擇科目+冊次後再查詢
  document.getElementById('resultCount').textContent = '';
  document.getElementById('qTbody').innerHTML =
    `<tr><td colspan="8" style="text-align:center;padding:48px 24px;color:var(--text-muted)">
      <div class="q-search-empty-icon" aria-hidden="true">${ICONS.search}</div>
      <div style="font-size:.9rem">尚未搜尋題目</div>
    </td></tr>`;
  document.getElementById('qCardGrid').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">尚未搜尋題目</div>';
}

window.doSearch = async () => {
  const sc  = document.getElementById('fSubject').value;
  const bc  = document.getElementById('fBook').value;
  if (!sc || !bc) { UI.toast('請先選擇科目與冊次', 'warning'); return; }
  try {
    document.getElementById('resultCount').textContent = '搜尋中…';
    allQuestions = await DataService.getQuestionsFromFirestore({ subjectCode: sc, bookCode: bc });
    updateTypeOptions();
  } catch(e) {
    document.getElementById('qTbody').innerHTML =
      `<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--danger)">載入失敗：${e.message}</td></tr>`;
    return;
  }
  const ch  = document.getElementById('fChapter').value;
  const sec = document.getElementById('fSection').value;
  const sub = document.getElementById('fSubsection').value;
  const tp  = document.getElementById('fType').value;
  const kw  = document.getElementById('fKeyword').value.trim().toLowerCase();
  filtered = allQuestions.filter(q => {
    // qnum keyword: match padded or raw number
    const qnumOk = !kw || (q.qnum||'').includes(kw) ||
      (/^\d+$/.test(kw) && (q.qnum||'') === kw.padStart(5,'0'));
    return (
      (!sc || q.subjectCode===sc) &&
      (!bc || q.bookCode===bc) &&
      (!ch || Number(q.chapterNum)===Number(ch)) &&
      (!sec || Number(q.sectionNum)===Number(sec)) &&
      (!sub || Number(q.subsectionNum)===Number(sub)) &&
      (!tp || q.type===tp) &&
           (!kw || (q.text||'').toLowerCase().includes(kw) ||
               (q.answer||'').toLowerCase().includes(kw) ||
               qnumOk)
    );
  });
  // 依題型排序，同題型內依題目編號遞增。
  const typeOrder = { T1:0, T2:1, T3:2, T4:3, T5:4, T6:5 };
  filtered.sort((a,b) => {
    const typeDifference = (typeOrder[a.type] ?? 6) - (typeOrder[b.type] ?? 6);
    if (typeDifference) return typeDifference;
    const an = a.qnum ? parseInt(a.qnum) : 999999;
    const bn = b.qnum ? parseInt(b.qnum) : 999999;
    return an - bn;
  });
  currentPage = 1;
  selected.clear();
  selectionAnchorId = null;
  renderTable();
};

window.onPageSizeChange = (isCard) => {
  if (isCard) {
    pageSizeCard = +document.getElementById('pageSizeSelCard').value;
  } else {
    pageSize = +document.getElementById('pageSizeSel').value;
  }
  currentPage = 1; renderTable();
};

// ── 切換檢視模式 ────────────────────────────────
window.setView = (mode) => {
  if (mode === viewMode) return;
  viewMode = mode;
  localStorage.setItem('qViewMode', mode);
  document.getElementById('viewTableBtn').classList.toggle('active', mode === 'table');
  document.getElementById('viewCardBtn').classList.toggle('active', mode === 'card');
  document.getElementById('tableView').style.display = mode === 'table' ? '' : 'none';
  document.getElementById('cardView').style.display  = mode === 'card'  ? '' : 'none';
  currentPage = 1;
  renderTable();
};

// ── 渲染 ─────────────────────────────────────────
function renderTable() {
  const total      = filtered.length;
  const curSize    = viewMode === 'card' ? pageSizeCard : pageSize;
  const totalPages = Math.max(1, Math.ceil(total/curSize));
  currentPage      = Math.min(currentPage, totalPages);
  const start      = (currentPage-1)*curSize;
  const pageItems  = filtered.slice(start, start+curSize);
  const selectAllCb = document.getElementById('selectAllCb');
  const selectedOnPage = pageItems.filter(q => selected.has(q.id)).length;
  selectAllCb.disabled = viewMode !== 'table' || !pageItems.length;
  selectAllCb.checked = !!pageItems.length && selectedOnPage === pageItems.length;
  selectAllCb.indeterminate = selectedOnPage > 0 && selectedOnPage < pageItems.length;

  document.getElementById('resultCount').textContent = `共找到 ${total} 題`;
  document.getElementById('batchDelBtn').style.display = canEdit ? '' : 'none';
  document.getElementById('batchBar').classList.toggle('hidden', selected.size===0);
  document.getElementById('selCount').textContent = selected.size;

  if (viewMode === 'table') renderTableMode(pageItems);
  else                       renderCardMode(pageItems);

  // 分頁渲染（兩個檢視各有自己的 pagination 容器）
  renderPagination(totalPages);
}

function renderTableMode(pageItems) {
  const tbody = document.getElementById('qTbody');
  if (!pageItems.length) {
    tbody.innerHTML=`<tr><td colspan="8" class="dash-empty">無符合條件的題目</td></tr>`;
    return;
  }
  tbody.innerHTML = pageItems.map(q => {
    const chap = [q.chapterNum,q.sectionNum,q.subsectionNum].filter(Boolean).join('-');
    const ans = (q.answer||'').length>16 ? q.answer.slice(0,16)+'…' : q.answer;
    const questionLine = [
      UI.questionSummary(q.text || '—'),
      ...((q.type === 'T2' || q.type === 'T3') && q.options?.length
        ? q.options.map((option, index) => `(${String.fromCharCode(65 + index)}) ${option}`)
        : []),
      q.tail || ''
    ].filter(Boolean).join(q.type === 'T2' || q.type === 'T3' ? ' ' : '　');
    return `<tr>
      <td><input type="checkbox" class="q-cb" data-id="${q.id}" ${selected.has(q.id)?'checked':''} onclick="onCbClick(event,'${q.id}')" title="按住 Shift 可選取範圍"></td>
      <td><span class="q-number">${escapeHtml(q.qnum||'—')}</span></td>
      <td>${UI.typeBadge(q.type)}</td>
      <td class="exam-date">${escapeHtml(chap||'—')}</td>
      <td>${UI.diffBadge(q.difficulty)}</td>
      <td><div class="q-text" title="${escapeHtml(questionLine)}">${escapeHtml(questionLine)}</div></td>
      <td><span class="q-answer" title="${escapeHtml(q.answer||'—')}">${escapeHtml(ans||'—')}</span></td>
      <td>
        <div class="q-actions">
          <button class="btn btn-sm btn-outline" onclick="openEdit('${q.id}')">${ICONS.edit16}編輯</button>
          ${canEdit?`<button class="btn btn-sm btn-danger" onclick="deleteOne('${q.id}')">${ICONS.trash16}刪除</button>`:''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderCardMode(pageItems) {
  const grid = document.getElementById('qCardGrid');
  if (!pageItems.length) {
    grid.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text-muted)">無符合條件的題目</div>`;
    return;
  }
  grid.innerHTML = pageItems.map(q => {
    const chap = [q.chapterNum,q.sectionNum,q.subsectionNum].filter(Boolean).join('-');

    const fullQuestion = q.type === 'T2' || q.type === 'T3' ? UI.choiceQuestionHtml(q, '—') : q.type === 'T5' ? UI.matchingQuestionHtml(q.text) : UI.questionHtml(q.text || '—');
    return `<div class="q-card-item${selected.has(q.id)?' selected':''}" data-qid="${q.id}">
      <div class="q-card-check">
        <input type="checkbox" class="q-cb" data-id="${q.id}" ${selected.has(q.id)?'checked':''} onclick="onCbClick(event,'${q.id}')" title="按住 Shift 可選取範圍">
      </div>
      <div class="q-card-body">
        <div class="q-card-meta">
          <span class="qnum">${UI.escapeHtml(q.qnum||'—')}</span>${UI.typeBadge(q.type)}
          ${UI.diffBadge(q.difficulty)}
          ${chap?`<span class="chapter">章節 ${chap}</span>`:''}
          <span class="page-source">頁數 ${UI.escapeHtml(q.source||'未註明')}</span>
        </div>
        <div class="q-card-text">${fullQuestion}</div>

        ${q.type !== 'T2' && q.type !== 'T3' && q.tail ? `<div>${UI.questionHtml(q.tail)}</div>` : ''}
        <div class="q-card-answer">
          <span class="ans-label">答案</span>
          <span class="ans-val">${UI.questionHtml(q.answer||'—')}</span>
        </div>
      </div>
      <div class="q-card-actions">
        <button class="btn btn-sm btn-outline" onclick="openEdit('${q.id}')">${ICONS.edit16}編輯</button>
        ${canEdit?`<button class="btn btn-sm btn-danger" onclick="deleteOne('${q.id}')">${ICONS.trash16}刪除</button>`:''}
      </div>
    </div>`;
  }).join('');
  UI.renderIcons(grid);
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPagination(totalPages) {
  const pagId = viewMode === 'card' ? 'paginationCard' : 'pagination';
  const pag = document.getElementById(pagId);
  if (!pag) return;
  if (totalPages <= 1) { pag.innerHTML=''; return; }
  let pages='';
  pages += `<button class="page-btn" onclick="gotoPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  const range = buildPageRange(currentPage, totalPages);
  range.forEach(p => {
    if (p==='…') pages += `<span class="page-info">…</span>`;
    else pages += `<button class="page-btn ${p===currentPage?'active':''}" onclick="gotoPage(${p})">${p}</button>`;
  });
  pages += `<button class="page-btn" onclick="gotoPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
  pages += `<span class="page-info">${currentPage}/${totalPages}</span>`;
  pag.innerHTML = pages;
}

function buildPageRange(cur, total) {
  if (total<=7) return Array.from({length:total},(_,i)=>i+1);
  const r=[1];
  if(cur>3) r.push('…');
  for(let i=Math.max(2,cur-1);i<=Math.min(total-1,cur+1);i++) r.push(i);
  if(cur<total-2) r.push('…');
  r.push(total);
  return r;
}

window.gotoPage = p => { currentPage=p; renderTable(); window.scrollTo(0,0); };

// ── 選取 ─────────────────────────────────────────
window.onCbClick = (event, id) => {
  const start = filtered.findIndex(q => q.id === selectionAnchorId);
  const end = filtered.findIndex(q => q.id === id);
  if (event.shiftKey && start !== -1 && end !== -1) {
    for (let i = Math.min(start, end); i <= Math.max(start, end); i++) selected.add(filtered[i].id);
  } else if (event.currentTarget.checked) {
    selected.add(id);
  } else {
    selected.delete(id);
  }
  selectionAnchorId = id;
  renderTable();
};
window.onSelectAll = () => {
  const checked = document.getElementById('selectAllCb').checked;
  const pageItems = filtered.slice((currentPage-1)*pageSize,currentPage*pageSize);
  pageItems.forEach(q => checked ? selected.add(q.id) : selected.delete(q.id));
  renderTable();
};
window.clearSelection = () => { selected.clear(); selectionAnchorId = null; renderTable(); };

// ── 刪除 ─────────────────────────────────────────
window.deleteOne = async id => {
  const question = allQuestions.find(q => q.id === id);
  if (!await confirmDeletion({
    title: '刪除題目',
    message: `確定要刪除題目「${question?.qnum || id}」？`,
    actionLabel: '刪除題目'
  })) return;
  await DataService.deleteQuestion(id);
  allQuestions = allQuestions.filter(q=>q.id!==id);
  filtered     = filtered.filter(q=>q.id!==id);
  selected.delete(id);
  UI.toast('已刪除','success');
  renderTable();
};

window.batchDelete = async () => {
  if (!selected.size) return;
  if (!await confirmDeletion({
    title: '批次刪除題目',
    message: `確定要刪除選取的 ${selected.size} 道題目？`,
    actionLabel: '批次刪除'
  })) return;
  const ids = [...selected];
  for (const id of ids) await DataService.deleteQuestion(id);
  allQuestions = allQuestions.filter(q=>!ids.includes(q.id));
  filtered     = filtered.filter(q=>!ids.includes(q.id));
  selected.clear();
  UI.toast(`已刪除 ${ids.length} 題`,'success');
  renderTable();
};

// ── 工具：選項欄位 HTML ──────────────────────────────

function questionEditorHtml(value) {

}

function questionEditorText(editor) {

}

let questionImageEditor = null;
let savingQuestion = false;
let editChapters = [];
let editBook = null;
let editLocation = {chapterNum:0, sectionNum:0, subsectionNum:0};
function locationLabel(location) {
  if (!location.chapterNum) return '選擇章節';
  const chapter = editChapters.find(c => Number(c.chapterNum) === location.chapterNum);
  const section = (chapter?.sections || []).find(s => Number(s.sectionNum) === location.sectionNum);
  const subsection = (section?.subsections || []).find(s => Number(s.num) === location.subsectionNum);
  return [chapter?.title || `${editBook?.l1 || '章'} ${location.chapterNum}`,
    section && (section.title || `${editBook?.l2 || '節'} ${location.sectionNum}`),
    subsection && (subsection.title || `${editBook?.l3 || '小節'} ${location.subsectionNum}`)].filter(Boolean).join(' ／ ');
}
function updateEditLocationLabel() {
  document.getElementById('eq-location').textContent = locationLabel(editLocation);
}
function appendChapterPickerItem(container, level, location, label) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = `chapter-picker-item chapter-picker-level-${level}`;
  button.textContent = label;
  button.dataset.chapter = location.chapterNum;
  button.dataset.section = location.sectionNum;
  button.dataset.subsection = location.subsectionNum;
  if (location.chapterNum === editLocation.chapterNum && location.sectionNum === editLocation.sectionNum && location.subsectionNum === editLocation.subsectionNum) {
    button.classList.add('selected');
    button.setAttribute('aria-current', 'true');
  }
  container.appendChild(button);
}
window.openChapterPicker = () => {
  const list = document.getElementById('chapterPickerList');
  list.replaceChildren();
  editChapters.forEach(chapter => {
    const chapterNum = Number(chapter.chapterNum);
    appendChapterPickerItem(list, 1, {chapterNum, sectionNum:0, subsectionNum:0}, chapter.title || `${editBook?.l1 || '章'} ${chapterNum}`);
    (chapter.sections || []).forEach(section => {
      const sectionNum = Number(section.sectionNum);
      appendChapterPickerItem(list, 2, {chapterNum, sectionNum, subsectionNum:0}, section.title || `${editBook?.l2 || '節'} ${sectionNum}`);
      (section.subsections || []).forEach(subsection => {
        const subsectionNum = Number(subsection.num);
        appendChapterPickerItem(list, 3, {chapterNum, sectionNum, subsectionNum}, subsection.title || `${editBook?.l3 || '小節'} ${subsectionNum}`);
      });
    });
  });
  if (!list.children.length) list.textContent = '此冊別尚無章節設定';
  document.getElementById('chapterPickerModal').classList.remove('hidden');
  (list.querySelector('.selected') || list.querySelector('button') || document.querySelector('#chapterPickerModal .modal-close')).focus();
};
window.closeChapterPicker = () => {
  document.getElementById('chapterPickerModal').classList.add('hidden');
  document.getElementById('eq-location')?.focus();
};
document.getElementById('chapterPickerList').addEventListener('click', event => {
  const button = event.target.closest('.chapter-picker-item');
  if (!button) return;
  editLocation = {chapterNum:Number(button.dataset.chapter), sectionNum:Number(button.dataset.section), subsectionNum:Number(button.dataset.subsection)};
  updateEditLocationLabel();
  closeChapterPicker();
});
document.getElementById('chapterPickerModal').addEventListener('keydown', event => {
  if (event.key === 'Escape') { event.preventDefault(); closeChapterPicker(); }
  if (event.key === 'Tab') {
    const buttons = [...document.querySelectorAll('#chapterPickerModal button')];
    const first = buttons[0], last = buttons.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});
document.getElementById('chapterPickerModal').addEventListener('click', event => {
  if (event.target.id === 'chapterPickerModal') closeChapterPicker();
});

window.openEdit = async id => {
  if (savingQuestion) return;
  questionImageEditor?.destroy();
  questionImageEditor = null;
  const q = allQuestions.find(x=>x.id===id); if(!q) return;
  const subject = _tbCache?.subjectByCode?.[q.subjectCode];
  editBook = (subject ? (_tbCache?.booksBySubject?.[subject.id] || []).find(b => b.code === q.bookCode) : null)
    || {l1:'章', l2:q.sectionNum ? '節' : '', l3:q.subsectionNum ? '小節' : ''};
  if (q.sectionNum && !editBook.l2) editBook = {...editBook, l2:'節'};
  if (q.subsectionNum && !editBook.l3) editBook = {...editBook, l3:'小節'};
  try {
    editChapters = editBook.id && subject
      ? await DataService.getChapterDefs(subject.id, editBook.id) : [];
  } catch (e) { UI.toast('章節載入失敗：' + e.message, 'danger'); return; }
  if (!editChapters.length) {
    editChapters = chaptersFromQuestions(allQuestions, editBook);
  }
  const locationChapters = [...editChapters];
  if (q.chapterNum && !locationChapters.some(c => String(c.chapterNum) === String(q.chapterNum))) {
    locationChapters.push({chapterNum:q.chapterNum, title:`${editBook?.l1 || '章'} ${q.chapterNum}（原位置）`, sections:[]});
  }
  editChapters = locationChapters;
  const originalChapter = editChapters.find(c => Number(c.chapterNum) === Number(q.chapterNum));
  if (originalChapter && q.sectionNum) {
    originalChapter.sections ||= [];
    if (!originalChapter.sections.some(s => Number(s.sectionNum) === Number(q.sectionNum))) {
      originalChapter.sections.push({sectionNum:q.sectionNum, title:`${editBook.l2 || '節'} ${q.sectionNum}（原位置）`, subsections:[]});
    }
    const originalSection = originalChapter.sections.find(s => Number(s.sectionNum) === Number(q.sectionNum));
    if (originalSection && q.subsectionNum) {
      originalSection.subsections ||= [];
      if (!originalSection.subsections.some(s => Number(s.num) === Number(q.subsectionNum))) {
        originalSection.subsections.push({num:q.subsectionNum, title:`${editBook.l3 || '小節'} ${q.subsectionNum}（原位置）`});
      }
    }
  }
  editLocation = {chapterNum:Number(q.chapterNum) || 0, sectionNum:Number(q.sectionNum) || 0, subsectionNum:Number(q.subsectionNum) || 0};
  document.getElementById('qModalTitle').textContent = `編輯題目 — ${q.qnum||''}`;
  document.getElementById('qModal').dataset.editId = id;

  document.getElementById('qModalBody').innerHTML = `
    <div class="edit-grid">
      <h4 class="edit-section-heading">基本資訊</h4>
      <div class="edit-basic-row">
      <div class="form-group"><label class="form-label">題型</label>
        <select class="form-control" id="eq-type">
          ${Object.entries(QUESTION_TYPES).map(([v,l])=>`<option value="${v}" ${q.type===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label class="form-label">難易</label>
        <select class="form-control" id="eq-diff">
          <option value="" ${!q.difficulty?'selected':''}>一般</option>
          <option value="◎" ${q.difficulty==='◎'?'selected':''}>較難 ◎</option>
          <option value="△" ${q.difficulty==='△'?'selected':''}>簡易 △</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label" for="eq-sourcecode">出處</label>
        <select class="form-control" id="eq-sourcecode">
          ${Object.entries(SOURCE_CODES).map(([v,l])=>`<option value="${v}" ${(q.sourceCode||'A1')===v?'selected':''}>${UI.escapeHtml(l)}</option>`).join('')}
          ${q.sourceCode && !Object.hasOwn(SOURCE_CODES,q.sourceCode) ? `<option value="${UI.escapeHtml(q.sourceCode)}" selected>${UI.escapeHtml(q.sourceCode)}</option>` : ''}
        </select>
      </div>
      <div class="form-group"><label class="form-label">頁數</label>
        <input class="form-control" id="eq-source" value="${(q.source||'').replace(/"/g,'&quot;')}">
      </div>
      <div class="form-group"><label class="form-label">答案數</label>
        <input class="form-control" id="eq-anscount" type="number" min="1" value="${q.answerCount||1}">
      </div>
      </div>
      <h4 class="edit-section-heading">章節位置</h4>
      <div class="edit-full form-group"><label class="form-label" for="eq-location">選擇章節 <span class="required">*</span></label>
        <button class="btn btn-outline" type="button" id="eq-location" onclick="openChapterPicker()"></button>
      </div>
      <h4 class="edit-section-heading">題目內容</h4>
      <div class="edit-full form-group"><label class="form-label">題目 <span class="required">*</span></label>
        <div class="form-control question-editor" id="eq-text" contenteditable="true" role="textbox" aria-label="題目" aria-multiline="true">${questionEditorHtml(q.text||'')}</div>
        <div id="eq-image-controls"></div>
        <div class="question-break-hint">Enter：換段（增加段距）　Shift+Enter：段內換行</div>
      </div>
      ${optionFields(q)}
      <h4 class="edit-section-heading">答案與解析</h4>
      <div class="form-group"><label class="form-label">題尾（選擇題用）</label>
        <input class="form-control" id="eq-tail" value="${(q.tail||'').replace(/"/g,'&quot;')}">
      </div>
      <div class="form-group"><label class="form-label">答案 <span class="required">*</span></label>
        <div style="display:flex;gap:8px">
          <input class="form-control" id="eq-answer" style="flex:1;min-width:0;${q.type === 'T1' ? 'display:none' : ''}" value="${UI.escapeHtml(q.answer||'')}">
          <select class="form-control" id="eq-truefalse-answers" aria-label="選擇是非題答案" style="width:100%;${q.type === 'T1' ? '' : 'display:none'}">
            <option value="">選答案</option><option value="○" ${q.answer === '○' ? 'selected' : ''}>○</option><option value="Ｘ" ${q.answer === 'Ｘ' ? 'selected' : ''}>Ｘ</option>
          </select>
        </div>
      </div>
      <div class="edit-full form-group"><label class="form-label">解析</label>
        <textarea class="form-control" id="eq-analysis" rows="3">${q.analysis||''}</textarea>
      </div>
    </div>`;

  updateEditLocationLabel();
  questionImageEditor = new QuestionImageEditor(document.getElementById('eq-text'), document.getElementById('eq-image-controls'));
  document.getElementById('eq-type').addEventListener('change', event => {
    document.getElementById('eq-truefalse-answers').style.display = event.target.value === 'T1' ? '' : 'none';
    document.getElementById('eq-answer').style.display = event.target.value === 'T1' ? 'none' : '';
  });
  document.getElementById('eq-truefalse-answers').addEventListener('change', event => {
    if (event.target.value) document.getElementById('eq-answer').value = event.target.value;
  });
  document.getElementById('eq-answer').addEventListener('input', event => {
    document.getElementById('eq-truefalse-answers').value = ['○','Ｘ'].includes(event.target.value) ? event.target.value : '';
  });

  document.getElementById('qModalFooter').innerHTML = `
    <button class="btn btn-ghost" onclick="closeQModal()">取消</button>
    ${canEdit?`<button class="btn btn-danger" onclick="closeQModal();deleteOne('${q.id}')">${ICONS.trash16}刪除</button>`:''}
    <button class="btn btn-primary" id="eq-save" onclick="saveEdit()">儲存</button>`;
  document.getElementById('qModal').classList.remove('hidden');
};

window.saveEdit = async () => {
  if (savingQuestion) return;
  if (questionImageEditor?.busy) { UI.toast('請等待圖片處理完成', 'warning'); return; }
  const id = document.getElementById('qModal').dataset.editId;
  const q  = allQuestions.find(x=>x.id===id); if(!q) return;
  const text = questionEditorText(document.getElementById('eq-text'));
  const answer = document.getElementById('eq-type').value === 'T1'
    ? document.getElementById('eq-truefalse-answers').value
    : document.getElementById('eq-answer').value.trim();
  if (!text || !answer) { UI.toast('題目與答案為必填','warning'); return; }
  const {chapterNum, sectionNum, subsectionNum} = editLocation;
  if (!chapterNum) { UI.toast(`請選擇${editBook?.l1 || '章'}`, 'warning'); return; }

  const updates = {
    type:        document.getElementById('eq-type').value,
    difficulty:  document.getElementById('eq-diff').value,
    source:      document.getElementById('eq-source').value.trim(),
    sourceCode:  document.getElementById('eq-sourcecode').value,
    answerCount: parseInt(document.getElementById('eq-anscount').value)||1,
    text, answer,
    tail:        document.getElementById('eq-tail')?.value.trim()||'',
    analysis:    document.getElementById('eq-analysis').value.trim(),
    chapterNum, sectionNum, subsectionNum,
  };
  if (chapterNum !== Number(q.chapterNum) || sectionNum !== Number(q.sectionNum || 0) || subsectionNum !== Number(q.subsectionNum || 0)) {
    const part = number => String(number).padStart(2, '0');
    const suffix = q.subjectCode === 'B1' ? part(chapterNum) + part(sectionNum) + part(subsectionNum)
      : q.subjectCode === 'C1' ? part(chapterNum) + part(sectionNum) : part(chapterNum);
    updates.catalogCode = `${q.subjectCode}-${q.bookCode}-${suffix}`;
  }
  if (updates.type === 'T2') {
    updates.options = [0,1,2,3,4]
      .map(i => (document.getElementById('eq-opt-'+i)?.value||'').trim())
      .filter(Boolean);
  }
  try {
    savingQuestion = true;
    document.getElementById('qModalBody').inert = true;
    document.querySelectorAll('#qModalFooter button, #qModal .modal-close').forEach(button => { button.disabled = true; });
    const imageEntries = questionImageEditor?.entries() || [];
    const archive = imageEntries.length ? await imageArchive(imageEntries) : null;
    await DataService.updateQuestion(id, updates);
    // 同步 allQuestions
    const idx = allQuestions.findIndex(x=>x.id===id);
    if (idx>=0) allQuestions[idx] = {...allQuestions[idx], ...updates};
    if (archive) downloadArchive(archive, q.qnum);
    questionImageEditor?.destroy(new Set(imageEntries.map(([path]) => path)));
    questionImageEditor = null;
    savingQuestion = false;
    closeQModal();
    doSearch();
    UI.toast(archive ? '題目已更新並下載圖片，請將解壓後的圖片上傳至 GitHub 的 images 資料夾' : '題目已更新','success', archive ? 8000 : 3000);
  } catch(e) { UI.toast('儲存失敗：'+e.message,'danger'); }
  finally {
    savingQuestion = false;
    document.getElementById('qModalBody').inert = false;
    document.querySelectorAll('#qModalFooter button, #qModal .modal-close').forEach(button => { button.disabled = false; });
  }
};

window.closeQModal = () => {
  if (savingQuestion) return;
  questionImageEditor?.destroy();
  questionImageEditor = null;
  document.getElementById('chapterPickerModal').classList.add('hidden');
  document.getElementById('qModal').classList.add('hidden');
};

loadAll();
</script>
</body>
</html>
