  let chosen=0, opener=null, toastTimer;
  grid.innerHTML=books.map((book,i)=>`<button class="gc-book" type="button" data-index="${i}" style="--book-tone:${tones[book.group]}"><img src="${artwork[i]}" alt=""/><strong>${book.name}</strong></button>`).join('');

  root.querySelector('.gc-close').addEventListener('click',close);
  overlay.addEventListener('click',event=>{if(event.target===overlay)close();});
  root.addEventListener('keydown',event=>{if(event.key==='Escape')close();if(event.key==='Tab'&&!overlay.hidden){const items=[...overlay.querySelectorAll('button')];if(event.shiftKey&&document.activeElement===items[0]){event.preventDefault();items.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===items.at(-1)){event.preventDefault();items[0].focus();}}});
  const updateCount=()=>{const count=root.querySelectorAll('.gc-chapters input:checked').length;root.querySelector('.gc-scope-footer span').textContent=count?`已選擇 ${count} 個章節`:'尚未選擇章節';};
  root.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{const book=books[chosen];overlay.hidden=true;root.querySelector('.gc-home').hidden=true;root.querySelector('.gc-scope').hidden=false;const title=root.querySelector('.gc-scope-title');title.querySelector('img').src=artwork[chosen];title.querySelector('small').textContent=button.dataset.mode;title.querySelector('h1').textContent=book.name;root.querySelector('.gc-chapters').innerHTML=book.chapters.map(name=>`<label><input type="checkbox"/>${name}</label>`).join('');updateCount();root.querySelector('.gc-back').focus();}));
  root.querySelector('.gc-chapters').addEventListener('change',updateCount);
  root.querySelector('.gc-select-all').addEventListener('click',()=>{const boxes=[...root.querySelectorAll('.gc-chapters input')];const checked=!boxes.every(box=>box.checked);boxes.forEach(box=>box.checked=checked);updateCount();});
  root.querySelector('.gc-primary').addEventListener('click',()=>notify(root.querySelector('.gc-chapters input:checked')?'已選擇出題範圍，可繼續設定題型與題數':'請先選擇至少一個章節'));
  root.querySelectorAll('[data-home]').forEach(button=>button.addEventListener('click',()=>{root.querySelector('.gc-home').hidden=false;root.querySelector('.gc-scope').hidden=true;overlay.hidden=true;}));
  const avatar=root.querySelector('.gc-avatar');avatar.addEventListener('click',()=>{const menu=root.querySelector('.gc-account-menu');menu.hidden=!menu.hidden;avatar.setAttribute('aria-expanded',String(!menu.hidden));});
})();
</script>
