<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電腦選題 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/process-bar.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<style>
.compose-layout{display:block}
.compose-panel[hidden]{display:none}
.scope-layout{display:grid;grid-template-columns:minmax(240px,.7fr) minmax(0,1.7fr);gap:16px;align-items:start}
.scope-layout .card{min-width:0}
.scope-layout .card-header{min-height:60px;padding:10px 20px;gap:12px}
.scope-layout .card-header h2{font-size:1.2rem;font-weight:700;letter-spacing:.01em}
.scope-title{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.scope-available{font-size:.88rem;font-weight:400;color:var(--text-secondary);white-space:nowrap}
.btn-previous{background:#607a99;color:#fff;border-color:transparent}
.btn-previous:hover{background:#4e6887;color:#fff}
.btn-previous:focus-visible{outline:2px solid #7c9ec5;outline-offset:2px}
.scope-header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.scope-header-actions .btn,.score-tools-actions .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.4}
.scope-header-actions .btn svg,.score-tools-actions .btn svg{display:block;flex:none;align-self:center}
.scope-header-actions .btn .step-icon{width:19px;height:19px;margin-right:-3px}
.scope-tree{height:auto;max-height:none;overflow:visible;padding:12px;background:#fff}
.scope-empty{padding:32px 16px;text-align:center;color:var(--text-muted)}
.subject-node{margin-bottom:4px}
.subject-node summary{cursor:pointer;padding:5px 8px;color:var(--primary);font-weight:600;border-radius:4px}
.book-node{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 28px;cursor:pointer;border-radius:4px}
.book-node:has(input:checked){background:#e2ebf4;color:#385b8a}
.book-node:hover,.subject-node summary:hover{background:#f5f8fc}
.book-node input{accent-color:#385b8a}
.subject-node.is-disabled summary,.book-node.is-disabled,#chapterTree .chapter-item.is-disabled{color:var(--text-muted);cursor:not-allowed;opacity:.55}
.subject-node.is-disabled summary:hover,.book-node.is-disabled:hover{background:none}
#chapterTree .chapter-item.is-disabled label{cursor:not-allowed}
.wizard-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 0}
.card>.wizard-actions{padding:16px;border-top:1px solid var(--border-light)}
#chapterTree.scope-tree{max-height:none;border:0;border-radius:0}
#chapterTree .chapter-item{border-bottom:0;padding-top:6px;padding-bottom:6px;font-size:1rem;line-height:1.5}
#chapterTree .chapter-item .ch-count{font-size:.94rem}
#chapterTree .chapter-children{margin-left:18px;border-left:1px dotted #b5c3d3}
#chapterTree .chapter-item.section,#chapterTree .chapter-item.subsection{padding-left:12px}
#chapterTree .chapter-item:has(input:checked){background:#eaf1f8}
#chapterTree .chapter-item{user-select:none}
#chapterTree .expand-btn{color:#385b8a}
@media(max-width:1100px){.scope-layout{grid-template-columns:1fr}}
@media(max-width:760px){.wizard-actions{flex-wrap:wrap}}

/* 設定面板 */
.config-card .card-body{padding:16px}
.section-title{font-size:.86rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.section-title:first-child{margin-top:0}
.type-row,.score-config-row{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:8px;border:1px solid var(--border-light);border-radius:9px;background:#fff;font-size:.9rem}
.type-row .type-label,.score-config-row .score-label{flex:1;min-width:0}
.type-row .type-label{display:flex;align-items:baseline;gap:8px;font-weight:500}
.type-row .type-pool{font-size:.82rem;color:var(--text-muted);font-weight:400;white-space:nowrap}
.type-row .row-unit,.score-config-row .row-unit{color:var(--text-secondary);font-size:.86rem;white-space:nowrap}
.chapter-tree{max-height:220px}
.type-layout{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}
.type-left-column{display:flex;flex-direction:column;gap:16px;min-width:0}
.type-layout .scope-title{flex-wrap:nowrap}
.type-layout .scope-title h2{white-space:nowrap}
.type-card-body{padding:18px 20px;background:#fff}
.difficulty-card .card-body{padding:18px 20px}
.difficulty-card .form-group{margin-bottom:0}
.type-title-note{font-size:.84rem;color:var(--text-secondary);font-weight:400;white-space:nowrap}
.type-card-body .type-row:last-child,.type-card-body .score-config-row:last-child{margin-bottom:0}
.type-row{flex-wrap:wrap}
.type-row.invalid{border-color:var(--danger);background:#fff3f1}
.type-error{display:none;width:100%;padding-left:4px;color:var(--danger);font-size:.82rem;line-height:1.4}
.type-row.invalid .type-error{display:block}
.number-stepper{display:flex;align-items:stretch;width:90px;flex:none;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff}
.number-stepper:focus-within{border-color:var(--primary-light);box-shadow:0 0 0 2px #3478f622}
.number-stepper .form-control{width:100%;min-width:0;padding:3px 6px;font-size:.88rem;border:0;border-radius:0;box-shadow:none;text-align:center;appearance:textfield;-moz-appearance:textfield}
.number-stepper .form-control::-webkit-inner-spin-button,.number-stepper .form-control::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.number-stepper-buttons{display:flex;flex-direction:column;flex:none;width:23px;border-left:1px solid var(--border)}
.number-stepper-buttons button{display:grid;place-items:center;flex:1;min-height:15px;padding:0;border:0;background:#f6f8fb;color:#536681;font-size:9px;line-height:1}
.number-stepper-buttons button+button{border-top:1px solid var(--border)}
.number-stepper-buttons button:hover{background:#e8eef6;color:var(--primary)}
.difficulty-note{margin-top:8px;color:var(--text-muted);font-size:.79rem;line-height:1.5}
.score-total{margin-top:14px;padding:13px 14px;border-radius:9px;background:#e1f3e9;color:#176d49;font-weight:700}
.integer-score-option{display:flex;align-items:center;gap:8px;width:fit-content;margin-top:12px;font-size:.88rem;color:var(--text-secondary);cursor:pointer}
.integer-score-option[hidden]{display:none}
.integer-score-option input{accent-color:var(--primary);width:16px;height:16px}
.score-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.score-tools[hidden]{display:none}
.score-tools .integer-score-option{margin-top:0}
.score-tools-actions{display:flex;gap:8px}
.compose-action-tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0}
.compose-action-tools[hidden]{display:none}
.scope-header-actions{flex-wrap:wrap}
.score-tools-actions .btn-auto-score{background:#e0edff;color:#2458a6;border-color:transparent}
.score-tools-actions .btn-auto-score:hover{background:#cbdfff;color:#174889}
.score-tools-actions .btn-auto-score:focus-visible{outline:2px solid #3478f6;outline-offset:2px}
#epModal.compose-inline-preview{position:static;inset:auto;padding:0;background:transparent;display:block;z-index:auto;overflow:visible;overscroll-behavior:auto;backdrop-filter:none;-webkit-backdrop-filter:none;animation:none}
#epModal.compose-inline-preview .ep-preview-modal{width:100%;max-width:none;max-height:none;height:auto;border:0;box-shadow:none;border-radius:0;overflow:visible;overscroll-behavior:auto;animation:none}
#epModal.compose-inline-preview #epBody{overflow:visible!important;overscroll-behavior:auto!important;flex:none!important}
#epModal.compose-inline-preview .modal-close,#epModal.compose-inline-preview #epFullscreenToggle{display:none}
#epModal.compose-inline-preview .modal-header{display:none}
#composePanel5 .card-header{flex-wrap:wrap}
#composePanel5 .scope-header-actions{flex-wrap:wrap}
.compose-preview-tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0}
.compose-preview-tools .btn svg{width:16px;height:16px;flex:none;transform:none;border:0;border-radius:0;background:transparent}
.settings-layout{grid-template-columns:minmax(0,1fr)}
.settings-layout .card-header{flex-wrap:wrap}
.exam-score-chart{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg-base);margin-bottom:16px}
.exam-score-chart span{height:100%}
.exam-summary-table-wrap{overflow-x:auto}
.exam-summary-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem;white-space:nowrap}
.exam-summary-table th{padding:9px 10px;text-align:left;background:var(--bg-base);color:var(--text-secondary);font-weight:500}
.exam-summary-table thead th:first-child{border-radius:8px 0 0 8px}
.exam-summary-table thead th:last-child{border-radius:0 8px 8px 0}
.exam-summary-table tbody tr{cursor:grab}
.exam-summary-table tbody tr:active{cursor:grabbing}
.exam-summary-table tbody tr:last-child td{border-bottom:0}
.exam-summary-table tr.is-dragging{opacity:.4}
.exam-summary-table tr.drag-target{box-shadow:inset 0 3px #3478f6}
.exam-type-drag{display:inline-block;color:var(--text-muted);margin-right:8px;font-size:1.1rem}
.exam-summary-table td{height:45px;box-sizing:border-box;padding:10px;border-bottom:1px solid var(--border-light);line-height:24px}
.exam-summary-table th:last-child,.exam-summary-table td:last-child{text-align:right}
.exam-type-dot{display:inline-block;width:1em;height:1em;border-radius:3px;margin-right:6px;vertical-align:-.1em}
.exam-summary-table small{display:inline;margin-left:8px;color:var(--text-muted);font-size:.79rem}
.exam-summary-table tfoot td{height:45px;padding:10px;background:#e1f3e9;color:#176d49;border-radius:8px;font-size:1.15rem;font-weight:700;border-bottom:0;text-align:left;line-height:24px}
.settings-header-sample{padding:14px;margin-bottom:16px;background:#f5f8fc;border:1px solid var(--border-light);border-radius:8px;overflow-x:auto;font-size:.88rem;line-height:1.6}
.settings-header-sample .ep-header-row{display:flex;flex-wrap:wrap;gap:4px 16px}
.settings-header-sample .ep-header-row span{white-space:pre-wrap}
.settings-header-sample .ep-header-row+.ep-header-row{margin-top:6px}
.settings-layout .ep-inline-header-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.settings-layout .ep-inline-header-lengths{grid-column:2;align-items:start}
@media(max-width:680px){.settings-layout .ep-inline-header-fields{grid-template-columns:1fr}.settings-layout .ep-inline-header-lengths{grid-column:1}}
@media(max-width:1220px){.type-layout{grid-template-columns:1fr}}

/* 自動選題：延續範圍與配分圖卡，題型列表沿用試卷編輯格式。 */
.result-card .card-header{min-height:60px;padding:10px 20px;gap:12px;flex-wrap:wrap}
.result-card .card-header h2{font-size:1.2rem;font-weight:700;letter-spacing:.01em}
.result-card .card-body{padding:18px 20px}
.preview-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.preview-stat{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:7px;background:#edf3fb;color:#385b8a;font-size:.88rem}
.preview-stat strong{font-size:1rem}
.preview-stat.score-stat{background:#e1f3e9;color:#176d49}
.result-section{margin-bottom:14px;border:1px solid var(--border-light);border-radius:9px;overflow:hidden;background:#fff}
.result-section:last-child{margin-bottom:0}
.result-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 12px;background:var(--bg-base);border-bottom:1px solid var(--border-light);font-size:.9rem;font-weight:700;color:var(--text-primary);cursor:pointer}
.result-section.is-collapsed .result-section-title{border-bottom:0}
.result-type-toggle{display:inline-flex;align-items:center;gap:8px;min-width:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.result-type-toggle svg{display:block;flex:none;transition:transform .15s ease}
.result-type-toggle[aria-expanded="false"] svg{transform:rotate(-90deg)}
.result-type-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:4px;border-radius:4px}
.result-list[hidden]{display:none}
.result-section-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.result-section-score{font-size:.84rem;font-weight:400;color:var(--text-secondary)}
.result-section-actions .btn{display:inline-flex;align-items:center;gap:6px}
.result-section-actions svg{display:block;flex:none}
.result-q{display:flex;align-items:flex-start;gap:10px;padding:12px;border-bottom:1px solid var(--border-light);font-size:.9rem;background:white}
.result-q:last-child{border-bottom:none}
.result-q:hover{background:#f8faff}
.result-q .q-num{color:var(--text-muted);font-size:.9rem;width:26px;flex-shrink:0;text-align:right;line-height:1.6}
.result-q .q-body{flex:1;min-width:0;overflow-wrap:anywhere}
.result-q .q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;line-height:1.6}
.result-q .q-meta .badge,.result-q .q-catalog-num,.result-q .q-source{padding:2px 8px;border-radius:6px;font-size:.82rem;line-height:1.5}
.result-q .q-catalog-num{font-family:var(--font-mono);background:#e8eef6;color:var(--primary)}
.result-q .q-source{max-width:100%;background:#f1edfa;color:#68518f;white-space:normal;overflow-wrap:anywhere}
.result-q .q-text,.result-q .q-tail{line-height:1.65;white-space:pre-wrap}
.result-q .q-tail{margin-top:5px}
.result-q .q-ans{display:flex;align-items:flex-start;gap:8px;margin-top:9px;padding:7px 10px;border-radius:6px;background:#eef7f2;color:#176d49;line-height:1.6}
.result-q .answer-label{flex:none;font-size:.82rem;font-weight:700}
.result-q .answer-text{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:760px){.result-card .card-header,.result-card .card-body{padding-left:14px;padding-right:14px}.result-card .scope-header-actions{flex-wrap:wrap}.result-q{gap:7px;padding:10px}}
.empty-config{text-align:center;padding:60px 24px;color:var(--text-muted)}
.empty-config .ec-icon{font-size:3rem;opacity:.3;margin-bottom:12px}
.score-input{width:56px;font-size:.88rem;padding:3px 6px;text-align:center}
.exam-save-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;background:#e8eef6;border-radius:var(--radius-lg);border:1px solid var(--border);margin-top:16px}
.exam-save-bar .form-control{flex:1;min-width:200px}
</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <div class="main" inert>
    <div class="topbar">
      <span class="topbar-title">電腦選題</span>
      <div class="topbar-breadcrumb"><span>首頁</span> › 電腦選題</div>
    </div>
    <div class="page-content">

<section class="import-progress" aria-label="電腦選題流程" style="--process-step-count:5;--process-initial-width:20%"><div class="steps" role="list">
<div class="step active" id="composeStep1" role="listitem" aria-current="step"><span class="step-num">1</span><span class="step-copy"><strong>出題範圍</strong></span></div>
<div class="step" id="composeStep2" role="listitem"><span class="step-num">2</span><span class="step-copy"><strong>題型與配分</strong></span></div>
<div class="step" id="composeStep3" role="listitem"><span class="step-num">3</span><span class="step-copy"><strong>自動選題</strong></span></div>
<div class="step" id="composeStep4" role="listitem"><span class="step-num">4</span><span class="step-copy"><strong>試卷設定</strong></span></div>
<div class="step" id="composeStep5" role="listitem"><span class="step-num">5</span><span class="step-copy"><strong>預覽試卷</strong></span></div>
</div><div class="import-progress-track" id="composeProgressTrack" role="progressbar" aria-label="電腦選題進度" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1" aria-valuetext="第 1 步，共 5 步"><div class="import-progress-fill" id="composeProgressFill"></div></div></section>

      <div class="compose-layout">
        <section id="composePanel1" class="compose-panel">
          <div class="scope-layout">
            <section class="card"><div class="card-header"><h2>選擇命題科目</h2></div><div class="scope-tree" id="subjectTree"></div></section>
            <section class="card"><div class="card-header"><div class="scope-title"><h2>選擇命題章節</h2><span class="scope-available" id="scopeAvailable">︱可選題數 0 題</span></div><div class="scope-header-actions"><div class="compose-action-tools" role="group" aria-label="範圍工具"><button class="btn btn-ghost btn-sm" onclick="clearAllChapters()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5a2 2 0 0 1 0 3L11 21H6l-4-4a2 2 0 0 1 0-3L13 3a2 2 0 0 1 3 0zM8 8l8 8M11 21h11"/></svg>取消選取</button></div><button class="btn btn-primary btn-sm" onclick="goComposeStep(2)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：題型與題數</button></div></div><div class="chapter-tree scope-tree" id="chapterTree"><div class="scope-empty">請先選擇左側的科目與冊次</div></div></section>
          </div>
          <div hidden><select id="cSubject" onchange="onSubjectChange()"><option value="">請選擇科目</option></select><select id="cBook" disabled onchange="loadChapters()"><option value="">請先選科目</option></select></div>
        </section>
        <section id="composePanel2" class="compose-panel" hidden>
          <div class="scope-layout type-layout">
            <div class="type-left-column">
              <section class="card"><div class="card-header"><div class="scope-title"><h2>題型與題數</h2><span class="type-title-note">︱調整各題型題數</span></div></div><div class="type-card-body"><div id="typeRows"></div></div></section>
              <section class="card difficulty-card"><div class="card-header"><div class="scope-title"><h2>試卷難易度</h2><span class="type-title-note">︱調整難易題配置比例</span></div></div><div class="card-body"><div class="form-group"><label class="sr-only" for="cDifficulty">試卷難易度</label><select class="form-control" id="cDifficulty"><option value="medium" selected>適中｜較難題 50% ≈ 簡易題 50%</option><option value="easy">偏易｜簡易題 70% &gt; 較難題 30%</option><option value="hard">偏難｜較難題 70% &gt; 簡易題 30%</option></select><p class="difficulty-note">難易題比例僅供參考。題目數量不足時，會依可用題目調整比例。</p></div></div></section>
            </div>
            <section class="card"><div class="card-header"><div class="scope-title"><h2>每題配分</h2><span class="type-title-note">︱自動配分或手動調整</span></div><div class="scope-header-actions"><button class="btn btn-previous btn-sm" onclick="goComposeStep(1)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button><button class="btn btn-primary btn-sm" onclick="doGenerate()" id="generateBtn"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg><span id="generateBtnLabel">下一步：自動選題</span></button></div></div><div class="type-card-body"><div id="scoreRows">請先設定題型與題數</div><div class="score-tools" id="scoreTools" hidden><label class="integer-score-option" id="integerScoreOption" hidden><input type="checkbox" id="integerScores" checked onchange="toggleIntegerScores()">以整數配分（未勾選時以 0.5 分為調整單位）</label><div class="score-tools-actions"><button type="button" class="btn btn-ghost btn-sm" onclick="clearComposeScores()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5a2 2 0 0 1 0 3L11 21H6l-4-4a2 2 0 0 1 0-3L13 3a2 2 0 0 1 3 0zM8 8l8 8M11 21h11"/></svg>清除配分</button><button type="button" class="btn btn-auto-score btn-sm" onclick="autoAllocateScores()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8L4 10l5.8 1.9L12 18l1.9-5.8L20 10l-5.8-1.9zM5 18l-.7 1.4L3 20l1.3.6L5 22l.7-1.4L7 20l-1.3-.6zM19 16l-.7 1.4L17 18l1.3.6L19 20l.7-1.4L21 18l-1.3-.6z"/></svg>自動配分</button></div></div></div></section>
          </div>
        </section>
        <section id="composePanel3" class="compose-panel" hidden>
          <section class="card result-card">
            <div class="card-header"><div class="scope-title"><h2>自動選題</h2><span class="type-title-note">︱檢視完整題目與答案</span></div><div class="scope-header-actions"><button type="button" class="btn btn-previous btn-sm" onclick="goComposeStep(2)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button><button type="button" class="btn btn-primary btn-sm" onclick="goComposeStep(4)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：試卷設定</button></div></div>

            <section class="card"><div class="card-header"><div class="scope-title"><h2>試卷表頭</h2><span class="type-title-note">︱設定文字與欄位位置</span></div></div><div class="type-card-body"><div class="settings-header-sample" id="settingsHeaderSample" aria-label="試卷表頭預覽"></div><div id="settingsHeaderFields"></div></div></section>

        <section id="composePanel5" class="compose-panel" hidden><div class="scope-layout"><section class="card" style="grid-column:1/-1"><div class="card-header"><div class="scope-title"><h2>預覽試卷</h2><span class="type-title-note">︱確認試卷呈現</span></div><div class="scope-header-actions"><button type="button" class="btn btn-previous btn-sm" onclick="goComposeStep(4)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button></div></div><div id="composeExamPreview"></div></section></div></section>

<script type="module">
import { guardPage } from './js/auth-guard.js';
import { showExamPreview, showHeaderSettings, newExamHeader, loadAppearance, mountInlineHeaderEditor, buildHeaderHtml, fontStackById } from './js/exam-preview.js';
import { allocateTypeScores } from './js/score-allocation.js';
import { blankCount, selectFillQuestions, reachableBlankCounts } from './js/blank-selection.js';
import { confirmAction } from './js/confirm-exam-deletion.js';
window._activeNav = 'compose';
const user = await guardPage(['admin','manager','teacher']);
if (!user) throw new Error('not auth');

function setComposeStep(n) {
  for (let i = 1; i <= 5; i++) document.getElementById('composePanel' + i).hidden = i !== n;
  document.getElementById('composeProgressFill').style.width = `${n * 20}%`;
  const progress = document.getElementById('composeProgressTrack');
  progress.setAttribute('aria-valuenow', String(n));
  progress.setAttribute('aria-valuetext', `第 ${n} 步，共 5 步`);
  for (let i = 1; i <= 5; i++) {
    const step = document.getElementById('composeStep' + i);
    step.classList.toggle('active', i === n);
    step.classList.toggle('done', i < n);
    if (i === n) step.setAttribute('aria-current', 'step');
    else step.removeAttribute('aria-current');
  }
  if (n === 4) renderExamSettings();
  if (n === 5) renderComposeExamPreview();
}

window.goComposeStep = n => {
  if (n > 1 && !document.querySelector('.chap-cb:checked')) { UI.toast('請勾選至少一個章節', 'warning'); return; }
  if (n >= 3 && !generatedQuestions.length) { UI.toast('請先選題', 'warning'); return; }
  setComposeStep(n);
};

// ── 初始化 ────────────────────────────────────────
const cSubject = document.getElementById('cSubject');
await initTextbookCache();
cSubject.innerHTML = tbSubjectOptions();

// 題型行
const TYPE_CONFIGS = [
  { code:'T1', label:'是非題', icon:'⭕', defaultScore:2 },
  { code:'T2', label:'選擇題', icon:'🔘', defaultScore:2 },
  { code:'T3', label:'複選題', icon:'☑️', defaultScore:4 },
  { code:'T4', label:'填空題', icon:'📝', defaultScore:2 },
  { code:'T5', label:'配合題', icon:'🔗', defaultScore:4 },
  { code:'T6', label:'問答題', icon:'💬', defaultScore:10 },
];
document.getElementById('typeRows').innerHTML = TYPE_CONFIGS.map(t => `
  <div class="type-row" id="typerow-${t.code}" style="display:none">
    <span class="type-label">${t.label}<span class="type-pool" id="pool-${t.code}"></span></span>
    <div class="number-stepper"><input class="form-control score-input" type="number" id="cnt-${t.code}" value="0" min="0" step="1" aria-label="${t.label}${t.code === 'T4' ? '格數' : '題數'}" oninput="updateScoreRows()"><div class="number-stepper-buttons"><button type="button" tabindex="-1" aria-label="增加${t.label}${t.code === 'T4' ? '格數' : '題數'}" onclick="adjustComposeNumber('cnt-${t.code}',1)">▲</button><button type="button" tabindex="-1" aria-label="減少${t.label}${t.code === 'T4' ? '格數' : '題數'}" onclick="adjustComposeNumber('cnt-${t.code}',-1)">▼</button></div></div>
    <span class="row-unit">${t.code === 'T4' ? '格' : '題'}</span>
    <span class="type-error" id="cnt-error-${t.code}" role="alert"></span>
  </div>
`).join('');

const escapeTreeText = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
window.adjustComposeNumber = (id, direction) => {
  const input = document.getElementById(id);
  const step = Number(input.step) || 1;
  const min = Number(input.min) || 0;
  const configuredMax = Number(input.max) || Infinity;
  const max = id.startsWith('cnt-') ? Math.min(configuredMax, Number(input.dataset.poolCount) || 0) : configuredMax;
  const current = Number(input.value);
  const base = Number.isFinite(current) ? (id.startsWith('cnt-') || step === 1 ? (direction > 0 ? Math.floor(current) : Math.ceil(current)) : current) : min;
  input.value = Math.min(max, Math.max(min, Math.round((base + direction * step) * 10) / 10));
  input.dispatchEvent(new Event('input', { bubbles:true }));
  input.focus();
};
let scopeQuestions = [];
window.loadScopeAvailability = async () => {
  const tree = document.getElementById('subjectTree');
  tree.innerHTML = '<div class="scope-empty">載入題庫中…</div>';
  try {
    scopeQuestions = await DataService.getQuestions();
    const subjectsWithQuestions = new Set(scopeQuestions.map(q => String(q.subjectCode)));
    const booksWithQuestions = new Set(scopeQuestions.map(q => JSON.stringify([String(q.subjectCode), String(q.bookCode)])));
    tree.innerHTML = (_tbCache?.subjects || []).map(subject => {
      const available = subjectsWithQuestions.has(String(subject.code));
      const books = _tbCache.booksBySubject[subject.id] || [];
      return `<details class="subject-node${available ? '' : ' is-disabled'}"><summary${available ? '' : ' aria-disabled="true" tabindex="-1" title="尚無題目"'}>${escapeTreeText(subject.name)}</summary>${books.length ? books.map(book => {
        const bookAvailable = booksWithQuestions.has(JSON.stringify([String(subject.code), String(book.code)]));
        return `<label class="book-node${bookAvailable ? '' : ' is-disabled'}"${bookAvailable ? '' : ' title="尚無題目"'}><input type="radio" name="scopeBook" data-subject="${escapeTreeText(subject.code)}" value="${escapeTreeText(book.code)}"${bookAvailable ? '' : ' disabled'}><span>${escapeTreeText(book.name)}</span></label>`;
      }).join('') : '<div class="scope-empty">尚無冊次</div>'}</details>`;
    }).join('') || '<div class="scope-empty">尚無科目</div>';
    [...cSubject.options].forEach(option => { if (option.value) option.disabled = !subjectsWithQuestions.has(String(option.value)); });
  } catch (error) {
    tree.innerHTML = `<div class="scope-empty">載入題庫失敗：${escapeTreeText(error.message)}<br><button type="button" class="btn btn-ghost btn-sm" onclick="loadScopeAvailability()">重新載入</button></div>`;
  }
};
document.getElementById('subjectTree').addEventListener('click', event => {
  if (event.target.closest('summary[aria-disabled="true"]')) event.preventDefault();
});
document.getElementById('subjectTree').addEventListener('change', async event => {
  const input = event.target;
  if (input.name !== 'scopeBook' || input.disabled) return;
  cSubject.value = input.dataset.subject;
  onSubjectChange();
  document.getElementById('cBook').value = input.value;
  generatedQuestions = [];
  draftPreviewData = null;
  document.getElementById('examTitle').value = '';
  await loadChapters();
});

let chapterData = {};
let generatedQuestions = [];
let settingsTypeOrder = TYPE_CONFIGS.map(type => type.code);
let draftPreviewData = null;
let lastChapterAnchor = null;
const chapterTree = document.getElementById('chapterTree');
chapterTree.addEventListener('click', event => {
  const row = event.target.closest('.chapter-item');
  if (!row || event.target.closest('.expand-btn')) return;
  const label = event.target.closest('label');
  const directInput = event.target.matches('.chap-cb');
  const cb = directInput ? event.target : label?.control || row.querySelector(':scope > .chap-cb');
  if (!cb || cb.disabled || !chapterTree.contains(cb)) return;
  if (!directInput && !label) {
    if (event.shiftKey) {
      const anchor = lastChapterAnchor;
      lastChapterAnchor = cb;
      selectChapterRange(anchor, cb);
    } else cb.click();
    return;
  }
  if (!event.shiftKey) {
    if (directInput) lastChapterAnchor = cb;
    return;
  }
  event.preventDefault();
  const anchor = lastChapterAnchor;
  lastChapterAnchor = cb;
  // 讓核取方塊的瀏覽器預設點擊狀態先結束，再一次套用整段範圍。
  setTimeout(() => selectChapterRange(anchor, cb), 0);
}, true);

function selectChapterRange(anchor, target) {
  const visible = [...chapterTree.querySelectorAll('.chap-cb')].filter(cb => !cb.disabled && cb.getClientRects().length);
  const start = visible.indexOf(anchor), end = visible.indexOf(target);
  if (end < 0) return;
  const range = start < 0 ? [target] : visible.slice(Math.min(start,end), Math.max(start,end)+1);
  const sameLevel = start < 0 || (anchor.classList.contains('chapter-cb') === target.classList.contains('chapter-cb') && anchor.classList.contains('sec-cb') === target.classList.contains('sec-cb'));
  const selected = sameLevel
    ? range.filter(cb => cb.classList.contains('chapter-cb') === target.classList.contains('chapter-cb') && cb.classList.contains('sec-cb') === target.classList.contains('sec-cb'))
    : range.filter(cb => !cb.closest('.chapter-item').nextElementSibling?.classList.contains('chapter-children'));
  if (!selected.includes(target)) selected.push(target);
  for (const cb of selected) {
    cb.checked = true;
    cb.indeterminate = false;
    if (cb.classList.contains('chapter-cb')) chapterTree.querySelectorAll(`.chap-cb[data-ch="${cb.dataset.ch}"]:not(.chapter-cb):not(:disabled)`).forEach(child => { child.checked = true; child.indeterminate = false; });
    else if (cb.classList.contains('sec-cb')) chapterTree.querySelectorAll(`.chap-cb[data-ch="${cb.dataset.ch}"][data-sec="${cb.dataset.sec}"][data-sub]:not(:disabled)`).forEach(child => { child.checked = true; child.indeterminate = false; });
  }
  chapterTree.querySelectorAll('.sec-cb').forEach(cb => syncParentCb(cb.dataset.ch, cb.dataset.sec));
  updateTypePoolsFromSelection();
}
window.openHeaderSettings = () => {
  setComposeStep(4);
  draftPreviewData ??= { header:newExamHeader(), appearance:loadAppearance() };
  showHeaderSettings(draftPreviewData);
};

function renderSettingsHeaderSample() {
  const sample = document.getElementById('settingsHeaderSample');
  sample.style.fontFamily = fontStackById(draftPreviewData.appearance.font);
  sample.innerHTML = buildHeaderHtml(draftPreviewData.header);
}

function renderExamSummary() {
  const colors = { T1:'#4b84cf', T2:'#3ca6a1', T3:'#cb9d36', T4:'#9670bf', T5:'#da8260', T6:'#6d819e' };
  const rows = settingsTypeOrder.map(code => TYPE_CONFIGS.find(type => type.code === code)).map(type => {
    const questions = generatedQuestions.filter(q => q.type === type.code);
    const units = type.code === 'T4' ? questions.reduce((sum, q) => sum + blankCount(q), 0) : questions.length;
    const score = Number(document.getElementById('score-' + type.code)?.value) || type.defaultScore;
    return { ...type, count:questions.length, units, score, total:Math.round(units * score * 10) / 10 };
  }).filter(type => type.count > 0);
  const total = Math.round(rows.reduce((sum, type) => sum + type.total, 0) * 10) / 10;
  document.getElementById('examSummary').innerHTML = `
    <div class="exam-score-chart" role="img" aria-label="各題型配分分布：${rows.map(type => `${type.label} ${type.total} 分`).join('、')}">${rows.map(type => `<span style="width:${total ? type.total / total * 100 : 0}%;background:${colors[type.code]}" title="${type.label}：${type.total} 分"></span>`).join('')}</div>
    <div class="exam-summary-table-wrap"><table class="exam-summary-table"><thead><tr><th scope="col">題型</th><th scope="col">題數</th><th scope="col">配分</th><th scope="col">小計</th></tr></thead><tbody>${rows.map(type => `<tr draggable="true" data-type="${type.code}"><td><span class="exam-type-drag" aria-hidden="true">⠿</span><span class="exam-type-dot" style="background:${colors[type.code]}"></span>${type.label}</td><td>${type.count} 題${type.code === 'T4' ? `<small>共 ${type.units} 格</small>` : ''}</td><td>${type.score} 分／${type.code === 'T4' ? '格' : '題'}</td><td>${type.total} 分</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">總分：${total} 分</td></tr></tfoot></table></div>`;
  const table = document.querySelector('#examSummary tbody');
  let draggedType = null;
  table.addEventListener('dragstart', event => {
    const row = event.target.closest('[data-type]');
    if (!row) return;
    draggedType = row.dataset.type;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', draggedType);
    row.classList.add('is-dragging');
  });
  table.addEventListener('dragover', event => {
    const row = event.target.closest('[data-type]');
    if (!draggedType || !row || row.dataset.type === draggedType) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    table.querySelectorAll('.drag-target').forEach(item => item.classList.remove('drag-target'));
    row.classList.add('drag-target');
  });
  table.addEventListener('drop', event => {
    const row = event.target.closest('[data-type]');
    if (!draggedType || !row || row.dataset.type === draggedType) return;
    event.preventDefault();
    const next = settingsTypeOrder.filter(code => code !== draggedType);
    next.splice(next.indexOf(row.dataset.type), 0, draggedType);
    settingsTypeOrder = next;
    generatedQuestions = settingsTypeOrder.flatMap(code => generatedQuestions.filter(q => q.type === code));
    if (draftPreviewData) draftPreviewData.typeOrder = [...settingsTypeOrder];
    renderExamSummary();
  });
  table.addEventListener('dragend', () => {
    draggedType = null;
    table.querySelectorAll('.is-dragging,.drag-target').forEach(row => row.classList.remove('is-dragging','drag-target'));
  });
}

function renderExamSettings() {
  draftPreviewData ??= { header:newExamHeader(), appearance:loadAppearance() };
  renderExamSummary();
  renderSettingsHeaderSample();
  draftPreviewData.onHeaderSaved = renderSettingsHeaderSample;
  draftPreviewData.onPreviewClose = renderExamSettings;
  const fields = document.getElementById('settingsHeaderFields');
  mountInlineHeaderEditor(fields, draftPreviewData, renderSettingsHeaderSample, () => {
    const status = fields.querySelector('[data-header-status]')?.textContent;
    renderExamSettings();
    const nextStatus = fields.querySelector('[data-header-status]');
    if (nextStatus) nextStatus.textContent = status === '尚未儲存' ? '已取消變更' : status || '';
  });
  fields.querySelector('.ep-inline-header-actions')?.remove();
}

window.onSubjectChange = () => {
  lastChapterAnchor = null;
  Object.keys(scoreOverrides).forEach(code => delete scoreOverrides[code]);
  const sc = cSubject.value;
  const bk = document.getElementById('cBook');
  if (sc) {
    bk.innerHTML = tbBookOptions(sc);
    [...bk.options].forEach(option => { if (option.value) option.disabled = !scopeQuestions.some(q => String(q.subjectCode) === String(sc) && String(q.bookCode) === String(option.value)); });
    bk.disabled = false;
  } else {
    bk.disabled = true;
    bk.innerHTML = '<option value="">請先選科目</option>';
  }
  document.getElementById('chapterTree').innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.88rem">請選擇冊次</div>';
  document.getElementById('scopeAvailable').textContent = '︱可選題數 0 題';
  window._allBookQs = [];
  TYPE_CONFIGS.forEach(t => document.getElementById('cnt-'+t.code).value = 0);
  updateTypePools([]);
  updateScoreRows();
};

window.loadChapters = async () => {
  const sc = cSubject.value, bc = document.getElementById('cBook').value;
  if (!sc || !bc) return;
  const tree = document.getElementById('chapterTree');
  tree.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:.88rem">載入中…</div>';
  document.getElementById('scopeAvailable').textContent = '︱可選題數 0 題';

  const isCurrentBook = () => cSubject.value === sc && document.getElementById('cBook').value === bc;
  let qs = [];
  try {
    qs = scopeQuestions.filter(q => String(q.subjectCode) === String(sc) && String(q.bookCode) === String(bc));
  } catch(e) {
    if (isCurrentBook()) tree.innerHTML = `<div class="scope-empty">載入失敗：${escapeTreeText(e.message)}</div>`;
    return;
  }
  if (!isCurrentBook()) return;
  // 統計每章每節的題目數量
  const countMap = {};
  qs.forEach(q => {
    const ch = q.chapterNum; if (!ch) return;
    if (!countMap[ch]) countMap[ch] = { count: 0, sections: {}, subsections: {} };
    countMap[ch].count++;
    if (q.sectionNum) {
      countMap[ch].sections[q.sectionNum] = (countMap[ch].sections[q.sectionNum]||0) + 1;
      if (q.subsectionNum) {
        const key = `${q.sectionNum}-${q.subsectionNum}`;
        countMap[ch].subsections[key] = (countMap[ch].subsections[key]||0) + 1;
      }
    }
  });
  chapterData = countMap;
  window._allBookQs = qs;
  updateTypePools([]);  // 載入後先隱藏，等使用者勾選章節再顯示

  // 從課本管理讀取章節定義（名稱）
  const subj = _tbCache?.subjectByCode?.[sc];
  const bookObj = subj ? (_tbCache?.booksBySubject?.[subj.id]||[]).find(b=>b.code===bc) : null;
  let tbChapters = [];
  if (subj && bookObj) {
    try {
      tbChapters = await DataService.getChapterDefs(subj.id, bookObj.id);
    } catch (e) {
      if (isCurrentBook()) tree.innerHTML = '<div class="scope-empty">載入章節失敗：' + escapeTreeText(e.message) + '</div>';
      return;
    }
    if (!isCurrentBook()) return;
  }
  const l1 = bookObj?.l1 || '章';
  const l2 = bookObj?.l2 || '節';

  // 合併課本定義與題目統計
  const allChNums = new Set([
    ...tbChapters.map(c => String(c.chapterNum)),
    ...Object.keys(countMap)
  ]);
  if (!allChNums.size) {
    tree.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.88rem">此科目/冊次無題目</div>';
    return;
  }

  // 建立章節名稱對照
  const chTitles = {};
  const secTitles = {};
  const subsecTitles = {};  // ch -> sec -> [{num, title}]
  const l3 = bookObj?.l3 || '';
  tbChapters.forEach(c => {
    chTitles[String(c.chapterNum)] = c.title || '';
    (c.sections||[]).forEach(s => {
      if (!secTitles[String(c.chapterNum)]) secTitles[String(c.chapterNum)] = {};
      secTitles[String(c.chapterNum)][String(s.sectionNum)] = s.title || '';
      if (l3 && (s.subsections||[]).length) {
        if (!subsecTitles[String(c.chapterNum)]) subsecTitles[String(c.chapterNum)] = {};
        subsecTitles[String(c.chapterNum)][String(s.sectionNum)] = s.subsections;
      }
    });
  });

  tree.innerHTML = [...allChNums].sort((a,b)=>parseInt(a)-parseInt(b)).map(ch => {
    const info = countMap[ch] || { count: 0, sections: {}, subsections: {} };
    const allSecs = new Set([
      ...Object.keys((secTitles[ch]||{})),
      ...Object.keys(info.sections)
    ]);
    const hasChildren = l2 && allSecs.size > 0;
    const secHTML = l2 ? [...allSecs].sort((a,b)=>parseInt(a)-parseInt(b)).map(sec => {
      const cnt = info.sections[sec] || 0;
      const subs = subsecTitles[ch]?.[sec] || [];
      const hasSubChildren = l3 && subs.length > 0;
      const subsHTML = hasSubChildren ? subs.map(ss => `
        <div class="chapter-item subsection">
          <span style="width:16px;flex-shrink:0;display:inline-block"></span>
          <input type="checkbox" class="chap-cb" data-ch="${ch}" data-sec="${sec}" data-sub="${ss.num}">
          <span>${escapeTreeText(ss.title || (l3+ss.num))}</span>
          <span class="ch-count">${info.subsections[`${sec}-${ss.num}`] || 0} 題</span>
        </div>`).join('') : '';
      return `<div class="chapter-item section">
        ${hasSubChildren ? `<button class="expand-btn" onclick="toggleChildren(this)" aria-label="展開章節" aria-expanded="false">▶</button>` : '<span style="width:16px;flex-shrink:0"></span>'}
        <input type="checkbox" class="chap-cb sec-cb" data-ch="${ch}" data-sec="${sec}" onchange="onSecCbChange(this)">
        <span>${escapeTreeText(secTitles[ch]?.[sec] || (l2+parseInt(sec)))}</span>
        ${hasSubChildren ? '' : `<span class="ch-count">${cnt} 題</span>`}
      </div>${hasSubChildren ? `<div class="chapter-children">${subsHTML}</div>` : ''}`;
    }).join('') : '';
    return `<div class="chapter-item">
        ${hasChildren ? `<button class="expand-btn" onclick="toggleChildren(this)" aria-label="展開章節" aria-expanded="false">▶</button>` : '<span style="width:16px;flex-shrink:0"></span>'}
        <input type="checkbox" class="chap-cb chapter-cb" data-ch="${ch}" onchange="onChapterCbChange(this)">
        <span>${escapeTreeText(chTitles[ch] || (l1+parseInt(ch)))}</span>
        ${hasChildren ? '' : `<span class="ch-count">${info.count} 題</span>`}
      </div>${hasChildren ? `<div class="chapter-children">${secHTML}</div>` : secHTML}`;
  }).join('');
  lastChapterAnchor = null;
  tree.querySelectorAll('.chap-cb').forEach((cb, index) => {
    const info = chapterData[cb.dataset.ch];
    const count = cb.dataset.sub ? info?.subsections[`${cb.dataset.sec}-${cb.dataset.sub}`] || 0
      : cb.dataset.sec ? info?.sections[cb.dataset.sec] || 0 : info?.count || 0;
    cb.disabled = count === 0;
    cb.closest('.chapter-item').classList.toggle('is-disabled', cb.disabled);
    if (cb.disabled) cb.closest('.chapter-item').title = '尚無題目';
    cb.id = 'scopeChapter' + index;
    const text = cb.nextElementSibling;
    const label = document.createElement('label');
    label.htmlFor = cb.id;
    label.textContent = text.textContent;
    text.replaceWith(label);
  });
};

window.toggleChildren = (btn) => {
  const parent = btn.closest('.chapter-item');
  const children = parent.nextElementSibling;
  if (!children || !children.classList.contains('chapter-children')) return;
  const open = children.classList.toggle('open');
  btn.textContent = open ? '▼' : '▶';
  btn.setAttribute('aria-expanded', String(open));
  btn.setAttribute('aria-label', open ? '收合章節' : '展開章節');
};

// 向上同步：子項全勾→上層勾；子項未全勾→上層取消
function syncParentCb(ch, sec) {
  // 同步第二層（sec-cb）：若該章所有 sec-cb 全勾則章勾，否則取消
  // 同步第三層→第二層：若該節所有 sub 全勾則節勾，否則取消
  if (sec !== undefined) {
    const subs = [...document.querySelectorAll(`.chap-cb[data-ch="${ch}"][data-sec="${sec}"][data-sub]:not(:disabled)`)];
    if (subs.length) {
      const secCb = document.querySelector(`.chap-cb.sec-cb[data-ch="${ch}"][data-sec="${sec}"]`);
      if (secCb) {
        secCb.checked = subs.every(s => s.checked);
        secCb.indeterminate = !secCb.checked && subs.some(s => s.checked);
      }
    }
  }
  // 同步章：若所有非 chapter-cb 的 chap-cb 全勾則章勾
  const allChildren = [...document.querySelectorAll(`.chap-cb[data-ch="${ch}"]:not(.chapter-cb):not(:disabled)`)];
  if (allChildren.length) {
    const chapCb = document.querySelector(`.chap-cb.chapter-cb[data-ch="${ch}"]`);
    if (chapCb) {
      chapCb.checked = allChildren.every(s => s.checked);
      chapCb.indeterminate = !chapCb.checked && allChildren.some(s => s.checked);
    }
  }
}

window.onSecCbChange = (cb) => {
  if (cb.disabled) return;
  const ch = cb.dataset.ch, sec = cb.dataset.sec, checked = cb.checked;
  cb.indeterminate = false;
  // 下行：同步所有子節
  document.querySelectorAll(`.chap-cb[data-ch="${ch}"][data-sec="${sec}"][data-sub]:not(:disabled)`).forEach(s => { s.checked = checked; s.indeterminate = false; });
  // 上行：同步章
  syncParentCb(ch, undefined);
  updateTypePoolsFromSelection();
};

window.onChapterCbChange = (cb) => {
  if (cb.disabled) return;
  const ch = cb.dataset.ch;
  const checked = cb.checked;
  cb.indeterminate = false;
  document.querySelectorAll(`.chap-cb[data-ch="${ch}"]:not(.chapter-cb):not(:disabled)`).forEach(s => s.checked = checked);
  updateTypePoolsFromSelection();
};

// 第三層直接點選 → 觸發向上同步
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.classList.contains('chap-cb') || t.disabled) return;
  if (t.classList.contains('chapter-cb') || t.classList.contains('sec-cb')) return;
  // 第三層：向上同步節和章
  syncParentCb(t.dataset.ch, t.dataset.sec);
  updateTypePoolsFromSelection();
});

let fillPool = [];
let fillReachable = [true];
function updateTypePools(qs) {
  document.getElementById('scopeAvailable').textContent = `︱可選題數 ${qs.length} 題`;
  fillPool = qs.filter(q => q.type === 'T4');
  fillReachable = reachableBlankCounts(fillPool);
  TYPE_CONFIGS.forEach(t => {
    const c = qs.filter(q => q.type === t.code).length;
    const available = t.code === 'T4' ? fillPool.reduce((sum, q) => sum + blankCount(q), 0) : c;
    const row = document.getElementById('typerow-'+t.code);
    if (row) row.style.display = c ? '' : 'none';
    if (!c) document.getElementById('cnt-' + t.code).value = 0;
    document.getElementById('cnt-' + t.code).dataset.poolCount = String(available);
    document.getElementById('cnt-' + t.code).max = String(available);
    const pool = document.getElementById('pool-'+t.code);
    if (pool) pool.textContent = c ? (t.code === 'T4' ? `共 ${c} 題、${available} 格` : `共 ${c} 題`) : '';
  });
  validateTypeCounts();
}

function validateTypeCounts(focusFirst = false) {
  let firstInvalid = null;
  TYPE_CONFIGS.forEach(t => {
    const input = document.getElementById('cnt-' + t.code);
    const row = document.getElementById('typerow-' + t.code);
    const available = Number(input.dataset.poolCount) || 0;
    const count = Number(input.value);
    let message = '';
    const unit = t.code === 'T4' ? '格' : '題';
    if (available && (input.value === '' || !Number.isSafeInteger(count) || count < 0)) message = `請填寫 0～${available} 的整數${unit}數`;
    else if (count > available) message = `此題型最多可選 ${available} ${unit}，請重新填寫`;
    else if (t.code === 'T4' && count > 0 && !fillReachable[count]) {
      const possible = fillReachable.flatMap((yes, n) => yes && n > 0 ? [n] : [])
        .sort((a, b) => Math.abs(a - count) - Math.abs(b - count)).slice(0, 6).sort((a, b) => a - b);
      message = `無法以整題湊出 ${count} 格；可選格數：${possible.join('、')}`;
    }
    row.classList.toggle('invalid', Boolean(message));
    input.setAttribute('aria-invalid', String(Boolean(message)));
    document.getElementById('cnt-error-' + t.code).textContent = message;
    if (message && !firstInvalid) firstInvalid = input;
  });
  if (focusFirst && firstInvalid) {
    firstInvalid.focus();
    UI.toast(firstInvalid.closest('.type-row').querySelector('.type-error').textContent, 'warning');
  }
  return !firstInvalid;
}

function updateTypePoolsFromSelection() {
  generatedQuestions = [];
  const allQs = window._allBookQs || [];
  if (!allQs.length) { updateTypePools([]); updateScoreRows(); return; }
  const checkedCbs = [...document.querySelectorAll('.chap-cb:checked')];
  if (!checkedCbs.length) {
    // 未勾選任何章節 → 隱藏所有題型
    updateTypePools([]);
    updateScoreRows();
    return;
  }
  const chapters = checkedCbs.map(c =>
    c.dataset.sub  ? `${c.dataset.ch}-${c.dataset.sec}-${c.dataset.sub}` :
    c.dataset.sec  ? `${c.dataset.ch}-${c.dataset.sec}` :
    c.dataset.ch
  );
  const filtered = allQs.filter(q => chapters.some(c => {
    const p = c.split('-').map(Number);
    const eq = (a,b) => Number(a)===Number(b);
    if (p.length === 1) return eq(q.chapterNum, p[0]);
    if (p.length === 2) return eq(q.chapterNum, p[0]) && eq(q.sectionNum, p[1]);
    return eq(q.chapterNum, p[0]) && eq(q.sectionNum, p[1]) && eq(q.subsectionNum, p[2]);
  }));
  updateTypePools(filtered);
  updateScoreRows();
}

function shuffleQuestions(items) {
  const shuffled = [...items];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

window.shuffleAll = () => {
  if (!generatedQuestions.length) return;
  // Shuffle within each type group
  const byType = {};
  generatedQuestions.forEach(q => { if (!byType[q.type]) byType[q.type] = []; byType[q.type].push(q); });
  Object.keys(byType).forEach(type => { byType[type] = shuffleQuestions(byType[type]); });
  // Re-flatten in original type order
  const TYPE_ORDER = ['T1','T2','T3','T4','T5','T6'];
  generatedQuestions = TYPE_ORDER.flatMap(t => byType[t]||[]);
  // Re-render
  const grouped = TYPE_CONFIGS.map(t => ({
    ...t,
    items: generatedQuestions.filter(q => q.type === t.code)
  })).filter(t => t.items.length);
  renderPreview(grouped);
  UI.toast('已在各題型內重新亂數排序', 'success');
};

const scoreOverrides = {};
const scoreWeights = { T1:1, T2:1, T3:2, T4:1, T5:3, T6:5 };
window.autoAllocateScores = () => {
  Object.keys(scoreOverrides).forEach(code => delete scoreOverrides[code]);
  updateScoreRows();
};
window.toggleIntegerScores = () => autoAllocateScores();
window.clearComposeScores = () => {
  TYPE_CONFIGS.forEach(type => {
    const input = document.getElementById('score-' + type.code);
    if (!input) return;
    scoreOverrides[type.code] = '';
    input.value = '';
  });
  recalcTotal();
};
window.normalizeComposeScore = input => {
  const step = Number(input.step);
  const value = Number(input.value);
  input.value = Math.min(100, Math.max(step, Math.round((Number.isFinite(value) ? value : step) / step) * step));
  recalcTotal(input);
};
window.updateScoreRows = () => {
  validateTypeCounts();
  const typeCounts = TYPE_CONFIGS.map(t => ({
    ...t,
    cnt: parseInt(document.getElementById('cnt-'+t.code).value)||0
  })).filter(t => t.cnt > 0);

  document.getElementById('integerScoreOption').hidden = !typeCounts.length;
  document.getElementById('scoreTools').hidden = !typeCounts.length;

  if (!typeCounts.length) {
    document.getElementById('scoreRows').innerHTML =
      '<span style="color:var(--text-muted);font-size:.88rem">請設定各題型題數</span>';
    return;
  }

  const scoreStep = document.getElementById('integerScores').checked ? 1 : 0.5;
  // 優先湊足 100 分並盡量採用整數配分，再依題型權重選擇組合。
  // 填空題以格為計分單位；配合、問答採較高權重。
  const suggestedScores = allocateTypeScores(typeCounts, scoreWeights, 100, scoreStep);

  const rows = typeCounts.map(t => {
    const score = suggestedScores[t.code];
    const fillQuestions = generatedQuestions.filter(q => q.type === 'T4');
    const selectedBlanks = fillQuestions.reduce((sum, q) => sum + blankCount(q), 0);
    const label = t.code === 'T4'
      ? `${t.label} × ${fillQuestions.length && selectedBlanks === t.cnt ? `${fillQuestions.length} 題（共 ${t.cnt} 格）` : `${t.cnt} 格（選題後顯示題數）`}`
      : `${t.label} × ${t.cnt} 題`;
    const unit = t.code === 'T4' ? '格' : '題';
    return `<div class="score-config-row">
      <span class="score-label">${label}</span>
      <div class="number-stepper"><input class="form-control" type="number" id="score-${t.code}" value="${scoreOverrides[t.code] ?? score}" min="${scoreStep}" max="100" step="${scoreStep}" aria-label="${t.label}每${unit}配分" oninput="recalcTotal(this)" onchange="normalizeComposeScore(this)"><div class="number-stepper-buttons"><button type="button" tabindex="-1" aria-label="增加${t.label}每${unit}配分" onclick="adjustComposeNumber('score-${t.code}',1)">▲</button><button type="button" tabindex="-1" aria-label="減少${t.label}每${unit}配分" onclick="adjustComposeNumber('score-${t.code}',-1)">▼</button></div></div>
      <span class="row-unit">分/${unit}</span>
    </div>`;
  });

  const displayTotal = Math.round(typeCounts.reduce((s,t) => s + t.cnt * (scoreOverrides[t.code] ?? suggestedScores[t.code]), 0) * 10) / 10;
  document.getElementById('scoreRows').innerHTML =
    rows.join('') +
    `<div class="score-total" id="scoreTotalRow">
      總計：<span id="scoreTotal">${displayTotal}</span> 分
      ${displayTotal > 100 ? '<span style="color:var(--danger);font-size:.88rem;margin-left:6px">⚠ 超過100分</span>' : ''}
    </div>`;
};

window.recalcTotal = input => {
  if (input?.id?.startsWith('score-')) scoreOverrides[input.id.slice(6)] = parseFloat(input.value) || 0;
  const total = TYPE_CONFIGS.reduce((s,t) => {
    const cnt = parseInt(document.getElementById('cnt-'+t.code)?.value)||0;
    const score = parseFloat(document.getElementById('score-'+t.code)?.value)||0;
    return s + cnt*score;
  }, 0);
  const el = document.getElementById('scoreTotal');
  if (el) el.textContent = Math.round(total*10)/10;
  const row = document.getElementById('scoreTotalRow');
  if (row) {
    const warn = row.querySelector('span[style*="danger"]');
    if (total > 100) {
      if (!warn) row.innerHTML += '<span style="color:var(--danger);font-size:.88rem;margin-left:6px">⚠ 超過100分</span>';
    } else {
      if (warn) warn.remove();
    }
  }
};

// ── 自動選題 ──────────────────────────────────────
window.doGenerate = async () => {
  const sc   = cSubject.value;
  const bc   = document.getElementById('cBook').value;
  const diff = document.getElementById('cDifficulty').value;

  if (!sc) { UI.toast('請選擇科目', 'warning'); return; }
  if (!bc) { UI.toast('請選擇冊次', 'warning'); return; }

  const typeCounts = TYPE_CONFIGS.map(t => ({...t, count: parseInt(document.getElementById('cnt-'+t.code).value)||0}));
  if (!validateTypeCounts(true)) return;
  const total = typeCounts.reduce((s,t) => s+t.count, 0);
  if (!total) { UI.toast('請至少設定一種題型的題數', 'warning'); return; }
  const missingScore = typeCounts.find(type => type.count > 0 &&
    !(Number(document.getElementById('score-' + type.code)?.value) > 0));
  if (missingScore) {
    document.getElementById('score-' + missingScore.code)?.focus();
    UI.toast('請填寫各題型配分，或點選「自動配分」', 'warning');
    return;
  }

  // 取章節篩選（必須勾選至少一個）
  const checkedCbs = [...document.querySelectorAll('.chap-cb:checked')];
  if (!checkedCbs.length) { UI.toast('請勾選至少一個章節', 'warning'); return; }
  const chapters = checkedCbs.map(c => c.dataset.sub ? `${c.dataset.ch}-${c.dataset.sec}-${c.dataset.sub}` : c.dataset.sec ? `${c.dataset.ch}-${c.dataset.sec}` : c.dataset.ch);

  const configuredScore = Math.round(typeCounts.reduce((sum, type) => {
    const score = Number(document.getElementById('score-' + type.code)?.value) || 0;
    return sum + type.count * score;
  }, 0) * 10) / 10;
  if (configuredScore !== 100 && !await confirmAction({
    title:'配分非 100 分',
    message:`目前配分總計為 ${configuredScore} 分，確定要繼續下一步驟嗎？`,
    actionLabel:'下一步',
  })) return;

  const btn = document.getElementById('generateBtn');
  btn.disabled = true; document.getElementById('generateBtnLabel').textContent = '選題中…';

  try {
    const allPicked = [];
    for (const t of typeCounts) {
      if (!t.count) continue;
      const picked = t.code === 'T4'
        ? selectFillQuestions(await DataService.getQuestions({ subjectCode: sc, bookCode: bc, chapters: chapters.length ? chapters : undefined, type:'T4' }), t.count, ({ easy:.3, medium:.5, hard:.7 })[diff] ?? .5)
        : await DataService.randomWithDifficulty({ subjectCode: sc, bookCode: bc, chapters: chapters.length ? chapters : undefined }, diff, t.count, t.code);
      if (picked === null) {
        UI.toast(`無法以整題湊出 ${t.count} 格填空題，請調整格數`, 'warning');
        return;
      }
      if (t.code !== 'T4' && picked.length < t.count) {
        document.getElementById('cnt-' + t.code).dataset.poolCount = String(picked.length);
        validateTypeCounts(true);
        return;
      }
      allPicked.push({ ...t, items: shuffleQuestions(picked) });
    }

    generatedQuestions = allPicked.flatMap(t => t.items.map(q => ({...q, _typeLabel: t.label, _icon: t.icon})));
    updateScoreRows();
    renderPreview(allPicked);
    if (generatedQuestions.length) setComposeStep(3);
    else UI.toast('此範圍沒有符合條件的題目，請調整題數', 'warning');
  } catch(e) {
    UI.toast('選題失敗：'+e.message, 'danger');
  } finally {
    btn.disabled = false; document.getElementById('generateBtnLabel').textContent = '下一步：自動選題';
  }
};

function renderPreview(grouped) {
  const typeScore = type => {
    const value = Number(document.getElementById('score-' + type.code)?.value);
    return Number.isFinite(value) && value > 0 ? value : type.defaultScore;
  };
  const scoreUnits = type => type.code === 'T4'
    ? type.items.reduce((sum, q) => sum + blankCount(q), 0) : type.items.length;
  const total = grouped.reduce((s,t) => s+t.items.length, 0);
  const totalScore = Math.round(grouped.reduce((sum, type) => sum + scoreUnits(type) * typeScore(type), 0) * 10) / 10;

  // stats
  document.getElementById('previewStats').innerHTML = `
    <div class="preview-stat">共 <strong>${total}</strong> 題</div>
    <div class="preview-stat score-stat">總計 <strong>${totalScore}</strong> 分</div>
    <div class="preview-stat"><strong>${grouped.filter(t => t.items.length).length}</strong> 種題型</div>
  `;

  let html = '';
  let qNum = 1;
  let sectionIndex = 0;
  const sectionNumbers = ['一','二','三','四','五','六'];
  for (const t of grouped) {
    if (!t.items.length) continue;
    const collapsed = collapsedResultTypes.has(t.code);
    html += `<div class="result-section${collapsed ? ' is-collapsed' : ''}">
      <div class="result-section-title">
        <button type="button" class="result-type-toggle" onclick="toggleResultType('${t.code}',this)" aria-expanded="${!collapsed}" aria-controls="resultQuestions-${t.code}" aria-label="${collapsed ? '展開' : '收合'}${t.label}題目"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span>${sectionNumbers[sectionIndex++]}、${t.label}（${t.items.length} 題${t.code === 'T4' ? `，共 ${scoreUnits(t)} 格` : ''}）</span></button>
        <div class="result-section-actions"><span class="result-section-score">每${t.code === 'T4' ? '格' : '題'} ${typeScore(t)} 分，共 ${scoreUnits(t) * typeScore(t)} 分</span><button type="button" class="btn btn-ghost btn-sm" onclick="regenerateType('${t.code}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-2l2 2M18 17a7 7 0 0 1-12 2l-2-2"/></svg>重選題目</button></div>
      </div>
      <div class="result-list" id="resultQuestions-${t.code}"${collapsed ? ' hidden' : ''}>
        ${t.items.map(q => `
          <div class="result-q">
            <span class="q-num">${qNum++}.</span>
            <div class="q-body">
              <div class="q-meta"><span class="q-catalog-num">${UI.escapeHtml(q.qnum || '—')}</span>${UI.typeBadge(q.type)}${UI.diffBadge(q.difficulty)}<span class="q-source">來源：${UI.escapeHtml(q.source || '未註明')}</span></div>
              <div class="q-text">${q.type === 'T5' ? UI.matchingQuestionHtml(q.text) : UI.questionHtml(q.text || '—')}${(q.type === 'T2' || q.type === 'T3') && q.options?.length ? ' ' + q.options.map((option, index) => '(' + String.fromCharCode(65 + index) + ')' + UI.questionHtml(option)).join(' ') : ''}${(q.type === 'T2' || q.type === 'T3') && q.tail ? (String(q.tail).trim() === '。' ? '' : ' ') + UI.questionHtml(q.tail) : ''}</div>
              ${q.type !== 'T2' && q.type !== 'T3' && q.tail ? '<div class="q-tail">' + UI.questionHtml(q.tail) + '</div>' : ''}
              <div class="q-ans"><span class="answer-label">答案</span><span class="answer-text">${UI.questionHtml(q.answer || '—')}</span></div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  document.getElementById('previewArea').innerHTML = html;
}

async function regenerateType(typeCode) {
  const sc   = cSubject.value;
  const bc   = document.getElementById('cBook').value;
  const diff = document.getElementById('cDifficulty').value;
  const cnt  = parseInt(document.getElementById('cnt-'+typeCode).value)||0;
  if (!cnt) return;

  const checkedCbs = [...document.querySelectorAll('.chap-cb:checked')];
  const chapters = checkedCbs.map(c => c.dataset.sub ? `${c.dataset.ch}-${c.dataset.sec}-${c.dataset.sub}` : c.dataset.sec ? `${c.dataset.ch}-${c.dataset.sec}` : c.dataset.ch);

  try {
    const newItems = typeCode === 'T4'
      ? selectFillQuestions(await DataService.getQuestions({ subjectCode: sc, bookCode: bc, chapters: chapters.length ? chapters : undefined, type:'T4' }), cnt, ({ easy:.3, medium:.5, hard:.7 })[diff] ?? .5)
      : await DataService.randomWithDifficulty({ subjectCode: sc, bookCode: bc, chapters: chapters.length ? chapters : undefined }, diff, cnt, typeCode);
    if (newItems === null) { UI.toast(`無法以整題湊出 ${cnt} 格填空題`, 'warning'); return; }
    // 替換 generatedQuestions 中對應題型的題目
    generatedQuestions = generatedQuestions.filter(q => q.type !== typeCode);
    generatedQuestions.push(...shuffleQuestions(newItems));
    updateScoreRows();
    UI.toast(`已重新選取 ${newItems.length} 題 ${QUESTION_TYPES[typeCode]}`, 'success');
    // 重組並渲染
    const TYPE_CONFIGS_local = TYPE_CONFIGS.map(t => ({
      ...t,
      items: generatedQuestions.filter(q => q.type === t.code)
    }));
    renderPreview(TYPE_CONFIGS_local.filter(t => t.items.length));
  } catch(e) { UI.toast('重選失敗：'+e.message, 'danger'); }
}
window.regenerateType = regenerateType;

window.openSaveModal = async () => {
  if (!generatedQuestions.length) { UI.toast('請先選題', 'warning'); return; }
  document.getElementById('saveModal').classList.remove('hidden');
};

window.doSaveExam = async () => {
  const title = document.getElementById('examTitle').value.trim();
  if (!title) {
    document.getElementById('saveErr').textContent = '請填寫試卷名稱';
    document.getElementById('saveErr').classList.remove('hidden');
    return;
  }
  document.getElementById('saveErr').classList.add('hidden');

  const sc = cSubject.value;
  const bc = document.getElementById('cBook').value;

  // 計算總分
  let totalScore = 0;
  const questionIds = [];
  const typeScores = {};
  TYPE_CONFIGS.forEach(t => {
    const scoreEl = document.getElementById('score-'+t.code);
    const score = scoreEl ? parseFloat(scoreEl.value)||t.defaultScore : t.defaultScore;
    typeScores[t.code] = score;
  });
  generatedQuestions.forEach(q => {
    questionIds.push(q.id);
    totalScore += (typeScores[q.type] || 2) * (q.type === 'T4' ? blankCount(q) : 1);
  });

  const exam = {
    title,
    header: draftPreviewData?.header ?? newExamHeader(),
    appearance: draftPreviewData?.appearance ?? loadAppearance(),
    description: document.getElementById('examDesc').value.trim(),
    subjectCode: sc,
    bookCode: bc,
    totalScore,
    typeScores,
    typeOrder: [...settingsTypeOrder],
    scoreUnits: { T4:'blank' },
    questionIds,
    questionCount: questionIds.length,
    composeMode: 'auto',
  };

  try {
    await DataService.saveExam(exam);
    UI.toast('試卷已儲存！', 'success');
    document.getElementById('saveModal').classList.add('hidden');
  } catch(e) {
    document.getElementById('saveErr').textContent = '儲存失敗：'+e.message;
    document.getElementById('saveErr').classList.remove('hidden');
  }
};

updateScoreRows();
setComposeStep(1);
loadScopeAvailability();
</script>
