<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電腦選題 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard-exam-editor.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<style>
.compose-layout{max-width:980px;margin:auto}.compose-step{display:none}.compose-step.active{display:block}
.compose-intro{margin-bottom:22px}.compose-intro h1{font-size:1.65rem;color:var(--primary);margin-bottom:4px}.compose-intro p{color:var(--text-secondary)}
.step-heading{display:flex;align-items:center;gap:10px;margin-bottom:18px}.step-heading svg{color:var(--primary-light)}.step-heading h2{font-size:1.18rem}.step-heading p{color:var(--text-secondary);font-size:.88rem}.step-actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.step-actions .btn{min-width:130px}.step-actions .btn:last-child{margin-left:auto}.scope-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.scope-grid .form-group{margin:0}.chapter-tree{max-height:380px!important}.result-card .card-body{min-height:280px}.save-fields{display:grid;gap:14px;max-width:620px}.save-fields .form-group{margin:0}
@media(max-width:700px){.scope-grid{grid-template-columns:1fr}.config-card .card-body{padding:18px}}

/* 設定面板 */
.config-card .card-body{padding:16px}
.section-title{font-size:.86rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.section-title:first-child{margin-top:0}
.type-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px;border-radius:var(--radius);background:var(--bg-base);border:1px solid var(--border-light)}
.type-row .form-control{width:72px;font-size:.88rem;padding:4px 6px;text-align:center}
.type-row .type-label{flex:1;font-size:.9rem;font-weight:500}
.type-row .type-pool{font-size:.84rem;color:var(--text-muted);white-space:nowrap}
.chapter-tree{max-height:220px}

/* 預覽區 */
.preview-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.preview-stats{display:flex;gap:8px;flex-wrap:wrap}
.preview-stat{display:inline-flex;align-items:center;gap:4px;background:var(--bg-base);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.86rem;color:var(--text-secondary)}
.preview-stat strong{color:var(--primary);font-size:.88rem}
.result-section{margin-bottom:16px}
.result-section-title{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-header);color:white;border-radius:var(--radius) var(--radius) 0 0;font-size:.9rem;font-weight:600}
.result-list{border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.result-q{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:.9rem;background:white}
.result-q:last-child{border-bottom:none}
.result-q:hover{background:#faf8f5}
.result-q .q-num{color:var(--text-muted);font-size:.85rem;width:26px;flex-shrink:0;padding-top:2px;text-align:right}
.result-q .q-body{flex:1;min-width:0}
.result-q .q-text{line-height:1.6;margin-bottom:3px}
.result-q .q-ans{font-size:.85rem;color:var(--success);font-weight:600}
.result-q .q-diff{flex-shrink:0}
.regenerate-btn{background:none;border:none;color:rgba(255,255,255,.7);font-size:.88rem;cursor:pointer;padding:2px 6px;border-radius:3px}
.regenerate-btn:hover{background:rgba(255,255,255,.15);color:white}
.empty-config{text-align:center;padding:60px 24px;color:var(--text-muted)}
.empty-config .ec-icon{font-size:3rem;opacity:.3;margin-bottom:12px}
.score-input{width:56px;font-size:.88rem;padding:3px 6px;text-align:center}
.exam-save-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;background:#e8eef6;border-radius:var(--radius-lg);border:1px solid var(--border);margin-top:16px}
.exam-save-bar .form-control{flex:1;min-width:200px}
.compose-layout{max-width:1120px}.compose-step .card-body{padding:24px}.setup-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(310px,.85fr);gap:22px}.setup-panel+.setup-panel{border-left:1px solid var(--border);padding-left:22px}.selection-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.selection-list{border:1px solid var(--border);border-radius:var(--radius);max-height:58vh;overflow:auto;background:white}.selection-list .edit-q-item{cursor:grab}.selection-list .edit-q-item.drag-over{border-top:2px solid var(--primary-light)}.selection-empty{padding:32px;text-align:center;color:var(--text-muted)}.selection-list .edit-q-section{position:sticky;top:0;z-index:1}.selection-list .eq-text{white-space:nowrap}
@media(max-width:800px){.setup-grid{grid-template-columns:1fr}.setup-panel+.setup-panel{border-left:0;border-top:1px solid var(--border);padding:20px 0 0}}
/* 與首頁總覽一致的彩色卡片層次 */
.compose-layout{max-width:none}.compose-intro{display:flex;align-items:center;gap:18px;margin-bottom:18px;padding:22px 26px;border-radius:16px;background:linear-gradient(115deg,#eaf2ff 0%,#f0f5ff 55%,#e8f7f2 100%);border:1px solid #dce8f8}.intro-mark{width:58px;height:58px;display:grid;place-items:center;flex:none;border-radius:16px;background:#3478f6;color:white;box-shadow:0 8px 20px #3478f633}.intro-mark svg{width:30px;height:30px}.intro-eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.16em;color:#3972c2}.compose-intro h1{margin:1px 0;font-size:1.55rem}.compose-intro p{font-size:.88rem}
#step-0>.card{background:transparent;border:0;box-shadow:none}#step-0>.card>.card-body{padding:0}.setup-grid{gap:16px}.setup-panel{min-width:0;padding:22px!important;border:1px solid var(--border)!important;border-radius:14px;box-shadow:var(--shadow-sm);background:#fff}.setup-panel:first-child{background:linear-gradient(160deg,#fff 50%,#f1f6ff 100%);border-top:4px solid #4b88ee!important}.setup-panel:last-child{background:linear-gradient(160deg,#fff 50%,#f0faf6 100%);border-top:4px solid #4aa685!important}.step-heading{margin-bottom:20px}.step-heading>span{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:12px;background:#e8f0ff;color:#3478f6}.setup-panel:last-child .step-heading>span{background:#e0f4eb;color:#2b9271}.step-heading svg{color:inherit}.step-heading h2{font-size:1.2rem}.chapter-tree{min-height:275px;max-height:390px!important;background:white;border-radius:10px}.type-row{background:#fff;border-color:#e1e9e8;padding:10px 12px}.type-row:has(input:focus){border-color:#6cb69a;box-shadow:0 0 0 2px #d9f4e8}.section-title{color:#526579}.setup-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.summary-tile{display:flex;flex-direction:column;gap:2px;padding:16px 19px;border-radius:12px;border:1px solid transparent}.summary-tile span{font-size:.85rem;font-weight:700}.summary-tile strong{font-size:1.7rem;line-height:1.2}.summary-tile small{font-size:.76rem;color:#708097}.summary-tile.blue{background:#eaf2ff;border-color:#dce9fc;color:#275eae}.summary-tile.mint{background:#e9f8f1;border-color:#d8f0e3;color:#267955}.summary-tile.amber{background:#fff4dc;border-color:#f5e7c5;color:#946518}#step-0 .step-actions{margin-top:14px}#step-0 .step-actions .btn{padding:11px 22px}
.result-card{overflow:hidden}.result-card .card-header{background:linear-gradient(110deg,#edf3ff,#eaf8f2);padding:18px 22px}.result-card .card-body{padding:20px 22px}.preview-stat{background:#fff;border-color:#d6e5ed}.selection-list{max-height:65vh}.selection-list .edit-q-section{background:#f0f5fc}.selection-list .edit-q-item:nth-child(odd){background:#fbfcff}.selection-list .edit-q-item:hover{background:#edf5ff}.selection-toolbar{padding:10px 14px;border-radius:10px;background:#f5f8fc}
.final-card{background:linear-gradient(145deg,#fff 55%,#f3f8ff)}.final-card .card-body{padding:26px!important}.final-summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.final-summary .preview-stat{padding:8px 14px;background:#eef5ff;border-color:#dce9fb}.save-fields{max-width:none;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr)}.exam-save-bar{margin-top:18px;background:#edf8f2;border-color:#d5ecdf;min-height:76px}.step-actions{padding:14px 2px 0}
@media(max-width:800px){.setup-grid{grid-template-columns:1fr}.save-fields{grid-template-columns:1fr}}@media(max-width:600px){.compose-intro{padding:17px;gap:12px}.intro-mark{width:46px;height:46px}.setup-summary{grid-template-columns:1fr 1fr}.summary-tile:last-child{grid-column:1/-1}.setup-panel{padding:17px!important}}
</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <div class="main" inert>
    <div class="topbar">
      <span class="topbar-title">電腦選題</span>
      <div class="topbar-breadcrumb"><span>首頁</span> › 電腦選題</div>
    </div>
    <div class="page-content">

      <div class="compose-layout">
        <div class="compose-intro"><div class="intro-mark" id="introIcon"></div><div><span class="intro-eyebrow">CREATE AN EXAM</span><h1>電腦選題</h1><p>設定出題條件，調整選出的題目，再預覽並儲存試卷。</p></div></div>
        <section class="compose-step active" id="step-0">
          <div class="card config-card"><div class="card-body">
          <div class="setup-grid"><div class="setup-panel">
            <div class="step-heading"><span id="scopeIcon"></span><div><h2>命題範圍</h2><p>選擇科目、冊別與章節範圍</p></div></div>
            <div class="scope-grid">
              <div class="form-group"><label class="form-label" for="cSubject">科目</label><select class="form-control" id="cSubject" onchange="onSubjectChange()"><option value="">請選擇科目</option></select></div>
              <div class="form-group"><label class="form-label" for="cBook">冊別</label><select class="form-control" id="cBook" disabled onchange="loadChapters()"><option value="">請先選科目</option></select></div>
            </div>
            <div class="section-title">章節範圍<button class="btn btn-ghost btn-sm" onclick="clearAllChapters()" style="margin-left:auto">全部清除</button></div>
            <div class="chapter-tree" id="chapterTree"><div style="padding:20px;text-align:center;color:var(--text-muted)">請先選擇科目與冊別</div></div>
          </div><div class="setup-panel">
            <div class="step-heading"><span id="typeIcon"></span><div><h2>題型配置</h2><p>設定各題型題數、難易度與配分</p></div></div>
            <div class="section-title">題型與題數</div><div id="typeRows"></div>
            <div class="section-title">難易度配置</div><div class="form-group"><label class="form-label" for="cDifficulty">整份試卷難易度</label><select class="form-control" id="cDifficulty"><option value="medium" selected>適中</option><option value="easy">偏易</option><option value="hard">偏難</option></select></div>
            <div class="section-title">計分設定</div><div id="scoreRows">設定題型後自動顯示</div>
          </div></div>
            <div class="setup-summary"><div class="summary-tile blue"><span>已選章節</span><strong id="summaryChapters">0</strong><small>請先勾選命題範圍</small></div><div class="summary-tile mint"><span>範圍內題目</span><strong id="summaryPool">0</strong><small>依選取章節統計</small></div><div class="summary-tile amber"><span>預計出題</span><strong id="summaryTarget">0</strong><small>依題型配置加總</small></div></div>
            <div class="step-actions"><button class="btn btn-primary" onclick="doGenerate()" id="generateBtn">電腦選題 →</button></div>
          </div></div>
        </section>
        <section class="compose-step" id="step-1">
          <div class="card result-card"><div class="card-header"><h2>電腦挑選的題目</h2><div id="previewStats" class="preview-stats"></div></div>
            <div class="card-body" id="previewArea"></div></div>
          <div class="step-actions"><button class="btn btn-ghost" onclick="showStep(0)">← 調整出題條件</button><button class="btn btn-primary" onclick="showStep(2)">預覽與儲存 →</button></div>
        </section>
        <section class="compose-step" id="step-2">
          <div class="card config-card final-card"><div class="card-body">
            <div class="step-heading"><span id="examIcon"></span><div><h2>試卷設定</h2><p>預覽試卷、命名並儲存</p></div></div>
            <div class="final-summary" id="finalSummary"></div>
            <div class="save-fields">
              <div class="form-group"><label class="form-label" for="examTitle">試卷名稱 <span class="required">*</span></label><input class="form-control" id="examTitle" placeholder="例：113學年度第一次月考"></div>
              <div class="form-group"><label class="form-label" for="examDesc">說明（選填）</label><textarea class="form-control" id="examDesc" rows="2" placeholder="可填寫考試類型、試題範圍等資訊。"></textarea></div>
            </div>
            <div class="exam-save-bar"><button class="btn btn-outline" onclick="openHeaderSettings()">試卷表頭</button><button class="btn btn-outline" onclick="previewExam()">預覽試卷</button></div>
            <div class="alert alert-danger hidden" id="saveErr" role="alert"></div>
            <div class="step-actions"><button class="btn btn-ghost" onclick="showStep(1)">← 返回題目清單</button><button class="btn btn-primary" onclick="doSaveExam()">儲存試卷</button></div>
          </div></div>
        </section>
      </div>

    </div>
  </div>
</div>


<script type="module">
import { guardPage } from './js/auth-guard.js';
import { showExamPreview, showHeaderSettings, newExamHeader, loadAppearance } from './js/exam-preview.js';
window._activeNav = 'compose';
const user = await guardPage(['admin','manager','teacher']);
if (!user) throw new Error('not auth');

// ── 初始化 ────────────────────────────────────────
const cSubject = document.getElementById('cSubject');
await initTextbookCache();
cSubject.innerHTML = tbSubjectOptions();

// 題型行
const TYPE_CONFIGS = [
  { code:'T1', label:'是非題', defaultScore:2 },
  { code:'T2', label:'選擇題', defaultScore:2 },
  { code:'T3', label:'複選題', defaultScore:4 },
  { code:'T4', label:'填空題', defaultScore:2 },
  { code:'T5', label:'配合題', defaultScore:4 },
  { code:'T6', label:'問答題', defaultScore:10 },
];
document.getElementById('typeRows').innerHTML = TYPE_CONFIGS.map(t => `
  <div class="type-row" id="typerow-${t.code}" style="display:none">
    <span class="type-label">${t.label}</span>
    <span class="type-pool" id="pool-${t.code}" style="color:var(--text-muted);font-size:.86rem;margin-right:4px"></span>
    <input class="form-control score-input" type="number" id="cnt-${t.code}" value="0" min="0" max="99" oninput="updateScoreRows()">
    <span style="font-size:.86rem;color:var(--text-muted)">題</span>
  </div>
`).join('');

let chapterData = {};
let generatedQuestions = [];
let draftPreviewData = null;
let currentStep = 0;
document.getElementById('scopeIcon').innerHTML = ICONS.book;
document.getElementById('typeIcon').innerHTML = ICONS.settings;
document.getElementById('examIcon').innerHTML = ICONS.test;
document.getElementById('introIcon').innerHTML = ICONS.navAuto20;
window.showStep = (step) => {
  if (step > 0 && !generatedQuestions.length) { UI.toast('請先完成選題', 'warning'); return; }
  if (step === 2) {
    const score = generatedQuestions.reduce((sum,q) => sum + (parseFloat(document.getElementById('score-'+q.type)?.value)||TYPE_CONFIGS.find(t=>t.code===q.type)?.defaultScore||2),0);
    document.getElementById('finalSummary').innerHTML = `<div class="preview-stat"><strong>${generatedQuestions.length}</strong> 題</div><div class="preview-stat">總分 <strong>${Math.round(score*10)/10}</strong> 分</div><div class="preview-stat">${UI.escapeHtml(cSubject.selectedOptions[0]?.textContent||'')}</div><div class="preview-stat">${UI.escapeHtml(document.getElementById('cBook').selectedOptions[0]?.textContent||'')}</div>`;
  }
  currentStep = step;
  document.querySelectorAll('.compose-step').forEach((el,i) => el.classList.toggle('active',i===step));
  document.querySelector('.page-content').scrollIntoView({block:'start'});
};
showStep(0);
window.openHeaderSettings = () => {
  draftPreviewData ??= { header:newExamHeader(), appearance:loadAppearance() };
  showHeaderSettings(draftPreviewData);
};

window.onSubjectChange = () => {
  const sc = cSubject.value;
  const bk = document.getElementById('cBook');
  if (sc) {
    bk.innerHTML = tbBookOptions(sc);
    bk.disabled = false;
  } else {
    bk.disabled = true;
    bk.innerHTML = '<option value="">請先選科目</option>';
  }
  document.getElementById('chapterTree').innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.88rem">請選擇冊次</div>';
  document.getElementById('summaryChapters').textContent = '0';
  updateTypePools([]);
};

window.loadChapters = async () => {
  const sc = cSubject.value, bc = document.getElementById('cBook').value;
  if (!sc || !bc) return;
  const tree = document.getElementById('chapterTree');
  tree.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:.88rem">載入中…</div>';

  let qs = [];
  try {
    qs = await DataService.getQuestions({ subjectCode: sc, bookCode: bc });
  } catch(e) {
    tree.innerHTML = `<div style="padding:12px;color:var(--danger);font-size:.88rem">載入失敗：${e.message}</div>`;
    return;
  }
  // 統計每章每節的題目數量
  const countMap = {};
  qs.forEach(q => {
    const ch = q.chapterNum; if (!ch) return;
    if (!countMap[ch]) countMap[ch] = { count: 0, sections: {} };
    countMap[ch].count++;
    if (q.sectionNum) {
      countMap[ch].sections[q.sectionNum] = (countMap[ch].sections[q.sectionNum]||0) + 1;
    }
  });
  chapterData = countMap;
  window._allBookQs = qs;
  document.getElementById('summaryChapters').textContent = '0';
  updateTypePools([]);  // 載入後先隱藏，等使用者勾選章節再顯示

  // 從課本管理讀取章節定義（名稱）
  const subj = _tbCache?.subjectByCode?.[sc];
  const bookObj = subj ? (_tbCache?.booksBySubject?.[subj.id]||[]).find(b=>b.code===bc) : null;
  let tbChapters = [];
  if (subj && bookObj) {
    tbChapters = await DataService.getChapterDefs(subj.id, bookObj.id);
  }
  const l1 = bookObj?.l1 || '章';
  const l2 = bookObj?.l2 || '節';

  // 合併課本定義與題目統計
  const allChNums = new Set([
    ...tbChapters.map(c => String(c.chapterNum)),
    ...Object.keys(countMap)
  ]);
  if (!allChNums.size) {
    tree.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.88rem">此科目/冊次無題目</div>';
    return;
  }

  // 建立章節名稱對照
  const chTitles = {};
  const secTitles = {};
  const subsecTitles = {};  // ch -> sec -> [{num, title}]
  const l3 = bookObj?.l3 || '';
  tbChapters.forEach(c => {
    chTitles[String(c.chapterNum)] = c.title || '';
    (c.sections||[]).forEach(s => {
      if (!secTitles[String(c.chapterNum)]) secTitles[String(c.chapterNum)] = {};
      secTitles[String(c.chapterNum)][String(s.sectionNum)] = s.title || '';
      if (l3 && (s.subsections||[]).length) {
        if (!subsecTitles[String(c.chapterNum)]) subsecTitles[String(c.chapterNum)] = {};
        subsecTitles[String(c.chapterNum)][String(s.sectionNum)] = s.subsections;
      }
    });
  });

  tree.innerHTML = [...allChNums].sort((a,b)=>parseInt(a)-parseInt(b)).map(ch => {
    const info = countMap[ch] || { count: 0, sections: {} };
    const allSecs = new Set([
      ...Object.keys((secTitles[ch]||{})),
      ...Object.keys(info.sections)
    ]);
    const hasChildren = l2 && allSecs.size > 0;
    const secHTML = l2 ? [...allSecs].sort((a,b)=>parseInt(a)-parseInt(b)).map(sec => {
      const cnt = info.sections[sec] || 0;
      const subs = subsecTitles[ch]?.[sec] || [];
      const hasSubChildren = l3 && subs.length > 0;
      const subsHTML = hasSubChildren ? subs.map(ss => `
        <div class="chapter-item subsection">
          <span style="width:16px;flex-shrink:0;display:inline-block"></span>
          <input type="checkbox" class="chap-cb" data-ch="${ch}" data-sec="${sec}" data-sub="${ss.num}">
          <span>${ss.title || (l3+ss.num)}</span>
          <span class="ch-count"></span>
        </div>`).join('') : '';
      return `<div class="chapter-item section">
        ${hasSubChildren ? `<button class="expand-btn" onclick="toggleChildren(this)">▶</button>` : '<span style="width:16px;flex-shrink:0"></span>'}
        <input type="checkbox" class="chap-cb sec-cb" data-ch="${ch}" data-sec="${sec}" onchange="onSecCbChange(this)">
        <span>${secTitles[ch]?.[sec] || (l2+parseInt(sec))}</span>
        <span class="ch-count">${cnt} 題</span>
      </div>${hasSubChildren ? `<div class="chapter-children">${subsHTML}</div>` : ''}`;
    }).join('') : '';
    return `<div class="chapter-item">
        ${hasChildren ? `<button class="expand-btn" onclick="toggleChildren(this)">▶</button>` : '<span style="width:16px;flex-shrink:0"></span>'}
        <input type="checkbox" class="chap-cb chapter-cb" data-ch="${ch}" onchange="onChapterCbChange(this)">
        <span>${chTitles[ch] || (l1+parseInt(ch))}</span>
        <span class="ch-count">${info.count} 題</span>
      </div>${hasChildren ? `<div class="chapter-children">${secHTML}</div>` : secHTML}`;
  }).join('');
};

window.toggleChildren = (btn) => {
  const parent = btn.closest('.chapter-item');
  const children = parent.nextElementSibling;
  if (!children || !children.classList.contains('chapter-children')) return;
  const open = children.classList.toggle('open');
  btn.textContent = open ? '▼' : '▶';
};

// 向上同步：子項全勾→上層勾；子項未全勾→上層取消
function syncParentCb(ch, sec) {
  // 同步第二層（sec-cb）：若該章所有 sec-cb 全勾則章勾，否則取消
  // 同步第三層→第二層：若該節所有 sub 全勾則節勾，否則取消
  if (sec !== undefined) {
    const subs = [...document.querySelectorAll(`.chap-cb[data-ch="${ch}"][data-sec="${sec}"][data-sub]`)];
    if (subs.length) {
      const secCb = document.querySelector(`.chap-cb.sec-cb[data-ch="${ch}"][data-sec="${sec}"]`);
      if (secCb) secCb.checked = subs.every(s => s.checked);
    }
  }
  // 同步章：若所有非 chapter-cb 的 chap-cb 全勾則章勾
  const allChildren = [...document.querySelectorAll(`.chap-cb[data-ch="${ch}"]:not(.chapter-cb)`)];
  if (allChildren.length) {
    const chapCb = document.querySelector(`.chap-cb.chapter-cb[data-ch="${ch}"]`);
    if (chapCb) chapCb.checked = allChildren.every(s => s.checked);
  }
}

window.onSecCbChange = (cb) => {
  const ch = cb.dataset.ch, sec = cb.dataset.sec, checked = cb.checked;
  // 下行：同步所有子節
  document.querySelectorAll(`.chap-cb[data-ch="${ch}"][data-sec="${sec}"][data-sub]`).forEach(s => s.checked = checked);
  // 上行：同步章
  syncParentCb(ch, undefined);
  updateTypePoolsFromSelection();
};

window.onChapterCbChange = (cb) => {
  const ch = cb.dataset.ch;
  const checked = cb.checked;
  document.querySelectorAll(`.chap-cb[data-ch="${ch}"]:not(.chapter-cb)`).forEach(s => s.checked = checked);
  updateTypePoolsFromSelection();
};

// 第三層直接點選 → 觸發向上同步
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.classList.contains('chap-cb')) return;
  if (t.classList.contains('chapter-cb') || t.classList.contains('sec-cb')) return;
  // 第三層：向上同步節和章
  syncParentCb(t.dataset.ch, t.dataset.sec);
  updateTypePoolsFromSelection();
});

window.clearAllChapters = () => {
  document.querySelectorAll('.chap-cb').forEach(c => c.checked = false);
  updateTypePoolsFromSelection();
};

function updateTypePools(qs) {
  TYPE_CONFIGS.forEach(t => {
    const c = qs.filter(q => q.type === t.code).length;
    const row = document.getElementById('typerow-'+t.code);
    if (row) row.style.display = c ? '' : 'none';
    const pool = document.getElementById('pool-'+t.code);
    if (pool) pool.textContent = c ? `共 ${c} 題` : '';
  });
  document.getElementById('summaryPool').textContent = qs.length;
}

function updateTypePoolsFromSelection() {
  const allQs = window._allBookQs || [];
  const checkedCbs = [...document.querySelectorAll('.chap-cb:checked')];
  document.getElementById('summaryChapters').textContent = checkedCbs.length;
  if (!allQs.length) { updateTypePools([]); return; }
  if (!checkedCbs.length) {
    // 未勾選任何章節 → 隱藏所有題型
    updateTypePools([]);
    return;
  }
  const chapters = checkedCbs.map(c =>
    c.dataset.sub  ? `${c.dataset.ch}-${c.dataset.sec}-${c.dataset.sub}` :
    c.dataset.sec  ? `${c.dataset.ch}-${c.dataset.sec}` :
    c.dataset.ch
  );
  const filtered = allQs.filter(q => chapters.some(c => {
    const p = c.split('-').map(Number);
    const eq = (a,b) => Number(a)===Number(b);
    if (p.length === 1) return eq(q.chapterNum, p[0]);
    if (p.length === 2) return eq(q.chapterNum, p[0]) && eq(q.sectionNum, p[1]);
    return eq(q.chapterNum, p[0]) && eq(q.sectionNum, p[1]) && eq(q.subsectionNum, p[2]);
  }));
  updateTypePools(filtered);
}

window.shuffleAll = () => {
  if (!generatedQuestions.length) return;
  // Shuffle within each type group
  const byType = {};
  generatedQuestions.forEach(q => { if (!byType[q.type]) byType[q.type] = []; byType[q.type].push(q); });
  Object.values(byType).forEach(arr => arr.sort(() => Math.random() - .5));
  // Re-flatten in original type order
  const TYPE_ORDER = ['T1','T2','T3','T4','T5','T6'];
  generatedQuestions = TYPE_ORDER.flatMap(t => byType[t]||[]);
  // Re-render
  const grouped = TYPE_CONFIGS.map(t => ({
    ...t,
    items: generatedQuestions.filter(q => q.type === t.code)
  })).filter(t => t.items.length);
  renderPreview(grouped);
  UI.toast('已在各題型內重新亂數排序', 'success');
};

window.previewExam = () => {
  if (!generatedQuestions.length) { UI.toast('請先選題', 'warning'); return; }
  const title = document.getElementById('examTitle').value.trim() || '（未命名試卷）';
  const typeScores = {};
  TYPE_CONFIGS.forEach(t => {
    const el = document.getElementById('score-'+t.code);
    if (el) typeScores[t.code] = parseFloat(el.value)||t.defaultScore;
  });
  draftPreviewData = {
    title,
    typeScores,
    subjectCode: cSubject.value,
    bookCode: document.getElementById('cBook').value,
    header: draftPreviewData?.header ?? newExamHeader(),
    appearance: draftPreviewData?.appearance ?? loadAppearance(),
  };
  showExamPreview(draftPreviewData, generatedQuestions);
};

window.updateScoreRows = () => {
  const typeCounts = TYPE_CONFIGS.map(t => ({
    ...t,
    cnt: parseInt(document.getElementById('cnt-'+t.code).value)||0
  })).filter(t => t.cnt > 0);
  document.getElementById('summaryTarget').textContent = typeCounts.reduce((sum,t)=>sum+t.cnt,0);

  if (!typeCounts.length) {
    document.getElementById('scoreRows').innerHTML =
      '<span style="color:var(--text-muted);font-size:.88rem">請設定各題型題數</span>';
    return;
  }

  // 依題型權重計算接近100分的配分
  // 權重：是非=1, 單選=1, 複選=2, 填空=1, 配合=2, 問答=5
  const weights = { T1:1, T2:1, T3:2, T4:1, T5:2, T6:5 };
  const weightSum = typeCounts.reduce((s,t) => s + t.cnt*(weights[t.code]||1), 0);

  // 計算每題原始分（保留兩位小數）
  const rawScores = {};
  typeCounts.forEach(t => {
    rawScores[t.code] = (weights[t.code]||1) * 100 / weightSum;
  });

  // 將每個分數精確到 0.5（無條件捨去），讓總分不超過100
  const floorScores = {};
  typeCounts.forEach(t => {
    floorScores[t.code] = Math.floor(rawScores[t.code] * 2) / 2;
  });

  // 計算捨去後的差距，用剩餘 0.5 補回最大差距的題型
  let total0 = typeCounts.reduce((s,t) => s + t.cnt * floorScores[t.code], 0);
  const gap = Math.round((100 - total0) * 2) / 2;  // 差幾個 0.5
  if (gap > 0) {
    // 依差距排序，依序補 0.5 給差距最大的題型（每題型最多補一次）
    const sorted = [...typeCounts].sort((a,b) =>
      (rawScores[b.code] - floorScores[b.code]) - (rawScores[a.code] - floorScores[a.code])
    );
    let remaining = gap;
    for (const t of sorted) {
      if (remaining <= 0) break;
      const add = Math.min(0.5, remaining / t.cnt);  // 每題最多加 0.5
      if (add >= 0.5) {
        floorScores[t.code] += 0.5;
        remaining -= t.cnt * 0.5;
      }
    }
  }

  const finalTotal = typeCounts.reduce((s,t) => s + t.cnt * floorScores[t.code], 0);
  const rows = typeCounts.map(t => {
    const score = floorScores[t.code];
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="flex:1">${t.label} × ${t.cnt} 題</span>
      <input class="form-control" type="number" id="score-${t.code}" value="${score}" min="0.5" max="99" step="0.5"
        style="width:58px;font-size:.88rem;padding:3px 6px;text-align:center" oninput="recalcTotal()">
      <span style="font-size:.86rem;color:var(--text-muted)">分/題</span>
    </div>`;
  });

  const displayTotal = Math.round(finalTotal * 10) / 10;
  document.getElementById('scoreRows').innerHTML =
    rows.join('') +
    `<div style="margin-top:8px;font-weight:700;color:var(--primary);font-size:.9rem;border-top:1px solid var(--border);padding-top:8px" id="scoreTotalRow">
      總計：<span id="scoreTotal">${displayTotal}</span> 分
      ${displayTotal > 100 ? '<span style="color:var(--danger);font-size:.88rem;margin-left:6px">⚠ 超過100分</span>' : ''}
    </div>`;
};

window.recalcTotal = () => {
  const total = TYPE_CONFIGS.reduce((s,t) => {
    const cnt = parseInt(document.getElementById('cnt-'+t.code)?.value)||0;
    const score = parseFloat(document.getElementById('score-'+t.code)?.value)||0;
    return s + cnt*score;
  }, 0);
  const el = document.getElementById('scoreTotal');
  if (el) el.textContent = Math.round(total*10)/10;
  const row = document.getElementById('scoreTotalRow');
  if (row) {
    const warn = row.querySelector('span[style*="danger"]');
    if (total > 100) {
      if (!warn) row.innerHTML += '<span style="color:var(--danger);font-size:.88rem;margin-left:6px">⚠ 超過100分</span>';
    } else {
      if (warn) warn.remove();
    }
  }
};

// ── 自動選題 ──────────────────────────────────────
window.doGenerate = async () => {
  const sc   = cSubject.value;
  const bc   = document.getElementById('cBook').value;
  const diff = document.getElementById('cDifficulty').value;

  if (!sc) { UI.toast('請選擇科目', 'warning'); return; }
  if (!bc) { UI.toast('請選擇冊次', 'warning'); return; }

  const typeCounts = TYPE_CONFIGS.map(t => ({...t, count: parseInt(document.getElementById('cnt-'+t.code).value)||0}));
  const total = typeCounts.reduce((s,t) => s+t.count, 0);
  if (!total) { UI.toast('請至少設定一種題型的題數', 'warning'); return; }

  // 取章節篩選（必須勾選至少一個）
  const checkedCbs = [...document.querySelectorAll('.chap-cb:checked')];
  if (!checkedCbs.length) { UI.toast('請勾選至少一個章節', 'warning'); return; }
  const chapters = checkedCbs.map(c => c.dataset.sub ? `${c.dataset.ch}-${c.dataset.sec}-${c.dataset.sub}` : c.dataset.sec ? `${c.dataset.ch}-${c.dataset.sec}` : c.dataset.ch);

  const btn = document.getElementById('generateBtn');
  btn.disabled = true; btn.textContent = '選題中…';

  try {
    const allPicked = [];
    for (const t of typeCounts) {
      if (!t.count) continue;
      const picked = await DataService.randomWithDifficulty({ subjectCode: sc, bookCode: bc, chapters: chapters.length ? chapters : undefined }, diff, t.count, t.code);
      allPicked.push({ ...t, items: picked });
    }

    generatedQuestions = allPicked.flatMap(t => t.items.map(q => ({...q, _typeLabel: t.label, _icon: t.icon})));
    renderPreview(allPicked);
    if (generatedQuestions.length) showStep(1);
    else UI.toast('此範圍沒有符合條件的題目，請調整配置', 'warning');
  } catch(e) {
    UI.toast('選題失敗：'+e.message, 'danger');
  } finally {
    btn.disabled = false; btn.textContent = '電腦選題 →';
  }
};

function renderPreview(grouped) {
  grouped = TYPE_CONFIGS.map(t => ({...t,items:generatedQuestions.filter(q=>q.type===t.code)})).filter(t=>t.items.length);
  const total = generatedQuestions.length;
  const totalScore = grouped.reduce((s,t) => {
    const scoreEl = document.getElementById('score-'+t.code);
    const score = scoreEl ? parseFloat(scoreEl.value)||t.defaultScore : t.defaultScore;
    return s + t.items.length * score;
  }, 0);

  // stats
  document.getElementById('previewStats').innerHTML = `
    <div class="preview-stat"><strong>${total}</strong> 題</div>
    <div class="preview-stat">共 <strong>${totalScore}</strong> 分</div>
    ${grouped.filter(t=>t.items.length).map(t=>`<div class="preview-stat"><strong>${t.items.length}</strong> ${t.label}</div>`).join('')}
  `;

  let html = `<div class="selection-toolbar"><span style="color:var(--text-secondary);font-size:.88rem">題目清單（可拖曳排序或移除）</span><button class="btn btn-outline btn-sm" onclick="shuffleAll()">${ICONS.refresh16} 重新排序</button></div><div class="selection-list">`;
  for (const [sectionIndex,t] of grouped.entries()) {
    html += `<div class="edit-q-section"><span>${['一','二','三','四','五','六'][sectionIndex]}、${t.label}（${t.items.length} 題）</span><button class="btn btn-ghost btn-sm" onclick="regenerateType('${t.code}')">${ICONS.refresh16} 重選此題型</button></div>`;
    html += t.items.map((q,index) => {
      const line = [q.text||'—',...(q.options||[]).map((option,i)=>`(${String.fromCharCode(65+i)}) ${option}`),q.tail||''].filter(Boolean).join('　');
      return `<div class="edit-q-item eq-item" draggable="true" data-id="${UI.escapeHtml(String(q.id))}" ondragstart="composeDragStart(event)" ondragover="composeDragOver(event)" ondrop="composeDrop(event)" ondragend="composeDragEnd()"><span class="drag-handle" aria-hidden="true">⠿</span><span class="eq-num">${index+1}.</span>${q.qnum?`<span class="eq-qnum">${UI.escapeHtml(String(q.qnum))}</span>`:''}<span class="eq-text" title="${UI.escapeHtml(line)}">${UI.escapeHtml(line)}</span>${UI.diffBadge(q.difficulty)}<button class="eq-remove" data-id="${UI.escapeHtml(String(q.id))}" onclick="removeComposeQuestion(this.dataset.id)" aria-label="移除題目">✕</button></div>`;
    }).join('');
  }
  html += generatedQuestions.length ? '</div>' : '<div class="selection-empty">尚無題目</div></div>';

  document.getElementById('previewArea').innerHTML = html;
}
let draggedQuestionId = null;
window.composeDragStart = event => { draggedQuestionId = event.currentTarget.dataset.id; event.dataTransfer.effectAllowed='move'; event.dataTransfer.setData('text/plain',draggedQuestionId); event.currentTarget.classList.add('dragging'); };
window.composeDragEnd = () => { draggedQuestionId=null; document.querySelectorAll('.selection-list .eq-item').forEach(el=>el.classList.remove('dragging','drag-over')); };
window.composeDragOver = event => {
  const targetId=event.currentTarget.dataset.id;
  if (!draggedQuestionId || draggedQuestionId===targetId || generatedQuestions.find(q=>String(q.id)===draggedQuestionId)?.type!==generatedQuestions.find(q=>String(q.id)===targetId)?.type) return;
  event.preventDefault(); event.currentTarget.classList.add('drag-over');
};
window.composeDrop = event => {
  event.preventDefault();
  const targetId=event.currentTarget.dataset.id;
  const from=generatedQuestions.findIndex(q=>String(q.id)===draggedQuestionId), to=generatedQuestions.findIndex(q=>String(q.id)===targetId);
  if(from<0||to<0||from===to||generatedQuestions[from].type!==generatedQuestions[to].type) return;
  generatedQuestions.splice(to,0,...generatedQuestions.splice(from,1));
  composeDragEnd(); renderPreview();
};
window.removeComposeQuestion = id => {
  generatedQuestions=generatedQuestions.filter(q=>String(q.id)!==id);
  renderPreview();
};

async function regenerateType(typeCode) {
  const sc   = cSubject.value;
  const bc   = document.getElementById('cBook').value;
  const diff = document.getElementById('cDifficulty').value;
  const cnt  = parseInt(document.getElementById('cnt-'+typeCode).value)||0;
  if (!cnt) return;

  const checkedCbs = [...document.querySelectorAll('.chap-cb:checked')];
  const chapters = checkedCbs.map(c => c.dataset.sub ? `${c.dataset.ch}-${c.dataset.sec}-${c.dataset.sub}` : c.dataset.sec ? `${c.dataset.ch}-${c.dataset.sec}` : c.dataset.ch);

  try {
    const newItems = await DataService.randomWithDifficulty({ subjectCode: sc, bookCode: bc, chapters: chapters.length ? chapters : undefined }, diff, cnt, typeCode);
    // 替換 generatedQuestions 中對應題型的題目
    generatedQuestions = generatedQuestions.filter(q => q.type !== typeCode);
    generatedQuestions.push(...newItems);
    UI.toast(`已重新選取 ${newItems.length} 題 ${QUESTION_TYPES[typeCode]}`, 'success');
    // 重組並渲染
    const TYPE_CONFIGS_local = TYPE_CONFIGS.map(t => ({
      ...t,
      items: generatedQuestions.filter(q => q.type === t.code)
    }));
    renderPreview(TYPE_CONFIGS_local.filter(t => t.items.length));
  } catch(e) { UI.toast('重選失敗：'+e.message, 'danger'); }
}
window.regenerateType = regenerateType;

window.doSaveExam = async () => {
  if (!generatedQuestions.length) { UI.toast('請先完成選題', 'warning'); showStep(1); return; }
  const title = document.getElementById('examTitle').value.trim();
  if (!title) {
    document.getElementById('saveErr').textContent = '請填寫試卷名稱';
    document.getElementById('saveErr').classList.remove('hidden');
    return;
  }
  document.getElementById('saveErr').classList.add('hidden');

  const sc = cSubject.value;
  const bc = document.getElementById('cBook').value;

  // 計算總分
  let totalScore = 0;
  const questionIds = [];
  const typeScores = {};
  TYPE_CONFIGS.forEach(t => {
    const scoreEl = document.getElementById('score-'+t.code);
    const score = scoreEl ? parseFloat(scoreEl.value)||t.defaultScore : t.defaultScore;
    typeScores[t.code] = score;
  });
  generatedQuestions.forEach(q => {
    questionIds.push(q.id);
    totalScore += typeScores[q.type] || 2;
  });

  const exam = {
    title,
    header: draftPreviewData?.header ?? newExamHeader(),
    appearance: draftPreviewData?.appearance ?? loadAppearance(),
    description: document.getElementById('examDesc').value.trim(),
    subjectCode: sc,
    bookCode: bc,
    totalScore,
    typeScores,
    questionIds,
    questionCount: questionIds.length,
    composeMode: 'auto',
  };

  try {
    await DataService.saveExam(exam);
    draftPreviewData = null;
    UI.toast('試卷已儲存！', 'success');
    document.getElementById('saveErr').classList.add('hidden');
  } catch(e) {
    document.getElementById('saveErr').textContent = '儲存失敗：'+e.message;
    document.getElementById('saveErr').classList.remove('hidden');
  }
};

updateScoreRows();
</script>
