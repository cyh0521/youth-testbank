<style>
.coded-layout{display:block}
.coded-panel[hidden]{display:none}
.coded-panel .card-header{min-height:60px;padding:10px 20px;gap:12px;flex-wrap:wrap}

.coded-panel .card-body{padding:18px 20px}
.selection-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.selection-layout .card{min-width:0}
.bank-list,.selected-list{max-height:650px;overflow-y:auto;padding:18px 20px;background:#fff}
.result-section-title{cursor:pointer}
.coded-panel .result-type-toggle{display:flex;width:100%;padding:9px 12px;box-sizing:border-box}
.coded-panel .result-section-title:has(.result-type-toggle){padding:0}
.result-list{border:0;border-radius:0}
.coded-panel .result-q{gap:6px}
.coded-panel .result-q .q-num{width:auto;min-width:18px;text-align:left}
.result-q.selected{background:#eaf1f8}
.result-q.selected:hover{background:#e2ebf4}
.drag-handle{cursor:grab;color:var(--text-muted);flex:none;line-height:1.65}
.drag-handle:active{cursor:grabbing}
#selList .result-q:has(.dragging){opacity:.4;background:#f0f4ff}
#selList .result-q.drag-over{box-shadow:inset 0 2px var(--primary-light)}
.si-remove{margin-left:auto}
.coded-filters{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.coded-filters .form-group{flex:0 1 110px;min-width:95px;margin:0!important}
.coded-filters .form-group:last-child{flex:1 1 120px;max-width:180px}
.coded-filters .form-control{font-size:.86rem;padding:5px 8px}
.score-cfg{padding:18px 20px;background:#fff}
#codedPanel3>.card{width:calc((100% - 16px)/2)}
#codedPanel3 .score-cfg{padding:0}
#codedPanel3 .total-score-bar{margin:14px 0 0;justify-content:flex-start}
@media(max-width:1100px){#codedPanel3>.card{width:100%}}
.total-score-bar{display:flex;align-items:center;justify-content:space-between;margin:0 20px 18px;padding:13px 14px;border-radius:9px;background:#e1f3e9;color:#176d49;font-weight:700}
.coded-panel .btn-auto-score{background:#e0edff;color:#2458a6;border-color:transparent}
.coded-panel .btn-auto-score:hover{background:#cbdfff;color:#174889}
.coded-panel .btn-auto-score:focus-visible{outline:2px solid #3478f6;outline-offset:2px}
@media(max-width:1100px){.selection-layout{grid-template-columns:1fr}}
@media(max-width:760px){.coded-panel .card-header,.coded-panel .card-body,.bank-list,.selected-list,.score-cfg{padding-left:14px;padding-right:14px}}
.coded-input-cards{display:grid;gap:16px;min-width:0}.coded-input-cards .form-group{margin-bottom:0}.coded-input-row{display:flex;gap:8px;align-items:center}.coded-input-row .form-control{flex:1;min-width:0}#lookupResult:empty{display:none}#lookupResult{margin-top:12px}#lookupResult .result-q{padding-left:0;padding-right:0;background:transparent}#lookupResult .result-q:hover{background:transparent}#codedPanel2 .selection-layout{grid-template-columns:minmax(280px,1fr) minmax(0,1.4fr)}@media(max-width:1100px){#codedPanel2 .selection-layout{grid-template-columns:1fr}}
.coded-single-input{align-items:stretch}.coded-single-input .form-control{font-size:.86rem;padding:5px 8px}.coded-single-input .btn{font-size:.86rem;padding:5px 10px;white-space:nowrap}#qnumHint:empty,#batchHint:empty{display:none}
</style>

<section class="import-progress" aria-label="編碼選題流程" style="--process-step-count:5;--process-initial-width:20%"><div class="steps" role="list"><div class="step active" id="codedStep1" role="listitem"><span class="step-num">1</span><span class="step-copy"><strong>出題範圍</strong></span></div><div class="step" id="codedStep2" role="listitem"><span class="step-num">2</span><span class="step-copy"><strong>編碼選題</strong></span></div><div class="step" id="codedStep3" role="listitem"><span class="step-num">3</span><span class="step-copy"><strong>題型與配分</strong></span></div><div class="step" id="codedStep4" role="listitem"><span class="step-num">4</span><span class="step-copy"><strong>試卷設定</strong></span></div><div class="step" id="codedStep5" role="listitem"><span class="step-num">5</span><span class="step-copy"><strong>預覽試卷</strong></span></div></div><div class="import-progress-track" id="codedProgressTrack" role="progressbar" aria-label="編碼選題進度" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"><div class="import-progress-fill" id="codedProgressFill"></div></div></section><div class="coded-layout"><section id="codedPanel1" class="coded-panel"><div id="examScope"></div></section><section id="codedPanel2" class="coded-panel" hidden><div class="selection-layout"><div class="coded-input-cards"><section class="card"><div class="card-header"><div class="scope-title"><h2>單題編碼選題</h2><span class="scope-available" id="bankCount">︱共 0 題</span></div></div>

</div><div class="wizard-actions"><button type="button" class="btn btn-ghost btn-sm" onclick="clearCodedSelection()">清除全部已選題目</button><button class="btn btn-outline btn-sm" id="shuffleBtn" onclick="shuffleSelected()" disabled>亂數排序</button></div></div></section><section id="codedPanel3" class="coded-panel" hidden><section class="card"><div class="card-header"><div class="scope-title"><h2>每題配分</h2><span class="type-title-note">︱自動配分或手動調整</span></div><div class="scope-header-actions"><button class="btn btn-previous btn-sm" onclick="goCodedStep(2)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button><button class="btn btn-primary btn-sm" onclick="goCodedStep(4)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：試卷設定</button></div></div><div class="type-card-body"><div class="score-cfg" id="scoreCfg"></div><div class="total-score-bar" id="totalScoreBar"><span id="totalScoreVal">總計：0 分</span></div><div class="score-tools"><label class="integer-score-option"><input type="checkbox" id="codedIntegerScores" checked onchange="toggleCodedIntegerScores()">以整數配分（未勾選時以 0.5 分為調整單位）</label><div class="score-tools-actions"><button type="button" class="btn btn-ghost btn-sm" onclick="clearCodedScores()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5a2 2 0 0 1 0 3L11 21H6l-4-4a2 2 0 0 1 0-3L13 3a2 2 0 0 1 3 0zM8 8l8 8M11 21h11"/></svg>清除配分</button><button class="btn btn-auto-score btn-sm" onclick="autoCodedScores()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8L4 10l5.8 1.9L12 18l1.9-5.8L20 10l-5.8-1.9zM5 18l-.7 1.4L3 20l1.3.6L5 22l.7-1.4L7 20l-1.3-.6zM19 16l-.7 1.4L17 18l1.3.6L19 20l.7-1.4L21 18l-1.3-.6z"/></svg>自動配分</button></div></div></div></section></section><section id="codedPanel4" class="coded-panel" hidden>
          <div class="scope-layout settings-layout">
            <section class="card"><div class="card-header"><div class="scope-title"><h2>試卷檢視</h2><span class="type-title-note">︱確認題型、題數與配分，可拖曳整列調整排序</span></div><div class="scope-header-actions"><button type="button" class="btn btn-previous btn-sm" onclick="goCodedStep(3)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button><button type="button" class="btn btn-primary btn-sm" onclick="goCodedStep(5)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：預覽試卷</button></div></div><div class="type-card-body"><div id="codedSummary"></div></div></section>
            <section class="card"><div class="card-header"><div class="scope-title"><h2>試卷表頭</h2><span class="type-title-note">︱設定文字與欄位位置</span></div></div><div class="type-card-body"><div class="settings-header-sample" id="codedHeaderSample" aria-label="試卷表頭預覽"></div><div id="codedHeaderFields"></div></div></section>
          </div>

        <section id="codedPanel5" class="coded-panel" hidden><div class="scope-layout"><section class="card" style="grid-column:1/-1"><div class="card-header"><div class="scope-title"><h2>預覽試卷</h2><span class="type-title-note">︱確認試卷呈現</span></div><div class="scope-header-actions"><button type="button" class="btn btn-previous btn-sm" onclick="goCodedStep(4)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button></div></div><div class="selection-preview-body compose-preview-layout"><div id="codedScopePreview"></div><div id="codedExamPreview"></div></div></section></div></section></div>

<script type="module">
import { renderScopePanel, mountScopeSelector } from './js/exam-scope.js?v=20261007-disabled-scope';
import { guardPage } from './js/auth-guard.js';
import { showExamPreview, showHeaderSettings, newExamHeader, loadAppearance, mountInlineHeaderEditor, buildHeaderHtml, fontStackById, togglePreviewPanel } from './js/exam-preview.js?v=20261011-difficulty-line-alignment';
import { allocateTypeScores, AUTO_SCORE_WEIGHTS } from './js/score-allocation.js?v=20261007-weighted-scores';
import { blankCount } from './js/blank-selection.js';
window._activeNav = 'coded';
const user = await guardPage(['admin','manager','teacher']);
if (!user) throw new Error('not auth');

// ── 初始化 ────────────────────────────────────────
await initTextbookCache();
document.getElementById('examScope').innerHTML = renderScopePanel({ nextAction:'goCodedStep(2)', nextLabel:'編碼選題' });
const cSubject = document.getElementById('cSubject');
cSubject.innerHTML = tbSubjectOptions();

// ── 狀態 ─────────────────────────────────────────
let allQs = [], filtered = [], pageSize = 30, curPage = 1;
let selectedIds = new Set();
let selectedOrder = [];
let settingsTypeOrder = ['T1','T2','T3','T4','T5','T6'];
let selQuestions = {};
let draftPreviewData = null;
window.openHeaderSettings = () => {
  draftPreviewData ??= { header:newExamHeader(), appearance:loadAppearance() };
  showHeaderSettings(draftPreviewData);
};

function getCodedScopeQuestions() { return scopeSelector.getQuestions(); }

window.applyFilters = () => {
  const df  = document.getElementById('fDiff').value;
  const kw  = document.getElementById('fKeyword').value.toLowerCase();
  const scopeQs = getCodedScopeQuestions();
  const typeFilter = document.getElementById('fType');
  const previousType = typeFilter.value;
  const availableTypes = new Set(scopeQs.map(q => q.type));
  typeFilter.innerHTML = '<option value="">全部題型</option>' + Object.entries(QUESTION_TYPES)
    .filter(([type]) => availableTypes.has(type))
    .map(([type,label]) => `<option value="${type}">${label}</option>`).join('');
  typeFilter.value = availableTypes.has(previousType) ? previousType : '';
  const tp = typeFilter.value;
  filtered = scopeQs.filter(q => {
    const qDiff = q.difficulty || '';
    const diffOk = !df || (df === '__normal__' ? qDiff === '' : qDiff === df);
    return (!tp || q.type === tp) && diffOk && (!kw || (q.text || '').toLowerCase().includes(kw));
  });
  curPage = 1;
  renderBank();
};

// ── 題目庫渲染 ────────────────────────────────────

function codedQuestionBody(q, action = '') {
  const choice = q.type === 'T2' || q.type === 'T3';
  return `<div class="q-meta"><span class="q-catalog-num">${UI.escapeHtml(q.qnum || '—')}</span>${UI.typeBadge(q.type)}${UI.diffBadge(q.difficulty)}<span class="q-source">頁數 ${UI.escapeHtml(q.source || '未註明')}</span>${action}</div>
    <div class="q-text">${q.type === 'T2' || q.type === 'T3' ? UI.choiceQuestionHtml(q, '—') : q.type === 'T5' ? UI.matchingQuestionHtml(q.text) : UI.questionHtml(q.text || '—')}</div>
    ${!choice && q.tail ? '<div class="q-tail">'+UI.questionHtml(q.tail)+'</div>' : ''}
    <div class="q-ans"><span class="answer-label">答案</span><span class="answer-text">${UI.questionHtml(q.answer || '—')}</span></div>`;
}

const collapsedCodedTypes = { bank:new Set(), selected:new Set() };
window.toggleCodedType = (side, code, button) => {
  const list = document.getElementById(`coded-${side}-${code}`);
  if (!list) return;
  const collapsed = !list.hidden;
  list.hidden = collapsed;
  button.setAttribute('aria-expanded',String(!collapsed));
  button.setAttribute('aria-label',`${collapsed ? '展開' : '收合'}${QUESTION_TYPES[code]}題目`);
  button.closest('.result-section').classList.toggle('is-collapsed',collapsed);
  if (collapsed) collapsedCodedTypes[side].add(code);
  else collapsedCodedTypes[side].delete(code);
};
function codedTypeToggle(side, code, label) {
  const collapsed = collapsedCodedTypes[side].has(code);
  return `<button type="button" class="result-type-toggle" onclick="toggleCodedType('${side}','${code}',this)" aria-expanded="${!collapsed}" aria-controls="coded-${side}-${code}" aria-label="${collapsed ? '展開' : '收合'}${QUESTION_TYPES[code]}題目"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span>${label}</span></button>`;
}

function renderBank() {
  document.getElementById('bankCount').textContent = `︱共 ${filtered.length} 題`;
  onQnumInput();
}
function findCodedQuestion(raw) {
  const code = raw.padStart(5, '0');
  return filtered.find(q => String(q.qnum || '').padStart(5, '0') === code);
}
window.onQnumInput = () => {
  const raw = document.getElementById('qnumInput').value.trim();
  const q = /^\d{1,5}$/.test(raw) ? findCodedQuestion(raw) : null;
  const duplicate = q && selectedIds.has(q.id);
  document.getElementById('addBtn').disabled = !q || duplicate;
  document.getElementById('qnumHint').textContent = !raw ? '' : !/^\d{1,5}$/.test(raw) ? '請輸入 1～5 位數字。' : !q ? '所選範圍內找不到此編碼，請確認編碼與出題範圍。' : duplicate ? '此題目已在清單中。' : '已找到題目，可加入試卷。';
  document.getElementById('lookupResult').innerHTML = q ? `<div class="result-q"><div class="q-body">${codedQuestionBody(q)}</div></div>` : '';
};
window.clearCodedInput = () => {
  document.getElementById('qnumInput').value = '';
  onQnumInput();
  document.getElementById('qnumInput').focus();
};
window.addByCode = () => {
  const raw = document.getElementById('qnumInput').value.trim();
  if (!/^\d{1,5}$/.test(raw)) return;
  const q = findCodedQuestion(raw);
  if (!q || selectedIds.has(q.id)) return;
  toggleQ(q.id, true);
  document.getElementById('qnumInput').value = '';
  onQnumInput();
  document.getElementById('qnumInput').focus();
};
window.addBatch = () => {
  const tokens = document.getElementById('batchInput').value.split(/[\s,，、]+/).filter(Boolean);
  let added=0, duplicate=0, missing=0, invalid=0;
  for (const token of tokens) {
    if (!/^\d{1,5}$/.test(token)) { invalid++; continue; }
    const q = findCodedQuestion(token);
    if (!q) { missing++; continue; }
    if (selectedIds.has(q.id)) { duplicate++; continue; }
    toggleQ(q.id,true,true); added++;
  }
  renderSelected(); renderBank();
  document.getElementById('batchHint').textContent = tokens.length ? `新增 ${added} 題；重複 ${duplicate} 題；範圍內未找到 ${missing} 題；格式無效 ${invalid} 筆。` : '請先輸入題目編碼。';
  if (added && !missing && !invalid) document.getElementById('batchInput').value='';
};
window.clearCodedSelection = () => {
  selectedIds.clear(); selectedOrder=[]; selQuestions={};
  renderSelected(); renderBank();
};
window.toggleQ = (id, add, silent=false) => {
  const q = allQs.find(x=>x.id===id); if (!q) return;
  if (add) { selectedIds.add(id); if (!selectedOrder.includes(id)) selectedOrder.push(id); selQuestions[id]=q; }
  else { selectedIds.delete(id); selectedOrder=selectedOrder.filter(x=>x!==id); delete selQuestions[id]; }
  if (!silent) {
    renderSelected();
    renderBank();
  }
};

// ── 已選面板 ─────────────────────────────────────
let defaultScoreSignature = '';
function selectedScoreUnits(question) { return question.type === 'T4' ? blankCount(question) : 1; }
const TYPE_SCORES = {T1:2,T2:2,T3:4,T4:2,T5:2,T6:10};
function renderSelected() {
  const count = selectedOrder.length;
  document.getElementById('selCountLabel').textContent = `︱已選 ${count} 題`;
  ['shuffleBtn'].forEach(id => document.getElementById(id).disabled = count===0);
  const list = document.getElementById('selList');
  if (!count) {
    list.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-muted);font-size:.9rem">輸入編碼後點擊「加入」將題目加入試卷</div>';
    document.getElementById('scoreCfg').style.display = 'none';
    document.getElementById('totalScoreBar').style.display = 'none';
    return;
  }
  // 依題型分組顯示（同題目庫樣式）
  const selGroups = {};
  const TYPE_ORDER_SEL = ['T1','T2','T3','T4','T5','T6'];
  TYPE_ORDER_SEL.forEach(t => { selGroups[t] = []; });
  selectedOrder.forEach((id,idx) => {
    const q = selQuestions[id];
    if (q) selGroups[q.type].push({q, id, idx});
  });
  let selHTML = '';
  for (const tCode of TYPE_ORDER_SEL) {
    const items = selGroups[tCode];
    if (!items.length) continue;
    const tLabel = QUESTION_TYPES[tCode] || tCode;
    selHTML += `<div class="result-section${collapsedCodedTypes.selected.has(tCode) ? ' is-collapsed' : ''}">
      <div class="result-section-title">${codedTypeToggle('selected', tCode, `${tLabel}（${items.length} 題${tCode === 'T4' ? `，共 ${items.reduce((sum,{q})=>sum+blankCount(q),0)} 格` : ''}）`)}</div>
      <div class="result-list" id="coded-selected-${tCode}"${collapsedCodedTypes.selected.has(tCode) ? ' hidden' : ''}>
        ${items.map(({q, id, idx}) => {
          return `<div class="result-q" data-id="${id}"
            ondragover="dragOver(event,'${id}')" ondrop="dropOn(event,'${id}')" ondragend="dragEnd()">
            <span class="drag-handle" style="padding-top:3px;cursor:grab" draggable="true" ondragstart="dragStart(event,'${id}')" title="拖曳排序">⠿</span>
            <span class="q-num">${idx+1}.</span>
            <div class="q-body">
              ${codedQuestionBody(q, `<button type="button" class="btn btn-ghost btn-sm replace-question si-remove" onclick="toggleQ('${id}',false)">移除</button>`)}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  list.innerHTML = selHTML;
  const typeGroups = {};
  const typeUnits = {};
  selectedOrder.forEach(id => { const q=selQuestions[id]; if(q){ typeGroups[q.type]=(typeGroups[q.type]||0)+1; typeUnits[q.type]=(typeUnits[q.type]||0)+selectedScoreUnits(q); } });
  document.getElementById('scoreCfg').style.display = 'block';
  document.getElementById('scoreCfg').innerHTML = TYPE_ORDER_SEL.filter(t => typeGroups[t] > 0).map(t => [t, typeGroups[t]]).map(([t,c]) =>
    `<div class="score-config-row"><span class="score-label">${QUESTION_TYPES[t]||t}<span class="type-title-note">（${c} 題${t === 'T4' ? `，共 ${typeUnits[t]} 格` : ''}）</span></span>
      <div class="number-stepper"><input class="form-control" type="number" id="sc-${t}" value="${TYPE_SCORES[t] ?? 2}" min="${document.getElementById('codedIntegerScores').checked ? 1 : 0.5}" max="100" step="${document.getElementById('codedIntegerScores').checked ? 1 : 0.5}" aria-label="${QUESTION_TYPES[t]}每${t === 'T4' ? '格' : '題'}配分" oninput="updateCodedScore('${t}',this)"><div class="number-stepper-buttons"><button type="button" tabindex="-1" aria-label="增加配分" onclick="adjustCodedScore('${t}',1)">▲</button><button type="button" tabindex="-1" aria-label="減少配分" onclick="adjustCodedScore('${t}',-1)">▼</button></div></div><span class="row-unit">分／${t === 'T4' ? '格' : '題'}</span>
    </div>`).join('');
  calcTotal();
  document.getElementById('totalScoreBar').style.display = 'flex';
}
function calcTotal() {
  let total=0;
  selectedOrder.forEach(id => { const q=selQuestions[id]; if(!q) return; const inp=document.getElementById('sc-'+q.type); total += (inp?Number(inp.value)||0:(TYPE_SCORES[q.type]||2)) * selectedScoreUnits(q); });
  document.getElementById('totalScoreVal').textContent = `總計：${total} 分`;
}
window.calcTotal = calcTotal;

// ── 拖曳 ─────────────────────────────────────────
let dragId=null;
window.dragStart=(e,id)=>{dragId=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';};
window.dragEnd=()=>{dragId=null;document.querySelectorAll('#selList .result-q').forEach(el=>el.classList.remove('dragging','drag-over'));};
window.dragOver=(e,id)=>{e.preventDefault();if(id!==dragId)document.querySelector(`#selList .result-q[data-id="${id}"]`)?.classList.add('drag-over');};
window.dropOn=(e,targetId)=>{e.preventDefault();if(!dragId||dragId===targetId)return;const from=selectedOrder.indexOf(dragId),to=selectedOrder.indexOf(targetId);if(from<0||to<0)return;selectedOrder.splice(from,1);selectedOrder.splice(to,0,dragId);renderSelected();};

// ── 排序/預覽/儲存 ───────────────────────────────
window.shuffleSelected = () => {
  if (!selectedOrder.length) return;
  const byType={};
  selectedOrder.forEach(id=>{const q=selQuestions[id];if(!q)return;if(!byType[q.type])byType[q.type]=[];byType[q.type].push(id);});
  Object.values(byType).forEach(arr=>arr.sort(()=>Math.random()-.5));
  selectedOrder = ['T1','T2','T3','T4','T5','T6'].flatMap(t=>byType[t]||[]);
  renderSelected(); UI.toast('已在各題型內重新亂數排序','success');
};
window.previewSelected = () => {
  if (!selectedOrder.length) { UI.toast('請先選題','warning'); return; }
  const typeScores={};
  Object.keys(TYPE_SCORES).forEach(t=>{const el=document.getElementById('sc-'+t);typeScores[t]=el?Number(el.value)||TYPE_SCORES[t]:TYPE_SCORES[t];});
  const qs = selectedOrder.map(id=>selQuestions[id]).filter(Boolean);
  const firstQ = qs[0];
  draftPreviewData = { typeOrder:[...settingsTypeOrder], title:'（預覽）', typeScores, scoreUnits:{T4:'blank'}, subjectCode:firstQ?.subjectCode||'', bookCode:firstQ?.bookCode||'',
    header:draftPreviewData?.header ?? newExamHeader(), appearance:draftPreviewData?.appearance ?? loadAppearance() };
  showExamPreview(draftPreviewData, qs, { scopeDisplay: 'grouped' });
};
window.openSaveModal = async () => {
  if (!selectedOrder.length) { UI.toast('請先選題','warning'); return; }
  document.getElementById('saveErr').classList.add('hidden');
  document.getElementById('saveModal').classList.remove('hidden');
};
window.doSaveExam = async () => {
  const title = document.getElementById('examTitle').value.trim();
  if (!title) { document.getElementById('saveErr').textContent='請填寫試卷名稱'; document.getElementById('saveErr').classList.remove('hidden'); return; }
  let totalScore=0; const typeScores={};
  selectedOrder.forEach(id=>{const q=selQuestions[id];if(!q)return;const inp=document.getElementById('sc-'+q.type);const score=inp?Number(inp.value)||2:2;typeScores[q.type]=score;totalScore+=score * selectedScoreUnits(q);});
  const firstQ = selQuestions[selectedOrder[0]];
  const exam = {
    title, typeOrder:[...settingsTypeOrder], header: draftPreviewData?.header ?? newExamHeader(), appearance: draftPreviewData?.appearance ?? loadAppearance(), description: document.getElementById('examDesc').value.trim(),
    subjectCode: firstQ?.subjectCode||'', bookCode: firstQ?.bookCode||'',
    totalScore, typeScores, scoreUnits:{T4:'blank'}, questionIds:[...selectedOrder],
    questionCount: selectedOrder.length, composeMode:'coded',
    scopeChapters: scopeSelector.getSelectedChapters(),
  };
  try {
    await DataService.saveExam(exam);
    draftPreviewData = null;
    UI.toast('試卷已儲存！','success');
    document.getElementById('saveModal').classList.add('hidden');
  } catch(e) { document.getElementById('saveErr').textContent='儲存失敗：'+e.message; document.getElementById('saveErr').classList.remove('hidden'); }
};

window.clearCodedScores = () => {
  document.querySelectorAll('#scoreCfg input').forEach(input=>{
    input.value='';
    TYPE_SCORES[input.id.slice(3)]=0;
  });
  calcTotal();
};
window.toggleCodedIntegerScores = () => {
  const step=document.getElementById('codedIntegerScores').checked ? 1 : 0.5;
  Object.keys(TYPE_SCORES).forEach(type=>{
    if(TYPE_SCORES[type]>0) TYPE_SCORES[type]=Math.max(step,Math.round(TYPE_SCORES[type]/step)*step);
  });
  renderSelected();
};
window.autoCodedScores = () => {
  const counts = {};
  selectedOrder.forEach(id => { const q=selQuestions[id]; counts[q.type]=(counts[q.type]||0)+selectedScoreUnits(q); });
  Object.assign(TYPE_SCORES, allocateTypeScores(Object.entries(counts).map(([code,cnt])=>({code,cnt})), AUTO_SCORE_WEIGHTS,100,document.getElementById('codedIntegerScores').checked ? 1 : 0.5));
  renderSelected();
};
window.adjustCodedScore = (type,direction) => {
  const input=document.getElementById('sc-'+type);
  const step=Number(input.step)||0.5;
  input.value=Math.min(100,Math.max(step,(Number(input.value)||0)+direction*step));
  updateCodedScore(type,input);
  input.focus();
};
window.updateCodedScore = (type, input) => {
  TYPE_SCORES[type] = Number(input.value);
  calcTotal();
};
function renderSettingsHeaderSample() {
  const sample = document.getElementById('codedHeaderSample');
  sample.style.fontFamily = fontStackById(draftPreviewData.appearance.font);
  sample.innerHTML = buildHeaderHtml(draftPreviewData.header);
}

function renderExamSummary() {
  const colors = { T1:'#4b84cf', T2:'#3ca6a1', T3:'#cb9d36', T4:'#9670bf', T5:'#da8260', T6:'#6d819e' };
  const rows = settingsTypeOrder.map(code => ({code,label:QUESTION_TYPES[code],defaultScore:TYPE_SCORES[code]})).map(type => {
    const questions = selectedOrder.map(id=>selQuestions[id]).filter(q=>q?.type === type.code);
    const units = type.code === 'T4' ? questions.reduce((sum,q)=>sum+blankCount(q),0) : questions.length;
    const score = Number(document.getElementById('sc-' + type.code)?.value) || type.defaultScore;
    return { ...type, count:questions.length, units, score, total:Math.round(units * score * 10) / 10 };
  }).filter(type => type.count > 0);
  const total = Math.round(rows.reduce((sum, type) => sum + type.total, 0) * 10) / 10;
  document.getElementById('codedSummary').innerHTML = `
    <div class="exam-score-chart" role="img" aria-label="各題型配分分布：${rows.map(type => `${type.label} ${type.total} 分`).join('、')}">${rows.map(type => `<span style="width:${total ? type.total / total * 100 : 0}%;background:${colors[type.code]}" title="${type.label}：${type.total} 分"></span>`).join('')}</div>
    <div class="exam-summary-table-wrap"><table class="exam-summary-table"><thead><tr><th scope="col">題型</th><th scope="col">題數</th><th scope="col">配分</th><th scope="col">小計</th></tr></thead><tbody>${rows.map(type => `<tr draggable="true" data-type="${type.code}"><td><span class="exam-type-drag" aria-hidden="true">⠿</span><span class="exam-type-dot" style="background:${colors[type.code]}"></span>${type.label}</td><td>${type.count} 題${type.code === 'T4' ? `<small>共 ${type.units} 格</small>` : ''}</td><td>${type.score} 分／${type.code === 'T4' ? '格' : '題'}</td><td>${type.total} 分</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">總分：${total} 分</td></tr></tfoot></table></div>`;
  const table = document.querySelector('#codedSummary tbody');
  let draggedType = null;
  table.addEventListener('dragstart', event => {
    const row = event.target.closest('[data-type]');
    if (!row) return;
    draggedType = row.dataset.type;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', draggedType);
    row.classList.add('is-dragging');
  });
  table.addEventListener('dragover', event => {
    const row = event.target.closest('[data-type]');
    if (!draggedType || !row || row.dataset.type === draggedType) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    table.querySelectorAll('.drag-target').forEach(item => item.classList.remove('drag-target'));
    row.classList.add('drag-target');
  });
  table.addEventListener('drop', event => {
    const row = event.target.closest('[data-type]');
    if (!draggedType || !row || row.dataset.type === draggedType) return;
    event.preventDefault();
    const next = settingsTypeOrder.filter(code => code !== draggedType);
    next.splice(next.indexOf(row.dataset.type), 0, draggedType);
    settingsTypeOrder = next;
    selectedOrder = settingsTypeOrder.flatMap(code => selectedOrder.filter(id => selQuestions[id]?.type === code));
    if (draftPreviewData) draftPreviewData.typeOrder = [...settingsTypeOrder];
    renderExamSummary();
  });
  table.addEventListener('dragend', () => {
    draggedType = null;
    table.querySelectorAll('.is-dragging,.drag-target').forEach(row => row.classList.remove('is-dragging','drag-target'));
  });
}

function renderExamSettings() {
  draftPreviewData ??= { header:newExamHeader(), appearance:loadAppearance() };
  renderExamSummary();
  renderSettingsHeaderSample();
  draftPreviewData.onHeaderSaved = renderSettingsHeaderSample;
  draftPreviewData.onPreviewClose = renderExamSettings;
  const fields = document.getElementById('codedHeaderFields');
  mountInlineHeaderEditor(fields, draftPreviewData, renderSettingsHeaderSample, () => {
    const status = fields.querySelector('[data-header-status]')?.textContent;
    renderExamSettings();
    const nextStatus = fields.querySelector('[data-header-status]');
    if (nextStatus) nextStatus.textContent = status === '尚未儲存' ? '已取消變更' : status || '';
  });
  fields.querySelector('.ep-inline-header-actions')?.remove();
}


function renderCodedExamPreview() {
  previewSelected();
  const modal = document.getElementById('epModal');
  document.getElementById('codedExamPreview').append(modal);
  modal.classList.add('compose-inline-preview');
  modal.removeAttribute('aria-modal');
  const scopePanel = modal.querySelector('#epScopePanel');
  const options = document.querySelector('.ep-preview-options');
  modal.querySelector('.ep-preview-controls').append(options);
  if (scopePanel) {
    document.getElementById('codedScopePreview').replaceChildren(scopePanel);
    modal.querySelector('.ep-scope-layout').classList.add('ep-scope-detached');
  }
  const actions = document.querySelector('#codedPanel5 .scope-header-actions');
  let tools = actions.querySelector('.compose-preview-tools');
  if (!tools) {
    tools = document.createElement('div');
    tools.className = 'compose-preview-tools';
    tools.setAttribute('role', 'group');
    tools.setAttribute('aria-label', '試卷預覽工具');
    actions.append(tools);
  }
  modal.querySelectorAll('.modal-header button').forEach(button => {
    if (!button.classList.contains('modal-close') && button.id !== 'epFullscreenToggle') tools.append(button);
  });
  const infoToggle = tools.querySelector('[data-display-info-toggle]') || document.createElement('button');
  infoToggle.type = 'button';
  infoToggle.className = 'btn btn-ghost btn-sm ep-panel-toggle';
  infoToggle.setAttribute('data-display-info-toggle', '');
  infoToggle.setAttribute('aria-controls', 'epPreviewOptions');
  infoToggle.setAttribute('aria-expanded', 'false');
  infoToggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>顯示資訊';
  tools.insertBefore(infoToggle, tools.querySelector('#epHeaderToggle'));
  const previewOptions = document.querySelector('.ep-preview-options');
  previewOptions.id = 'epPreviewOptions';
  previewOptions.hidden = true;
  infoToggle.onclick = () => togglePreviewPanel('epPreviewOptions');
  const download = tools.querySelector('button[onclick="window._epDoExport()"]');
  if (download) {
    download.classList.remove('btn-ghost');
    download.classList.add('btn-primary');
  }
  if (!tools.querySelector('[data-compose-save]')) {
    const save = document.createElement('button');
    save.type = 'button';
    save.className = 'btn btn-primary btn-sm';
    save.setAttribute('data-compose-save', '');
    save.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>儲存';
    save.onclick = () => openSaveModal();
    tools.append(save);
  }
  window._epClose = () => goCodedStep(4);
}

window.goCodedStep = n => {
  if (n > 1 && !document.querySelector('.chap-cb:checked')) { UI.toast('請勾選至少一個章節','warning'); return; }
  if (n > 1 && !getCodedScopeQuestions().length) { UI.toast('所選命題範圍尚無題目，請重新選擇章節。','warning'); return; }
  if (n > 2 && !selectedOrder.length) { UI.toast('請先編碼選題','warning'); return; }
  if (n > 3 && [...document.querySelectorAll('#scoreCfg input')].some(input => !input.checkValidity() || !Number.isFinite(Number(input.value)))) { UI.toast('請輸入有效配分（0.5 至 100 分）','warning'); return; }
  for (let i=1;i<=5;i++) {
    document.getElementById('codedPanel'+i).hidden = i !== n;
    const step = document.getElementById('codedStep'+i);
    step.classList.toggle('active',i===n); step.classList.toggle('done',i<n);
    if(i===n) step.setAttribute('aria-current','step'); else step.removeAttribute('aria-current');
  }
  document.getElementById('codedProgressFill').style.width = `${n*20}%`;
  document.getElementById('codedProgressTrack').setAttribute('aria-valuenow',String(n));
  document.getElementById('codedProgressTrack').setAttribute('aria-valuetext',`第 ${n} 步，共 5 步`);
  if (n===2) {
    const typeFilter=document.getElementById('fType');
    const diffFilter=document.getElementById('fDiff');
    const keyword=document.getElementById('fKeyword');
    const previous=[typeFilter.value,diffFilter.value,keyword.value];
    typeFilter.value=diffFilter.value=keyword.value='';
    applyFilters();
    const allowed=new Set(filtered.map(q=>q.id));
    selectedOrder.filter(id=>!allowed.has(id)).forEach(id=>{ selectedIds.delete(id); delete selQuestions[id]; });
    selectedOrder=selectedOrder.filter(id=>allowed.has(id));
    [typeFilter.value,diffFilter.value,keyword.value]=previous;
    applyFilters(); renderSelected();
  }
  if (n===3) {
    const counts = {};
    selectedOrder.forEach(id => { const q = selQuestions[id]; if (q) counts[q.type] = (counts[q.type] || 0) + selectedScoreUnits(q); });
    const signature = JSON.stringify([Object.entries(counts).sort(([a],[b]) => a.localeCompare(b)), document.getElementById('codedIntegerScores').checked]);
    if (signature !== defaultScoreSignature) {
      autoCodedScores();
      defaultScoreSignature = signature;
    } else renderSelected();
  }
  if (n===4) renderExamSettings();
  if (n===5) renderCodedExamPreview();
  document.querySelector('.page-content').scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('codedStep1').setAttribute('aria-current','step');
const scopeSelector = mountScopeSelector({ cache:_tbCache, dataService:DataService, onChange(questions, selected, reason) {
  allQs = questions;
  const allowed = new Set(selected.map(q => q.id));
  selectedOrder = selectedOrder.filter(id => {
    if (allowed.has(id)) return true;
    selectedIds.delete(id); delete selQuestions[id]; return false;
  });
  if (reason === 'book') draftPreviewData = null;
  applyFilters(); renderSelected();
} });
</script>
</body>
</html>
