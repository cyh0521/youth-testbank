<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>線上考試 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<style>
/* 考試列表 */
.exam-item{border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:16px 18px;background:white;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:box-shadow .15s}
.exam-item:hover{box-shadow:var(--shadow-md)}
.exam-item .ei-icon{font-size:2rem;flex-shrink:0}
.exam-item .ei-info{flex:1;min-width:0}
.exam-item .ei-title{font-weight:700;font-size:.95rem;color:var(--primary);margin-bottom:4px}
.exam-item .ei-meta{font-size:.78rem;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap}
/* 考試介面 */
.exam-ui{display:none}
.exam-topbar{background:var(--primary-dark);color:white;padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.exam-title-bar{flex:1;font-family:var(--font-serif);font-weight:600;font-size:1rem}
.timer{font-family:var(--font-mono);font-size:1.1rem;font-weight:700;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px;min-width:80px;text-align:center}
.timer.warning{color:#ffa726;animation:pulse 1s infinite}
.timer.danger{color:#ff5252;animation:pulse .5s infinite}
.q-block{border:1px solid var(--border-light);border-radius:var(--radius);padding:16px;margin-bottom:10px;background:white}
.q-block.answered{border-left:3px solid var(--success)}
.q-block .q-num-label{font-size:.8rem;color:var(--text-muted);margin-bottom:4px}
.q-block .q-text{font-size:.9rem;line-height:1.7;margin-bottom:10px}
.options-grid{display:grid;gap:6px}
.option-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:white;cursor:pointer;text-align:left;font-size:.88rem;font-family:var(--font-sans);transition:all .12s;width:100%}
.option-btn:hover{border-color:var(--primary-light);background:#f0f4ff}
.option-btn.selected{border-color:var(--primary);background:#e8eef6;font-weight:500}
.option-key{width:24px;height:24px;border-radius:50%;background:var(--bg-base);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.option-btn.selected .option-key{background:var(--primary);color:white}
.tf-options{display:flex;gap:10px}
.tf-btn{flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:white;cursor:pointer;font-size:.9rem;font-family:var(--font-sans);font-weight:500;transition:all .12s;text-align:center}
.tf-btn:hover{border-color:var(--primary-light);background:#f0f4ff}
.tf-btn.selected{border-color:var(--primary);background:#e8eef6}
.fill-input{width:100%;border:none;border-bottom:2px solid var(--border);padding:4px 0;font-size:.9rem;background:transparent;font-family:var(--font-sans);outline:none;transition:border-color .15s}
.fill-input:focus{border-bottom-color:var(--primary-light)}
.text-answer{width:100%;min-height:80px;border:1px solid var(--border);border-radius:var(--radius);padding:8px;font-size:.88rem;font-family:var(--font-sans);resize:vertical;outline:none;transition:border-color .15s}
.text-answer:focus{border-color:var(--primary-light)}
.progress-nav{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.pnav-btn{width:34px;height:34px;border-radius:var(--radius);border:1px solid var(--border);background:white;font-size:.8rem;cursor:pointer;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;transition:all .12s}
.pnav-btn.done{background:#eafaf1;border-color:#1e8449;color:#1e8449;font-weight:700}
.pnav-btn.current{background:var(--primary);color:white;border-color:var(--primary)}
.submit-section{text-align:center;padding:24px;background:white;border-top:1px solid var(--border-light);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
/* 結果 */
.result-summary{text-align:center;padding:32px;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:white;border-radius:var(--radius-lg);margin-bottom:20px}
.result-score{font-size:3.5rem;font-weight:900;font-family:var(--font-serif);line-height:1}
.result-max{font-size:1rem;opacity:.7}
.result-pass{font-size:1rem;margin-top:8px;font-weight:600}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.result-stat{background:rgba(255,255,255,.1);border-radius:var(--radius);padding:12px}
.result-stat .rs-num{font-size:1.5rem;font-weight:700;font-family:var(--font-serif)}
.result-stat .rs-label{font-size:.76rem;opacity:.7;margin-top:2px}
</style>
<style>
/* 側邊欄預載入樣式，防止 JS 初始化前的空白閃爍 */
#sidebar{background:var(--bg-sidebar,#1a3a5c);min-height:100vh;width:var(--sidebar-width,240px)}
.main{opacity:0;transition:opacity .15s ease}
.main.ready{opacity:1}
</style>
<script>
// 頁面載入完成後立即顯示內容，避免等待 JS module 初始化
document.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var m=document.querySelector('.main');
    if(m)m.classList.add('ready');
  },50);
});
</script>
</head>
<body>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="mainTopbar">
      <span class="topbar-title">線上考試</span>
    </div>
    <div class="page-content" id="listView">
      <div id="examListEl">
        <div style="text-align:center;padding:60px;color:var(--text-muted)">載入中…</div>
      </div>
    </div>

    <!-- 考試介面 -->
    <div id="examView" class="exam-ui" style="padding:0">
      <!-- 動態填入 -->
    </div>

    <!-- 結果 -->
    <div id="resultView" style="display:none;padding:24px">
      <!-- 動態填入 -->
    </div>
  </div>
</div>

<script type="module">
import { guardPage } from './js/auth-guard.js';
window._activeNav = 'take';
const user = await guardPage(['student','teacher','admin']);
if (!user) throw new Error('not auth');

let examData = null;
let questions = [];
let answers = {};
let timer = null;
let remainingSeconds = 0;

// ── 載入可用試卷（依班級過濾）──────────────────────
async function loadAvailableExams() {
  const el = document.getElementById('examListEl');
  try {
    // 取得學生所屬班級
    const myClasses = await DataService.getMyClasses();
    const myClassIds = myClasses.map(c => c.id);

    // 取得全部 active 試卷
    const all = await DataService.getExams();
    const active = all.filter(e => (e.status||'draft') === 'active');

    // 只顯示：classIds 包含我的班級 的試卷
    // 留空（classIds 為空陣列或不存在）= 不開放給任何班級
    const visible = active.filter(e => {
      const ids = e.classIds || [];
      if (!ids.length) return false;                     // 未指定班級 → 不開放
      return ids.some(id => myClassIds.includes(id));   // 有交集才顯示
    });

    if (!myClasses.length) {
      el.innerHTML = `<div style="text-align:center;padding:60px 24px;color:var(--text-muted)">
        <div style="font-size:3rem;opacity:.3;margin-bottom:14px">🏫</div>
        <p style="font-size:.92rem;margin-bottom:8px">您尚未加入任何班級</p>
        <p style="font-size:.82rem">請至「我的班級」頁面輸入老師提供的教室代碼加入班級，才能參加考試。</p>
        <div style="margin-top:16px">
          <button class="btn btn-primary btn-sm" onclick="nav('classes')">🏫 前往加入班級</button>
        </div>
      </div>`;
      return;
    }

    if (!visible.length) {
      // 有班級但沒有開放的考試
      const classNames = myClasses.map(c => c.name).join('、');
      el.innerHTML = `<div style="text-align:center;padding:60px 24px;color:var(--text-muted)">
        <div style="font-size:3rem;opacity:.3;margin-bottom:14px">📋</div>
        <p style="font-size:.92rem;margin-bottom:6px">目前沒有開放中的考試</p>
        <p style="font-size:.8rem">您的班級：${classNames}</p>
        <p style="font-size:.8rem;margin-top:4px">請等待老師開放考試</p>
      </div>`;
      return;
    }

    // 按班級分組顯示
    const byClass = {};
    myClasses.forEach(c => { byClass[c.id] = { name: c.name, exams: [] }; });
    visible.forEach(e => {
      (e.classIds||[]).forEach(cid => {
        if (byClass[cid]) byClass[cid].exams.push(e);
      });
    });

    let html = `<div style="margin-bottom:12px;font-size:.85rem;color:var(--text-secondary)">
      共 <strong>${visible.length}</strong> 份考試開放中
    </div>`;

    Object.values(byClass).filter(g => g.exams.length).forEach(group => {
      html += `<div style="font-size:.82rem;font-weight:700;color:var(--primary);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)">
        🏫 ${group.name}
      </div>`;
      html += group.exams.map(e => `
        <div class="exam-item">
          <div class="ei-icon">📝</div>
          <div class="ei-info">
            <div class="ei-title">${e.title||'（未命名）'}</div>
            <div class="ei-meta">
              <span>📊 ${e.questionCount||0} 題</span>
              <span>💯 ${e.totalScore||0} 分</span>
              <span>⏱ ${e.duration||50} 分鐘</span>
              <span>及格 ${e.passScore||60} 分</span>
              ${e.description?`<span>📌 ${e.description}</span>`:''}
            </div>
          </div>
          <button class="btn btn-primary" onclick="startExam('${e.id}')">開始考試</button>
        </div>`).join('');
    });

    el.innerHTML = html;

  } catch(e) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--danger)">載入失敗：${e.message}</div>`;
  }
}

window.startExam = async (examId) => {
  if (!confirm('確定要開始考試嗎？計時將立即開始。')) return;
  try {
    const all = await DataService.getExams();
    examData = all.find(e => e.id===examId);
    if (!examData) { UI.toast('試卷不存在', 'danger'); return; }

    // 載入題目
    questions = await DataService.getQuestionsByIds(examData.questionIds || []);
    // 保持試卷原始排序
    const idOrder = examData.questionIds || [];
    questions.sort((a, b) => idOrder.indexOf(a.id) - idOrder.indexOf(b.id));

    if (!questions.length) { UI.toast('此試卷無題目', 'danger'); return; }

    answers = {};
    document.getElementById('listView').style.display = 'none';
    document.getElementById('mainTopbar').style.display = 'none';
    document.getElementById('examView').style.display = 'block';
    renderExamUI();
    startTimer(examData.duration * 60);
  } catch(e) { UI.toast('載入失敗：'+e.message, 'danger'); }
};

function renderExamUI() {
  const qHTML = questions.map((q, idx) => {
    let inputHTML = '';
    if (q.type === 'T1') {
      // 是非題
      inputHTML = `<div class="tf-options">
        <button class="tf-btn" id="tf-${q.id}-o" onclick="setAnswer('${q.id}','○')">○ 對</button>
        <button class="tf-btn" id="tf-${q.id}-x" onclick="setAnswer('${q.id}','Ｘ')">✕ 錯</button>
      </div>`;
    } else if (q.type === 'T2') {
      // 單選題
      const opts = q.options || [];
      inputHTML = `<div class="options-grid">${opts.map((o,i) => {
        const key = 'ＡＢＣＤＥ'[i];
        return `<button class="option-btn" id="opt-${q.id}-${i}" onclick="setAnswer('${q.id}','${key}')">
          <span class="option-key">${key}</span>${o}
        </button>`;
      }).join('')}${q.tail?`<div style="font-size:.84rem;color:var(--text-secondary);padding:4px 0;font-style:italic">${q.tail}</div>`:''}</div>`;
    } else if (q.type === 'T3') {
      // 複選題
      inputHTML = `<div style="font-size:.8rem;color:var(--primary-light);margin-bottom:6px">☑ 複選題，請選擇所有正確答案</div>
        <div class="options-grid" id="multi-${q.id}"></div>`;
    } else if (q.type === 'T4') {
      const count = q.answerCount || 1;
      inputHTML = `<div style="display:flex;flex-direction:column;gap:10px">${Array.from({length:count},(_,i)=>
        `<div style="display:flex;align-items:center;gap:8px">
          ${count>1?`<span style="font-size:.8rem;color:var(--text-muted);flex-shrink:0">空格 ${i+1}：</span>`:''}
          <input class="fill-input" type="text" id="fill-${q.id}-${i}" placeholder="請填寫答案" oninput="collectFill('${q.id}')">
        </div>`
      ).join('')}</div>`;
    } else {
      // 問答 / 配合題
      inputHTML = `<textarea class="text-answer" id="text-${q.id}" rows="${q.type==='T6'?4:3}" placeholder="請輸入答案…" oninput="setAnswer('${q.id}',this.value)"></textarea>`;
    }

    return `<div class="q-block" id="qblock-${q.id}">
      <div class="q-num-label">${QUESTION_TYPES[q.type]||q.type} — 第 ${idx+1} 題</div>
      <div class="q-text">${q.text||'—'}</div>
      ${inputHTML}
    </div>`;
  }).join('');

  // Progress nav
  const navHTML = questions.map((q, i) =>
    `<button class="pnav-btn" id="pnav-${q.id}" onclick="scrollToQ('${q.id}')" title="第${i+1}題">${i+1}</button>`
  ).join('');

  document.getElementById('examView').innerHTML = `
    <div class="exam-topbar">
      <div class="exam-title-bar">${examData.title}</div>
      <div style="font-size:.82rem;opacity:.7">${questions.length} 題 / ${examData.totalScore||'?'} 分</div>
      <div class="timer" id="timerDisplay">--:--</div>
    </div>
    <div style="padding:16px 20px;background:#f8f6f2;border-bottom:1px solid var(--border)">
      <div style="font-size:.78rem;color:var(--text-secondary);margin-bottom:6px">答題進度</div>
      <div class="progress-nav">${navHTML}</div>
    </div>
    <div style="padding:20px" id="questionArea">${qHTML}</div>
    <div class="submit-section">
      <div style="margin-bottom:12px">
        <span id="answerProgress" style="font-size:.88rem;color:var(--text-secondary)"></span>
      </div>
      <button class="btn btn-primary btn-lg" onclick="submitExam()">✅ 交卷</button>
      <div style="font-size:.78rem;color:var(--text-muted);margin-top:8px">交卷後無法修改</div>
    </div>
  `;

  updateProgress();
  initMultiChoice();
}

function initMultiChoice() {
  questions.filter(q => q.type === 'T3').forEach(q => {
    const opts = extractT3Options(q.text);
    const container = document.getElementById('multi-'+q.id);
    if (!container) return;
    container.innerHTML = opts.map((o, i) => {
      const key = 'ＡＢＣＤＥ'[i];
      return `<button class="option-btn" id="mopt-${q.id}-${i}" onclick="toggleMulti('${q.id}',${i})">
        <span class="option-key">${key}</span>${o}
      </button>`;
    }).join('');
  });
}

function extractT3Options(text) {
  // 嘗試從複選題 text 中提取選項（格式：（A）選項 （B）選項…）
  const matches = [...(text||'').matchAll(/[（(][ＡＢＣＤE][）)]\s*([^（(）)]+)/g)];
  if (matches.length) return matches.map(m => m[1].trim());
  return [];
}

window.toggleMulti = (qid, idx) => {
  const key = 'ＡＢＣＤＥ'[idx];
  const current = answers[qid] || '';
  const chars = [...current];
  const pos = chars.indexOf(key);
  if (pos>=0) chars.splice(pos,1); else chars.push(key);
  chars.sort();
  answers[qid] = chars.join('');
  // Update UI
  const opts = document.querySelectorAll(`[id^="mopt-${qid}-"]`);
  opts.forEach((btn, i) => {
    btn.classList.toggle('selected', chars.includes('ＡＢＣＤＥ'[i]));
    const keyEl = btn.querySelector('.option-key');
    if (keyEl) { keyEl.style.background = chars.includes('ＡＢＣＤＥ'[i]) ? 'var(--primary)' : ''; keyEl.style.color = chars.includes('ＡＢＣＤＥ'[i]) ? 'white' : ''; }
  });
  document.getElementById('qblock-'+qid)?.classList.toggle('answered', !!answers[qid]);
  updateProgress();
};

window.setAnswer = (qid, val) => {
  answers[qid] = val;
  const q = questions.find(x => x.id===qid);
  if (q?.type === 'T1') {
    ['o','x'].forEach(k => document.getElementById(`tf-${qid}-${k}`)?.classList.remove('selected'));
    document.getElementById(`tf-${qid}-${val==='○'?'o':'x'}`)?.classList.add('selected');
  } else if (q?.type === 'T2') {
    const idx = 'ＡＢＣＤＥ'.indexOf(val);
    document.querySelectorAll(`[id^="opt-${qid}-"]`).forEach((el,i) => {
      el.classList.toggle('selected', i===idx);
      const k = el.querySelector('.option-key');
      if (k) { k.style.background = i===idx?'var(--primary)':''; k.style.color = i===idx?'white':''; }
    });
  }
  document.getElementById('qblock-'+qid)?.classList.toggle('answered', !!val);
  document.getElementById('pnav-'+qid)?.classList.toggle('done', !!val);
  updateProgress();
};

window.collectFill = (qid) => {
  const q = questions.find(x => x.id===qid);
  const count = q?.answerCount || 1;
  const vals = Array.from({length:count}, (_,i) => (document.getElementById(`fill-${qid}-${i}`)?.value||'').trim());
  answers[qid] = vals.filter(Boolean).join('、');
  document.getElementById('qblock-'+qid)?.classList.toggle('answered', vals.some(Boolean));
  document.getElementById('pnav-'+qid)?.classList.toggle('done', vals.some(Boolean));
  updateProgress();
};

function updateProgress() {
  const done = Object.keys(answers).filter(k => answers[k]).length;
  const total = questions.length;
  const el = document.getElementById('answerProgress');
  if (el) el.textContent = `已作答 ${done}/${total} 題`;
}

window.scrollToQ = (qid) => {
  document.getElementById('qblock-'+qid)?.scrollIntoView({ behavior:'smooth', block:'start' });
};

// ── 計時器 ────────────────────────────────────────
function startTimer(seconds) {
  remainingSeconds = seconds;
  timer = setInterval(() => {
    remainingSeconds--;
    const m = Math.floor(remainingSeconds/60), s = remainingSeconds%60;
    const el = document.getElementById('timerDisplay');
    if (el) {
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.className = 'timer' + (remainingSeconds<300?' warning':'') + (remainingSeconds<60?' danger':'');
    }
    if (remainingSeconds <= 0) {
      clearInterval(timer);
      UI.toast('時間到！自動交卷', 'warning');
      submitExam(true);
    }
  }, 1000);
}

// ── 交卷 ─────────────────────────────────────────
window.submitExam = async (auto=false) => {
  if (!auto) {
    const done = Object.keys(answers).filter(k => answers[k]).length;
    if (done < questions.length) {
      if (!confirm(`你還有 ${questions.length-done} 題尚未作答，確定要交卷嗎？`)) return;
    }
  }
  clearInterval(timer);

  // 計算分數
  const typeScores = examData.typeScores || {};
  let score = 0;
  const detail = [];
  questions.forEach(q => {
    const userAns = (answers[q.id]||'').trim();
    const correct = (q.answer||'').trim();
    const perScore = typeScores[q.type] || 2;
    let isCorrect = false;
    if (q.type === 'T6' || q.type === 'T5') {
      isCorrect = null; // 主觀題，老師批改
    } else {
      isCorrect = userAns === correct;
    }
    if (isCorrect === true) score += perScore;
    detail.push({ qid: q.id, type: q.type, userAns, correct, isCorrect, perScore });
  });

  // 儲存成績
  try {
    const resultId = await DataService.saveResult({
      examId: examData.id,
      examTitle: examData.title,
      score,
      totalScore: examData.totalScore || questions.length*2,
      passScore: examData.passScore || 60,
      timeUsed: (examData.duration*60 - remainingSeconds),
      detail,
    });
    showResult(score, detail);
  } catch(e) {
    showResult(score, detail);
    UI.toast('成績儲存失敗：'+e.message, 'danger');
  }
};

function showResult(score, detail) {
  document.getElementById('examView').style.display = 'none';
  document.getElementById('resultView').style.display = 'block';

  const total = examData.totalScore || questions.length*2;
  const pct = Math.round(score/total*100);
  const passed = score >= (examData.passScore||60);
  const auto = detail.filter(d => d.isCorrect===true).length;
  const manual = detail.filter(d => d.isCorrect===null).length;
  const wrong = detail.filter(d => d.isCorrect===false).length;

  document.getElementById('resultView').innerHTML = `
    <div class="result-summary">
      <div style="font-size:1.1rem;margin-bottom:8px;opacity:.8">考試完成！</div>
      <div class="result-score">${score}</div>
      <div class="result-max">/ ${total} 分（${pct}%）</div>
      <div class="result-pass" style="color:${passed?'#a5d6a7':'#ef9a9a'}">${passed?'✅ 通過！':'❌ 未通過'}</div>
      <div class="result-grid">
        <div class="result-stat"><div class="rs-num">${auto}</div><div class="rs-label">答對</div></div>
        <div class="result-stat"><div class="rs-num">${wrong}</div><div class="rs-label">答錯</div></div>
        <div class="result-stat"><div class="rs-num">${manual}</div><div class="rs-label">待批改</div></div>
      </div>
    </div>
    ${manual>0?`<div class="alert alert-info">📌 有 ${manual} 題主觀題（問答/配合）需老師批改，最終成績可能變動。</div>`:''}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-outline" onclick="nav('my-results')">查看成績記錄</button>
      <button class="btn btn-primary" onclick="location.reload()">回到考試列表</button>
    </div>
  `;
}

loadAvailableExams();
</script>
</body>
</html>
