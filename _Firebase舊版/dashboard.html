<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首頁總覽 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<style>
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr 1fr}}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:700px){.charts-row{grid-template-columns:1fr}}
.bar-item{display:flex;align-items:center;gap:10px;font-size:.82rem;margin-bottom:7px}
.bar-label{width:64px;color:var(--text-secondary);flex-shrink:0;text-align:right;font-size:.76rem}
.bar-track{flex:1;background:var(--bg-base);border-radius:4px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:.72rem;color:white;font-weight:600;transition:width .6s ease;min-width:0}
.bar-count{width:36px;text-align:right;color:var(--text-secondary);font-weight:600;flex-shrink:0}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
@media(max-width:600px){.quick-actions{grid-template-columns:1fr 1fr}}
.quick-action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 12px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);cursor:pointer;transition:all .2s;text-decoration:none}
.quick-action:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--primary-light)}
.quick-action .qa-icon{font-size:1.8rem}
.quick-action .qa-label{font-size:.82rem;font-weight:600;color:var(--primary)}
.quick-action .qa-desc{font-size:.72rem;color:var(--text-muted);text-align:center}
.welcome-banner{background:linear-gradient(135deg,var(--primary-dark),var(--primary));border-radius:var(--radius-lg);padding:22px 26px;color:white;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.welcome-banner h2{font-family:var(--font-serif);font-size:1.1rem;margin-bottom:4px}
.welcome-banner p{font-size:.82rem;opacity:.75}
.welcome-icon{font-size:2.5rem;opacity:.6;flex-shrink:0}
</style>
<style>
/* 側邊欄預載入樣式，防止 JS 初始化前的空白閃爍 */
#sidebar{background:var(--bg-sidebar,#1a3a5c);min-height:100vh;width:var(--sidebar-width,240px)}
.main{opacity:0;transition:opacity .15s ease}
.main.ready{opacity:1}
</style>
<script>
// 頁面載入完成後立即顯示內容，避免等待 JS module 初始化
document.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var m=document.querySelector('.main');
    if(m)m.classList.add('ready');
  },50);
});
</script>
</head>
<body>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">首頁總覽</span>
      <div class="topbar-actions"><span class="text-sm text-muted" id="dateStr"></span></div>
    </div>
    <div class="page-content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">
        <div class="spinner" style="margin:0 auto 12px"></div>
        載入中…
      </div>
    </div>
  </div>
</div>
<script type="module">
import { guardPage } from './js/auth-guard.js';
window._activeNav = 'dashboard';

const user = await guardPage();
if (!user) throw new Error('not auth');

document.getElementById('dateStr').textContent =
  new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric',weekday:'long'});

const isStaff = DataService.isStaff();
const isAdmin = DataService.isAdmin();

async function render() {
  try {
    if (isStaff) {
      await renderStaff();
    } else {
      await renderStudent();
    }
  } catch(e) {
    console.error('Dashboard render error:', e);
    document.getElementById('content').innerHTML = `
      <div class="alert alert-danger">
        <div><strong>載入失敗：</strong>${e.message}</div>
        <div style="font-size:.8rem;margin-top:6px;opacity:.8">
          請確認 Firestore 安全規則已設定，或重新整理頁面再試。
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p style="font-size:.88rem;color:var(--text-secondary);margin-bottom:16px">
            若 Firestore 尚未設定安全規則，請至 Firebase Console → Firestore → 規則，
            暫時設定為測試模式（allow read, write: if true）。
          </p>
          <button class="btn btn-primary" onclick="location.reload()">🔄 重新載入</button>
        </div>
      </div>`;
  }
}

async function renderStaff() {
  // 各資料分開 try，避免一個失敗全部炸掉
  let stats    = { total: 0, byType: {}, bySubject: {}, byDifficulty: {} };
  let exams    = [];
  let results  = [];

  try { stats   = await DataService.getQuestionStats(); } catch(e) { console.warn('stats error', e.message); }
  try { exams   = await DataService.getExams(); }          catch(e) { console.warn('exams error', e.message); }
  try { results = await DataService.getResults(); }        catch(e) { console.warn('results error', e.message); }

  const tColors = {T1:'#3498db',T2:'#2ecc71',T3:'#f39c12',T4:'#9b59b6',T5:'#e67e22',T6:'#95a5a6'};
  const maxT = Math.max(...Object.values(stats.byType||{}), 1);
  const typeBars = Object.entries(QUESTION_TYPES).map(([c,n]) => {
    const cnt = stats.byType[c]||0;
    const pct = Math.round(cnt/maxT*100);
    return `<div class="bar-item">
      <div class="bar-label">${n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${tColors[c]}">${cnt>0?cnt:''}</div></div>
      <div class="bar-count">${cnt}</div>
    </div>`;
  }).join('');

  const maxS = Math.max(...Object.values(stats.bySubject||{}), 1);
  const subjBars = Object.entries(SUBJECT_CODES).map(([c,n]) => {
    const cnt = stats.bySubject[c]||0;
    const pct = Math.round(cnt/maxS*100);
    return `<div class="bar-item">
      <div class="bar-label" style="width:90px;font-size:.7rem">${n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(pct,cnt?2:0)}%;background:var(--primary)">${cnt>0?cnt:''}</div></div>
      <div class="bar-count">${cnt}</div>
    </div>`;
  }).join('');

  const examRows = exams.slice(0,5).map(e => `
    <tr>
      <td><strong>${e.title||'（未命名）'}</strong></td>
      <td style="font-size:.8rem">${SUBJECT_CODES[e.subjectCode]||'—'}</td>
      <td>${e.questionCount||0} 題</td>
      <td style="font-size:.78rem;color:var(--text-muted)">${UI.formatDate(e.createdAt)}</td>
      <td><button class="btn btn-sm btn-outline" onclick="nav('exams')">查看</button></td>
    </tr>`).join('') ||
    `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:24px">尚無試卷，請先選題組卷</td></tr>`;

  const adminQA = isAdmin ? `
    <a class="quick-action" onclick="nav('import')">
      <div class="qa-icon">📥</div><div class="qa-label">匯入題目</div><div class="qa-desc">上傳 Word 入題檔</div>
    </a>
    <a class="quick-action" onclick="nav('questions')">
      <div class="qa-icon">🔧</div><div class="qa-label">題目維護</div><div class="qa-desc">查看、刪除題目</div>
    </a>` : '';

  document.getElementById('content').innerHTML = `
    <div class="welcome-banner">
      <div>
        <h2>歡迎回來，${user.displayName||user.email} ${isAdmin?'管理員':'老師'} 👋</h2>
        <p>題庫共 ${(stats.total||0).toLocaleString()} 題　試卷 ${exams.length} 份　成績記錄 ${results.length} 筆</p>
      </div>
      <div class="welcome-icon">📚</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#e8eef6">📚</div>
        <div class="stat-body"><div class="stat-num">${(stats.total||0).toLocaleString()}</div><div class="stat-label">題庫總題數</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#eafaf1">📋</div>
        <div class="stat-body"><div class="stat-num">${exams.length}</div><div class="stat-label">已建立試卷</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fdf3e3">📊</div>
        <div class="stat-body"><div class="stat-num">${results.length}</div><div class="stat-label">作答記錄</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fdecea">🗂️</div>
        <div class="stat-body"><div class="stat-num">${Object.keys(stats.bySubject||{}).length}</div><div class="stat-label">科目種類</div></div>
      </div>
    </div>

    <div class="charts-row">
      <div class="card">
        <div class="card-header"><h2>題型分布</h2></div>
        <div class="card-body">${stats.total ? typeBars : '<div style="color:var(--text-muted);font-size:.85rem">尚無題目</div>'}</div>
      </div>
      <div class="card">
        <div class="card-header"><h2>各科題數</h2></div>
        <div class="card-body" style="max-height:200px;overflow-y:auto">${stats.total ? subjBars : '<div style="color:var(--text-muted);font-size:.85rem">尚無題目</div>'}</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><h2>快速操作</h2></div>
      <div class="card-body">
        <div class="quick-actions">
          ${adminQA}
          <a class="quick-action" onclick="nav('compose')">
            <div class="qa-icon">✏️</div><div class="qa-label">電腦選題</div><div class="qa-desc">自動亂數組卷</div>
          </a>
          <a class="quick-action" onclick="nav('manual')">
            <div class="qa-icon">🖊️</div><div class="qa-label">人工選題</div><div class="qa-desc">手動挑選題目</div>
          </a>
          <a class="quick-action" onclick="nav('exams')">
            <div class="qa-icon">📁</div><div class="qa-label">試卷管理</div><div class="qa-desc">管理已建立試卷</div>
          </a>
          <a class="quick-action" onclick="nav('results')">
            <div class="qa-icon">📊</div><div class="qa-label">成績查詢</div><div class="qa-desc">查看學生成績</div>
          </a>
          <a class="quick-action" onclick="nav('settings')">
            <div class="qa-icon">⚙️</div><div class="qa-label">帳號管理</div><div class="qa-desc">新增/管理帳號</div>
          </a>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>最近試卷</h2>
        <button class="btn btn-sm btn-outline" onclick="nav('exams')">全部試卷 →</button>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>試卷名稱</th><th>科目</th><th>題數</th><th>建立日期</th><th></th></tr></thead>
          <tbody>${examRows}</tbody>
        </table>
      </div>
    </div>`;
}

async function renderStudent() {
  let exams     = [];
  let myResults = [];
  let myClasses = [];

  try { exams     = await DataService.getExams(); }                            catch(e) { console.warn(e.message); }
  try { myResults = await DataService.getResults({ studentUid: user.uid }); } catch(e) { console.warn(e.message); }
  try { myClasses = await DataService.getMyClasses(); }                        catch(e) { console.warn(e.message); }

  // 只計算學生所屬班級有被指定、且狀態為 active 的試卷
  const myClassIds = myClasses.map(c => c.id);
  const activeExams = exams.filter(e => {
    if ((e.status||'draft') !== 'active') return false;
    const ids = e.classIds || [];
    if (!ids.length) return false;                          // 未指定班級 = 不開放
    return ids.some(id => myClassIds.includes(id));        // 須在學生的班級內
  });

  const avg = myResults.length
    ? Math.round(myResults.reduce((s,r) => s + (r.totalScore ? r.score/r.totalScore*100 : 0), 0) / myResults.length)
    : null;

  document.getElementById('content').innerHTML = `
    <div class="welcome-banner">
      <div>
        <h2>歡迎，${user.displayName||user.email} 同學 👋</h2>
        <p>${activeExams.length > 0
          ? `目前有 <strong>${activeExams.length}</strong> 份考試開放中，繼續加油！`
          : myClasses.length ? '目前沒有開放中的考試，請等待老師安排。' : '請先加入班級才能參加考試。'
        }</p>
      </div>
      <div class="welcome-icon">🎓</div>
    </div>

    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card">
        <div class="stat-icon" style="background:#eafaf1">📝</div>
        <div class="stat-body"><div class="stat-num">${myResults.length}</div><div class="stat-label">已完成考試</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fdf3e3">⭐</div>
        <div class="stat-body"><div class="stat-num">${avg !== null ? avg+'%' : '—'}</div><div class="stat-label">平均得分率</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#e8eef6">📋</div>
        <div class="stat-body"><div class="stat-num">${activeExams.length}</div><div class="stat-label">我的開放考試</div></div>
      </div>
    </div>

    <div class="quick-actions" style="grid-template-columns:1fr 1fr;max-width:380px">
      <a class="quick-action" onclick="nav('take')">
        <div class="qa-icon">📝</div><div class="qa-label">參加考試</div><div class="qa-desc">選擇試卷開始作答</div>
      </a>
      <a class="quick-action" onclick="nav('my-results')">
        <div class="qa-icon">📊</div><div class="qa-label">我的成績</div><div class="qa-desc">查看歷次成績</div>
      </a>
    </div>`;
}

render();
</script>
</body>
</html>
