<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成績查詢 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<style>
/* ── 篩選列 ── */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;background:white;border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:3px;min-width:0}
.fg-label{font-size:.72rem;color:var(--text-muted);font-weight:500}
.filter-row .form-control{font-size:.82rem;padding:5px 8px}

/* ── 統計 bar ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.stats-row{grid-template-columns:1fr 1fr}}
.mini-stat{background:white;border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:12px}
.ms-icon{width:40px;height:40px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.ms-num{font-size:1.4rem;font-weight:700;font-family:var(--font-serif);color:var(--primary);line-height:1.1}
.ms-label{font-size:.74rem;color:var(--text-muted);margin-top:1px}

/* ── 成績表格 ── */
.score-cell{font-weight:700;font-size:.92rem}
.score-pass{color:var(--success)}
.score-fail{color:var(--danger)}
.pct-bar-wrap{display:flex;align-items:center;gap:6px}
.pct-bar-bg{flex:1;height:6px;background:var(--bg-base);border-radius:3px;overflow:hidden;min-width:60px}
.pct-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.pct-text{font-size:.76rem;font-weight:600;width:34px;text-align:right;flex-shrink:0}

/* ── 詳情 Modal ── */
.ans-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light);font-size:.84rem}
.ans-row:last-child{border-bottom:none}
.ans-num{color:var(--text-muted);font-size:.74rem;width:24px;flex-shrink:0;padding-top:2px;text-align:right}
.ans-q{flex:1;min-width:0}
.ans-q .q-txt{line-height:1.5;margin-bottom:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ans-q .ans-compare{display:flex;gap:12px;font-size:.78rem;margin-top:3px;flex-wrap:wrap}
.ans-correct{color:var(--success);font-weight:600}
.ans-wrong{color:var(--danger);font-weight:600}
.ans-pending{color:var(--warning);font-weight:600}
.ans-result{flex-shrink:0;width:24px;text-align:center;font-size:.9rem}

/* ── 分組標題 ── */
.group-header{background:var(--primary-dark);color:white;padding:6px 14px;font-size:.8rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.group-header:hover{background:var(--primary)}
.group-rows{display:none}
.group-rows.open{display:table-row-group}

/* ── Tab ── */
.view-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.view-tab{padding:9px 20px;font-size:.875rem;font-weight:500;background:none;border:none;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:var(--font-sans)}
.view-tab.active{color:var(--primary);border-bottom-color:var(--accent);font-weight:700}
</style>
<style>
/* 側邊欄預載入樣式，防止 JS 初始化前的空白閃爍 */
#sidebar{background:var(--bg-sidebar,#1a3a5c);min-height:100vh;width:var(--sidebar-width,240px)}
.main{opacity:0;transition:opacity .15s ease}
.main.ready{opacity:1}
</style>
<script>
// 頁面載入完成後立即顯示內容，避免等待 JS module 初始化
document.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var m=document.querySelector('.main');
    if(m)m.classList.add('ready');
  },50);
});
</script>
</head>
<body>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">成績查詢</span>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="exportBtn" onclick="exportCSV()">⬇ 匯出 CSV</button>
      </div>
    </div>
    <div class="page-content">

      <!-- Tab -->
      <div class="view-tabs">
        <button class="view-tab active" data-tab="list" onclick="switchTab('list')">📋 成績列表</button>
        <button class="view-tab" data-tab="byexam" onclick="switchTab('byexam')">📊 依試卷統計</button>
      </div>

      <!-- Tab: 成績列表 -->
      <div id="tab-list">
        <!-- 統計卡 -->
        <div class="stats-row" id="statsRow">
          <div class="mini-stat"><div class="ms-icon" style="background:#e8eef6">📝</div><div><div class="ms-num" id="sTotal">—</div><div class="ms-label">總作答次數</div></div></div>
          <div class="mini-stat"><div class="ms-icon" style="background:#eafaf1">✅</div><div><div class="ms-num" id="sPass">—</div><div class="ms-label">通過次數</div></div></div>
          <div class="mini-stat"><div class="ms-icon" style="background:#fdf2f8">📈</div><div><div class="ms-num" id="sAvg">—</div><div class="ms-label">平均得分率</div></div></div>
          <div class="mini-stat"><div class="ms-icon" style="background:#fef5e7">🏆</div><div><div class="ms-num" id="sHigh">—</div><div class="ms-label">最高得分率</div></div></div>
        </div>

        <!-- 篩選 -->
        <div class="filter-row">
          <div class="fg">
            <span class="fg-label">試卷</span>
            <select class="form-control" id="fExam" style="min-width:180px" onchange="applyFilter()">
              <option value="">全部試卷</option>
            </select>
          </div>
          <div class="fg">
            <span class="fg-label">學生姓名</span>
            <input class="form-control" id="fStudent" placeholder="搜尋姓名…" oninput="applyFilter()" style="min-width:120px">
          </div>
          <div class="fg">
            <span class="fg-label">通過狀態</span>
            <select class="form-control" id="fPass" onchange="applyFilter()" style="min-width:100px">
              <option value="">全部</option>
              <option value="pass">通過</option>
              <option value="fail">未通過</option>
            </select>
          </div>
          <div style="align-self:flex-end;margin-left:auto;display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="clearFilter()">重置</button>
          </div>
        </div>

        <!-- 表格 -->
        <div class="card">
          <div class="table-wrapper">
            <table class="data-table" id="resultsTable">
              <thead>
                <tr>
                  <th>學生</th>
                  <th>試卷名稱</th>
                  <th>得分</th>
                  <th style="min-width:120px">得分率</th>
                  <th>狀態</th>
                  <th>作答時間</th>
                  <th>提交時間</th>
                  <th style="width:80px"></th>
                </tr>
              </thead>
              <tbody id="resultsTbody">
                <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">載入中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Tab: 依試卷統計 -->
      <div id="tab-byexam" style="display:none">
        <div class="card">
          <div class="table-wrapper">
            <table class="data-table" id="byExamTable">
              <thead>
                <tr>
                  <th>試卷名稱</th>
                  <th>作答人數</th>
                  <th>通過人數</th>
                  <th>通過率</th>
                  <th>平均分</th>
                  <th>最高分</th>
                  <th>最低分</th>
                </tr>
              </thead>
              <tbody id="byExamTbody">
                <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">載入中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- 成績詳情 Modal -->
<div class="modal-overlay hidden" id="detailModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="detailTitle">成績詳情</h3>
      <button class="modal-close" onclick="document.getElementById('detailModal').classList.add('hidden')">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('detailModal').classList.add('hidden')">關閉</button>
    </div>
  </div>
</div>

<script type="module">
import { guardPage } from './js/auth-guard.js';
window._activeNav = 'results';
const user = await guardPage(['admin','teacher']);
if (!user) throw new Error('not auth');

let allResults = [];
let allQuestions = {};
async function loadQuestionsForResult(qids) {
  const missing = (qids||[]).filter(id => id && !allQuestions[id]);
  if (!missing.length) return;
  const qs = await DataService.getQuestionsByIds(missing);
  qs.forEach(q => { allQuestions[q.id] = q; });
}
let filtered = [];
let examsMap = {};

async function init() {
  try {
    // 取得教師的班級列表，用於過濾成績
    const myClasses = await DataService.getClasses({ teacherUid: user.uid }).catch(() => []);
    const myClassIds = myClasses.map(c => c.id);
    const myClassStudentUids = new Set();
    
    // 收集所有班級的學生 UID
    for (const cls of myClasses) {
      try {
        const members = await DataService.getClassMembers(cls.id);
        members.forEach(m => myClassStudentUids.add(m.uid));
      } catch(e) { /* ignore */ }
    }

    const [results, exams, qs] = await Promise.all([
      DataService.getResults(),
      DataService.getExams(),
      Promise.resolve([]),  // 題目改為按需載入
    ]);

    // 過濾成績：只顯示自己班級學生的成績，以及自己出的試卷的成績
    const isAdmin = DataService.isAdmin();
    allResults = isAdmin ? results : results.filter(r => {
      // 學生在教師的班級中
      if (myClassStudentUids.has(r.studentUid)) return true;
      // 或是教師自己出的試卷的成績
      const exam = exams.find(e => e.id === r.examId);
      if (exam && exam.createdBy === user.uid) return true;
      return false;
    });

    // 題目改為按需載入，不預先全量讀取
    exams.forEach(e => { examsMap[e.id] = e; });

    // 填試卷下拉
    const fExam = document.getElementById('fExam');
    const examsSeen = new Set();
    allResults.forEach(r => {
      if (r.examId && !examsSeen.has(r.examId)) {
        examsSeen.add(r.examId);
        const title = examsMap[r.examId]?.title || r.examTitle || r.examId;
        fExam.innerHTML += `<option value="${r.examId}">${title}</option>`;
      }
    });

    applyFilter();
    renderByExam();
  } catch(e) {
    document.getElementById('resultsTbody').innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--danger)">載入失敗：${e.message}</td></tr>`;
  }
}

window.applyFilter = () => {
  const examId = document.getElementById('fExam').value;
  const student = document.getElementById('fStudent').value.toLowerCase();
  const passF = document.getElementById('fPass').value;

  filtered = allResults.filter(r => {
    const pass = r.score >= (r.passScore || examsMap[r.examId]?.passScore || 60);
    return (!examId || r.examId === examId) &&
           (!student || (r.studentName||'').toLowerCase().includes(student)) &&
           (!passF || (passF==='pass'?pass:!pass));
  });

  updateStats(filtered);
  renderTable(filtered);
};

window.clearFilter = () => {
  ['fExam','fPass'].forEach(id => document.getElementById(id).value='');
  document.getElementById('fStudent').value='';
  applyFilter();
};

function updateStats(data) {
  const total = data.length;
  const passArr = data.filter(r => r.score >= (r.passScore || examsMap[r.examId]?.passScore || 60));
  const pcts = data.map(r => r.totalScore ? Math.round(r.score/r.totalScore*100) : 0);
  const avg = total ? Math.round(pcts.reduce((a,b)=>a+b,0)/total) : 0;
  const high = total ? Math.max(...pcts) : 0;

  document.getElementById('sTotal').textContent = total;
  document.getElementById('sPass').textContent = passArr.length;
  document.getElementById('sAvg').textContent = avg + '%';
  document.getElementById('sHigh').textContent = high + '%';
}

function renderTable(data) {
  const tbody = document.getElementById('resultsTbody');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">無符合條件的成績記錄</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(r => {
    const total = r.totalScore || 100;
    const pct = Math.round(r.score / total * 100);
    const passScore = r.passScore || examsMap[r.examId]?.passScore || 60;
    const passed = r.score >= passScore;
    const barColor = pct >= 80 ? '#1e8449' : pct >= 60 ? '#2c5f8a' : '#c0392b';
    const timeUsed = r.timeUsed ? `${Math.floor(r.timeUsed/60)}分${r.timeUsed%60}秒` : '—';
    return `<tr>
      <td style="font-weight:500">${r.studentName||'—'}</td>
      <td style="font-size:.84rem">${r.examTitle||examsMap[r.examId]?.title||r.examId||'—'}</td>
      <td><span class="score-cell ${passed?'score-pass':'score-fail'}">${r.score}</span><span style="font-size:.76rem;color:var(--text-muted)">/${total}</span></td>
      <td><div class="pct-bar-wrap">
        <div class="pct-bar-bg"><div class="pct-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <span class="pct-text" style="color:${barColor}">${pct}%</span>
      </div></td>
      <td>${passed
        ? '<span class="badge badge-easy">✓ 通過</span>'
        : '<span class="badge" style="background:#fdecea;color:#c0392b">✗ 未過</span>'
      }</td>
      <td style="font-size:.8rem;color:var(--text-muted)">${timeUsed}</td>
      <td style="font-size:.78rem;color:var(--text-muted)">${UI.formatDateTime(r.submittedAt)}</td>
      <td><button class="btn btn-sm btn-outline" onclick="viewDetail('${r.id}')">詳情</button></td>
    </tr>`;
  }).join('');
}

function renderByExam() {
  const groups = {};
  allResults.forEach(r => {
    if (!groups[r.examId]) groups[r.examId] = { title: r.examTitle || examsMap[r.examId]?.title || r.examId, results: [] };
    groups[r.examId].results.push(r);
  });
  const tbody = document.getElementById('byExamTbody');
  if (!Object.keys(groups).length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">尚無成績記錄</td></tr>';
    return;
  }
  tbody.innerHTML = Object.entries(groups).map(([examId, g]) => {
    const rs = g.results;
    const passScore = examsMap[examId]?.passScore || 60;
    const passed = rs.filter(r => r.score >= (r.passScore||passScore));
    const pcts = rs.map(r => r.totalScore ? r.score/r.totalScore*100 : 0);
    const avg = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
    const maxPct = Math.round(Math.max(...pcts));
    const minPct = Math.round(Math.min(...pcts));
    const passRate = Math.round(passed.length/rs.length*100);
    return `<tr>
      <td style="font-weight:600">${g.title}</td>
      <td>${rs.length} 人</td>
      <td>${passed.length} 人</td>
      <td><div class="pct-bar-wrap">
        <div class="pct-bar-bg"><div class="pct-bar-fill" style="width:${passRate}%;background:${passRate>=60?'var(--success)':'var(--danger)'}"></div></div>
        <span class="pct-text" style="color:${passRate>=60?'var(--success)':'var(--danger)'}">${passRate}%</span>
      </div></td>
      <td><span style="font-weight:700;color:var(--primary)">${avg}%</span></td>
      <td><span style="color:var(--success);font-weight:600">${maxPct}%</span></td>
      <td><span style="color:var(--danger);font-weight:600">${minPct}%</span></td>
    </tr>`;
  }).join('');
}

window.viewDetail = async (id) => {
  const r = allResults.find(x => x.id===id); if (!r) return;
  // 按需載入此成績用到的題目
  await loadQuestionsForResult((r.detail||[]).map(d => d.qid));
  const total = r.totalScore || 100;
  const pct = Math.round(r.score/total*100);
  const passScore = r.passScore || examsMap[r.examId]?.passScore || 60;
  const passed = r.score >= passScore;
  const timeUsed = r.timeUsed ? `${Math.floor(r.timeUsed/60)}分${r.timeUsed%60}秒` : '—';

  const detail = r.detail || [];
  const ansHTML = detail.map((d,i) => {
    const q = allQuestions[d.qid];
    let resultIcon, resultClass;
    if (d.isCorrect === true)  { resultIcon='✓'; resultClass='ans-correct'; }
    else if (d.isCorrect === false) { resultIcon='✗'; resultClass='ans-wrong'; }
    else { resultIcon='?'; resultClass='ans-pending'; }

    return `<div class="ans-row">
      <span class="ans-num">${i+1}.</span>
      <div class="ans-q">
        <div class="q-txt">${q?.text||d.qid}</div>
        <div class="ans-compare">
          <span>學生：<strong class="${d.isCorrect===false?'ans-wrong':''}">${d.userAns||'（未作答）'}</strong></span>
          ${d.isCorrect!==null?`<span>正解：<strong class="ans-correct">${d.correct||'—'}</strong></span>`:'<span class="ans-pending">主觀題待批改</span>'}
          <span style="color:var(--text-muted)">${d.perScore}分</span>
        </div>
      </div>
      <span class="ans-result ${resultClass}">${resultIcon}</span>
    </div>`;
  }).join('') || '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.84rem">無詳細作答記錄</div>';

  document.getElementById('detailTitle').textContent = `${r.studentName||'學生'} — ${r.examTitle||'考試'}`;
  document.getElementById('detailBody').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
      ${[
        ['得分', `<span style="font-size:1.3rem;font-weight:900;color:${passed?'var(--success)':'var(--danger)'}">${r.score}</span><span style="color:var(--text-muted)">/${total}</span>`],
        ['得分率', `<strong style="color:${passed?'var(--success)':'var(--danger)'}">${pct}%</strong>`],
        ['結果', passed?'<span class="badge badge-easy">✓ 通過</span>':'<span class="badge" style="background:#fdecea;color:#c0392b">✗ 未通過</span>'],
        ['作答時間', timeUsed],
        ['提交時間', UI.formatDateTime(r.submittedAt)],
        ['及格分', passScore+'分'],
      ].map(([k,v])=>`<div style="background:var(--bg-base);padding:8px 12px;border-radius:var(--radius)">
        <div style="font-size:.7rem;color:var(--text-muted);margin-bottom:2px">${k}</div>
        <div style="font-size:.88rem">${v}</div>
      </div>`).join('')}
    </div>
    <div style="font-weight:600;font-size:.84rem;margin-bottom:8px;color:var(--primary)">各題作答詳情</div>
    <div style="max-height:360px;overflow-y:auto;border:1px solid var(--border-light);border-radius:var(--radius);padding:0 12px">
      ${ansHTML}
    </div>
  `;
  document.getElementById('detailModal').classList.remove('hidden');
};

// ── 匯出 CSV ─────────────────────────────────────
window.exportCSV = () => {
  if (!filtered.length) { UI.toast('無資料可匯出', 'warning'); return; }
  const headers = ['學生姓名','試卷名稱','得分','總分','得分率','通過','作答時間(秒)','提交時間'];
  const rows = filtered.map(r => {
    const total = r.totalScore||100;
    const pct = Math.round(r.score/total*100);
    const passScore = r.passScore || examsMap[r.examId]?.passScore || 60;
    const passed = r.score >= passScore ? '通過' : '未通過';
    return [r.studentName||'', r.examTitle||examsMap[r.examId]?.title||'', r.score, total, pct+'%', passed, r.timeUsed||'', UI.formatDateTime(r.submittedAt)];
  });
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `成績匯出_${new Date().toLocaleDateString('zh-TW')}.csv`;
  a.click();
  UI.toast('CSV 匯出成功', 'success');
};

// ── Tab 切換 ─────────────────────────────────────
window.switchTab = (tab) => {
  document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('tab-list').style.display = tab==='list' ? '' : 'none';
  document.getElementById('tab-byexam').style.display = tab==='byexam' ? '' : 'none';
};

init();
</script>
</body>
</html>
