.main{opacity:0;transition:opacity .15s ease}.main.ready{opacity:1}
.log-box{background:#1a1a2e;color:#a8d8a8;font-family:var(--font-mono);font-size:.78rem;padding:16px;border-radius:var(--radius);height:400px;overflow-y:auto;white-space:pre-wrap;}

<div class="layout">

          <div style="display:flex;gap:10px;margin-bottom:16px">
            <button class="btn btn-primary" id="startBtn" onclick="startImport()">▶ 開始匯入</button>

            <button class="btn btn-ghost" id="clearQBtn" onclick="clearQuestions()" style="color:var(--danger);border-color:var(--danger)">🗑 清除所有題目</button>
          </div>
          <div class="log-box" id="logBox">等待開始...\n</div>
        </div>
      </div>
    </div>
  </div>
</div>

function log(msg, type='') {
  const box = document.getElementById('logBox');
  const cls = type==='err'?'log-err':type==='ok'?'log-ok':type==='info'?'log-info':'';
  box.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  box.scrollTop = box.scrollHeight;
}

      });
      log(`  ✓ 科目已建立，ID: ${subjId}`, 'ok');

      const books = Object.values(subj.books);
      for (const book of books) {
        try {
          log(`  📖 冊別：${book.name} (${book.code})`);
          const bookId = await DataService.saveBook(subjId, {
            name: book.name, code: book.code, order: book.order,
            l1: book.l1 || '', l2: book.l2 || '', l3: book.l3 || ''
          });
          totalBooks++;
          log(`    ✓ 冊別已建立，ID: ${bookId}`, 'ok');

          for (const ch of book.chapters) {
            try {
              await DataService.saveChapter(subjId, bookId, {
                chapterNum: ch.chapterNum,
                title: ch.title,
                sections: ch.sections || []
              });
              totalChapters++;
            } catch(e) {
              log(`    ✗ 章節失敗：${ch.title} - ${e.message}`, 'err');
              errors++;
            }
          }
          log(`    ✓ ${book.chapters.length} 章節已建立`, 'ok');
        } catch(e) {
          log(`  ✗ 冊別失敗：${book.name} - ${e.message}`, 'err');
          errors++;
        }
      }
    } catch(e) {
      log(`✗ 科目失敗：${subj.name} - ${e.message}`, 'err');
      errors++;
    }
  }

  log(`\n═══════════════════════════`, 'info');
  if (errors === 0) {
    log(`✅ 匯入完成！科目: ${subjects.length}，冊別: ${totalBooks}，章: ${totalChapters}`, 'ok');
    log(`請前往「課本管理」確認，並刪除此頁面。`, 'info');
  } else {
    log(`⚠️ 完成但有 ${errors} 個錯誤，請查看上方記錄。`, 'err');
  }
  document.getElementById('startBtn').disabled = false;
};

window.clearAll = async () => {
  if (!confirm('確定要清除 Firestore 中所有課本資料？此操作不可復原。')) return;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('clearBtn').disabled = true;
  log('清除現有資料...', 'info');
  try {
    const subjects = await DataService.getSubjects();
    for (const s of subjects) {
      await DataService.deleteSubject(s.id);
      log(`  已刪除：${s.name}`, 'ok');
    }
    log('清除完成。', 'ok');
  } catch(e) {
    log('清除失敗：' + e.message, 'err');
  }
  document.getElementById('clearBtn').disabled = false;
  document.getElementById('startBtn').disabled = false;
};

window.resetCounter = async () => {
  if (!confirm('確定要重置題目流水號？\n\n下次匯入的第一題編號將從 00001 開始。\n（不會影響已存在的題目）')) return;
  document.getElementById('resetCounterBtn').disabled = true;
  try {
    await DataService.resetQuestionCounter();
    log('✅ 流水號已重置，下次匯入將從 00001 開始。', 'ok');
  } catch(e) {
    log('✗ 重置失敗：' + e.message, 'err');
  }
  document.getElementById('resetCounterBtn').disabled = false;
};
window.clearQuestions = async () => {
  if (!confirm('確定要刪除 Firestore 中所有題目？\n\n此操作不可復原，請確認已備份。')) return;
  document.getElementById('clearQBtn').disabled = true;
  log('開始清除題目...', 'info');
  try {
    const total = await DataService.deleteAllQuestions((deleted, all) => {
      log(`  已刪除 ${deleted} / ${all}`, 'ok');
    });
    await DataService.resetQuestionCounter();
    log(`✅ 共刪除 ${total} 題，流水號已重置為 0。`, 'ok');
    log('現在可以重新匯入題目。', 'info');
  } catch(e) {
    log('✗ 刪除失敗：' + e.message, 'err');
  }
  document.getElementById('clearQBtn').disabled = false;
};
</script>
