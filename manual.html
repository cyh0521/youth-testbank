<style>
.manual-layout{display:block}
.manual-panel[hidden]{display:none}
.manual-panel .card-header{min-height:60px;padding:10px 20px;gap:12px;flex-wrap:wrap}
.manual-panel .card-header h2{font-size:1.2rem;font-weight:700;letter-spacing:.01em}
.manual-panel .card-body{padding:18px 20px}
.selection-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.selection-layout .card{min-width:0}
#manualPanel2 .card:has(#manualFilterMenu){overflow:visible}
#manualPanel2 .card:has(#manualFilterMenu)>.card-header{border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.bank-list,.selected-list{max-height:650px;overflow-y:auto;padding:18px 20px;background:#fff}
.result-section-title{cursor:pointer}
.manual-panel .result-type-toggle{display:flex;width:100%;padding:9px 12px;box-sizing:border-box}
.manual-panel .result-section-title:has(.result-type-toggle){padding:0}
.result-list{border:0;border-radius:0}
#manualPanel2 .result-section{border:0;border-radius:0;box-shadow:none}
.manual-panel .result-q{gap:6px}
.manual-panel .result-q .q-num{width:auto;min-width:18px;text-align:left}
.result-q.selected{background:#eaf1f8}
.result-q.selected:hover{background:#e2ebf4}
.drag-handle{cursor:grab;color:var(--text-muted);flex:none;line-height:1.65}
.drag-handle:active{cursor:grabbing}
#selList .result-q:has(.dragging){opacity:.4;background:#f0f4ff}
#selList .result-q.drag-over{box-shadow:inset 0 2px var(--primary-light)}
.si-remove{margin-left:auto}
.manual-filters{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.manual-filters .form-group{flex:0 1 110px;min-width:95px;margin:0!important}
.manual-filters .form-group{flex:1 1 120px;max-width:180px}
.manual-filters .edit-q-view-toggle{margin-left:0;height:calc(1.204rem + 10px)}
.manual-compact-question{display:none;min-width:0;flex:1;align-items:center;gap:8px}
.manual-compact-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.manual-compact-text img{max-height:22px;vertical-align:middle}
.manual-list-view .manual-full-question{display:none}
.manual-list-view .manual-compact-question{display:flex}
.manual-list-view .result-q{align-items:flex-start}
#manualPanel2 .result-q{cursor:pointer}
.manual-list-view .result-q.is-expanded .manual-full-question{display:block}
.manual-list-view .result-q.is-expanded .manual-compact-question{display:none}
.manual-list-view .result-q .q-body{min-width:0}
.manual-list-view .manual-compact-question .si-remove{flex:none}
.manual-filter-menu{position:relative;flex:none}
.manual-filter-menu>.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.4}
.manual-filter-menu>.btn svg{display:block;flex:none;align-self:center;width:16px;height:16px;transform:none}
.manual-filter-popover[hidden]{display:none}
.manual-filter-popover{position:absolute;top:calc(100% + 8px);right:0;z-index:60;width:160px;max-width:calc(100vw - 48px);padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-md)}
.manual-filter-popover fieldset{border:0;padding:0;margin:0}
.manual-filter-popover fieldset+fieldset{margin-top:8px}
.manual-filter-popover legend{font-size:.88rem;font-weight:700;margin-bottom:4px}
.manual-filter-popover label{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.88rem;cursor:pointer}
.manual-filter-popover input{accent-color:var(--primary)}
.manual-filters .form-control{font-size:.86rem;padding:5px 8px}
#bankList .replace-question:disabled{opacity:.55;cursor:default}
@media(max-width:1100px){#manualPanel3>.card{width:100%}}
.manual-panel .btn-auto-score{background:#e0edff;color:#2458a6;border-color:transparent}
.manual-panel .btn-auto-score:hover{background:#cbdfff;color:#174889}
.manual-panel .btn-auto-score:focus-visible{outline:2px solid #3478f6;outline-offset:2px}
@media(max-width:1100px){.selection-layout{grid-template-columns:1fr}}
@media(max-width:760px){.manual-panel .card-header,.manual-panel .card-body,.bank-list,.selected-list{padding-left:14px;padding-right:14px}}
</style>

<script type="module">
import { renderScopePanel, mountScopeSelector } from './js/exam-scope.js?v=20261124-empty-chart';
import { guardPage } from './js/auth-guard.js';
import { showExamPreview, mountInlinePreviewLayout, showHeaderSettings, newExamHeader, loadAppearance, mountInlineHeaderEditor, buildHeaderHtml, buildHeaderSampleHtml, fontStackById, togglePreviewPanel } from './js/exam-preview.js?v=20261125-shared-preview';
import { allocateTypeScores, AUTO_SCORE_WEIGHTS } from './js/score-allocation.js?v=20261007-weighted-scores';
import { blankCount } from './js/blank-selection.js';
import { examScopeSnapshot } from './js/preview-scope.js?v=20261015-selected-only';
window._activeNav = 'manual';
const user = await guardPage(['admin','manager','teacher']);
if (!user) throw new Error('not auth');

// ── 初始化 ────────────────────────────────────────
await initTextbookCache();
document.getElementById('examScope').innerHTML = renderScopePanel({ nextAction:'goManualStep(2)', nextLabel:'選擇題目' });
const cSubject = document.getElementById('cSubject');
cSubject.innerHTML = tbSubjectOptions();

// ── 狀態 ─────────────────────────────────────────
let allQs = [], filtered = [], pageSize = 30, curPage = 1;
let selectedIds = new Set();
let selectedOrder = [];
let settingsTypeOrder = ['T1','T2','T3','T4','T5','T6'];
let selQuestions = {};
let draftPreviewData = null;
window.openHeaderSettings = () => {
  draftPreviewData ??= { header:newExamHeader(), appearance:loadAppearance() };
  showHeaderSettings(draftPreviewData);
};

function getManualScopeQuestions() { return scopeSelector.getQuestions(); }

const excludedManualTypes = new Set();
const excludedManualDifficulties = new Set();
const manualDifficultyOptions = [['△','簡易題'],['◎','較難題']];
function renderManualFilterChecks(scopeQs) {
  const availableTypes = new Set(scopeQs.map(q=>q.type));
  document.getElementById('manualTypeChecks').innerHTML = Object.entries(QUESTION_TYPES)
    .filter(([type])=>availableTypes.has(type))
    .map(([type,label])=>`<label><input type="checkbox" ${excludedManualTypes.has(type) ? '' : 'checked'} onchange="setManualFilter('type','${type}',this.checked)">${label}</label>`).join('') || '<span class="text-muted">此範圍尚無題型</span>';
  document.getElementById('manualDifficultyChecks').innerHTML = manualDifficultyOptions
    .map(([value,label])=>`<label><input type="checkbox" ${excludedManualDifficulties.has(value) ? '' : 'checked'} onchange="setManualFilter('difficulty','${value}',this.checked)">${label}</label>`).join('');
}
window.setManualFilter = (kind,value,checked) => {
  const excluded = kind === 'type' ? excludedManualTypes : excludedManualDifficulties;
  if(checked) excluded.delete(value); else excluded.add(value);
  applyFilters(false);
};
window.applyFilters = (updateChecks = true) => {
  const kw = document.getElementById('fKeyword').value.toLowerCase();
  const scopeQs = getManualScopeQuestions();
  if(updateChecks) renderManualFilterChecks(scopeQs);
  filtered = scopeQs.filter(q => !excludedManualTypes.has(q.type) &&
    !excludedManualDifficulties.has(q.difficulty || '') &&
    (!kw || (q.text || '').toLowerCase().includes(kw)));
  curPage = 1;
  renderBank();
};
function setManualFilterMenu(expanded) {
  document.getElementById('manualFilterPanel').hidden = !expanded;
  document.getElementById('manualFilterToggle').setAttribute('aria-expanded',String(expanded));
}
window.toggleManualFilterMenu = () => setManualFilterMenu(document.getElementById('manualFilterPanel').hidden);
document.addEventListener('click',event=>{
  if(!document.getElementById('manualFilterMenu').contains(event.target)) setManualFilterMenu(false);
});
document.getElementById('manualFilterMenu').addEventListener('keydown',event=>{
  if(event.key==='Escape') {
    setManualFilterMenu(false);
    document.getElementById('manualFilterToggle').focus();
  }
});

// ── 題目庫渲染 ────────────────────────────────────
const TYPE_ORDER_BANK = ['T1','T2','T3','T4','T5','T6'];

function manualQuestionSummary(q) {
  const choice = q.type === 'T2' || q.type === 'T3';
  const options = choice && q.options?.length ? q.options.map((option,index)=>`(${String.fromCharCode(65+index)})${option}`).join(' ') : '';
  const text = [q.text || '—', options, q.tail || ''].filter(Boolean).join(' ');
  return UI.escapeHtml(UI.questionSummary(UI.questionText(text)).replace(/[\s\u2029]+/g,' ').trim());
}
function manualQuestionBody(q, action = '') {
  const choice = q.type === 'T2' || q.type === 'T3';
  return `<div class="manual-compact-question"><span class="q-catalog-num">${UI.escapeHtml(q.qnum || '—')}</span>${UI.diffBadge(q.difficulty)}<span class="manual-compact-text">${manualQuestionSummary(q)}</span>${action}</div><div class="manual-full-question"><div class="q-meta"><span class="q-catalog-num">${UI.escapeHtml(q.qnum || '—')}</span>${UI.diffBadge(q.difficulty)}${UI.typeBadge(q.type)}<span class="q-source">頁數 ${UI.escapeHtml(q.source || '未註明')}</span>${action}</div>
    <div class="q-text">${q.type === 'T2' || q.type === 'T3' ? UI.choiceQuestionHtml(q, '—') : q.type === 'T5' ? UI.matchingQuestionHtml(q.text) : UI.questionHtml(q.text || '—')}</div>
    ${!choice && q.tail ? '<div class="q-tail">'+UI.questionHtml(q.tail)+'</div>' : ''}

function buildRange(cur, total) {
  if (total<=7) return Array.from({length:total},(_,i)=>i+1);
  const r=[1];
  if(cur>3) r.push('…');
  for(let i=Math.max(2,cur-1);i<=Math.min(total-1,cur+1);i++) r.push(i);
  if(cur<total-2) r.push('…');
  r.push(total);
  return r;
}

function renderExamSummary() {
  const rows = settingsTypeOrder.map(code => ({code,label:QUESTION_TYPES[code],defaultScore:TYPE_SCORES[code]})).map(type => {
    const questions = selectedOrder.map(id=>selQuestions[id]).filter(q=>q?.type === type.code);
    const units = type.code === 'T4' ? questions.reduce((sum,q)=>sum+blankCount(q),0) : questions.length;
    const score = type.defaultScore ?? 2;
    return { ...type, count:questions.length, units, score, total:Math.round(units * score * 10) / 10 };
  }).filter(type => type.count > 0);
  const total = Math.round(rows.reduce((sum, type) => sum + type.total, 0) * 10) / 10;
  document.getElementById('manualSummary').innerHTML = `
    <div class="exam-summary-table-wrap"><table class="exam-summary-table"><thead><tr><th scope="col">題型</th><th scope="col">題數</th><th scope="col">配分</th><th scope="col">小計</th></tr></thead><tbody>${rows.map(type => `<tr data-type="${type.code}"><td><button type="button" class="exam-type-drag" draggable="true" aria-label="拖曳調整${type.label}順序">⠿</button>${type.label}</td><td>${type.count} 題${type.code === 'T4' ? `<small>共 ${type.units} 格</small>` : ''}</td><td><div class="selection-summary-score"><div class="number-stepper"><input class="form-control" type="number" required id="sc-${type.code}" value="${type.score}" min="${document.getElementById('manualIntegerScores').checked ? 1 : 0.5}" max="100" step="${document.getElementById('manualIntegerScores').checked ? 1 : 0.5}" aria-label="${type.label}每${type.code === 'T4' ? '格' : '題'}配分" oninput="updateManualScore('${type.code}',this)"><div class="number-stepper-buttons"><button type="button" tabindex="-1" aria-label="增加${type.label}配分" onclick="adjustManualScore('${type.code}',1)">▲</button><button type="button" tabindex="-1" aria-label="減少${type.label}配分" onclick="adjustManualScore('${type.code}',-1)">▼</button></div></div><span class="row-unit">分／${type.code === 'T4' ? '格' : '題'}</span></div></td><td id="manualSubtotal-${type.code}">${type.total} 分</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4" id="totalScoreVal">總分：${total} 分</td></tr></tfoot></table></div>`;
  const table = document.querySelector('#manualSummary tbody');
  let draggedType = null;
  table.addEventListener('dragstart', event => {
    if (!event.target.closest('.exam-type-drag')) { event.preventDefault(); return; }
    const row = event.target.closest('[data-type]');
    if (!row) return;
    draggedType = row.dataset.type;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', draggedType);
    row.classList.add('is-dragging');
  });
  table.addEventListener('dragover', event => {
    const row = event.target.closest('[data-type]');
    if (!draggedType || !row || row.dataset.type === draggedType) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    table.querySelectorAll('.drag-target').forEach(item => item.classList.remove('drag-target'));
    row.classList.add('drag-target');
  });
  table.addEventListener('drop', event => {
    const row = event.target.closest('[data-type]');
    if (!draggedType || !row || row.dataset.type === draggedType) return;
    event.preventDefault();
    const next = settingsTypeOrder.filter(code => code !== draggedType);
    next.splice(next.indexOf(row.dataset.type), 0, draggedType);
    settingsTypeOrder = next;
    selectedOrder = settingsTypeOrder.flatMap(code => selectedOrder.filter(id => selQuestions[id]?.type === code));
    if (draftPreviewData) draftPreviewData.typeOrder = [...settingsTypeOrder];
    renderExamSummary();
    renderSettingsHeaderSample();
  });
  table.addEventListener('dragend', () => {
    draggedType = null;
    table.querySelectorAll('.is-dragging,.drag-target').forEach(row => row.classList.remove('is-dragging','drag-target'));
  });
}

window.goManualStep = n => {
  if (n > 1 && !document.querySelector('.chap-cb:checked')) { UI.toast('請勾選至少一個章節','warning'); return; }
  if (n > 1 && !getManualScopeQuestions().length) { UI.toast('所選命題範圍尚無題目，請重新選擇章節。','warning'); return; }
  if (n > 2 && !selectedOrder.length) { UI.toast('請先選擇題目','warning'); return; }
  if (n > 3 && [...document.querySelectorAll('#manualSummary input')].some(input => !input.checkValidity() || !Number.isFinite(Number(input.value)))) { UI.toast('請輸入有效配分（0.5 至 100 分）','warning'); return; }
  for (let i=1;i<=4;i++) {
    document.getElementById('manualPanel'+i).hidden = i !== n;
    const step = document.getElementById('manualStep'+i);
    step.classList.toggle('active',i===n); step.classList.toggle('done',i<n);
    if(i===n) step.setAttribute('aria-current','step'); else step.removeAttribute('aria-current');
  }
  document.getElementById('manualProgressFill').style.width = `${n*25}%`;
  document.getElementById('manualProgressTrack').setAttribute('aria-valuenow',String(n));
  document.getElementById('manualProgressTrack').setAttribute('aria-valuetext',`第 ${n} 步，共 4 步`);
  if (n===2) {
    const allowed=new Set(getManualScopeQuestions().map(q=>q.id));
    selectedOrder.filter(id=>!allowed.has(id)).forEach(id=>{ selectedIds.delete(id); delete selQuestions[id]; });
    selectedOrder=selectedOrder.filter(id=>allowed.has(id));
    applyFilters(); renderSelected();
  }
  if (n===3) {
    const counts = {};
    selectedOrder.forEach(id => { const q = selQuestions[id]; if (q) counts[q.type] = (counts[q.type] || 0) + selectedScoreUnits(q); });
    const signature = JSON.stringify([Object.entries(counts).sort(([a],[b]) => a.localeCompare(b)), document.getElementById('manualIntegerScores').checked]);
    if (signature !== defaultScoreSignature) {
      autoManualScores();
      defaultScoreSignature = signature;
    } else renderSelected();
  }
  if (n===3) renderExamSettings();
  if (n===4) renderManualExamPreview();
  document.querySelector('.page-content').scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('manualStep1').setAttribute('aria-current','step');
const scopeSelector = mountScopeSelector({ cache:_tbCache, dataService:DataService, onChange(questions, selected, reason) {
  allQs = questions;
  const allowed = new Set(selected.map(q => q.id));
  selectedOrder = selectedOrder.filter(id => {
    if (allowed.has(id)) return true;
    selectedIds.delete(id); delete selQuestions[id]; return false;
  });
  if (reason === 'book') draftPreviewData = null;
  applyFilters(); renderSelected();
} });
</script>
