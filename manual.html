<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手動選題 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/process-bar.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<link rel="stylesheet" href="css/exam-compose.css">
<style>
.manual-layout{display:block}
.manual-panel[hidden]{display:none}
.manual-panel .card-header{min-height:60px;padding:10px 20px;gap:12px;flex-wrap:wrap}
.manual-panel .card-header h2{font-size:1.2rem;font-weight:700;letter-spacing:.01em}
.manual-panel .card-body{padding:18px 20px}
.selection-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.selection-layout .card{min-width:0}
.bank-list,.selected-list{max-height:650px;overflow-y:auto;padding:18px 20px;background:#fff}
.result-section-title{cursor:default}
.result-list{border:0;border-radius:0}
#bankList .result-q{cursor:default}
.manual-panel .result-q{gap:6px}
.manual-panel .result-q .q-num{width:auto;min-width:18px;text-align:left}
.result-q.selected{background:#eaf1f8}
.result-q.selected:hover{background:#e2ebf4}
.drag-handle{cursor:grab;color:var(--text-muted);flex:none;line-height:1.65}
.drag-handle:active{cursor:grabbing}
#selList .result-q:has(.dragging){opacity:.4;background:#f0f4ff}
#selList .result-q.drag-over{box-shadow:inset 0 2px var(--primary-light)}
.si-remove{margin-left:auto}
.manual-filters{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.manual-filters .form-group{flex:0 1 110px;min-width:95px;margin:0!important}
.manual-filters .form-group:last-child{flex:1 1 120px;max-width:180px}
.manual-filters .form-control{font-size:.86rem;padding:5px 8px}
#bankList .replace-question:disabled{opacity:.55;cursor:default}
.score-cfg{padding:18px 20px;background:#fff}
.total-score-bar{display:flex;align-items:center;justify-content:space-between;margin:0 20px 18px;padding:13px 14px;border-radius:9px;background:#e1f3e9;color:#176d49;font-weight:700}
#manualSummary .exam-summary-table tbody tr{cursor:default}
.manual-panel .btn-auto-score{background:#e0edff;color:#2458a6;border-color:transparent}
.manual-panel .btn-auto-score:hover{background:#cbdfff;color:#174889}
.manual-panel .btn-auto-score:focus-visible{outline:2px solid #3478f6;outline-offset:2px}
@media(max-width:1100px){.selection-layout{grid-template-columns:1fr}}
@media(max-width:760px){.manual-panel .card-header,.manual-panel .card-body,.bank-list,.selected-list,.score-cfg{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <div class="main" inert>
    <div class="topbar">
      <span class="topbar-title">手動選題</span>
      <div class="topbar-breadcrumb"><span>首頁</span> › 手動選題</div>
    </div>
    <div class="page-content">
<section class="import-progress" aria-label="手動選題流程" style="--process-step-count:5;--process-initial-width:20%"><div class="steps" role="list"><div class="step active" id="manualStep1" role="listitem"><span class="step-num">1</span><span class="step-copy"><strong>出題範圍</strong></span></div><div class="step" id="manualStep2" role="listitem"><span class="step-num">2</span><span class="step-copy"><strong>選擇題目</strong></span></div><div class="step" id="manualStep3" role="listitem"><span class="step-num">3</span><span class="step-copy"><strong>題型與配分</strong></span></div><div class="step" id="manualStep4" role="listitem"><span class="step-num">4</span><span class="step-copy"><strong>試卷設定</strong></span></div><div class="step" id="manualStep5" role="listitem"><span class="step-num">5</span><span class="step-copy"><strong>預覽試卷</strong></span></div></div><div class="import-progress-track" id="manualProgressTrack" role="progressbar" aria-label="手動選題進度" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"><div class="import-progress-fill" id="manualProgressFill"></div></div></section><div class="manual-layout"><section id="manualPanel1" class="manual-panel"><div class="scope-layout"><section class="card"><div class="card-header"><h2>選擇命題科目</h2></div><div class="scope-tree" id="subjectTree"></div><div hidden><select class="form-control" id="cSubject" aria-label="科目" onchange="onSubjectChange()">
                  <option value="">請選擇科目</option>
                </select><select class="form-control" id="cBook" aria-label="冊次" disabled onchange="loadChapters()">
                  <option value="">請先選科目</option>
                </select></div></section><section class="card"><div class="card-header"><h2>選擇命題章節</h2><div class="scope-header-actions"><button class="btn btn-primary btn-sm" onclick="goManualStep(2)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：選擇題目</button></div></div>              <div class="chapter-tree scope-tree" id="chapterTree">
                <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.88rem">請先選擇科目與冊次</div>
              </div>

<div class="wizard-actions"><button class="btn btn-ghost btn-sm" onclick="clearAllChapters()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5a2 2 0 0 1 0 3L11 21H6l-4-4a2 2 0 0 1 0-3L13 3a2 2 0 0 1 3 0zM8 8l8 8M11 21h11"/></svg>取消選取</button></div></section></div></section><section id="manualPanel2" class="manual-panel" hidden><div class="selection-layout">        <div class="card">
          <div class="card-header">
            <div class="scope-title"><h2>題目庫</h2><span class="scope-available" id="bankCount">︱共 0 題</span></div>
          <div class="manual-filters">              <div class="form-group" style="margin-bottom:8px">
                <select class="form-control" id="fType" aria-label="題型" onchange="applyFilters()">
                  <option value="">全部題型</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom:8px">
                <select class="form-control" id="fDiff" aria-label="難易度" onchange="applyFilters()">
                  <option value="">不限難易度</option>
                  <option value="◎">較難 ◎</option>
                  <option value="△">簡易 △</option>
                </select>
              </div>
              <div class="form-group">
                <input class="form-control" id="fKeyword" aria-label="搜尋題目" placeholder="搜尋題目…" oninput="applyFilters()">
              </div>
</div>
          </div>

          <div class="bank-list"  id="bankList">
            <div style="text-align:center;padding:48px 24px;color:var(--text-muted)">
              <div style="font-size:2rem;margin-bottom:10px;opacity:.3">📚</div>
              <p style="font-size:.88rem">請在左側選擇科目與冊次</p>
            </div>
          </div>
          <div class="pag-wrap" id="bankPag"></div>
        </div>

          <div class="card">
            <div class="card-header">
              <div class="scope-title"><h2>已選題目</h2><span class="scope-available" id="selCountLabel">︱已選 0 題</span></div>
<div class="scope-header-actions"><button class="btn btn-previous btn-sm" onclick="goManualStep(1)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button><button class="btn btn-primary btn-sm" onclick="goManualStep(3)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：題型與配分</button></div>
            </div>
            <div id="selList" class="selected-list">
              <div style="text-align:center;padding:32px;color:var(--text-muted);font-size:.9rem">點擊「加入」將題目加入試卷</div>
            </div>
</div><div class="wizard-actions"><button class="btn btn-outline btn-sm" id="shuffleBtn" onclick="shuffleSelected()" disabled>亂數排序</button></div></div></section><section id="manualPanel3" class="manual-panel" hidden><section class="card"><div class="card-header"><h2>題型與配分</h2><div class="scope-header-actions"><button class="btn btn-auto-score btn-sm" onclick="autoManualScores()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8L4 10l5.8 1.9L12 18l1.9-5.8L20 10l-5.8-1.9zM5 18l-.7 1.4L3 20l1.3.6L5 22l.7-1.4L7 20l-1.3-.6zM19 16l-.7 1.4L17 18l1.3.6L19 20l.7-1.4L21 18l-1.3-.6z"/></svg>自動配分</button><button class="btn btn-previous btn-sm" onclick="goManualStep(2)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button><button class="btn btn-primary btn-sm" onclick="goManualStep(4)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：試卷設定</button></div></div><div class="score-cfg" id="scoreCfg"></div><div class="total-score-bar" id="totalScoreBar"><span>預估總分</span><span id="totalScoreVal">0 分</span></div></section></section><section id="manualPanel4" class="manual-panel" hidden><div class="scope-layout settings-layout"><section class="card"><div class="card-header"><h2>試卷檢視</h2><div class="scope-header-actions"><button class="btn btn-previous btn-sm" onclick="goManualStep(3)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button><button class="btn btn-primary btn-sm" onclick="goManualStep(5)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6 6 6-6 6"/><path d="m6 6 6 6-6 6" stroke-opacity=".5"/></svg>下一步：預覽試卷</button></div></div><div class="card-body" id="manualSummary"></div></section><section class="card"><div class="card-header"><h2>試卷表頭</h2></div><div class="card-body" id="manualHeaderFields"></div></section></div></section><section id="manualPanel5" class="manual-panel" hidden><section class="card"><div class="card-header"><h2>預覽試卷</h2><div class="scope-header-actions"><button class="btn btn-previous btn-sm" onclick="goManualStep(4)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button></div><div class="compose-preview-tools" id="manualPreviewTools"></div><button class="btn btn-primary btn-sm" id="saveBtn" onclick="openSaveModal()" disabled>儲存試卷</button></div><div id="manualExamPreview"></div></section></section></div>
    </div>
  </div>
</div>

<!-- 儲存 Modal -->
<div class="modal-overlay hidden" id="saveModal">
  <div class="modal">
    <div class="modal-header"><h3>💾 儲存試卷</h3><button class="modal-close" onclick="document.getElementById('saveModal').classList.add('hidden')">✕</button></div>
    <div class="modal-body">
      <div class="alert alert-danger hidden" id="saveErr"></div>
      <div class="form-group">
        <label class="form-label">試卷名稱 <span class="required">*</span></label>
        <input class="form-control" id="examTitle" placeholder="例：113學年度第一次月考">
      </div>
      <div class="form-group">
        <label class="form-label">說明（選填）</label>
        <textarea class="form-control" id="examDesc" rows="2" placeholder="可填寫考試類型、試題範圍等資訊。"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('saveModal').classList.add('hidden')">取消</button>
      <button class="btn btn-primary" onclick="doSaveExam()">儲存</button>
    </div>
  </div>
</div>

<script type="module">
import { guardPage } from './js/auth-guard.js';
import { showExamPreview, showHeaderSettings, newExamHeader, loadAppearance, mountInlineHeaderEditor } from './js/exam-preview.js';
import { allocateTypeScores } from './js/score-allocation.js';
window._activeNav = 'manual';
const user = await guardPage(['admin','manager','teacher']);
if (!user) throw new Error('not auth');

// ── 初始化 ────────────────────────────────────────
await initTextbookCache();
const cSubject = document.getElementById('cSubject');
cSubject.innerHTML = tbSubjectOptions();

// ── 狀態 ─────────────────────────────────────────
let allQs = [], filtered = [], pageSize = 30, curPage = 1;
let selectedIds = new Set();
let selectedOrder = [];
let selQuestions = {};
let _bookObj = null, _chapters = [];
let draftPreviewData = null;
window.openHeaderSettings = () => {
  draftPreviewData ??= { header:newExamHeader(), appearance:loadAppearance() };
  showHeaderSettings(draftPreviewData);
};

const escapeTreeText = value => UI.escapeHtml(String(value ?? ''));
function renderScopeCatalog() {
  document.getElementById('subjectTree').innerHTML = (_tbCache?.subjects || []).map(subject => {
    const books = _tbCache.booksBySubject[subject.id] || [];
    return `<details class="subject-node"><summary>${escapeTreeText(subject.name)}</summary>${books.length ? books.map(book=>`<label class="book-node"><input type="radio" name="scopeBook" data-subject="${escapeTreeText(subject.code)}" value="${escapeTreeText(book.code)}"><span>${escapeTreeText(book.name)}</span></label>`).join('') : '<div class="scope-empty">尚無冊次</div>'}</details>`;
  }).join('') || '<div class="scope-empty">尚無科目</div>';
}
document.getElementById('subjectTree').addEventListener('change',async event=>{
  const input=event.target;
  if(input.name!=='scopeBook') return;
  cSubject.value=input.dataset.subject;
  onSubjectChange();
  document.getElementById('cBook').value=input.value;
  await loadChapters();
});

// ── 科目/冊次 ─────────────────────────────────────
window.onSubjectChange = () => {
  const sc = cSubject.value;
  const bk = document.getElementById('cBook');
  if (sc) {
    const subj = _tbCache?.subjectByCode?.[sc];
    const books = subj ? (_tbCache?.booksBySubject?.[subj.id]||[]) : [];
    bk.innerHTML = '<option value="">請選擇冊次</option>';
    books.forEach(b => bk.innerHTML += `<option value="${b.code}">${b.name}</option>`);
    bk.disabled = false;
  } else {
    bk.innerHTML = '<option value="">請先選科目</option>';
    bk.disabled = true;
  }
  document.getElementById('chapterTree').innerHTML =
    '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.88rem">請先選擇冊次</div>';
  allQs = []; applyFilters();
};

window.loadChapters = async () => {
  const sc = cSubject.value, bc = document.getElementById('cBook').value;
  if (!sc || !bc) { allQs = []; filtered = []; document.getElementById('chapterTree').innerHTML = '<div class="scope-empty">請先選擇冊次</div>'; renderBank(); return; }
  const tree = document.getElementById('chapterTree');
  tree.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:.88rem">載入中…</div>';
  allQs = []; applyFilters();

  // 載入題目
  try {
    allQs = await DataService.getQuestions({ subjectCode: sc, bookCode: bc });
  } catch(e) { allQs = []; }

  const subj = _tbCache?.subjectByCode?.[sc];
  const bookObj = subj ? (_tbCache?.booksBySubject?.[subj.id]||[]).find(b=>b.code===bc) : null;
  _bookObj = bookObj || null;

  let tbChapters = [];
  if (subj && bookObj) {
    tbChapters = await DataService.getChapterDefs(subj.id, bookObj.id);
    _chapters = tbChapters;
  }
  const l1 = bookObj?.l1 || '章';
  const l2 = bookObj?.l2 || '';
  const l3 = bookObj?.l3 || '';

  // 統計題數
  const countMap = {};
  allQs.forEach(q => {
    const ch = q.chapterNum; if (!ch) return;
    if (!countMap[ch]) countMap[ch] = { count:0, sections:{} };
    countMap[ch].count++;
    if (q.sectionNum) countMap[ch].sections[q.sectionNum] = (countMap[ch].sections[q.sectionNum]||0)+1;
  });

  // 章節名稱對照
  const chTitles = {}, secTitles = {}, subsecTitles = {};
  tbChapters.forEach(c => {
    chTitles[String(c.chapterNum)] = c.title || '';
    (c.sections||[]).forEach(s => {
      if (!secTitles[String(c.chapterNum)]) secTitles[String(c.chapterNum)] = {};
      secTitles[String(c.chapterNum)][String(s.sectionNum)] = s.title || '';
      if (l3 && (s.subsections||[]).length) {
        if (!subsecTitles[String(c.chapterNum)]) subsecTitles[String(c.chapterNum)] = {};
        subsecTitles[String(c.chapterNum)][String(s.sectionNum)] = s.subsections;
      }
    });
  });

  const allChNums = new Set([
    ...tbChapters.map(c => String(c.chapterNum)),
    ...Object.keys(countMap)
  ]);

  if (!allChNums.size) {
    tree.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.88rem">此科目/冊次無章節資料</div>';
    filtered = []; renderBank(); return;
  }

  tree.innerHTML = [...allChNums].sort((a,b)=>parseInt(a)-parseInt(b)).map(ch => {
    const info = countMap[ch] || { count:0, sections:{} };
    const allSecs = new Set([...Object.keys(secTitles[ch]||{}), ...Object.keys(info.sections)]);
    const hasChildren = l2 && allSecs.size > 0;
    const secHTML = l2 ? [...allSecs].sort((a,b)=>parseInt(a)-parseInt(b)).map(sec => {
      const subs = subsecTitles[ch]?.[sec] || [];
      const hasSubChildren = l3 && subs.length > 0;
      const subsHTML = hasSubChildren ? subs.map(ss => `
        <div class="chapter-item subsection">
          <span style="width:16px;flex-shrink:0;display:inline-block"></span>
          <input type="checkbox" class="chap-cb" data-ch="${ch}" data-sec="${sec}" data-sub="${ss.num}">
          <span>${ss.title || (l3+ss.num)}</span>
        </div>`).join('') : '';
      return `<div class="chapter-item section">
        ${hasSubChildren ? `<button class="expand-btn" onclick="toggleChildren(this)">▶</button>` : '<span style="width:16px;flex-shrink:0"></span>'}
        <input type="checkbox" class="chap-cb sec-cb" data-ch="${ch}" data-sec="${sec}" onchange="onSecCbChange(this)">
        <span>${secTitles[ch]?.[sec] || (l2+parseInt(sec))}</span>
        <span class="ch-count">${info.sections[sec]||0} 題</span>
      </div>${hasSubChildren ? `<div class="chapter-children">${subsHTML}</div>` : ''}`;
    }).join('') : '';
    return `<div class="chapter-item">
      ${hasChildren ? `<button class="expand-btn" onclick="toggleChildren(this)">▶</button>` : '<span style="width:16px;flex-shrink:0"></span>'}
      <input type="checkbox" class="chap-cb chapter-cb" data-ch="${ch}" onchange="onChapterCbChange(this)">
      <span>${chTitles[ch] || (l1+parseInt(ch))}</span>
      <span class="ch-count">${info.count} 題</span>
    </div>${hasChildren ? `<div class="chapter-children">${secHTML}</div>` : secHTML}`;
  }).join('');

  filtered = [];
  curPage = 1;
  renderBank();  // 載入後先不顯示，等勾選章節
};

window.toggleChildren = (btn) => {
  const parent = btn.closest('.chapter-item');
  const children = parent.nextElementSibling;
  if (!children?.classList.contains('chapter-children')) return;
  const open = children.classList.toggle('open');
  btn.textContent = open ? '▼' : '▶';
};
window.clearAllChapters = () => {
  document.querySelectorAll('.chap-cb').forEach(c => c.checked = false);
  applyFilters();
};

function syncParentCb(ch, sec) {
  // 第三層→第二層
  if (sec !== undefined) {
    const subs = [...document.querySelectorAll(`.chap-cb[data-ch="${ch}"][data-sec="${sec}"][data-sub]`)];
    if (subs.length) {
      const secCb = document.querySelector(`.chap-cb.sec-cb[data-ch="${ch}"][data-sec="${sec}"]`);
      if (secCb) secCb.checked = subs.every(s => s.checked);
    }
  }
  // 第二層→第一層
  const allChildren = [...document.querySelectorAll(`.chap-cb[data-ch="${ch}"]:not(.chapter-cb)`)];
  if (allChildren.length) {
    const chapCb = document.querySelector(`.chap-cb.chapter-cb[data-ch="${ch}"]`);
    if (chapCb) chapCb.checked = allChildren.every(s => s.checked);
  }
}

window.onChapterCbChange = (cb) => {
  const ch = cb.dataset.ch, checked = cb.checked;
  document.querySelectorAll(`.chap-cb[data-ch="${ch}"]:not(.chapter-cb)`).forEach(s => s.checked = checked);
  applyFilters();
};
window.onSecCbChange = (cb) => {
  const ch = cb.dataset.ch, sec = cb.dataset.sec, checked = cb.checked;
  document.querySelectorAll(`.chap-cb[data-ch="${ch}"][data-sec="${sec}"][data-sub]`).forEach(s => s.checked = checked);
  syncParentCb(ch, undefined);
  applyFilters();
};
// 第三層直接點選 → 向上同步
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.classList.contains('chap-cb')) return;
  if (t.classList.contains('chapter-cb') || t.classList.contains('sec-cb')) return;
  syncParentCb(t.dataset.ch, t.dataset.sec);
  applyFilters();
});

// ── 篩選 ─────────────────────────────────────────
window.applyFilters = () => {
  const df  = document.getElementById('fDiff').value;
  const kw  = document.getElementById('fKeyword').value.toLowerCase();
  const checkedCbs = [...document.querySelectorAll('.chap-cb:checked')];
  const chapters = checkedCbs.map(c =>
    c.dataset.sub  ? `${c.dataset.ch}-${c.dataset.sec}-${c.dataset.sub}` :
    c.dataset.sec  ? `${c.dataset.ch}-${c.dataset.sec}` :
    c.dataset.ch
  );
  const scopeQs = allQs.filter(q => {
    const chOk = chapters.length > 0 && chapters.some(c => {
      const p = c.split('-').map(Number);
      const eq = (a,b) => Number(a)===Number(b);
      if (p.length===1) return eq(q.chapterNum, p[0]);
      if (p.length===2) return eq(q.chapterNum, p[0]) && eq(q.sectionNum, p[1]);
      return eq(q.chapterNum, p[0]) && eq(q.sectionNum, p[1]) && eq(q.subsectionNum, p[2]);
    });
    return chOk;
  });
  const typeFilter = document.getElementById('fType');
  const previousType = typeFilter.value;
  const availableTypes = new Set(scopeQs.map(q => q.type));
  typeFilter.innerHTML = '<option value="">全部題型</option>' + Object.entries(QUESTION_TYPES)
    .filter(([type]) => availableTypes.has(type))
    .map(([type,label]) => `<option value="${type}">${label}</option>`).join('');
  typeFilter.value = availableTypes.has(previousType) ? previousType : '';
  const tp = typeFilter.value;
  filtered = scopeQs.filter(q => {
    const qDiff = q.difficulty || '';
    const diffOk = !df || (df === '__normal__' ? qDiff === '' : qDiff === df);
    return (!tp || q.type === tp) && diffOk && (!kw || (q.text || '').toLowerCase().includes(kw));
  });
  curPage = 1;
  renderBank();
};

// ── 題目庫渲染 ────────────────────────────────────
const TYPE_ORDER_BANK = ['T1','T2','T3','T4','T5','T6'];

function manualQuestionBody(q, action = '') {
  const choice = q.type === 'T2' || q.type === 'T3';
  const options = choice && q.options?.length ? ' ' + q.options.map((option,index)=>'('+String.fromCharCode(65+index)+')'+UI.questionHtml(option)).join(' ') : '';
  const tail = choice && q.tail ? (String(q.tail).trim()==='。' ? '' : ' ') + UI.questionHtml(q.tail) : '';
  return `<div class="q-meta"><span class="q-catalog-num">${UI.escapeHtml(q.qnum || '—')}</span>${UI.typeBadge(q.type)}${UI.diffBadge(q.difficulty)}<span class="q-source">來源：${UI.escapeHtml(q.source || '未註明')}</span>${action}</div>
    <div class="q-text">${q.type==='T5' ? UI.matchingQuestionHtml(q.text) : UI.questionHtml(q.text || '—')}${options}${tail}</div>
    ${!choice && q.tail ? '<div class="q-tail">'+UI.questionHtml(q.tail)+'</div>' : ''}
    <div class="q-ans"><span class="answer-label">答案</span><span class="answer-text">${UI.questionHtml(q.answer || '—')}</span></div>`;
}

function renderBank() {
  const total = filtered.length;
  document.getElementById('bankCount').textContent = `︱共 ${total} 題`;
  document.getElementById('bankPag').innerHTML = '';

  const bankList = document.getElementById('bankList');
  if (!allQs.length) {
    bankList.innerHTML = '<div style="text-align:center;padding:48px 24px;color:var(--text-muted)"><div style="font-size:2rem;margin-bottom:10px;opacity:.3">📚</div><p style="font-size:.88rem">請在左側選擇科目與冊次</p></div>';
    return;
  }
  if (!total) {
    bankList.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:.9rem">無符合條件的題目</div>`;
    return;
  }

  // 依題型分組
  const groups = {};
  TYPE_ORDER_BANK.forEach(t => { groups[t] = []; });
  filtered.forEach(q => { if (groups[q.type]) groups[q.type].push(q); else groups[q.type] = [q]; });

  let qNum = 1;
  let html = '';
  for (const tCode of TYPE_ORDER_BANK) {
    const typeQuestions = groups[tCode];
    if (!typeQuestions || !typeQuestions.length) continue;
    const qs = typeQuestions.filter(q => !selectedIds.has(q.id));
    const tLabel = QUESTION_TYPES[tCode] || tCode;
    html += `<div class="result-section">
      <div class="result-section-title">
        ${tLabel}（共 ${typeQuestions.length} 題，${qs.length} 題可選）
      </div>
      <div class="result-list">
        ${!qs.length ? '<div class="scope-empty">此題型的題目皆已加入試卷</div>' : ''}
        ${qs.map(q => {
          return `<div class="result-q" id="qcard-${q.id}">
            <span class="q-num">${qNum++}.</span>
            <div class="q-body">
              ${manualQuestionBody(q, `<button type="button" class="btn btn-ghost btn-sm replace-question si-remove" onclick="toggleQ('${q.id}',true)">加入</button>`)}
            </div>

          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  bankList.innerHTML = html;
}


function buildRange(cur, total) {
  if (total<=7) return Array.from({length:total},(_,i)=>i+1);
  const r=[1];
  if(cur>3) r.push('…');
  for(let i=Math.max(2,cur-1);i<=Math.min(total-1,cur+1);i++) r.push(i);
  if(cur<total-2) r.push('…');
  r.push(total);
  return r;
}
window.goPage = p => { curPage=p; renderBank(); };
window.toggleQ = (id, add, silent=false) => {
  const q = allQs.find(x=>x.id===id); if (!q) return;
  if (add) { selectedIds.add(id); if (!selectedOrder.includes(id)) selectedOrder.push(id); selQuestions[id]=q; }
  else { selectedIds.delete(id); selectedOrder=selectedOrder.filter(x=>x!==id); delete selQuestions[id]; }
  if (!silent) {
    renderSelected();
    renderBank();
  }
};

// ── 已選面板 ─────────────────────────────────────
const TYPE_SCORES = {T1:2,T2:2,T3:4,T4:2,T5:2,T6:10};
function renderSelected() {
  const count = selectedOrder.length;
  document.getElementById('selCountLabel').textContent = `︱已選 ${count} 題`;
  ['saveBtn','shuffleBtn'].forEach(id => document.getElementById(id).disabled = count===0);
  const list = document.getElementById('selList');
  if (!count) {
    list.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-muted);font-size:.9rem">點擊「加入」將題目加入試卷</div>';
    document.getElementById('scoreCfg').style.display = 'none';
    document.getElementById('totalScoreBar').style.display = 'none';
    return;
  }
  // 依題型分組顯示（同題目庫樣式）
  const selGroups = {};
  const TYPE_ORDER_SEL = ['T1','T2','T3','T4','T5','T6'];
  TYPE_ORDER_SEL.forEach(t => { selGroups[t] = []; });
  selectedOrder.forEach((id,idx) => {
    const q = selQuestions[id];
    if (q) selGroups[q.type].push({q, id, idx});
  });
  let selHTML = '';
  for (const tCode of TYPE_ORDER_SEL) {
    const items = selGroups[tCode];
    if (!items.length) continue;
    const tLabel = QUESTION_TYPES[tCode] || tCode;
    selHTML += `<div class="result-section">
      <div class="result-section-title">${tLabel}（${items.length} 題）</div>
      <div class="result-list">
        ${items.map(({q, id, idx}) => {
          return `<div class="result-q" data-id="${id}"
            ondragover="dragOver(event,'${id}')" ondrop="dropOn(event,'${id}')" ondragend="dragEnd()">
            <span class="drag-handle" style="padding-top:3px;cursor:grab" draggable="true" ondragstart="dragStart(event,'${id}')" title="拖曳排序">⠿</span>
            <span class="q-num">${idx+1}.</span>
            <div class="q-body">
              ${manualQuestionBody(q, `<button type="button" class="btn btn-ghost btn-sm replace-question si-remove" onclick="toggleQ('${id}',false)">移除</button>`)}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  list.innerHTML = selHTML;
  const typeGroups = {};
  selectedOrder.forEach(id => { const q=selQuestions[id]; if(q){ typeGroups[q.type]=(typeGroups[q.type]||0)+1; } });
  document.getElementById('scoreCfg').style.display = 'block';
  document.getElementById('scoreCfg').innerHTML = Object.entries(typeGroups).map(([t,c]) =>
    `<div class="score-config-row"><span class="score-label">${QUESTION_TYPES[t]||t}<span class="type-title-note">（${c} 題）</span></span>
      <div class="number-stepper"><input class="form-control" type="number" id="sc-${t}" value="${TYPE_SCORES[t]||2}" min="0.5" max="100" step="0.5" aria-label="${QUESTION_TYPES[t]}每題配分" oninput="updateManualScore('${t}',this)"><div class="number-stepper-buttons"><button type="button" tabindex="-1" aria-label="增加配分" onclick="adjustManualScore('${t}',1)">▲</button><button type="button" tabindex="-1" aria-label="減少配分" onclick="adjustManualScore('${t}',-1)">▼</button></div></div><span class="row-unit">分／題</span>
    </div>`).join('');
  calcTotal();
  document.getElementById('totalScoreBar').style.display = 'flex';
}
function calcTotal() {
  let total=0;
  selectedOrder.forEach(id => { const q=selQuestions[id]; if(!q) return; const inp=document.getElementById('sc-'+q.type); total += inp?Number(inp.value)||0:(TYPE_SCORES[q.type]||2); });
  document.getElementById('totalScoreVal').textContent = total + ' 分';
}
window.calcTotal = calcTotal;

// ── 拖曳 ─────────────────────────────────────────
let dragId=null;
window.dragStart=(e,id)=>{dragId=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';};
window.dragEnd=()=>{dragId=null;document.querySelectorAll('#selList .result-q').forEach(el=>el.classList.remove('dragging','drag-over'));};
window.dragOver=(e,id)=>{e.preventDefault();if(id!==dragId)document.querySelector(`#selList .result-q[data-id="${id}"]`)?.classList.add('drag-over');};
window.dropOn=(e,targetId)=>{e.preventDefault();if(!dragId||dragId===targetId)return;const from=selectedOrder.indexOf(dragId),to=selectedOrder.indexOf(targetId);if(from<0||to<0)return;selectedOrder.splice(from,1);selectedOrder.splice(to,0,dragId);renderSelected();};

// ── 排序/預覽/儲存 ───────────────────────────────
window.shuffleSelected = () => {
  if (!selectedOrder.length) return;
  const byType={};
  selectedOrder.forEach(id=>{const q=selQuestions[id];if(!q)return;if(!byType[q.type])byType[q.type]=[];byType[q.type].push(id);});
  Object.values(byType).forEach(arr=>arr.sort(()=>Math.random()-.5));
  selectedOrder = ['T1','T2','T3','T4','T5','T6'].flatMap(t=>byType[t]||[]);
  renderSelected(); UI.toast('已在各題型內重新亂數排序','success');
};
window.previewSelected = () => {
  if (!selectedOrder.length) { UI.toast('請先選題','warning'); return; }
  const typeScores={};
  Object.keys(TYPE_SCORES).forEach(t=>{const el=document.getElementById('sc-'+t);typeScores[t]=el?Number(el.value)||TYPE_SCORES[t]:TYPE_SCORES[t];});
  const qs = selectedOrder.map(id=>selQuestions[id]).filter(Boolean);
  const firstQ = qs[0];
  draftPreviewData = { title:'（預覽）', typeScores, subjectCode:firstQ?.subjectCode||'', bookCode:firstQ?.bookCode||'',
    header:draftPreviewData?.header ?? newExamHeader(), appearance:draftPreviewData?.appearance ?? loadAppearance() };
  showExamPreview(draftPreviewData, qs);
};
window.openSaveModal = async () => {
  if (!selectedOrder.length) { UI.toast('請先選題','warning'); return; }
  document.getElementById('saveErr').classList.add('hidden');
  document.getElementById('saveModal').classList.remove('hidden');
};
window.doSaveExam = async () => {
  const title = document.getElementById('examTitle').value.trim();
  if (!title) { document.getElementById('saveErr').textContent='請填寫試卷名稱'; document.getElementById('saveErr').classList.remove('hidden'); return; }
  let totalScore=0; const typeScores={};
  selectedOrder.forEach(id=>{const q=selQuestions[id];if(!q)return;const inp=document.getElementById('sc-'+q.type);const score=inp?Number(inp.value)||2:2;typeScores[q.type]=score;totalScore+=score;});
  const firstQ = selQuestions[selectedOrder[0]];
  const exam = {
    title, header: draftPreviewData?.header ?? newExamHeader(), appearance: draftPreviewData?.appearance ?? loadAppearance(), description: document.getElementById('examDesc').value.trim(),
    subjectCode: firstQ?.subjectCode||'', bookCode: firstQ?.bookCode||'',
    totalScore, typeScores, questionIds:[...selectedOrder],
    questionCount: selectedOrder.length, composeMode:'manual',
  };
  try {
    await DataService.saveExam(exam);
    draftPreviewData = null;
    UI.toast('試卷已儲存！','success');
    document.getElementById('saveModal').classList.add('hidden');
  } catch(e) { document.getElementById('saveErr').textContent='儲存失敗：'+e.message; document.getElementById('saveErr').classList.remove('hidden'); }
};

window.autoManualScores = () => {
  const counts = {};
  selectedOrder.forEach(id => { const q=selQuestions[id]; counts[q.type]=(counts[q.type]||0)+1; });
  Object.assign(TYPE_SCORES, allocateTypeScores(Object.entries(counts).map(([code,cnt])=>({code,cnt})), {T1:1,T2:1,T3:2,T4:1,T5:3,T6:5},100,0.5));
  renderSelected();
};
window.adjustManualScore = (type,direction) => {
  const input=document.getElementById('sc-'+type);
  input.value=Math.min(100,Math.max(0.5,(Number(input.value)||0)+direction*0.5));
  updateManualScore(type,input);
  input.focus();
};
window.updateManualScore = (type, input) => {
  TYPE_SCORES[type] = Number(input.value);
  calcTotal();
};
window.goManualStep = n => {
  if (n > 1 && !document.querySelector('.chap-cb:checked')) { UI.toast('請勾選至少一個章節','warning'); return; }
  if (n > 2 && !selectedOrder.length) { UI.toast('請先選擇題目','warning'); return; }
  if (n > 3 && [...document.querySelectorAll('#scoreCfg input')].some(input => !input.checkValidity() || !Number.isFinite(Number(input.value)))) { UI.toast('請輸入有效配分（0.5 至 100 分）','warning'); return; }
  for (let i=1;i<=5;i++) {
    document.getElementById('manualPanel'+i).hidden = i !== n;
    const step = document.getElementById('manualStep'+i);
    step.classList.toggle('active',i===n); step.classList.toggle('done',i<n);
    if(i===n) step.setAttribute('aria-current','step'); else step.removeAttribute('aria-current');
  }
  document.getElementById('manualProgressFill').style.width = `${n*20}%`;
  document.getElementById('manualProgressTrack').setAttribute('aria-valuenow',String(n));
  document.getElementById('manualProgressTrack').setAttribute('aria-valuetext',`第 ${n} 步，共 5 步`);
  if (n===2) {
    const typeFilter=document.getElementById('fType');
    const diffFilter=document.getElementById('fDiff');
    const keyword=document.getElementById('fKeyword');
    const previous=[typeFilter.value,diffFilter.value,keyword.value];
    typeFilter.value=diffFilter.value=keyword.value='';
    applyFilters();
    const allowed=new Set(filtered.map(q=>q.id));
    selectedOrder.filter(id=>!allowed.has(id)).forEach(id=>{ selectedIds.delete(id); delete selQuestions[id]; });
    selectedOrder=selectedOrder.filter(id=>allowed.has(id));
    [typeFilter.value,diffFilter.value,keyword.value]=previous;
    applyFilters(); renderSelected();
  }
  if (n===3) renderSelected();
  if (n===4) {
    draftPreviewData ??= { header:newExamHeader(), appearance:loadAppearance() };
    const groups = {};
    selectedOrder.forEach(id => { const q=selQuestions[id]; groups[q.type]=(groups[q.type]||0)+1; });
    document.getElementById('manualSummary').innerHTML = `<div class="exam-summary-table-wrap"><table class="exam-summary-table"><thead><tr><th>題型</th><th>題數</th><th>每題配分</th><th>小計</th></tr></thead><tbody>${Object.entries(groups).map(([type,count])=>`<tr><td>${QUESTION_TYPES[type]}</td><td>${count}</td><td>${TYPE_SCORES[type]}</td><td>${count*TYPE_SCORES[type]}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">共 ${selectedOrder.length} 題，${document.getElementById('totalScoreVal').textContent}</td></tr></tfoot></table></div>`;
    mountInlineHeaderEditor(document.getElementById('manualHeaderFields'),draftPreviewData,()=>{},()=>goManualStep(4));
    document.querySelector('#manualHeaderFields .ep-inline-header-actions')?.remove();
  }
  if (n===5) {
    document.getElementById('manualPreviewTools').replaceChildren();
    previewSelected();
    const modal=document.getElementById('epModal');
    document.getElementById('manualExamPreview').append(modal);
    modal.classList.add('compose-inline-preview'); modal.removeAttribute('aria-modal');
    modal.querySelectorAll('.modal-header button').forEach(button=>{
      if(!button.classList.contains('modal-close') && button.id!=='epFullscreenToggle') document.getElementById('manualPreviewTools').append(button);
    });
    window._epClose=()=>goManualStep(4);
  }
  window.scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('manualStep1').setAttribute('aria-current','step');
renderScopeCatalog();
</script>
</body>
</html>
