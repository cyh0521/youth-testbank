<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>題本列印 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css?v=20261125-download-spacing">
<link rel="stylesheet" href="css/process-bar.css">
<link rel="stylesheet" href="css/exam-compose.css?v=20261012-chapter-controls-18">

<link rel="stylesheet" href="css/site-redesign.css?v=20261016-yellow-titles">
<link rel="stylesheet" href="css/compose-redesign.css?v=20261125-coded-four-steps">
<link rel="stylesheet" href="css/compose-papercraft.css?v=20261125-accounts-ui">
<link rel="stylesheet" href="css/selection-preview.css?v=20261125-four-step-previews">
</head>
<body class="booklet-page booklet-selection-page selection-redesign-page">
<script src="js/icons.js"></script>
<script src="js/core.js?v=20261008-choice-images"></script>
<div class="layout">
<div class="paper-corner paper-corner--left" aria-hidden="true"><svg viewBox="0 0 120 145"><g style="filter:drop-shadow(2px 3px 2px #66543429)"><path d="M-5-4 112-4 17 91-5 110Z" fill="#dacaac"/><path d="M-5-4 112-4 17 89" fill="#f0e4c9"/></g><g style="filter:drop-shadow(2px 4px 2px #43563730)"><path d="M-5 14 90-2 4 135-5 126Z" fill="#94a586"/><path d="M-5 14 90-2 29 58Z" fill="#bfcaab"/><path d="M29 58 90-2 4 135Z" fill="#a9b89a"/></g><g style="filter:drop-shadow(1px 2px 1px #7e663329)"><path d="M-5-3 43-3-5 45Z" fill="#ddbf77"/><path d="M-5-3 43-3-5 38Z" fill="#edda9e"/></g></svg></div>
<div class="paper-corner paper-corner--right" aria-hidden="true"><svg viewBox="0 0 120 145"><g style="filter:drop-shadow(2px 3px 2px #66543429)"><path d="M-5-4 108-4 17 91-5 110Z" fill="#dacaac"/><path d="M-5-4 108-4 17 89" fill="#f0e4c9"/></g><g style="filter:drop-shadow(2px 4px 2px #43563730)"><path d="M-5 14 87-2 4 123-5 118Z" fill="#94a586"/><path d="M-5 14 87-2 29 58Z" fill="#bfcaab"/><path d="M29 58 87-2 4 123Z" fill="#a9b89a"/></g><g style="filter:drop-shadow(1px 2px 1px #7e663329)"><path d="M-5-3 35-3-5 37Z" fill="#ddbf77"/><path d="M-5-3 35-3-5 31Z" fill="#edda9e"/></g></svg></div>


  <header class="site-header" id="sidebar"></header>
  <script src="js/shell.js?v=20261019-user-guide"></script>
  <div class="main" inert>

    <div class="page-content">
      <header class="compose-page-heading"><div class="compose-page-title"><h1>題本列印</h1><p>依章節製作整冊或部分題本</p></div><section class="import-progress" aria-label="題本列印流程" style="--process-step-count:2;--process-initial-width:50%">
        <div class="steps" role="list">
          <div class="step active" id="bookletStep1" role="listitem" aria-current="step"><span class="step-num">1</span><span class="step-copy"><strong>出題範圍</strong></span></div>
          <div class="step" id="bookletStep2" role="listitem"><span class="step-num">2</span><span class="step-copy"><strong>預覽題本</strong></span></div>
        </div>
        <div class="import-progress-track" id="bookletProgressTrack" role="progressbar" aria-label="題本列印進度" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1" aria-valuetext="第 1 步，共 2 步"><div class="import-progress-fill" id="bookletProgressFill"></div></div>
      </section></header>
      <div class="booklet-layout compose-layout"><section id="bookletPanel1"><div id="examScope"></div></section>
      <section id="bookletPanel2" hidden>
        <div class="scope-layout"><div class="card" style="grid-column:1/-1"><div class="card-header"><div class="scope-title"><h2>預覽題本</h2><span class="type-title-note">︱確認題本呈現</span></div><div class="scope-header-actions"><button type="button" class="btn btn-previous btn-sm" onclick="goBookletStep(1)"><svg class="step-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 6-6 6 6 6"/><path d="m18 6-6 6 6 6" stroke-opacity=".5"/></svg>上一步</button><div id="bookletPreviewTools" class="compose-preview-tools"></div></div></div><div id="bookletPreview" class="selection-preview-body compose-preview-layout"><div id="bookletScopePreview"></div><div id="bookletExamPreview"></div></div></div></div>
      </section></div>
    </div>
  </div>
</div>
<script type="module">
import { renderScopePanel, mountScopeSelector } from './js/exam-scope.js?v=20261124-empty-chart';
import { showExamPreview, mountInlinePreviewLayout, loadAppearance } from './js/exam-preview.js?v=20261125-shared-preview';
import { guardPage } from './js/auth-guard.js';
window._activeNav = 'booklet';
const user = await guardPage(['admin','manager','teacher']);
if (!user) throw new Error('not auth');
await initTextbookCache();
document.getElementById('examScope').innerHTML = renderScopePanel({nextAction:'goBookletStep(2)', nextLabel:'預覽題本'});
document.getElementById('cSubject').innerHTML = tbSubjectOptions();
let bookletData = {title:'題本', booklet:true, appearance:loadAppearance()};
let scopeRevision = 0;
let previewRevision = -1;
const scopeSelector = mountScopeSelector({cache:_tbCache, dataService:DataService, onChange(questions, selected, reason) {
  scopeRevision++;
  if (reason === 'book') bookletData = {title:'題本', booklet:true, appearance:bookletData.appearance};
}});
window.goBookletStep = n => {
  if (n === 2) {
    if (!scopeSelector.getSelectedChapters().length) { UI.toast('請勾選至少一個章節','warning'); return; }
    const questions = scopeSelector.getQuestions();
    if (!questions.length) { UI.toast('所選命題範圍尚無題目，請重新選擇章節。','warning'); return; }
    if (previewRevision !== scopeRevision) {
      const bookName = document.getElementById('cBook').selectedOptions[0]?.textContent.trim() || '';
      bookletData.title = `${bookName}題本`;
      bookletData.chapterCatalog = scopeSelector.getChapterCatalog();
      showExamPreview(bookletData, questions, {scopeDisplay:'grouped'});
      const modal = mountInlinePreviewLayout(document.getElementById('bookletScopePreview'), document.getElementById('bookletExamPreview'));
      const tools = document.getElementById('bookletPreviewTools');
      const appearanceButton = document.getElementById('epAppearanceToggle');
      const printButton = document.querySelector('button[onclick="window._epDoPrint()"]');
      const downloadButton = document.querySelector('button[onclick="window._epDoExport()"]');
      [printButton, downloadButton].forEach(button => {
        button.classList.remove('btn-ghost');
        button.classList.add('btn-primary');
      });
      tools.append(appearanceButton, printButton, downloadButton);
      previewRevision = scopeRevision;
    }
  }
  for (let i=1;i<=2;i++) {
    document.getElementById('bookletPanel'+i).hidden = i !== n;
    const step = document.getElementById('bookletStep'+i);
    step.classList.toggle('active',i===n);
    step.classList.toggle('done',i<n);
    if (i===n) step.setAttribute('aria-current','step'); else step.removeAttribute('aria-current');
  }
  document.getElementById('bookletProgressFill').style.width = (n * 50) + '%';
  document.getElementById('bookletProgressTrack').setAttribute('aria-valuenow',String(n));
  document.getElementById('bookletProgressTrack').setAttribute('aria-valuetext',`第 ${n} 步，共 2 步`);
  document.querySelector('.page-content').scrollTo({top:0,behavior:'smooth'});
};
</script>
<script src="js/selection-redesign.js?v=20261013"></script>
</body>
</html>
