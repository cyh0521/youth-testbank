<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼獅文化線上命題系統 — 登入</title>
<link rel="stylesheet" href="css/theme.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<script>try{sessionStorage.removeItem('youth.shellRole');}catch{}</script>
<style>
body{min-height:100vh;background:#eef2f1;overflow-x:hidden}
.page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(440px,.92fr)}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(32px,5vw,76px);color:#fff;background:linear-gradient(145deg,#112e39 0%,#183f47 50%,#245b5a 100%)}
.hero::before{content:'';position:absolute;z-index:-1;width:78vmin;height:78vmin;right:-20vmin;top:13%;border:1px solid rgba(232,205,142,.2);border-radius:50%;box-shadow:0 0 0 70px rgba(255,255,255,.025),0 0 0 140px rgba(255,255,255,.018);animation:float 12s ease-in-out infinite alternate}
.hero::after{content:'';position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 78% 32%,rgba(193,168,100,.19),transparent 33%),radial-gradient(circle at 5% 100%,rgba(116,183,172,.18),transparent 45%)}
.hero-grid{position:absolute;inset:0;z-index:-1;opacity:.24;background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(90deg,transparent 12%,#000 100%)}
.brand{display:inline-flex;align-items:center;align-self:flex-start;gap:14px;padding:0 0 17px;border-bottom:1px solid rgba(255,255,255,.28)}
.brand-mark{display:grid;place-items:center;width:37px;height:35px;flex:none}
.brand-mark img{display:block;width:37px;height:auto;max-height:32px;object-fit:contain}
.brand-name{color:#fff;font-size:1.12rem;font-weight:800;letter-spacing:.17em;line-height:1}
.hero-watermark{position:absolute;z-index:-1;width:min(55vw,650px);right:-15%;bottom:7%;opacity:.055;transform:rotate(-8deg);pointer-events:none;animation:mark-drift 14s ease-in-out infinite alternate}
.hero-copy{max-width:680px;position:relative;padding:40px 0;margin:auto 0}
.hero-copy .brand{margin-bottom:38px}
.eyebrow{display:flex;align-items:center;gap:11px;color:#e8d3a3;font-size:.72rem;font-weight:700;letter-spacing:.24em;margin-bottom:15px}
.eyebrow::before{content:'';width:28px;height:2px;background:currentColor}
.hero h1{font-family:var(--font-serif);font-size:clamp(2.45rem,4.2vw,4.65rem);font-weight:800;line-height:1.32;letter-spacing:.035em;text-wrap:balance}
.title-main{display:inline-block;position:relative;color:#fff;font-weight:900;letter-spacing:.07em;padding-bottom:.23em}
.title-main::after{content:'';position:absolute;left:0;bottom:0;width:43%;height:5px;border-radius:8px;background:linear-gradient(90deg,#d7b777,#f2dca5 72%,transparent)}
.title-main::before{content:'';position:absolute;width:9px;height:9px;right:-20px;top:7px;border-radius:50%;background:#e5c98e;box-shadow:0 0 20px rgba(229,201,142,.65)}
.hero-copy p{font-size:clamp(1rem,1.35vw,1.2rem);color:#d0e2dd;line-height:1.9;margin-top:26px;letter-spacing:.08em}
.hero-foot{font-size:.72rem;color:#a8c1bd;letter-spacing:.12em}
.login-side{display:flex;align-items:center;justify-content:center;padding:48px 5vw;background:radial-gradient(circle at 95% 5%,#fff 0%,transparent 43%),#f4f6f4}
.wrap{width:100%;max-width:430px}
.form-heading{margin-bottom:32px}.form-heading .overline{font-size:.72rem;font-weight:800;color:#a07a39;letter-spacing:.23em}.form-heading h2{font-size:2rem;letter-spacing:.05em;color:#183b43;margin-top:8px}.form-heading p{font-size:.88rem;color:#738386;margin-top:8px}
.card{background:#fff;border:1px solid #e3e9e6;border-radius:22px;box-shadow:0 25px 75px rgba(24,59,67,.09);overflow:hidden}
/* panels */
.panel{display:none;padding:32px}.panel.active{display:block}
/* msg */
.msg{border-radius:var(--radius);padding:9px 13px;font-size:.83rem;margin-bottom:12px;display:none;border:1px solid}
.msg.show{display:block}
.msg.err{background:#fef0ef;color:#c0392b;border-color:#f5c6c2}
.msg.ok{background:#f0faf4;color:#1a5c33;border-color:#a8d5b5}
.msg.warn{background:#fef9e7;color:#7c5000;border-color:#ffe082}
/* form */
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:.81rem;font-weight:700;color:#39555a;margin-bottom:8px}
.req{color:var(--danger);margin-left:2px}
.form-control{width:100%;padding:13px 15px;border:1px solid #dce5e2;border-radius:11px;font-size:.9rem;font-family:var(--font-sans);color:var(--text-primary);background:#fbfcfb;transition:border-color .15s,box-shadow .15s}
.form-control:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(44,95,138,.12)}
.big-btn{width:100%;padding:14px;border:none;border-radius:11px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:var(--font-sans);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.big-btn.primary{background:#1d5557;color:white;box-shadow:0 8px 20px rgba(29,85,87,.18)}
.big-btn.primary:hover:not(:disabled){background:#163f42;transform:translateY(-2px);box-shadow:0 12px 24px rgba(29,85,87,.22)}
.big-btn.accent{background:var(--accent);color:white}
.big-btn.accent:hover:not(:disabled){background:var(--accent-light);transform:translateY(-1px)}
.big-btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.hint{background:#f5f8f6;border-radius:10px;padding:12px 14px;font-size:.76rem;color:#667b7b;line-height:1.8;margin-top:24px}
.hint strong{color:#315d5b;display:block;margin-bottom:2px}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:.78rem;color:var(--text-muted)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite}
#fbStatus{text-align:center;font-size:.75rem;margin-top:10px;color:var(--text-secondary)}
#fbStatus.err{color:#ff8a80}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(-28px,22px) scale(1.06)}}
@keyframes mark-drift{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-24px) rotate(-5deg)}}
@media(max-width:800px){.page{grid-template-columns:1fr}.hero{min-height:300px;padding:28px 32px}.hero-copy{padding:35px 0 20px}.hero h1{font-size:clamp(2rem,6vw,3rem)}.hero-copy p{margin-top:10px}.hero-foot{display:none}.login-side{padding:42px 20px 60px}.form-heading{margin-bottom:22px}}
@media(max-width:480px){.hero{min-height:255px;padding:22px}.brand{gap:10px;padding-bottom:11px}.brand-mark{width:29px;height:27px}.brand-mark img{width:29px;max-height:25px}.brand-name{font-size:.9rem}.hero-watermark{width:75vw;right:-25%}.hero-copy{padding:25px 0 12px}.hero-copy .brand{margin-bottom:24px}.eyebrow{font-size:.62rem;margin-bottom:10px}.hero h1{font-size:1.9rem}.title-main::after{height:3px}.hero-copy p{font-size:.9rem}.login-side{padding:30px 16px 48px}.panel{padding:24px}.form-heading h2{font-size:1.7rem}}
@media(prefers-reduced-motion:reduce){.hero::before,.hero-watermark{animation:none}.big-btn{transition:none}}
</style>
</head>
<body>
<main class="page">
  <section class="hero" aria-labelledby="page-title">
    <div class="hero-grid" aria-hidden="true"></div>
    <img class="hero-watermark" src="img/youth.png" alt="" aria-hidden="true">
    <div class="hero-copy">
      <div class="brand"><span class="brand-mark"><img src="img/youth.png" alt=""></span><span class="brand-name">幼獅文化</span></div>
      <div class="eyebrow">TEACHING STARTS HERE</div>
      <h1 id="page-title"><span class="title-main">線上命題系統</span></h1>
      <p>讓每一道好題，成為教學的起點。</p>
    </div>
    <div class="hero-foot">YOUTH CULTURAL ENTERPRISE CO., LTD.</div>
  </section>
  <section class="login-side" aria-label="帳號登入">
  <div class="wrap">
    <div class="form-heading"><div class="overline">WELCOME BACK</div><h2>歡迎回來</h2><p>登入帳號，開始您的命題工作。</p></div>
  <div class="card">


    <!-- ── 登入 ── -->
    <div class="panel active" id="panel-login">
      <div class="msg err" id="loginErr"></div>
      <div class="msg ok"  id="loginOk"></div>

      <div class="form-group">
        <label class="form-label">電子信箱 <span class="req">*</span></label>
        <input class="form-control" type="email" id="loginEmail" placeholder="請輸入電子信箱"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-group">
        <label class="form-label">密碼 <span class="req">*</span></label>
        <input class="form-control" type="password" id="loginPw" placeholder="請輸入密碼"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="big-btn primary" id="loginBtn" onclick="doLogin()">登　入</button>
      <div class="hint">
        <strong>說明</strong>
        教師帳號請聯繫幼獅業務同仁協助申請。
      </div>
      <div style="text-align:center;margin-top:12px;font-size:.78rem;color:var(--text-muted)">
        第一次使用？<a onclick="showPanel('init')" style="color:var(--primary);cursor:pointer">初始化管理員</a>
      </div>
    </div>

    <!-- ── 初始化管理員 ── -->
    <div class="panel" id="panel-init">
      <div class="msg err" id="initErr"></div>
      <div style="background:#fef9e7;border:1px solid #ffe082;border-radius:var(--radius);padding:9px 13px;font-size:.8rem;color:#7c5000;margin-bottom:14px">
        ⚠ 僅供第一次建立系統管理員帳號使用。
      </div>
      <div class="form-group">
        <label class="form-label">管理員驗證碼 <span class="req">*</span></label>
        <input class="form-control" type="password" id="initCode" placeholder="admin2024">
      </div>
      <div class="form-group">
        <label class="form-label">電子信箱 <span class="req">*</span></label>
        <input class="form-control" type="email" id="initEmail">
      </div>
      <div class="form-group">
        <label class="form-label">姓名 <span class="req">*</span></label>
        <input class="form-control" id="initName">
      </div>
      <div class="form-group">
        <label class="form-label">密碼 <span class="req">*</span></label>
        <input class="form-control" type="password" id="initPw" placeholder="至少 6 字元">
      </div>
      <div class="form-group">
        <label class="form-label">確認密碼 <span class="req">*</span></label>
        <input class="form-control" type="password" id="initPw2">
      </div>
      <button class="big-btn primary" id="initBtn" onclick="doInitAdmin()">建立管理員帳號</button>
      <div style="text-align:center;margin-top:12px;font-size:.82rem;color:var(--text-secondary)">
        <a onclick="showPanel('login')" style="color:var(--primary);cursor:pointer;font-weight:600">返回登入</a>
      </div>
    </div>
  </div>
  <div id="fbStatus">連線中…</div>
  </div>
  </section>
</main>

<script type="module">
import { initializeApp }                          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc,
         serverTimestamp }                         from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword,
         createUserWithEmailAndPassword,
         signOut, onAuthStateChanged,
         setPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey:            "AIzaSyAESI-xumpIXZTymeKHNnJMhBwZ5V6OQiQ",
  authDomain:        "youth-testbank.firebaseapp.com",
  projectId:         "youth-testbank",
  storageBucket:     "youth-testbank.firebasestorage.app",
  messagingSenderId: "703759738861",
  appId:             "1:703759738861:web:6e6e75eca40f67d808e9e4",
};

let app, db, auth;
try {
  app  = initializeApp(firebaseConfig);
  db   = getFirestore(app);
  auth = getAuth(app);
  
  // 設定 Session 持久性：關閉瀏覽器分頁後登入狀態失效
  await setPersistence(auth, browserSessionPersistence);
  
  document.getElementById('fbStatus').textContent = '';
  onAuthStateChanged(auth, async u => {
    if (!u) return;
    try {
      const snap = await getDoc(doc(db, 'users', u.uid));
      if (snap.exists()) window.location.href = 'dashboard.html';
    } catch(e) {}
  });
} catch(e) {
  document.getElementById('fbStatus').textContent = '⚠ Firebase 連線失敗：'+e.message;
  document.getElementById('fbStatus').className = 'err';
}

// ── 登入／初始化面板 ──────────────────────────────
window.showPanel = name => {
  ['login','init'].forEach(n => {
    document.getElementById('panel-'+n).classList.toggle('active', n===name);
  });
  ['loginErr','loginOk','initErr'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.className = el.className.replace(' show',''); }
  });
};

function showMsg(id, text, type='err') {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = `msg ${type} show`;
}
function hideMsg(id) {
  const el = document.getElementById(id);
  if (el) el.className = el.className.replace(' show','');
}

// ── 登入 ─────────────────────────────────────────
window.doLogin = async () => {
  hideMsg('loginErr'); hideMsg('loginOk');
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value;
  const btn   = document.getElementById('loginBtn');
  if (!email) return showMsg('loginErr','請輸入電子信箱');
  if (!pw)    return showMsg('loginErr','請輸入密碼');

  btn.disabled = true; btn.innerHTML = '<div class="spin"></div> 登入中…';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pw);
    const snap = await getDoc(doc(db, 'users', cred.user.uid));
    if (!snap.exists()) {
      await signOut(auth);
      btn.disabled=false; btn.textContent='登　入';
      return showMsg('loginErr','找不到使用者資料，請聯絡管理員');
    }
    const role = snap.data().role;
    if (!['admin','teacher'].includes(role)) {
      await signOut(auth);
      btn.disabled=false; btn.textContent='登　入';
      return showMsg('loginErr','此系統僅供管理員與教師使用','warn');
    }
    window.location.href = 'dashboard.html';
  } catch(e) {
    btn.disabled=false; btn.innerHTML='登　入';
    const m = {
      'auth/user-not-found':'帳號不存在',
      'auth/wrong-password':'密碼錯誤',
      'auth/invalid-credential':'帳號或密碼錯誤',
      'auth/invalid-email':'電子信箱格式錯誤',
      'auth/too-many-requests':'嘗試次數過多，請稍後再試',
      'auth/network-request-failed':'網路連線失敗',
    };
    showMsg('loginErr', m[e.code]||('登入失敗：'+e.message));
  }
};

// ── 初始化管理員 ─────────────────────────────────
window.doInitAdmin = async () => {
  hideMsg('initErr');
  const code = document.getElementById('initCode').value.trim();
  const email= document.getElementById('initEmail').value.trim();
  const name = document.getElementById('initName').value.trim();
  const pw   = document.getElementById('initPw').value;
  const pw2  = document.getElementById('initPw2').value;
  const btn  = document.getElementById('initBtn');

  if (code!=='admin2024') return showMsg('initErr','驗證碼錯誤');
  if (!email)             return showMsg('initErr','請輸入電子信箱');
  if (!name)              return showMsg('initErr','請輸入姓名');
  if (pw.length<6)        return showMsg('initErr','密碼至少 6 字元');
  if (pw!==pw2)           return showMsg('initErr','兩次密碼不一致');

  btn.disabled=true; btn.innerHTML='<div class="spin"></div> 建立中…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await setDoc(doc(db,'users',cred.user.uid),{
      email, displayName:name, role:'admin', school:null, createdAt:serverTimestamp()
    });
    await signOut(auth);
    btn.disabled=false; btn.textContent='建立管理員帳號';
    ['initCode','initEmail','initName','initPw','initPw2'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.value='';
    });
    showPanel('login');
    document.getElementById('loginEmail').value = email;
    showMsg('loginOk',`✅ 管理員帳號「${name}」建立成功！請輸入密碼登入。`,'ok');
  } catch(e) {
    btn.disabled=false; btn.textContent='建立管理員帳號';
    const m={
      'auth/email-already-in-use':'此信箱已被使用',
      'auth/invalid-email':'電子信箱格式錯誤',
      'auth/network-request-failed':'網路連線失敗',
    };
    showMsg('initErr', m[e.code]||('建立失敗：'+e.message));
  }
};
</script>
</body>
</html>
