<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試卷管理 — 幼獅題庫系統</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">
<script>if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed");</script>
<style>
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-row select{max-width:180px}
.exam-sort-heading{display:inline-flex;align-items:center;gap:5px;padding:0;border:0;background:none;color:inherit;font:inherit;font-weight:inherit;text-align:left;cursor:pointer}
.exam-sort-heading:hover{color:var(--primary)}
.exam-sort-heading:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:2px}
.exam-sort-indicator{min-width:1em;color:var(--primary)}

/* 試卷編輯 Modal */
.edit-basic-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.edit-basic-fields .form-group{margin-bottom:0}
@media(max-width:600px){.edit-basic-fields{grid-template-columns:1fr}}
#editModal .modal{display:flex;flex-direction:column;max-height:90vh;overflow:hidden}
#editModal .modal-header{position:relative;top:auto;flex:none}
#editModal .modal-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#editModal.is-fullscreen{left:var(--sidebar-width);padding:0}
.sidebar-collapsed #editModal.is-fullscreen{left:var(--sidebar-collapsed-width)}
#editModal.is-fullscreen .modal{width:100%;max-width:none;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;border:0;border-radius:0}
#editModal.is-fullscreen #editQList{max-height:none!important;min-height:50vh}
#editModal .edit-fullscreen-icon-restore{display:none}
#editModal.is-fullscreen .edit-fullscreen-icon-expand{display:none}
#editModal.is-fullscreen .edit-fullscreen-icon-restore{display:block}
.edit-q-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border-light);font-size:.9rem}
.edit-q-section{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 12px;background:var(--bg-base);border-top:1px solid var(--border);border-bottom:1px solid var(--border-light);font-size:.9rem;font-weight:700;color:var(--text-primary)}
.edit-q-section:first-child{border-top:0}
.edit-q-score{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:.9rem;font-weight:400}
.edit-q-score input{width:64px;padding:3px 5px;text-align:center;font-size:.9rem}
.edit-type-order-list{display:grid;gap:7px}
.edit-type-order-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:6px;background:white;font-size:.88rem;cursor:grab}
.edit-type-order-item:active{cursor:grabbing}
.edit-type-order-item.dragging{opacity:.45}
.edit-type-order-item.drop-before{border-top:3px solid var(--primary)}
.edit-type-order-item.drop-after{border-bottom:3px solid var(--primary)}
.edit-type-order-handle{color:var(--text-muted);font-weight:700}
.edit-q-item:last-child{border-bottom:none}
.edit-q-item:hover{background:#faf8f5}
.eq-num{color:var(--text-muted);font-size:.9rem;width:22px;flex-shrink:0;text-align:right}
.eq-qnum{font-family:var(--font-mono);font-size:.9rem;background:#e8eef6;color:var(--primary);padding:1px 5px;border-radius:3px;flex-shrink:0}
.eq-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-q-item .badge{font-size:.9rem}
.eq-remove{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0 3px;font-size:.9rem;flex-shrink:0}
.eq-remove:hover{color:var(--danger)}
.drag-handle{cursor:grab;color:var(--text-muted);font-size:.9rem;flex-shrink:0}
.eq-item.dragging{opacity:.4}.eq-item.drag-over{border-top:2px solid var(--primary-light)}
.edit-header-sample{padding:10px 14px;margin-bottom:12px;border-bottom:2px solid #333;color:#000;background:#f5f3ee;line-height:1.6}
.edit-header-sample .ep-exam-header{border:0;padding:0;margin:0}
.edit-header-sample .ep-header-row{display:flex;flex-wrap:wrap;gap:4px 20px}
.edit-header-sample .ep-header-row span{white-space:pre-wrap}
.edit-header-sample .ep-header-row+.ep-header-row{margin-top:6px}
.edit-header-sample .title-row{font-size:1.05em;font-weight:700;column-gap:.5em}
</style>
</head>
<body>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="js/shell.js"></script>
  <div class="main" inert>
    <div class="topbar">
      <span class="topbar-title">試卷管理</span>
    </div>
    <div class="page-content">
      <section id="listView" class="card recent-section">
        <div class="filter-row">
          <input class="form-control" id="searchInput" placeholder="🔍 搜尋試卷名稱…" oninput="filterExams()" style="max-width:220px">
          <select class="form-control" id="bookFilter" aria-label="篩選冊別" onchange="filterExams()"><option value="">全部冊別</option></select>
          <span style="font-size:.88rem;color:var(--text-muted);margin-left:auto" id="examCount"></span>
        </div>
        <div class="table-wrapper"><table class="data-table recent-table"><colgroup><col class="recent-col-title"><col class="recent-col-subject"><col class="recent-col-count"><col class="recent-col-date"><col class="recent-col-actions"></colgroup><thead><tr><th data-sort-field="title"><button class="exam-sort-heading" type="button" onclick="setExamSort('title')">試卷名稱<span class="exam-sort-indicator" aria-hidden="true"></span></button></th><th data-sort-field="subject"><button class="exam-sort-heading" type="button" onclick="setExamSort('subject')">科目（冊別）<span class="exam-sort-indicator" aria-hidden="true"></span></button></th><th data-sort-field="questionCount"><button class="exam-sort-heading" type="button" onclick="setExamSort('questionCount')">題數<span class="exam-sort-indicator" aria-hidden="true"></span></button></th><th data-sort-field="createdAt"><button class="exam-sort-heading" type="button" onclick="setExamSort('createdAt')">建立時間<span class="exam-sort-indicator" aria-hidden="true"></span></button></th><th>操作</th></tr></thead><tbody id="examList"><tr><td colspan="5" class="dash-empty">載入中…</td></tr></tbody></table></div>
      </section>
    </div>
  </div>
</div>

<!-- 試卷編輯 Modal -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal modal-xl">
    <div class="modal-header">
      <h3 id="editTitle">編輯試卷</h3>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn btn-ghost btn-sm" onclick="shuffleEditQs()" title="各題型內隨機重新排序"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h2.5a6 6 0 0 0 5.1-3l4.8-8a6 6 0 0 1 5.1-3H22M2 6h2.5a6 6 0 0 1 5.1 3l.5.8M14 17.2a6 6 0 0 0 5.5 2.8H22"/></svg>重新排序</button>
        <button class="btn btn-ghost btn-sm" id="editTypeOrderToggle" type="button" onclick="openEditTypeOrder()" aria-haspopup="dialog" aria-controls="editTypeOrderModal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="m8 3-2 3 2 3m8 6 2 3-2 3"/></svg>題型排序</button>
        <button class="btn btn-ghost btn-sm ep-panel-toggle" id="editHeaderToggle" onclick="toggleEditHeader()" aria-expanded="false" aria-controls="editHeaderPanel" title="設定試卷上方表頭資訊"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>試卷表頭</button>
        <button class="btn btn-outline btn-sm" onclick="previewEdit()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>預覽</button>
        <button class="btn btn-primary btn-sm" onclick="saveEdit()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>儲存</button>
        <button class="btn btn-ghost btn-sm" id="editFullscreenToggle" type="button" onclick="toggleEditFullscreen()" aria-pressed="false" aria-label="放大視窗" title="放大視窗"><svg class="edit-fullscreen-icon-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg><svg class="edit-fullscreen-icon-restore" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg><span id="editFullscreenLabel">放大</span></button>
        <button class="modal-close" onclick="closeEdit()">✕</button>
      </div>
    </div>
    <div class="modal-body" style="padding:16px 20px">
      <div id="editHeaderPanel" class="ep-inline-header hidden">
        <div id="editHeaderSample" class="edit-header-sample"></div>
        <div id="editHeaderFields"></div>
      </div>
      <!-- 基本資訊 -->
      <div class="edit-basic-fields">
        <div class="form-group">
          <label class="form-label" for="editExamTitle">試卷名稱 <span class="required">*</span></label>
          <input class="form-control" id="editExamTitle">
        </div>
        <div class="form-group">
          <label class="form-label" for="editExamDescription">說明</label>
          <input class="form-control" id="editExamDescription" placeholder="可填寫考試類型、試題範圍等資訊。">
        </div>
      </div>
      <div style="font-size:.9rem;color:var(--text-secondary);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
        <span>題目清單（可拖曳排序或移除）</span>
        <span id="editQCount" style="font-weight:600;color:var(--primary)"></span>
      </div>
      <div id="editQList" style="border:1px solid var(--border);border-radius:var(--radius);max-height:400px;overflow-y:auto;background:white"></div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="editTypeOrderModal" role="dialog" aria-modal="true" aria-labelledby="editTypeOrderTitle" style="z-index:1100">
  <div class="modal" style="max-width:460px;width:96%">
    <div class="modal-header"><h3 id="editTypeOrderTitle">題型排序</h3><button class="modal-close" type="button" onclick="closeEditTypeOrder()" aria-label="關閉">✕</button></div>
    <div class="modal-body">
      <p style="font-size:.88rem;color:var(--text-secondary);margin-bottom:12px">拖曳題型以調整試卷中的顯示順序。</p>
      <div id="editTypeOrderList" class="edit-type-order-list"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" type="button" onclick="closeEditTypeOrder()">取消</button><button class="btn btn-primary" type="button" onclick="applyEditTypeOrder()">套用順序</button></div>
  </div>
</div>

<script type="module">
import { guardPage } from './js/auth-guard.js';
import { confirmExamDeletion } from './js/confirm-exam-deletion.js';
import { showExamPreview, downloadExam, printWithPaperChoice, showHeaderSettings, loadHeader, loadAppearance, mountInlineHeaderEditor, buildHeaderHtml, fontStackById } from './js/exam-preview.js';
window.openHeaderSettings = showHeaderSettings;
window._activeNav = 'exams';
const user = await guardPage(['admin','manager','teacher']);
if (!user) throw new Error('not auth');
const canEdit = DataService.isAdmin() || DataService.isTeacher();

const TYPE_SCORES   = { T1:2, T2:2, T3:4, T4:2, T5:2, T6:10 };

let allExams     = [];
let allQuestions = {};  // id -> q
let editExamId   = null;
let editDraftExam = null;
let editQOrder   = [];  // array of question ids
let editQMap     = {};  // id -> q
let editTypeOrder = [];
let typeOrderDraft = [];
let draggedEditType = null;
let initialized  = false;
let examSortField = 'createdAt';
let examSortDirection = 'desc';
function examSubjectLabel(exam) {
  return window._tbCache?.subjectByCode?.[exam.subjectCode]?.name || SUBJECT_CODES[exam.subjectCode] || exam.subjectCode || '未指定科目';
}

// ── 載入 ─────────────────────────────────────────
async function init() {
  try {
    const [exams] = await Promise.all([DataService.getExams(), initTextbookCache().catch(() => null)]);
    allExams = exams;
    if (!initialized) {
      initialized = true;
      const requestedEdit = new URLSearchParams(location.search).get('edit');
      if (requestedEdit && canEdit) {
        const exam = allExams.find(item => item.id === requestedEdit);
        if (exam) await openEdit(exam.id);
        else UI.toast('找不到此試卷', 'warning');
      }
    }
    renderBookFilter();
    filterExams();
  } catch(e) {
    document.getElementById('examList').innerHTML =
      `<tr><td colspan="5" class="dash-empty">載入失敗：${UI.escapeHtml(e.message)}</td></tr>`;
  }
}

function bookFilterKey(exam) {
  return encodeURIComponent(JSON.stringify([exam.subjectCode || '', exam.bookCode || '']));
}

function renderBookFilter() {
  const select = document.getElementById('bookFilter');
  const selected = select.value;
  const subjects = window._tbCache?.subjects || [];
  const subjectOrder = new Map(subjects.map((subject, index) => [subject.code, index]));
  const bookOrder = new Map(subjects.flatMap(subject =>
    (window._tbCache?.booksBySubject?.[subject.id] || []).map((book, index) =>
      [bookFilterKey({subjectCode:subject.code, bookCode:book.code}), index]
    )
  ));
  const books = [...new Map(allExams.map(exam => [bookFilterKey(exam), exam])).entries()]
    .sort((a, b) =>
      (subjectOrder.get(a[1].subjectCode) ?? Infinity) - (subjectOrder.get(b[1].subjectCode) ?? Infinity) ||
      (bookOrder.get(a[0]) ?? Infinity) - (bookOrder.get(b[0]) ?? Infinity) ||
      examSubjectLabel(a[1]).localeCompare(examSubjectLabel(b[1]), 'zh-Hant') ||
      examBookName(a[1]).localeCompare(examBookName(b[1]), 'zh-Hant', {numeric:true})
    );
  const nameCounts = new Map();
  books.forEach(([, exam]) => nameCounts.set(examBookName(exam), (nameCounts.get(examBookName(exam)) || 0) + 1));
  select.innerHTML = '<option value="">全部冊別</option>' + books.map(([key, exam]) =>
    `<option value="${key}">${UI.escapeHtml(nameCounts.get(examBookName(exam)) > 1 ? `${examSubjectLabel(exam)}｜${examBookName(exam)}` : examBookName(exam))}</option>`
  ).join('');
  select.value = books.some(([key]) => key === selected) ? selected : '';
}

window.setExamSort = field => {
  if (!['title','subject','questionCount','createdAt'].includes(field)) return;
  examSortDirection = examSortField === field && examSortDirection === 'desc' ? 'asc' : 'desc';
  examSortField = field;
  filterExams();
};

function updateExamSortHeadings() {
  document.querySelectorAll('.recent-table th[data-sort-field]').forEach(th => {
    const active = th.dataset.sortField === examSortField;
    th.setAttribute('aria-sort', active ? (examSortDirection === 'asc' ? 'ascending' : 'descending') : 'none');
    th.querySelector('.exam-sort-indicator').textContent = active ? (examSortDirection === 'asc' ? '↑' : '↓') : '';
  });
}

window.filterExams = () => {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const book = document.getElementById('bookFilter').value;
  const list = allExams.filter(e =>
    (!kw || (e.title || '').toLowerCase().includes(kw)) &&
    (!book || bookFilterKey(e) === book)
  ).sort((a,b) => {
    let result;
    if (examSortField === 'createdAt') result = (new Date(a.createdAt || 0).getTime() || 0) - (new Date(b.createdAt || 0).getTime() || 0);
    else if (examSortField === 'questionCount') result = (Number(a.questionCount) || 0) - (Number(b.questionCount) || 0);
    else if (examSortField === 'subject') result = examSubjectLabel(a).localeCompare(examSubjectLabel(b), 'zh-Hant', {numeric:true}) || examBookName(a).localeCompare(examBookName(b), 'zh-Hant', {numeric:true});
    else result = (a.title || '').localeCompare(b.title || '', 'zh-Hant', {numeric:true});
    return (result || (a.title || '').localeCompare(b.title || '', 'zh-Hant', {numeric:true})) * (examSortDirection === 'asc' ? 1 : -1);
  });
  updateExamSortHeadings();
  document.getElementById('examCount').textContent = `共 ${list.length} 份試卷`;
  renderExams(list);
};

function examBookName(exam) {
  const subject = window._tbCache?.subjectByCode?.[exam.subjectCode];
  const books = window._tbCache?.booksBySubject?.[subject?.id] || [];
  return books.find(book => book.code === exam.bookCode)?.name || exam.bookName || exam.bookCode || '未指定冊別';
}

function renderExams(list) {
  const I = window.ICONS;
  const esc = UI.escapeHtml;
  const eye = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  document.getElementById('examList').innerHTML = list.map(e => {
    const tone = Math.max(0, Object.keys(SUBJECT_CODES).indexOf(e.subjectCode)) % 6;
    return `<tr>
      <td><span class="exam-name${e.description ? ' has-description' : ''}">${I.test20}<strong title="${esc(e.title || '（未命名）')}">${esc(e.title || '（未命名）')}</strong>${e.description ? `<span class="exam-description" title="${esc(e.description)}">${esc(e.description)}</span>` : ''}</span></td>
      <td><span class="subject-tag tone-${tone}" title="${esc(examBookName(e))}">${esc(examBookName(e))}</span></td>
      <td class="nowrap">${Number(e.questionCount) || 0} 題</td>
      <td class="exam-date">${esc(UI.formatDateTime(e.createdAt))}</td>
      <td><div class="recent-exam-actions">
        <button class="btn btn-sm btn-outline" onclick="previewExam('${e.id}')">${eye}預覽</button>
        ${canEdit ? `<button class="btn btn-sm btn-outline" onclick="openEdit('${e.id}')">${I.edit16}編輯</button>` : ''}
        <button class="btn btn-sm btn-ghost" onclick="printSavedExam('${e.id}')">${I.printer16}列印</button>
        <button class="btn btn-sm btn-primary" onclick="downloadWord('${e.id}')">${I.download16}下載</button>
        ${canEdit ? `<button class="btn btn-sm btn-danger" onclick="deleteExam('${e.id}')">${I.trash16}刪除</button>` : ''}
      </div></td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="dash-empty">${document.getElementById('searchInput').value.trim() || document.getElementById('bookFilter').value ? '找不到符合條件的試卷' : '尚無試卷，請先透過選題功能建立試卷'}</td></tr>`;
}

// ── 取得試卷題目 ─────────────────────────────────
async function loadExamQuestions(e) {
  const ids = e.questionIds || [];
  const qs = await DataService.getQuestionsByIds(ids);
  qs.forEach(q => { allQuestions[q.id] = q; });
}

function getExamQuestions(e) {
  // 從已快取的題目找，若無則回傳空（呼叫方需先用 loadExamQuestions）
  return (e.questionIds||[]).map(id => allQuestions[id]).filter(Boolean);
}

// ── 預覽 ─────────────────────────────────────────
window.previewExam = async (id) => {
  const e = allExams.find(x => x.id===id); if (!e) return;
  await loadExamQuestions(e);
  const qs = getExamQuestions(e);
  if (!qs.length) { UI.toast('此試卷無法載入題目', 'warning'); return; }
  showExamPreview(e, qs);
};

// ── 輸出 Word ────────────────────────────────────
window.downloadWord = async (id) => {
  const e = allExams.find(x => x.id===id); if (!e) return;
  await loadExamQuestions(e);
  const qs = getExamQuestions(e);
  if (!qs.length) { UI.toast('此試卷無法載入題目', 'warning'); return; }
  await downloadExam(e, qs, 'Word');
};

window.printSavedExam = async (id) => {
  const e = allExams.find(x => x.id===id); if (!e) return;
  await loadExamQuestions(e);
  const qs = getExamQuestions(e);
  if (!qs.length) { UI.toast('此試卷無法載入題目', 'warning'); return; }
  await printWithPaperChoice(e, qs);
};

// ── 刪除 ─────────────────────────────────────────
window.deleteExam = async (id, title = allExams.find(exam => exam.id === id)?.title || '') => {
  if (!await confirmExamDeletion(title)) return;
  try {
    await DataService.deleteExam(id);
    UI.toast('試卷已刪除', 'success');
    allExams = allExams.filter(e => e.id!==id);
    filterExams();
  } catch(e) { UI.toast('刪除失敗：'+e.message, 'danger'); }
};

// ── 編輯 Modal ───────────────────────────────────
window.openEdit = async (id) => {
  const e = allExams.find(x => x.id===id); if (!e) return;
  await loadExamQuestions(e);
  editExamId = id;
  editDraftExam = { id, header:{ ...(e.header ?? loadHeader()) }, appearance:{ ...(e.appearance ?? loadAppearance()) },
    onHeaderSaved:() => { e.header = { ...editDraftExam.header }; },
    onAppearanceSaved:() => { e.appearance = { ...editDraftExam.appearance }; } };
  editQOrder = [...(e.questionIds||[])];
  editQMap   = {};
  editQOrder.forEach(qid => { if (allQuestions[qid]) editQMap[qid] = allQuestions[qid]; });
  // Remove ids without question data
  editQOrder = editQOrder.filter(qid => editQMap[qid]);
  editTypeOrder = [...new Set([...(e.typeOrder || []), ...EDIT_TYPE_ORDER])];
  editQOrder = orderedEditTypes().flatMap(type => editQOrder.filter(id => editQMap[id].type === type));

  document.getElementById('editTitle').textContent = `編輯試卷：${e.title||''}`;
  document.getElementById('editExamTitle').value  = e.title || '';
  document.getElementById('editExamDescription').value = e.description || '';
  renderEditQList(e.typeScores||{});
  document.getElementById('editTypeOrderModal').classList.add('hidden');
  document.getElementById('editHeaderPanel').classList.add('hidden');
  document.getElementById('editHeaderToggle').setAttribute('aria-expanded', 'false');
  setEditFullscreen(false);
  document.getElementById('editModal').classList.remove('hidden');
};

function setEditFullscreen(fullscreen) {
  document.getElementById('editModal').classList.toggle('is-fullscreen', fullscreen);
  const button = document.getElementById('editFullscreenToggle');
  button.setAttribute('aria-pressed', String(fullscreen));
  button.setAttribute('aria-label', fullscreen ? '還原視窗' : '放大視窗');
  button.title = fullscreen ? '還原視窗' : '放大視窗';
  document.getElementById('editFullscreenLabel').textContent = fullscreen ? '還原' : '放大';
}
window.toggleEditFullscreen = () => {
  setEditFullscreen(!document.getElementById('editModal').classList.contains('is-fullscreen'));
};

function renderEditHeaderSample() {
  const sample = document.getElementById('editHeaderSample');
  sample.style.fontFamily = fontStackById(editDraftExam.appearance.font);
  sample.innerHTML = buildHeaderHtml(editDraftExam.header);
}
document.addEventListener('exam-header-saved', event => {
  const { id, header, source } = event.detail;
  const exam = allExams.find(item => item.id === id);
  if (exam) exam.header = { ...header };
  if (editExamId !== id || !editDraftExam || source === editDraftExam) return;
  editDraftExam.header = { ...header };
  if (!document.getElementById('editHeaderPanel').classList.contains('hidden')) {
    renderEditHeaderSample();
    mountInlineHeaderEditor(document.getElementById('editHeaderFields'), editDraftExam, renderEditHeaderSample, () => {
      document.getElementById('editHeaderPanel').classList.add('hidden');
      document.getElementById('editHeaderToggle').setAttribute('aria-expanded', 'false');
    });
  }
});
window.toggleEditHeader = () => {
  const panel = document.getElementById('editHeaderPanel');
  const expanded = !panel.classList.toggle('hidden');
  document.getElementById('editHeaderToggle').setAttribute('aria-expanded', String(expanded));
  if (expanded) {
    renderEditHeaderSample();
    mountInlineHeaderEditor(document.getElementById('editHeaderFields'), editDraftExam, renderEditHeaderSample, () => {
      panel.classList.add('hidden');
      document.getElementById('editHeaderToggle').setAttribute('aria-expanded', 'false');
    });
  }
};

const EDIT_TYPE_ORDER = ['T1','T2','T3','T4','T5','T6'];
const EDIT_TYPE_LABELS = {T1:'是非題',T2:'選擇題',T3:'複選題',T4:'填空題',T5:'配合題',T6:'問答題'};
const EDIT_ROMANS = ['一','二','三','四','五','六'];
function orderedEditTypes() {
  const present = [...new Set(editQOrder.map(id => editQMap[id]?.type).filter(Boolean))];
  return [...editTypeOrder.filter(type => present.includes(type)), ...present.filter(type => !editTypeOrder.includes(type))];
}

window.openEditTypeOrder = () => {
  typeOrderDraft = orderedEditTypes();
  renderEditTypeOrder();
  document.getElementById('editTypeOrderModal').classList.remove('hidden');
};

window.closeEditTypeOrder = () => {
  document.getElementById('editTypeOrderModal').classList.add('hidden');
  typeOrderDraft = [];
  draggedEditType = null;
};

function renderEditTypeOrder() {
  document.getElementById('editTypeOrderList').innerHTML = typeOrderDraft.map((type, index) =>
    `<div class="edit-type-order-item" draggable="true" data-type="${type}" ondragstart="editTypeDragStart(event)" ondragover="editTypeDragOver(event)" ondragleave="editTypeDragLeave(event)" ondrop="editTypeDrop(event)" ondragend="editTypeDragEnd()"><span class="edit-type-order-handle" aria-hidden="true">⠿</span><span>${index + 1}. ${EDIT_TYPE_LABELS[type] || type}</span></div>`
  ).join('') || '<span>尚無題目</span>';
}

window.editTypeDragStart = event => {
  draggedEditType = event.currentTarget.dataset.type;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', draggedEditType);
  event.currentTarget.classList.add('dragging');
};
window.editTypeDragOver = event => {
  if (!draggedEditType || event.currentTarget.dataset.type === draggedEditType) return;
  event.preventDefault();
  const after = event.clientY > event.currentTarget.getBoundingClientRect().top + event.currentTarget.offsetHeight / 2;
  event.currentTarget.classList.toggle('drop-after', after);
  event.currentTarget.classList.toggle('drop-before', !after);
};
window.editTypeDragLeave = event => event.currentTarget.classList.remove('drop-before', 'drop-after');
window.editTypeDragEnd = () => {
  draggedEditType = null;
  document.querySelectorAll('.edit-type-order-item').forEach(item => item.classList.remove('dragging', 'drop-before', 'drop-after'));
};
window.editTypeDrop = event => {
  event.preventDefault();
  const target = event.currentTarget.dataset.type;
  if (!draggedEditType || target === draggedEditType) return;
  const after = event.clientY > event.currentTarget.getBoundingClientRect().top + event.currentTarget.offsetHeight / 2;
  const next = typeOrderDraft.filter(type => type !== draggedEditType);
  next.splice(next.indexOf(target) + (after ? 1 : 0), 0, draggedEditType);
  typeOrderDraft = next;
  draggedEditType = null;
  renderEditTypeOrder();
};

window.applyEditTypeOrder = () => {
  const scores = getCurrentEditScores();
  editTypeOrder = [...typeOrderDraft, ...editTypeOrder.filter(type => !typeOrderDraft.includes(type))];
  editQOrder = typeOrderDraft.flatMap(type => editQOrder.filter(id => editQMap[id]?.type === type));
  renderEditQList(scores);
  closeEditTypeOrder();
};

function editScoreValue(value, type) {
  const parsed = parseFloat(value);
  const fallback = TYPE_SCORES[type] || 2;
  return Math.round(Math.min(99.5, Math.max(0.5, Number.isFinite(parsed) ? parsed : fallback)) * 2) / 2;
}

window.normalizeEditScore = (input, type) => {
  input.value = editScoreValue(input.value, type);
  updateEditTotal();
};

function updateEditTotal() {
  const scores = getCurrentEditScores();
  const total = editQOrder.reduce((sum, id) => sum + (scores[editQMap[id]?.type] || 0), 0);
  document.getElementById('editQCount').textContent = `${editQOrder.length} 題 / 共 ${total} 分`;
}

function renderEditQList(typeScores = getCurrentEditScores()) {
  const container = document.getElementById('editQList');
  if (!editQOrder.length) {
    container.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-muted)">尚無題目</div>';
    updateEditTotal();
    return;
  }
  container.innerHTML = orderedEditTypes().map((type, sectionIndex) => {
    const ids = editQOrder.filter(id => editQMap[id]?.type === type);
    const score = editScoreValue(typeScores[type], type);
    return `<div class="edit-q-section"><span>${EDIT_ROMANS[sectionIndex] || sectionIndex + 1}、${EDIT_TYPE_LABELS[type] || type}（${ids.length} 題）</span><label class="edit-q-score">每題 <input class="form-control" type="number" id="escore-${type}" value="${score}" min="0.5" max="99.5" step="0.5" oninput="updateEditTotal()" onchange="normalizeEditScore(this,'${type}')"> 分</label></div>` + ids.map((id, idx) => {
      const q = editQMap[id];
      const questionLine = [
        q.text || '—',
        ...((q.type === 'T2' || q.type === 'T3') && q.options?.length
          ? q.options.map((option, index) => `(${String.fromCharCode(65 + index)}) ${option}`)
          : []),
        q.tail || ''
      ].filter(Boolean).join('　');
      return `<div class="edit-q-item eq-item" draggable="true" data-id="${id}"
      ondragstart="eqDragStart(event,'${id}')" ondragover="eqDragOver(event,'${id}')"
      ondrop="eqDrop(event,'${id}')" ondragend="eqDragEnd()">
      <span class="drag-handle">⠿</span>
      <span class="eq-num">${idx+1}.</span>
      ${q.qnum?`<span class="eq-qnum">${q.qnum}</span>`:''}
      <span style="flex-shrink:0">${UI.typeBadge(q.type)}</span>
      <span class="eq-text" title="${UI.escapeHtml(questionLine)}">${UI.escapeHtml(questionLine)}</span>
      <button class="eq-remove" onclick="removeEditQ('${id}')" title="從試卷移除">✕</button>
    </div>`;
    }).join('');
  }).join('');
  updateEditTotal();
}

window.removeEditQ = (id) => {
  const scores = getCurrentEditScores();
  editQOrder = editQOrder.filter(x => x!==id);
  renderEditQList(scores);
};

function getCurrentEditScores() {
  const scores = {};
  const types = orderedEditTypes();
  types.forEach(t => {
    const el = document.getElementById('escore-'+t);
    scores[t] = editScoreValue(el?.value, t);
  });
  return scores;
}

// Drag-to-reorder
let _eDragId = null;
window.eqDragStart = (e,id) => { _eDragId=id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
window.eqDragEnd   = ()     => { _eDragId=null; document.querySelectorAll('.eq-item').forEach(el=>el.classList.remove('dragging','drag-over')); };
window.eqDragOver  = (e,id) => {
  if (!_eDragId || id === _eDragId || editQMap[id]?.type !== editQMap[_eDragId]?.type) return;
  e.preventDefault();
  document.querySelector(`.eq-item[data-id="${id}"]`)?.classList.add('drag-over');
};
window.eqDrop      = (e,targetId) => {
  e.preventDefault();
  if (!_eDragId || _eDragId===targetId || editQMap[targetId]?.type !== editQMap[_eDragId]?.type) return;
  const from=editQOrder.indexOf(_eDragId), to=editQOrder.indexOf(targetId);
  if (from<0||to<0) return;
  editQOrder.splice(from,1); editQOrder.splice(to,0,_eDragId);
  renderEditQList();
};

// Shuffle
window.shuffleEditQs = () => {
  const byType = {};
  editQOrder.forEach(id => {
    const q = editQMap[id]; if (!q) return;
    if (!byType[q.type]) byType[q.type] = [];
    byType[q.type].push(id);
  });
  Object.values(byType).forEach(arr => arr.sort(() => Math.random()-.5));
  editQOrder = orderedEditTypes().flatMap(t => byType[t]||[]);
  renderEditQList();
  UI.toast('已重新排序', 'success');
};

// Preview
window.previewEdit = () => {
  const typeScores = getCurrentEditScores();
  const qs = editQOrder.map(id => editQMap[id]).filter(Boolean);
  const title = document.getElementById('editExamTitle').value.trim() || '試卷預覽';
  editDraftExam.title = title;
  editDraftExam.description = document.getElementById('editExamDescription').value.trim();
  editDraftExam.typeScores = typeScores;
  editDraftExam.typeOrder = orderedEditTypes();
  editDraftExam.onPreviewClose = () => {
    if (!document.getElementById('editHeaderPanel').classList.contains('hidden')) {
      renderEditHeaderSample();
      mountInlineHeaderEditor(document.getElementById('editHeaderFields'), editDraftExam, renderEditHeaderSample, () => {
        document.getElementById('editHeaderPanel').classList.add('hidden');
        document.getElementById('editHeaderToggle').setAttribute('aria-expanded', 'false');
      });
    }
  };
  showExamPreview(editDraftExam, qs);
};

// Save edit
window.saveEdit = async () => {
  const title = document.getElementById('editExamTitle').value.trim();
  if (!title) { UI.toast('請填寫試卷名稱', 'warning'); return; }
  const typeScores  = getCurrentEditScores();
  let totalScore = 0;
  editQOrder.forEach(id => {
    const q = editQMap[id]; if (!q) return;
    totalScore += typeScores[q.type] || 2;
  });
  try {
    await DataService.saveExam({
      id:            editExamId,
      title,
      description: document.getElementById('editExamDescription').value.trim(),
      typeScores,
      typeOrder: orderedEditTypes(),
      header:        editDraftExam.header,
      appearance:    editDraftExam.appearance,
      totalScore,
      questionIds:   [...editQOrder],
      questionCount: editQOrder.length,
    });
    UI.toast('試卷已儲存', 'success');
    closeEdit();
    await init();
  } catch(e) { UI.toast('儲存失敗：'+e.message, 'danger'); }
};

window.closeEdit = () => {
  closeEditTypeOrder();
  setEditFullscreen(false);
  document.getElementById('editModal').classList.add('hidden');
  editDraftExam = null;
};

init();
</script>
</body>
